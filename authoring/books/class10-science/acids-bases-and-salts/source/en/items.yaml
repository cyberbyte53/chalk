  text: Activity 2.10 Take 10 mL water in a beaker. Add a few drops of concentrated H₂SO₄ to it and
    swirl the beaker slowly. Touch the base of the beaker. Is there a change in temperature? Is this
    an exothermic or endothermic process? Repeat the above Activity with sodium hydroxide pellets
    and record your observations.
  made:
