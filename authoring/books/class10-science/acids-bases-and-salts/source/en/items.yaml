    - {words: L53.5-L59.1, by: agent}
- id: "4.5.6"
  kind: text
  page: 16
  text: One other salt, which possesses water of crystallisation is gypsum. It has two water molecules
    as water of cyrstallisation. It has the chemical formula CaSO₄.2H₂O. Let us look into the use of
    this salt.
  made:
    - {words: L62.2-L66.1, by: scripts}
- id: "4.5.7"
  kind: heading
  page: 16
  title: Plaster of Paris
  text: Plaster of Paris
- id: "4.5.8"
  kind: text
  page: 16
  text: On heating gypsum at 373 K, it loses water molecules and becomes calcium sulphate hemihydrate
    (CaSO₄.½H₂O). This is called Plaster of Paris, the substance which doctors use as plaster for
    supporting fractured bones in the right position. Plaster of Paris is a white powder and on
    mixing with water, it changes to gypsum once again giving a hard solid mass.
  made:
    - {words: L69.4-L73.3, by: agent}
    - {words: L74, by: agent}
- id: "4.5.9"
  kind: equation
  page: 17
  text: CaSO₄.½H₂O + 1½H₂O → CaSO₄.2H₂O (Plaster of Paris) ( Gypsum)
  made:
    - {words: L5-L8, by: agent}
- id: "4.5.10"
  kind: text
  page: 17
  text: Note that only half a water molecule is shown to be attached as water of crystallisation. How
    can you get half a water molecule? It is written in this form because two formula units of CaSO₄
    share one molecule of water. Plaster of Paris is used for making toys, materials for decoration
    and for making surfaces smooth. Try to find out why is calcium sulphate hemihydrate called
    ‘Plaster of Paris’ ?
