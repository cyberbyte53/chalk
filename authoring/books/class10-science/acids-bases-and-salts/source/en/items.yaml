- id: "4.4.32"
  kind: heading
  page: 16
  title: Uses of washing soda
  text: Uses of washing soda
- id: "4.4.33"
  kind: text
  page: 16
  text: (i) Sodium carbonate (washing soda) is used in glass, soap and paper industries. (ii) It is
    used in the manufacture of sodium compounds such as borax. (iii) Sodium carbonate can be used as
    a cleaning agent for domestic purposes. (iv) It is used for removing permanent hardness of
    water.
