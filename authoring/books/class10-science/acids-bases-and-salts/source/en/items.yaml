- id: "4.5.3"
  kind: text
  page: 16
  text: Copper sulphate crystals which seem to be dry contain water of crystallisation. When we heat
    the crystals, this water is removed and the salt turns white.
- id: "4.5.4"
  kind: text
  page: 16
  text: If you moisten the crystals again with water, you will find that blue colour of the crystals
    reappears.
- id: "4.5.5"
  kind: text
  page: 16
  text: Water of crystallisation is the fixed number of water molecules present in one formula unit of
    a salt. Five water molecules are present in one formula unit of copper sulphate. Chemical
    formula for hydrated copper sulphate is CuSO₄.5H₂O. Now you would be able to answer the question
    whether the molecule of Na₂CO₃.10H₂O is wet.
  made:
