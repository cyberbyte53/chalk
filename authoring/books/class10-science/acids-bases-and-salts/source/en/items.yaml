- id: "1.1.3"
  kind: text
  page: 2
  text: These indicators tell us whether a substance is acidic or basic by change in colour. There are
    some substances whose odour changes in acidic or basic media. These are called olfactory
    indicators. Let us try out some of these indicators.
- id: "1.1.4"
  kind: activity
  page: 2
  number: Activity 2.2
  text: Activity 2.2 Take some finely chopped onions in a plastic bag along with some strips of clean
    cloth. Tie up the bag tightly and leave overnight in the fridge. The cloth strips can now be
    used to test for acids and bases. Take two of these cloth strips and check their odour. Keep
    them on a clean surface and put a few drops of dilute HCl solution on one strip and a few drops
    of dilute NaOH solution on the other. Rinse both cloth strips with water and again check their
    odour. Note your observations. Now take some dilute vanilla essence and clove oil and check
    their odour. Take some dilute HCl solution in one test tube and dilute NaOH solution in another.
    Add a few drops of dilute vanilla essence to both test tubes and shake well. Check the odour
    once again and record changes in odour, if any. Similarly, test the change in the odour of clove
    oil with dilute HCl and dilute NaOH solutions and record your observations.
- id: "1.1.5"
  kind: text
  page: 3
  text: Which of these – vanilla, onion and clove, can be used as olfactory indicators on the basis of
    your observations?
- id: "1.1.6"
  kind: text
  page: 3
  text: Let us do some more activities to understand the chemical properties of acids and bases.
