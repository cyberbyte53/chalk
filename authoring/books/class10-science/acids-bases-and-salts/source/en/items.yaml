- id: "1.6.1"
  kind: text
  page: 6
  text: You saw the reaction between carbon dioxide and calcium hydroxide (lime water) in Activity
    2.5. Calcium hydroxide, which is a base, reacts with carbon dioxide to produce a salt and water.
    Since this is similar to the reaction between a base and an acid, we can conclude that non-
    metallic oxides are acidic in nature.
