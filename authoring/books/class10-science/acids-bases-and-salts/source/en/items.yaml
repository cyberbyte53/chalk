- id: "2.7.22"
  kind: text
  page: 8
  text: The process of dissolving an acid or a base in water is a highly exothermic one. Care must be
    taken while mixing concentrated nitric acid or sulphuric acid with water. The acid must always
    be added slowly to water with constant stirring. If water is added to a concentrated acid, the
    heat generated may cause the mixture to splash out and cause burns. The glass container may also
    break due to excessive local heating. Look out for the warning sign (shown in Fig. 2.5) on the
    can of concentrated sulphuric acid and on the bottle of sodium hydroxide pellets.
- id: "2.7.23"
  kind: text
  page: 8
  text: Mixing an acid or base with water results in decrease in the concentration of ions (H₃O⁺/OH⁻)
    per unit volume. Such a process is called dilution and the acid or the base is said to be
    diluted.
  made:
    - {words: L61.4-L63.5, by: agent}
