  text: In Section 2.1 we have seen that all acids have similar chemical properties. What leads to
    this similarity in properties? We saw in Activity 2.3 that all acids generate hydrogen gas on
    reacting with metals, so hydrogen seems to be common to all acids. Let us perform an Activity to
    investigate whether all compounds containing hydrogen are acidic.
- id: "2.2"
  kind: activity
  page: 6
  number: Activity 2.8
  text: Activity 2.8 Take solutions of glucose, alcohol, hydrochloric acid, sulphuric acid, etc. Fix
    two nails on a cork, and place the cork in a 100 mL beaker. Connect the nails to the two
    terminals of a 6 volt battery through a bulb and a switch, as shown in Fig. 2.3. Now pour some
    dilute HCl in the beaker and switch on the current. Repeat with dilute sulphuric acid. What do
    you observe? Repeat the experiment separately with glucose and alcohol solutions. What do you
    observe now? Does the bulb glow in all cases?
