  title: Group Activity
  text: Group Activity (I) Prepare your own indicator Crush beetroot in a mortar. Add sufficient water
    to obtain the extract. Filter the extract by the procedure learnt by you in earlier classes.
    Collect the filtrate to test the substances you may have tasted earlier. Arrange four test tubes
    in a test tube stand and label them as A,B,C and D. Pour 2 mL each of lemon juice solution,
    soda-water, vinegar and baking soda solution in them respectively. Put 2-3 drops of the beetroot
    extract in each test tube and note the colour change if any. Write your observation in a Table.
    You can prepare indicators by using other natural materials like extracts of red cabbage leaves,
    coloured petals of some flowers such as Petunia, Hydrangea and Geranium. (II) Preparing a
    soda-acid fire extinguisher The reaction of acids with metal hydrogencarbonates is used in the
    fire extinguishers which produce carbon dioxide. Take 20 mL of sodium hydrogencarbonate (NaHCO₃)
    solution in a wash-bottle. Suspend an ignition tube containing dilute sulphuric acid in the
    wash-bottle (Fig. 2.10). Close the mouth of the wash-bottle. Tilt the wash-bottle so that the
    acid from the ignition tube mixes with the sodium hydrogencarbonate solution below. You will
    notice discharge coming out of the nozzle. Direct this discharge on a burning candle. What
    happens?
