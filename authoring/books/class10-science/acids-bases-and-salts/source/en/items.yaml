  number: Activity 2.15
  text: Activity 2.15 Heat a few crystals of copper sulphate in a dry boiling tube. What is the colour
    of the copper sulphate after heating? Do you notice water droplets in the boiling tube? Where
    have these come from? Add 2-3 drops of water on the sample of copper sulphate obtained after
    heating. What do you observe? Is the blue colour of copper sulphate restored?
