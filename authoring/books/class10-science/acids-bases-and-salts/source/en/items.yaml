- id: "4"
  kind: section
  page: 12
  number: "2.4"
  title: MORE ABOUT SALTS
  text: 2.4 MORE ABOUT SALTS
  made:
    - {words: L30.4-5, by: agent}
- id: "4.1"
  kind: text
  page: 12
  text: In the previous sections we have seen the formation of salts during various reactions. Let us
    understand more about their preparation, properties and uses.
- id: "4.2"
  kind: section
  page: 12
  number: 2.4.1
  title: Family of Salts
  text: 2.4.1 Family of Salts
- id: "4.2.1"
  kind: activity
  page: 12
  number: Activity 2.13
  text: Activity 2.13 Write the chemical formulae of the salts given below. Potassium sulphate, sodium
    sulphate, calcium sulphate, magnesium sulphate, copper sulphate, sodium chloride, sodium
    nitrate, sodium carbonate and ammonium chloride. Identify the acids and bases from which the
    above salts may be obtained. Salts having the same positive or negative radicals are said to
    belong to a family. For example, NaCl and Na₂SO₄ belong to the family of sodium salts.
    Similarly, NaCl and KCl belong to the family of chloride salts. How many families can you
    identify among the salts given in this Activity?
  made:
    - {words: L6.9-L9, page: 13, by: agent}
- id: "4.3"
  kind: section
  page: 13
  number: 2.4.2
  title: pH of Salts
  text: 2.4.2 pH of Salts
- id: "4.3.1"
  kind: activity
  page: 13
  number: Activity 2.14
  text: Activity 2.14 Collect the following salt samples – sodium chloride, potassium nitrate,
    aluminium chloride, zinc sulphate, copper sulphate, sodium acetate, sodium carbonate and sodium
    hydrogencarbonate (some other salts available can also be taken). Check their solubility in
    water (use distilled water only). Check the action of these solutions on litmus and find the pH
    using a pH paper. Which of the salts are acidic, basic or neutral? Identify the acid or base
    used to form the salt. Report your observations in Table 2.4.
- id: "4.3.2"
  kind: text
  page: 13
  text: Salts of a strong acid and a strong base are neutral with pH value of 7. On the other hand,
    salts of a strong acid and weak base are acidic with pH value less than 7 and those of a strong
    base and weak acid are basic in nature, with pH value more than 7.
- id: "4.3.3"
  kind: table
  page: 13
  number: Table 2.4
  text: Table 2.4 Salt pH Acid used Base used
  rows:
    - [Salt, pH, Acid used, Base used]
    - ["", "", "", ""]
