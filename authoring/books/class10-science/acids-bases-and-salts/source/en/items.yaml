- id: "3"
  kind: section
  page: 9
  number: "2.3"
  title: HOW STRONG ARE ACID OR BASE SOLUTIONS?
  text: 2.3 HOW STRONG ARE ACID OR BASE SOLUTIONS?
- id: "3.1"
  kind: text
  page: 9
  text: We know how acid-base indicators can be used to distinguish between an acid and a base. We
    have also learnt in the previous section about dilution and decrease in concentration of H⁺ or
    OH⁻ ions in solutions. Can we quantitatively find the amount of these ions present in a
    solution? Can we judge how strong a given acid or base is?
  made:
    - {words: L21.7-8, by: scripts}
    - {words: L21.10-11, by: scripts}
- id: "3.2"
  kind: text
  page: 9
  text: We can do this by making use of a universal indicator, which is a mixture of several
    indicators. The universal indicator shows different colours at different concentrations of
    hydrogen ions in a solution.
- id: "3.3"
  kind: text
  page: 9
  text: A scale for measuring hydrogen ion concentration in a solution, called pH scale has been
    developed. The p in pH stands for ‘potenz’ in German, meaning power. On the pH scale we can
    measure pH generally from 0 (very acidic) to 14 (very alkaline). pH should be thought of simply
    as a number which indicates the acidic or basic nature of a solution. Higher the hydronium ion
    concentration, lower is the pH value.
- id: "3.4"
  kind: text
  page: 9
  text: The pH of a neutral solution is 7. Values less than 7 on the pH scale represent an acidic
    solution. As the pH value increases from 7 to 14, it represents an increase in OH⁻ ion
    concentration in the solution, that is, increase in the strength of alkali (Fig. 2.6). Generally
    paper impregnated with the universal indicator is used for measuring pH.
  made:
    - {words: L35.5-6, by: scripts}
- id: "3.5"
  kind: figure
  page: 9
  number: Figure 2.6
  text: Figure 2.6 Variation of pH with the change in concentration of H⁺(aq) and OH⁻(aq) ions
  crop: [99.1, 606.6, 526.2, 708.2]
  made:
