    - {cells: true, by: agent}
- id: "4.4"
  kind: section
  page: 13
  number: 2.4.3
  title: Chemicals from Common Salt
  text: 2.4.3 Chemicals from Common Salt
- id: "4.4.1"
  kind: text
  page: 13
  text: By now you have learnt that the salt formed by the combination of hydrochloric acid and sodium
    hydroxide solution is called sodium chloride. This is the salt that you use in food. You must
    have observed in the above Activity that it is a neutral salt.
- id: "4.4.2"
  kind: text
  page: 13
  text: Seawater contains many salts dissolved in it. Sodium chloride is separated from these salts.
    Deposits of solid salt are also found in several parts of the world. These large crystals are
    often brown due to impurities. This is called rock salt. Beds of rock salt were formed when seas
    of bygone ages dried up. Rock salt is mined like coal.
- id: "4.4.3"
  kind: text
  page: 13
  text: You must have heard about Mahatma Gandhi’s Dandi March. Did you know that sodium chloride was
    such an important symbol in our struggle for freedom?
- id: "4.4.4"
  kind: heading
  page: 14
  title: Common salt — A raw material for chemicals
  text: Common salt — A raw material for chemicals
- id: "4.4.5"
  kind: text
  page: 14
  text: The common salt thus obtained is an important raw material for various materials of daily use,
    such as sodium hydroxide, baking soda, washing soda, bleaching powder and many more. Let us see
    how one substance is used for making all these different substances.
- id: "4.4.6"
  kind: heading
  page: 14
  title: Sodium hydroxide
  text: Sodium hydroxide
- id: "4.4.7"
  kind: text
  page: 14
  text: When electricity is passed through an aqueous solution of sodium chloride (called brine), it
    decomposes to form sodium hydroxide. The process is called the chlor-alkali process because of
    the products formed– chlor for chlorine and alkali for sodium hydroxide.
- id: "4.4.8"
  kind: equation
  page: 14
  text: 2NaCl(aq) + 2H₂O(l) → 2NaOH(aq) + Cl₂(g) + H₂(g)
  made:
    - {words: L11.3-L13.1, by: scripts}
    - {words: L13.2, by: agent}
    - {words: L13.5-L15.1, by: scripts}
    - {words: L15.3-L17.1, by: scripts}
- id: "4.4.9"
  kind: text
  page: 14
  text: Chlorine gas is given off at the anode, and hydrogen gas at the cathode. Sodium hydroxide
    solution is formed near the cathode. The three products produced in this process are all useful.
    Figure 2.8 shows the different uses of these products.
- id: "4.4.10"
  kind: figure
  page: 14
  number: Figure 2.8
  text: Figure 2.8 Important products from the chlor-alkali process
  crop: [64.1, 312.6, 533.5, 559]
  made:
    - {box: true, by: figure-snap}
- id: "4.4.11"
  kind: heading
  page: 14
  title: Bleaching powder
  text: Bleaching powder
- id: "4.4.12"
  kind: text
  page: 14
  text: You have already come to know that chlorine is produced during the electrolysis of aqueous
    sodium chloride (brine). This chlorine gas is used for the manufacture of bleaching powder.
    Bleaching powder is produced by the action of chlorine on dry slaked lime [Ca(OH)₂]. Bleaching
    powder is represented as Ca(ClO)₂, though the actual composition is quite complex.
  made:
    - {words: L27.10-L29.1, by: agent}
    - {words: L30.4-L32.1, by: scripts}
- id: "4.4.13"
  kind: equation
  page: 14
  text: 2Ca(OH)₂ + 2Cl₂ → Ca(ClO)₂ + CaCl₂ + 2H₂O
  made:
    - {words: L34.1-L35.1, by: scripts}
    - {words: L36.2-L37.1, by: scripts}
    - {words: L38.1, by: agent}
    - {words: L38.2-L39.1, by: scripts}
    - {words: L40.2-L41.1, by: scripts}
    - {words: L42.2-L44.1, by: scripts}
- id: "4.4.14"
  kind: text
  page: 15
  text: Bleaching powder is used – (i) for bleaching cotton and linen in the textile industry, for
    bleaching wood pulp in paper factories and for bleaching washed clothes in laundry; (ii) as an
    oxidising agent in many chemical industries; and (iii) to make drinking water free from germs.
- id: "4.4.15"
  kind: heading
  page: 15
  title: Baking soda
  text: Baking soda
- id: "4.4.16"
  kind: text
  page: 15
  text: The baking soda is commonly used in the kitchen for making tasty crispy pakoras, etc.
    Sometimes it is added for faster cooking. The chemical name of the compound is sodium
    hydrogencarbonate (NaHCO₃). It is produced using sodium chloride as one of the raw materials.
  made:
    - {words: L10.8-L12.1, by: scripts}
- id: "4.4.17"
  kind: equation
  page: 15
  text: NaCl + H₂O + CO₂ + NH₃ → NH₄Cl + NaHCO₃ (Ammonium chloride) (Sodium hydrogencarbonate)
  made:
    - {words: L14.3-5, by: scripts}
    - {words: L14.7-8, by: scripts}
    - {words: L14.10-11, by: scripts}
    - {words: L15.2-4, by: scripts}
    - {words: L15.6-7, by: scripts}
- id: "4.4.18"
  kind: text
  page: 15
  text: Did you check the pH of sodium hydrogencarbonate in Activity 2.14? Can you correlate why it
    can be used to neutralise an acid? It is a mild non-corrosive basic salt. The following reaction
    takes place when it is heated during cooking –
- id: "4.4.19"
  kind: equation
  page: 15
  text: 2NaHCO₃ Heat → Na₂CO₃ + H₂O + CO₂ (Sodium hydrogencarbonate) (Sodium carbonate)
  made:
    - {words: L23.1-2, by: scripts}
    - {words: L24.1-3, by: agent}
    - {words: L24.4-7, by: scripts}
    - {words: L24.9-11, by: scripts}
    - {words: L24.13-14, by: scripts}
- id: "4.4.20"
  kind: text
  page: 15
  text: Sodium hydrogencarbonate has got various uses in the household.
- id: "4.4.21"
  kind: heading
  page: 15
  title: Uses of Baking soda
  text: Uses of Baking soda
- id: "4.4.22"
  kind: text
  page: 15
  text: (i) Baking powder is a mixture of baking soda (sodium hydrogen carbonate) and tartaric acid
    which is a weak edible acid. When baking powder is heated or mixed in water, the following
    reaction takes place –
- id: "4.4.23"
  kind: equation
  page: 15
  text: NaHCO₃ + H⁺ → CO₂ + H₂O + Sodium salt of acid (From any acid)
  made:
    - {words: L35.1-L36.1, by: scripts}
    - {words: L37.2-3, by: scripts}
    - {words: L37.4, by: agent}
    - {words: L37.5-L38.1, by: scripts}
    - {words: L39.2-L41.1, by: scripts}
- id: "4.4.24"
  kind: text
  page: 15
  text: Carbon dioxide produced during the reaction can cause bread or cake to rise making them soft
    and spongy.
- id: "4.4.25"
  kind: text
  page: 15
  text: (ii) Sodium hydrogencarbonate is also an ingredient in antacids. Being alkaline, it
    neutralises excess acid in the stomach and provides relief.
- id: "4.4.26"
  kind: text
  page: 15
  text: (iii) It is also used in soda-acid fire extinguishers.
- id: "4.4.27"
  kind: heading
  page: 15
  title: Washing soda
  text: Washing soda
- id: "4.4.28"
  kind: text
  page: 15
  text: Another chemical that can be obtained from sodium chloride is Na₂CO₃.10H₂O (washing soda). You
    have seen above that sodium carbonate can be obtained by heating baking soda; recrystallisation
    of sodium carbonate gives washing soda. It is also a basic salt.
