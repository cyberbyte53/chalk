- id: "3.9"
  kind: text
  page: 10
  text: The strength of acids and bases depends on the number of H⁺ ions and OH⁻ ions produced,
    respectively. If we take hydrochloric acid and acetic acid of the same concentration, say one
    molar, then these produce different amounts of hydrogen ions. Acids that give rise to more H⁺
    ions are said to be strong acids, and acids that give less H⁺ ions are said to be weak acids.
    Can you now say what weak and strong bases are?
  made:
    - {words: L30.12-13, by: scripts}
    - {words: L31.2-3, by: scripts}
    - {words: L33.12-13, by: scripts}
    - {words: L34.12-13, by: scripts}
- id: "3.10"
  kind: section
  page: 10
  number: 2.3.1
  title: Importance of pH in Everyday Life
  text: 2.3.1 Importance of pH in Everyday Life
  made:
    - {words: L36.2-3, by: agent}
    - {words: L36.7-8, by: agent}
- id: "3.10.1"
  kind: heading
  page: 10
  title: Are plants and animals pH sensitive?
  text: Are plants and animals pH sensitive?
- id: "3.10.2"
  kind: text
  page: 10
  text: Our body works within the pH range of 7.0 to 7.8. Living organisms can survive only in a
    narrow range of pH change. When pH of rain water is less than 5.6, it is called acid rain. When
    acid rain flows into the rivers, it lowers the pH of the river water. The survival of aquatic
    life in such rivers becomes difficult.
- id: "3.10.3"
  kind: box
  page: 11
  title: Do You Know?
  text: Do You Know? Acids in other planets The atmosphere of venus is made up of thick white and
    yellowish clouds of sulphuric acid. Do you think life can exist on this planet?
- id: "3.10.4"
  kind: heading
  page: 11
  title: What is the pH of the soil in your backyard?
  text: What is the pH of the soil in your backyard?
- id: "3.10.5"
  kind: text
  page: 11
  text: Plants require a specific pH range for their healthy growth. To find out the pH required for
    the healthy growth of a plant, you can collect the soil from various places and check the pH in
    the manner described below in Activity 2.12. Also, you can note down which plants are growing in
    the region from which you have collected the soil.
- id: "3.10.6"
  kind: activity
  page: 11
  number: Activity 2.12
  text: Activity 2.12 Put about 2 g soil in a test tube and add 5 mL water to it. Shake the contents
    of the test tube. Filter the contents and collect the filtrate in a test tube. Check the pH of
    this filtrate with the help of universal indicator paper. What can you conclude about the ideal
    soil pH for the growth of plants in your region?
- id: "3.10.7"
  kind: heading
  page: 11
  title: pH in our digestive system
  text: pH in our digestive system
- id: "3.10.8"
  kind: text
  page: 11
  text: It is very interesting to note that our stomach produces hydrochloric acid. It helps in the
    digestion of food without harming the stomach. During indigestion the stomach produces too much
    acid and this causes pain and irritation. To get rid of this pain, people use bases called
    antacids. One such remedy must have been suggested by you at the beginning of this Chapter.
    These antacids neutralise the excess acid. Magnesium hydroxide (Milk of magnesia), a mild base,
    is often used for this purpose.
- id: "3.10.9"
  kind: heading
  page: 11
  title: pH change as the cause of tooth decay
  text: pH change as the cause of tooth decay
- id: "3.10.10"
  kind: text
  page: 11
  text: Tooth decay starts when the pH of the mouth is lower than 5.5. Tooth enamel, made up of
    calcium hydroxyapatite (a crystalline form of calcium phosphate) is the hardest substance in the
    body. It does not dissolve in water, but is corroded when the pH in the mouth is below 5.5.
    Bacteria present in the mouth produce acids by degradation of sugar and food particles remaining
    in the mouth after eating. The best way to prevent this is to clean the mouth after eating food.
    Using toothpastes, which are generally basic, for cleaning the teeth can neutralise the excess
    acid and prevent tooth decay.
- id: "3.10.11"
  kind: heading
  page: 11
  title: Self defence by animals and plants through chemical warfare
  text: Self defence by animals and plants through chemical warfare
- id: "3.10.12"
  kind: text
  page: 11
  text: Have you ever been stung by a honey-bee? Bee-sting leaves an acid which causes pain and
    irritation. Use of a mild base like baking soda on the stung area gives relief. Stinging hair of
    nettle leaves inject methanoic acid causing burning pain.
- id: "3.10.13"
  kind: box
  page: 12
  title: Do You Know?
  text: Do You Know? Nature provides neutralisation options Nettle is a herbaceous plant which grows
    in the wild. Its leaves have stinging hair, which cause painful stings when touched
    accidentally. This is due to the methanoic acid secreted by them. A traditional remedy is
    rubbing the area with the leaf of the dock plant, which often grows beside the nettle in the
    wild. Can you guess the nature of the dock plant? So next time you know what to look out for if
    you accidentally touch a nettle plant while trekking. Are you aware of any other effective
    traditional remedies for such stings?
