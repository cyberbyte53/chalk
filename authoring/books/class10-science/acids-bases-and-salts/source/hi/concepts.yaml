concepts:
  - key: acids-sour-bases-bitter
    concept: अम्लों का स्वाद खट्टा होता है तथा यह नीले लिटमस पत्र को लाल कर देते हैं, जबकि क्षारकों का स्वाद कड़वा होता है एवं यह लाल लिटमस पत्र को नीला कर देते हैं।
    terms: []
    items: ["0.4"]
  - key: indicators-show-acid-or-base
    concept: रंग में परिवर्तन के द्वारा सूचक बताते हैं कि कोई पदार्थ अम्ल है या क्षारक; लिटमस एवं हल्दी प्राकृतिक सूचक हैं, मेथिल ऑरेंज एवं फीनॉल्फथेलिन संश्लेषित सूचक।
    terms: [अम्ल-क्षारक सूचक]
    items: ["0.4", "0.6", "1.1.1"]
    cause: wrong-place
    note: "the suggested 1.1.4 is the onion, vanilla and clove activity (English 2.2, olfactory indicators), which this book misprints as क्रियाकलाप 2.1; its own 2.1, the colour-indicator activity, is 1.1.1"
  - key: olfactory-indicators
    concept: कुछ पदार्थों, जैसे प्याज, वैनिला एवं लौंग के तेल, की गंध अम्लीय या क्षारकीय माध्यम में भिन्न हो जाती है; इन्हें गंधीय सूचक कहते हैं।
    terms: [गंधीय]
    items: ["1.1.3", "1.1.4"]
  - key: acid-and-metal-give-hydrogen
    concept: अम्ल के साथ धातु की अभिक्रिया से लवण एवं हाइड्रोजन गैस बनती है।
    terms: [लवण]
    items: ["1.2.1", "1.2.3", "1.2.4"]
  - key: some-metals-react-with-base
    concept: जिंक जैसी कुछ धातुएँ सोडियम हाइड्रॉक्साइड जैसे क्षारक से अभिक्रिया करके हाइड्रोजन एवं लवण (सोडियम जिंकेट) बनाती हैं, किंतु ऐसी अभिक्रियाएँ सभी धातुओं के साथ संभव नहीं हैं।
    terms: []
    items: ["1.2.6", "1.2.8", "1.2.9"]
  - key: carbonates-with-acid-give-carbon-dioxide
    concept: सभी धातु कार्बोनेट एवं हाइड्रोजनकार्बोनेट अम्ल के साथ अभिक्रिया करके संगत लवण, कार्बन डाइऑक्साइड एवं जल बनाते हैं; कार्बन डाइऑक्साइड चूने के पानी को दूधिया कर देती है।
    terms: []
    items: ["1.3.1", "1.3.4", "1.3.7", "1.3.10", "1.3.12"]
  - key: excess-carbon-dioxide-clears-lime-water
    concept: अत्यधिक मात्रा में कार्बन डाइऑक्साइड प्रवाहित करने पर श्वेत कैल्सियम कार्बोनेट, कैल्सियम हाइड्रोजनकार्बोनेट बन जाता है, जो जल में घुलनशील है।
    terms: []
    items: ["1.3.8", "1.3.9"]
  - key: neutralisation
    concept: अम्ल एवं क्षारक एक-दूसरे का प्रभाव समाप्त कर देते हैं; उनकी अभिक्रिया से लवण तथा जल प्राप्त होते हैं, इसे उदासीनीकरण अभिक्रिया कहते हैं।
    terms: [उदासीनीकरण अभिक्रिया]
    items: ["1.4.1", "1.4.2", "1.4.4", "1.4.5"]
  - key: metal-oxides-are-basic
    concept: क्षारक एवं अम्ल की अभिक्रिया के समान ही धात्विक ऑक्साइड अम्ल के साथ अभिक्रिया करके लवण एवं जल देते हैं, अतः इन्हें क्षारकीय ऑक्साइड कहते हैं।
    terms: []
    items: ["1.5.1", "1.5.2", "1.5.3", "1.5.4"]
  - key: non-metal-oxides-are-acidic
    concept: कार्बन डाइऑक्साइड जैसे अधात्विक ऑक्साइड क्षारक के साथ अभिक्रिया करके लवण एवं जल बनाते हैं, अतः ये अम्लीय प्रकृति के होते हैं।
    terms: []
    items: ["1.6.1"]
  - key: acids-give-hydrogen-ions
    concept: अम्ल विलयन में हाइड्रोजन आयन H⁺ (aq) उत्पन्न करते हैं, इसी कारण वे विद्युत का चालन करते हैं और उनका गुणधर्म अम्लीय होता है; ग्लूकोज़ एवं एल्कोहल के विलयन विद्युत का चालन नहीं करते।
    terms: []
    items: ["2.2", "2.4", "2.5"]
  - key: ions-only-in-water
    concept: जल की उपस्थिति में ही HCl में हाइड्रोजन आयन उत्पन्न होते हैं, जो जल के अणुओं के साथ मिलकर हाइड्रोनियम आयन (H₃O⁺) बनाते हैं; शुष्क HCl गैस सूखे लिटमस पत्र का रंग नहीं बदलती।
    terms: [हाइड्रोनियम आयन]
    items: ["2.7.2", "2.7.4", "2.7.6", "2.7.7"]
  - key: bases-give-hydroxide-ions
    concept: क्षारक जल में हाइड्रॉक्साइड (OH⁻) आयन उत्पन्न करते हैं; जल में घुलनशील क्षारक को क्षार कहते हैं।
    terms: [क्षार]
    items: ["2.7.8", "2.7.12", "2.7.13"]
  - key: neutralisation-forms-water
    concept: उदासीनीकरण में अम्ल के H⁺ (aq) आयन एवं क्षारक के OH⁻ (aq) आयन मिलकर जल बनाते हैं।
    terms: []
    items: ["2.7.14", "2.7.17"]
  - key: dissolving-is-exothermic
    concept: जल में अम्ल या क्षारक के घुलने की प्रक्रिया अत्यंत ऊष्माक्षेपी होती है, अतः अम्ल को सदैव धीरे-धीरे जल में मिलाना चाहिए, सांद्र अम्ल में जल नहीं।
    terms: []
    items: ["2.7.19", "2.7.21"]
  - key: dilution
    concept: जल में अम्ल या क्षारक मिलाने पर प्रति इकाई आयतन में आयनों की सांद्रता कम हो जाती है; इस प्रक्रिया को तनुकरण कहते हैं।
    terms: [तनुकरण]
    items: ["2.7.22"]
  - key: universal-indicator
    concept: सार्वत्रिक सूचक अनेक सूचकों का मिश्रण होता है, जो हाइड्रोजन आयन की विभिन्न सांद्रता को विभिन्न रंगों में प्रदर्शित करता है।
    terms: [सार्वत्रिक सूचक]
    items: ["3.2"]
  - key: ph-scale
    concept: pH स्केल शून्य से चौदह तक हाइड्रोजन आयन की सांद्रता मापता है; हाइड्रोनियम आयन की सांद्रता जितनी अधिक होगी, pH उतना ही कम होगा।
    terms: [pH स्केल]
    items: ["3.3"]
  - key: ph-of-neutral-acidic-basic
    concept: उदासीन विलयन के pH का मान 7 होता है, अम्लीय विलयन का 7 से कम, और pH 7 से 14 तक बढ़ने पर क्षार की शक्ति बढ़ती है।
    terms: []
    items: ["3.4", "3.6", "3.8"]
  - key: strong-and-weak-acids
    concept: समान सांद्रता पर अधिक H⁺ आयन उत्पन्न करने वाले अम्ल प्रबल अम्ल तथा कम H⁺ आयन उत्पन्न करने वाले दुर्बल अम्ल कहलाते हैं; क्षारक की शक्ति इसी प्रकार OH⁻ आयनों पर निर्भर करती है।
    terms: [प्रबल अम्ल, दुर्बल अम्ल]
    items: ["3.9"]
  - key: living-things-need-narrow-ph
    concept: जीवित प्राणी केवल संकीर्ण pH परास में ही जीवित रह सकते हैं; हमारा शरीर 7.0 से 7.8 pH के बीच कार्य करता है, और 5.6 से कम pH की वर्षा अम्लीय वर्षा कहलाती है, जो नदी के जलीय जीवन को कठिन बनाती है।
    terms: [अम्लीय वर्षा]
    items: ["3.10.2"]
  - key: soil-ph-and-plants
    concept: अच्छी उपज के लिए पौधों को मिट्टी के एक विशिष्ट pH परास की आवश्यकता होती है।
    terms: []
    items: ["3.10.5", "3.10.6"]
  - key: antacids-neutralise-stomach-acid
    concept: हमारा उदर भोजन के पाचन के लिए हाइड्रोक्लोरिक अम्ल उत्पन्न करता है; अपच में अत्यधिक अम्ल से दर्द होता है, जिसे मिल्क ऑफ मैगनीशिया जैसे दुर्बल क्षारक, ऐन्टैसिड, उदासीन करते हैं।
    terms: [ऐन्टैसिड]
    items: ["3.10.8"]
  - key: tooth-decay-below-ph-5-5
    concept: मुँह के pH का मान 5.5 से कम होने पर, बैक्टीरिया द्वारा भोजन से बने अम्ल से दाँतों का इनैमल संक्षारित होता है; क्षारकीय दंत-मंजन अम्ल को उदासीन करता है।
    terms: []
    items: ["3.10.10"]
  - key: stings-neutralised-by-base
    concept: मधुमक्खी एवं नेटल के डंक अम्ल छोड़ते हैं (नेटल का मेथैनॉइक अम्ल), और बेकिंग सोडा जैसा दुर्बल क्षारक या डॉक पौधे की पत्ती आराम देती है।
    terms: []
    items: ["3.10.12", "3.10.13"]
  - key: naturally-occurring-acids
    concept: कई प्राकृतिक स्रोतों में अम्ल होते हैं, जैसे सिरके में ऐसीटिक अम्ल, नींबू एवं संतरे में सिट्रिक अम्ल, दही में लैक्टिक अम्ल और चींटी के डंक में मेथैनॉइक अम्ल।
    terms: []
    items: ["3.10.14"]
  - key: families-of-salts
    concept: समान धन या ऋण मूलक वाले लवणों को एक ही परिवार का कहा जाता है, जैसे सोडियम लवण या क्लोराइड लवण।
    terms: []
    items: ["4.2.1"]
  - key: ph-of-salts
    concept: प्रबल अम्ल एवं प्रबल क्षारक के लवण उदासीन (pH 7) होते हैं, प्रबल अम्ल एवं दुर्बल क्षारक के अम्लीय, तथा प्रबल क्षारक एवं दुर्बल अम्ल के क्षारकीय।
    terms: []
    items: ["4.3.1", "4.3.3"]
  - key: common-salt-sources
    concept: साधारण नमक (सोडियम क्लोराइड) एक उदासीन लवण है, जो समुद्री जल से तथा सूखे समुद्रों से बने खनिज नमक के निक्षेपों से प्राप्त होता है।
    terms: [खनिज नमक]
    items: ["4.4.1", "4.4.2"]
  - key: chlor-alkali-process
    concept: सोडियम क्लोराइड के जलीय विलयन (लवण जल) से विद्युत प्रवाहित करने पर सोडियम हाइड्रॉक्साइड, क्लोरीन एवं हाइड्रोजन बनते हैं (क्लोर-क्षार प्रक्रिया), तीनों उपयोगी उत्पाद।
    terms: [क्लोर-क्षार]
    items: ["4.4.5", "4.4.7", "4.4.8", "4.4.9", "4.4.10", "4.4.11"]
  - key: bleaching-powder
    concept: शुष्क बुझे हुए चूने पर क्लोरीन की क्रिया से विरंजक चूर्ण बनता है, जिसका उपयोग सूती कपड़े एवं कागज़ के विरंजन, उपचायक के रूप में और पीने के जल को जीवाणुओं से मुक्त करने में होता है।
    terms: []
    items: ["4.4.13", "4.4.14", "4.4.16"]
  - key: baking-soda
    concept: बेकिंग सोडा सोडियम हाइड्रोजनकार्बोनेट है, जो सोडियम क्लोराइड से बनता है; यह एक दुर्बल असंक्षारक क्षारीय लवण है, जो गर्म करने पर सोडियम कार्बोनेट, जल एवं कार्बन डाइऑक्साइड देता है।
    terms: []
    items: ["4.4.18", "4.4.19", "4.4.20", "4.4.21"]
  - key: uses-of-baking-soda
    concept: बेकिंग पाउडर (बेकिंग सोडा एवं टार्टरिक अम्ल) से उत्पन्न कार्बन डाइऑक्साइड पावरोटी या केक को मुलायम एवं स्पंजी बनाती है; बेकिंग सोडा ऐन्टैसिड एवं सोडा-अम्ल अग्निशामक में भी उपयोग होता है।
    terms: [बेकिंग पाउडर]
    items: ["4.4.24", "4.4.25", "4.4.26", "4.4.27"]
  - key: washing-soda
    concept: धोने का सोडा, Na₂CO₃.10H₂O, सोडियम कार्बोनेट के पुनः क्रिस्टलीकरण से प्राप्त एक क्षारकीय लवण है, जिसका उपयोग काँच, साबुन एवं कागज़ उद्योगों में, साफ़-सफ़ाई में और जल की स्थायी कठोरता हटाने में होता है।
    terms: []
    items: ["4.4.29", "4.4.30", "4.4.34"]
  - key: water-of-crystallisation
    concept: शुष्क दिखने वाले लवण के क्रिस्टलों में क्रिस्टलन का जल होता है, एक सूत्र इकाई में जल के निश्चित अणु (नीले कॉपर सल्फ़ेट में पाँच, जो गर्म करने पर श्वेत हो जाता है)।
    terms: [क्रिस्टलन का जल]
    items: ["4.5.1", "4.5.3", "4.5.4", "4.5.5"]
  - key: plaster-of-paris
    concept: जिप्सम (CaSO₄.2H₂O) को 373 K पर गर्म करने पर प्लास्टर ऑफ पेरिस (CaSO₄.½H₂O) बनता है, जो जल मिलाने पर पुनः कठोर जिप्सम बन जाता है; इसका उपयोग टूटी हड्डियों को स्थिर रखने, खिलौने एवं सजावट के सामान बनाने में होता है।
    terms: []
    items: ["4.5.6", "4.5.8", "4.5.9", "4.5.10", "4.5.11"]
