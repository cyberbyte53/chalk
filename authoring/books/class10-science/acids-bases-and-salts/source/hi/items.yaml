  text: "सामूहिक क्रियाकलाप (I) आप अपना सूचक तैयार करें   खरल में चुकंदर की जड़ को पीसिए।  
    निष्कर्ष प्राप्त करने के लिए पर्याप्त जल मिलाइए।   पिछली कक्षाओं में पढ़ी गई विधियों द्वारा
    निष्कर्ष छान लीजिए।   पदार्थों की जाँच के लिए निस्यंद को एकत्र कर लीजिए। इस पदार्थ को शायद आप
    पहले भी चख चुके हैं।   परखनली स्टैंड में चार परखनलियों को व्यवस्थित कीजिए एवं उसे A, B, C एवं
    D से चिह्नित कीजिए। इन परखनलियों में क्रमशः नींबू रस का विलयन, सोडा-जल, सिरका एवं बेकिंग सोडा का
    2 mL डालिए।   प्रत्येक परखनली में चुकंदर जड़ के निचोड़ (निष्कर्ष) की 2–3 बूँदें मिलाइए एवं रंग
    में आए परिवर्तन पर ध्यान दीजिए। अपने प्रेक्षणों को सारणी में लिखिए।   लाल पत्ता गोभी की
    पत्तियों, कुछ फूल, जैसे– पेटुनिया (Petunia), हाइड्रेंजिया (Hydrangea) एवं जेरानियम (Geranium) की
    पंखुड़ी आदि जैसे कुछ प्राकृतिक पदार्थों के निचोड़ से भी आप अपना सूचक बना सकते हैं। (II)
    सोडा-अम्ल अग्निशामक तैयार करना   कार्बन डाइऑक्साइड उत्पन्न करने वाले अग्निशामक में धातु
    हाइड्रोजनकार्बोनेट के साथ अम्ल की अभिक्रिया का उपयोग होता है।   एक धावन बोतल में सोडियम
    हाइड्रोजनकार्बोनेट (NaHCO₃) विलयन का 20 mL विलयन लीजिए।   तनु सल्फ़्यूरिक अम्ल वाली ज्वलन नली
    को धावन बोतल में लटकाइए।   धावन बोतल का मुँह बंद कर दीजिए।   धावन बोतल को इस प्रकार से
    झुकाइए, जिससे कि ज्वलन नली का अम्ल सोडियम हाइड्रोजनकार्बोनेट के विलयन से मिश्रित हो जाए।   आप
    देखेंगे कि नोज़ल (तुंड) से बुदबुदाहट बाहर आ रही है।   इसे एक जलती हुई मोमबत्ती की ओर लाइए।
    क्या होता है?"
