- id: "3.10.8"
  kind: text
  page: 12
  text: यह अत्यन्त रोचक है कि हमारा उदर हाइड्रोक्लोरिक अम्ल (Hydrochloric acid) उत्पन्न करता है। यह
    उदर को हानि पहुँचाए बिना भोजन के पाचन में सहायक होता है। अपच की स्थिति में उदर अत्यधिक मात्रा
    में अम्ल उत्पन्न करता है, जिसके कारण उदर में दर्द एवं जलन का अनुभव होता है। इस दर्द से मुक्त
    होने के लिए ऐन्टैसिड (antacid) जैसे क्षारकों का उपयोग किया जाता है। इस अध्याय के आरंभ में ऐसा ही
    एक उपचार आपने अवश्य सुझाया होगा। यह ऐन्टैसिड अम्ल की आधिक्य मात्रा को उदासीन करता है। इसके लिए
    मैग्नीशियम हाइड्रॉक्साइड (मिल्क ऑफ मैगनीशिया) जैसे दुर्बल क्षारक का उपयोग किया जाता है।
