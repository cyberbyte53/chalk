  text: आप जानते हैं कि अम्लों का स्वाद खट्टा होता है तथा यह नीले लिटमस पत्र को लाल कर देते हैं। जबकि
    क्षारकों का स्वाद कड़वा होता है एवं यह लाल लिटमस पत्र को नीला कर देते हैं। लिटमस एक प्राकृतिक
    सूचक होता है। इसी प्रकार हल्दी (turmeric) भी एक ऐसा ही सूचक है। क्या आपने कभी ध्यान दिया है कि
    श्वेत कपड़े पर लगे सब्जी के दाग पर जब क्षारकीय प्रकृति वाला साबुन रगड़ते हैं तब उस धब्बे का रंग
    भूरा-लाल हो जाता है? लेकिन कपड़े को अत्यधिक जल से धोने के पश्चात् वह फिर से पीले रंग का हो जाता
    है। अम्ल एवं क्षारक की जाँच के लिए आप संश्लेषित (synthetic) सूचक जैसे मेथिल ऑरेंज (methyl
