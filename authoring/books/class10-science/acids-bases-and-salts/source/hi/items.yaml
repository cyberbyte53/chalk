    की जाँच कीजिए।   इन्हें स्वच्छ सतह पर रखकर उनमें से एक टुकड़े पर तनु HCl विलयन की कुछ बूँदें
    एवं दूसरे पर तनु NaOH विलयन की कुछ बूँदें डालिए।   दोनों टुकड़ों को जल से धोकर उनकी गंध की
