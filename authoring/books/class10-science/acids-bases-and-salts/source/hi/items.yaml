  text: "आपने क्या सीखा   अम्ल-क्षारक सूचक रंजक या रंजकों के  मिश्रण होते हैं, जिनका उपयोग अम्ल एवं
    क्षारक की उपस्थिति को सूचित करने के  लिए किया जाता है।   विलयन में H⁺ (aq) आयन के  निर्माण के
    कारण ही पदार्थ की प्रकृति अम्लीय होती है। विलयन में OH⁻(aq)आयन के निर्माण से पदार्थ की प्रकृति
    क्षारकीय होती है।   जब कोई अम्ल किसी धातु के साथ अभिक्रिया करता है तो हाइड्रोजन गैस का
    उत्सर्जन होता है। साथ ही संगत लवण का निर्माण होता है।   जब क्षारक किसी धातु से अभिक्रिया करता
    है तो हाइड्रोजन गैस के उत्सर्जन के साथ एक लवण का निर्माण होता है जिसका ऋण आयन एक धातु एवं
    ऑक्सीजन के परमाणुओं से संयुक्त रूप से निर्मित होता है।   जब अम्ल किसी धातु कार्बोनेट या धातु
    हाइड्रोजनकार्बोनेट से अभिक्रिया करता है तो यह संगत लवण कार्बन डाइऑक्साइड गैस एवं जल उत्पन्न करता
    है।   जल में अम्लीय एवं क्षारकीय विलयन विद्युत का चालन करते हैं, क्योंकि ये क्रमशः हाइड्रोजन
    एवं हाइड्रॉक्साइड आयन का निर्माण करते हैं।   अम्ल या क्षारक की प्रबलता की जाँच pH (0—14) स्केल
    के उपयोग से की जा सकती है, जो विलयन में हाइड्रोजन आयन की सांद्रता की माप होता है।   एक उदासीन
    विलयन के pH का मान 7 होता है, जबकि अम्लीय विलयन के pH का मान 7 से कम एवं क्षारकीय विलयन के pH का
    मान 7 से अधिक होता है।   सभी जीवों में उपापचय की क्रिया pH की एक इष्टतम सीमा में होती है।  
    सांद्र अम्ल या क्षारक को जल के साथ मिश्रित करना एक अत्यन्त ऊष्माक्षेपी अभिक्रिया है।   अम्ल
    एवं क्षारक एक-दूसरे को उदासीन करके लवण एवं जल का निर्माण करते हैं।   लवण के एक सूत्र इकाई में
    जल के  निश्चित अणुओं की संख्या को क्रिस्टलन का जल कहते हैं।   हमारे दैनिक जीवन एवं उद्योगों
    में लवण के कई उपयोग हैं।"
