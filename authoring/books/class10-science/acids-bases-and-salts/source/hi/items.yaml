  text: क्या आप जानते हैं? लिटमस विलयन बैंगनी रंग का रंजक होता है, जो थैलोफ़ाइटा समूह के लिचेन
    (lichen) पौधे से निकाला जाता है। प्रायः इसे सूचक की तरह उपयोग किया जाता है। लिटमस विलयन जब न तो
    अम्लीय होता है न ही क्षारकीय, तब यह बैंगनी रंग का होता है। बहुत सारे प्राकृतिक पदार्थ; जैसे– लाल
    पत्ता गोभी, हल्दी, हायड्रेंजिया, पिटूनिया एवं जेरानियम जैसे कई फूलों की रंगीन पंखुड़ियाँ किसी
    विलयन में अम्ल एवं क्षारक की उपस्थिति को सूचित करते हैं। इन्हें अम्ल-क्षारक सूचक या कभी-कभी केवल
    सूचक कहते हैं।
