  title: क्या आप जानते हैं?
  text: क्या आप जानते हैं? प्रकृति उदासीनीकरण के विकल्प देती है नेटल एक शाकीय पादप है, जो जंगलों में
    उपजता है। इसके पत्तों में डंकनुमा बाल होते हैं जो अगर गलती से छू जाएँ तो डंक जैसा दर्द होता है।
    इन बालों से मेथैनॉइक अम्ल का स्राव होने के कारण यह दर्द होता है। पारंपरिक तौर पर इसका इलाज डंक
    वाले स्थान पर डॉक पौधे की पत्ती रगड़कर किया जाता है। ये पौधे अधिकतर नेटल के पास ही पैदा होते
    हैं। क्या आप डॉक पौधे की प्रकृति का अनुमान लगा सकते हैं? आप अब जान गए होंगे कि अगली बार पहाड़ों
    पर चढ़ते हुए गलती से नेटल पौधे के छू जाने पर आपको क्या करना होगा? क्या आप ऐसे ही पारंपरिक इलाज
    जानते हैं, जो डंक लगने पर प्रभावी हों?
