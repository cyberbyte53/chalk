    है ‘शक्ति’। इस pH स्केल से सामान्यतः शून्य (अधिक अम्लता) से चौदह (अधिक क्षारीय) तक pH को ज्ञात
    कर सकते हैं। साधारण भाषा pH को एक ऐसी संख्या के रूप में देखना चाहिए, जो किसी विलयन की अम्लता
    अथवा क्षारकीयता को दर्शाते हैं। हाइड्रोनियम आयन की सांद्रता जितनी अधिक होगी उसका pH उतना ही कम
    होगा।
