- id: "3.10.10"
  kind: text
  page: 12
  text: मुँह के pH का मान 5.5 से कम होने पर दाँतों का क्षय प्रारंभ हो जाता है। दाँतों का इनैमल
    (दत्तवल्क) कैल्सियम हाइड्रोक्सीएपेटाइट (कैल्सियम फॉस्फेट का क्रिस्टलीय रूप) से बना होता है, जो
    कि शरीर का सबसे कठोर पदार्थ है। यह जल में नहीं घुलता, लेकिन मुँह के pH का मान 5.5 से कम होने पर
    यह संक्षारित हो जाता है। मुँह में उपस्थित बैक्टीरिया, भोजन के पश्चात मुँह में अवशिष्ट शर्करा एवं
    खाद्य पदार्थों का निम्नीकरण करके अम्ल उत्पन्न करते हैं। भोजन के बाद मुँह साफ़ करने से इससे बचाव
    किया जा सकता है। मुँह की सफ़ाई के लिए क्षारकीय दंत-मंजन का उपयोग करने से अम्ल की आधिक्य मात्रा
    को उदासीन किया जा सकता है, जिसके परिणामस्वरूप दंत क्षय को रोका जा सकता है।
