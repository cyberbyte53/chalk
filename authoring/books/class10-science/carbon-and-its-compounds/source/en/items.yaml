- id: "5.9"
  kind: text
  page: 19
  text: Have you ever observed while bathing that foam is formed with difficulty and an insoluble
    substance (scum) remains after washing with water? This is caused by the reaction of soap with
    the calcium and magnesium salts, which cause the hardness of water. Hence you need to use a
    larger amount of soap. This problem is overcome by using another class of compounds called
    detergents as cleansing agents. Detergents are generally sodium salts of sulphonic acids or
    ammonium salts with chlorides or bromides ions, etc. Both have long hydrocarbon chain. The
    charged ends of these compounds do not form insoluble precipitates with the calcium and
    magnesium ions in hard water. Thus, they remain effective in hard water. Detergents are usually
    used to make shampoos and products for cleaning clothes.
