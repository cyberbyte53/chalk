- id: "2.9"
  kind: section
  page: 9
  number: 4.2.4
  title: Homologous Series
  text: 4.2.4 Homologous Series
- id: "2.9.1"
  kind: text
  page: 9
  text: You have seen that carbon atoms can be linked together to form chains of varying lengths.
    These chains can be branched also. In addition, hydrogen atom or other atoms on these carbon
    chains can be replaced by any of the functional groups that we saw above. The presence of a
    functional group such as alcohol decides the properties of the carbon compound, regardless of
    the length of the carbon chain. For example, the chemical properties of CH₃OH, C₂H₅OH, C₃H₇OH
    and C₄H₉OH are all very similar. Hence, such a series of compounds in which the same functional
    group substitutes for hydrogen in a carbon chain is called a homologous series.
  made:
    - {words: L47.5-L61.1, by: agent}
- id: "2.9.2"
  kind: text
  page: 9
  text: Let us look at the homologous series that we saw earlier in Table 4.2. If we look at the
    formulae of successive compounds, say – CH₄ and C₂H₆ — these differ by a –CH₂- unit C₂H₆ and
    C₃H₈ — these differ by a –CH₂- unit What is the difference between the next pair – propane and
    butane (C₄H₁₀)?
  made:
    - {words: L67.1-L68.1, by: scripts}
    - {words: L69.2-L72.1, by: scripts}
