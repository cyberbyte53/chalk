- id: "4.2.6"
  kind: text
  page: 15
  text: Alcohols react with sodium leading to the evolution of hydrogen. With ethanol, the other
    product is sodium ethoxide. Can you recall which other substances produce hydrogen on reacting
    with metals?
- id: "4.2.7"
