- id: "3.3.4"
  kind: text
  page: 14
  text: We see that some substances are capable of adding oxygen to others. These substances are known
    as oxidising agents.
- id: "3.3.5"
  kind: text
  page: 14
  text: Alkaline potassium permanganate or acidified potassium dichromate are oxidising alcohols to
    acids, that is, adding oxygen to the starting material. Hence they are known as oxidising
    agents.
- id: "3.4"
  kind: section
  page: 14
  number: 4.3.3
  title: Addition Reaction
  text: 4.3.3 Addition Reaction
- id: "3.4.1"
  kind: text
  page: 14
  text: Unsaturated hydrocarbons add hydrogen in the presence of catalysts such as palladium or nickel
    to give saturated hydrocarbons. Catalysts are substances that cause a reaction to occur or
    proceed at a different rate without the reaction itself being affected. This reaction is
    commonly used in the hydrogenation of vegetable oils using a nickel catalyst. Vegetable oils
    generally have long unsaturated carbon chains while animal fats have saturated carbon chains.
- id: "3.4.2"
  kind: figure
  page: 14
  text: ""
  crop: [96.4, 313, 288.7, 351.5]
  made:
    - {box: true, by: figure-snap}
- id: "3.4.3"
  kind: text
  page: 14
  text: You must have seen advertisements stating that some vegetable oils are ‘healthy’. Animal fats
    generally contain saturated fatty acids which are said to be harmful for health. Oils containing
    unsaturated fatty acids should be chosen for cooking.
- id: "3.5"
  kind: section
  page: 14
  number: 4.3.4
  title: Substitution Reaction
  text: 4.3.4 Substitution Reaction
- id: "3.5.1"
  kind: text
  page: 14
  text: Saturated hydrocarbons are fairly unreactive and are inert in the presence of most reagents.
    However, in the presence of sunlight, chlorine is added to hydrocarbons in a very fast reaction.
    Chlorine can replace the hydrogen atoms one by one. It is called a substitution reaction because
    one type of atom or a group of atoms takes the place of another. A number of products are
    usually formed with the higher homologues of alkanes.
- id: "3.5.2"
  kind: equation
  page: 14
  text: CH₄ + Cl₂ → CH₃Cl + HCl (in the presence of sunlight)
