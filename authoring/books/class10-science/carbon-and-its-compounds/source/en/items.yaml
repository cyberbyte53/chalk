- id: "1.12"
  kind: text
  page: 3
  text: In the case of oxygen, we see the formation of a double bond between two oxygen atoms. This is
    because an atom of oxygen has six electrons in its L shell (the atomic number of oxygen is
    eight) and it requires two more electrons to complete its octet. So each atom of oxygen shares
    two electrons with another atom of oxygen to give us the structure shown in Fig. 4.3. The two
    electrons contributed by each oxygen atom give rise to two shared pairs of electrons. This is
    said to constitute a double bond between the two atoms.
