  text: Activity 4.7 Compare the pH of dilute acetic acid and dilute hydrochloric acid using both
    litmus paper and universal indicator. Are both acids indicated by the litmus test? Does the
    universal indicator show them as equally strong acids?
- id: "4.3.3"
  kind: text
  page: 16
  text: The group of organic compounds called carboxylic acids are obviously characterised by their
    acidic nature. However, unlike mineral acids like HCl, which are completely ionised, carboxylic
    acids are weak acids.
