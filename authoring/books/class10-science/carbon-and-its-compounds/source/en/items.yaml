- id: "1.18"
  kind: text
  page: 3
  text: Let us now take a look at methane, which is a compound of carbon. Methane is widely used as a
    fuel and is a major component of bio-gas and Compressed Natural Gas (CNG). It is also one of the
    simplest compounds formed by carbon. Methane has a formula CH₄. Hydrogen, as you know, has a
    valency of 1. Carbon is tetravalent because it has four valence electrons. In order to achieve
    noble gas configuration, carbon shares these electrons with four atoms of hydrogen as shown in
    Fig. 4.5.
  made:
    - {words: L57.5-L59.1, by: agent}
- id: "1.19"
  kind: text
  page: 3
  text: Such bonds which are formed by the sharing of an electron pair between two atoms are known as
    covalent bonds. Covalently bonded molecules are seen to have strong bonds within the molecule,
    but intermolecular forces are weak. This gives rise to the low melting and boiling points of
    these compounds. Since the electrons are shared between atoms and no charged particles are
    formed, such covalent compounds are generally poor conductors of electricity.
  made:
    - {words: L66.12-L67.1, by: agent}
