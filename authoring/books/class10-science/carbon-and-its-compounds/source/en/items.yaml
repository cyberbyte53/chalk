- id: "2.9.3"
  kind: text
  page: 9
  text: Can you find out the difference in molecular masses between these pairs (the atomic mass of
    carbon is 12 u and the atomic mass of hydrogen is 1 u)?
- id: "2.9.4"
  kind: text
  page: 9
  text: Similarly, take the homologous series for alkenes. The first member of the series is ethene
    which we have already come across in Section 4.2.1. What is the formula for ethene? The
    succeeding members have the formula C₃H₆, C₄H₈ and C₅H₁₀. Do these also differ by a –CH₂– unit?
    Do you see any relation between the number of carbon and hydrogen atoms in these compounds? The
    general formula for alkenes can be written as CₙH₂ₙ, where n = 2, 3, 4. Can you similarly
    generate the general formula for alkanes and alkynes?
  made:
    - {words: L100.4-L104.1, by: scripts}
    - {words: L104.2-L107.1, by: scripts}
    - {words: L108.2-L112.1, by: scripts}
    - {words: L112.8-L114, by: agent}
    - {words: L3.5-L7.1, page: 10, by: agent}
- id: "2.9.5"
  kind: text
  page: 10
  text: As the molecular mass increases in any homologous series, a gradation in physical properties
    is seen. This is because the melting and boiling points increase with increasing molecular mass.
    Other physical properties such as solubility in a particular solvent also show a similar
    gradation. But the chemical properties, which are determined solely by the functional group,
    remain similar in a homologous series.
