  text: Activity 4.6 Teacher’s demonstration – Drop a small piece of sodium, about the size of a
    couple of grains of rice, into ethanol (absolute alcohol). What do you observe? How will you
    test the gas evolved?
- id: "4.2.5"
  kind: equation
  page: 15
  text: 2Na + 2CH₃CH₂OH → 2CH₃CH₂O⁻Na⁺ + H₂ (Sodium ethoxide)
  made:
