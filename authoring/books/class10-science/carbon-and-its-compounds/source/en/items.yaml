- id: "1.4"
  kind: text
  page: 2
  text: In Class IX, we learnt about the combining capacity of various elements and how it depends on
    the number of valence electrons. Let us now look at the electronic configuration of carbon. The
    atomic number of carbon is 6. What would be the distribution of electrons in various shells of
    carbon? How many valence electrons will carbon have?
- id: "1.5"
  kind: text
  page: 2
  text: We know that the reactivity of elements is explained as their tendency to attain a completely
    filled outer shell, that is, attain noble gas configuration. Elements forming ionic compounds
    achieve this by either gaining or losing electrons from the outermost shell. In the case of
    carbon, it has four electrons in its outermost shell and needs to gain or lose four electrons to
    attain noble gas configuration. If it were to gain or lose electrons – (i) It could gain four
    electrons forming C⁴⁻ anion. But it would be difficult for the nucleus with six protons to hold
    on to ten electrons, that is, four extra electrons. (ii) It could lose four electrons forming
    C⁴⁺ cation. But it would require a large amount of energy to remove four electrons leaving
    behind a carbon cation with six protons in its nucleus holding on to just two electrons.
  made:
    - {words: L50.8-9, by: agent}
    - {words: L53.8-9, by: scripts}
- id: "1.6"
  kind: text
  page: 2
  text: Carbon overcomes this problem by sharing its valence electrons with other atoms of carbon or
    with atoms of other elements. Not just carbon, but many other elements form molecules by sharing
    electrons in this manner. The shared electrons ‘belong’ to the outermost shells of both the
    atoms and lead to both atoms attaining the noble gas configuration. Before going on to compounds
    of carbon, let us look at some simple molecules formed by the sharing of valence electrons.
- id: "1.7"
  kind: text
  page: 2
  text: The simplest molecule formed in this manner is that of hydrogen. As you have learnt earlier,
    the atomic number of hydrogen is 1. Hence hydrogen has one electron in its K shell and it
    requires one more electron to fill the K shell. So two hydrogen atoms share their electrons to
    form a molecule of hydrogen, H₂. This allows each hydrogen atom to attain the electronic
    configuration of the nearest noble gas, helium, which has two electrons in its K shell. We can
    depict this using dots or crosses to represent valence electrons (Fig. 4.1).
  made:
    - {words: L68.4-L70.1, by: scripts}
