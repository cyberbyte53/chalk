- id: "3"
  kind: section
  page: 12
  number: "4.3"
  title: CHEMICAL PROPERTIES OF CARBON COMPOUNDS
  text: 4.3 CHEMICAL PROPERTIES OF CARBON COMPOUNDS
- id: "3.1"
  kind: text
  page: 12
  text: In this section we will be studying about some of the chemical properties of carbon compounds.
    Since most of the fuels we use are either carbon or its compounds, we shall first study
    combustion.
- id: "3.2"
  kind: section
  page: 12
  number: 4.3.1
  title: Combustion
  text: 4.3.1 Combustion
- id: "3.2.1"
  kind: text
  page: 12
  text: Carbon, in all its allotropic forms, burns in oxygen to give carbon dioxide along with the
    release of heat and light. Most carbon compounds also release a large amount of heat and light
    on burning. These are the oxidation reactions that you learnt about in the first Chapter –
- id: "3.2.2"
  kind: equation
  page: 12
  text: (i) C + O₂ → CO₂ + heat and light
  made:
    - {words: L22.4-L23.1, by: scripts}
    - {words: L24.2-L25, by: agent}
- id: "3.2.3"
  kind: equation
  page: 12
  text: (ii) CH₄ + O₂ → CO₂ + H₂O + heat and light
  made:
    - {words: L27.2-L28.1, by: scripts}
