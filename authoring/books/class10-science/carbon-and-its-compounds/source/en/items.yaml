  title: SOME IMPORTANT CARBON COMPOUNDS – ETHANOL AND ETHANOIC ACID
  text: 4.4 SOME IMPORTANT CARBON COMPOUNDS – ETHANOL AND ETHANOIC ACID
- id: "4.1"
  kind: text
  page: 14
  text: Many carbon compounds are invaluable to us. But here we shall study the properties of two
    commercially important compounds – ethanol and ethanoic acid.
- id: "4.2"
  kind: section
  page: 15
  number: 4.4.1
  title: Properties of Ethanol
  text: 4.4.1 Properties of Ethanol
- id: "4.2.1"
  kind: text
  page: 15
  text: Ethanol is a liquid at room temperature (refer to Table 4.1 for the melting and boiling points
    of ethanol). Ethanol is commonly called alcohol and is the active ingredient of all alcoholic
    drinks. In addition, because it is a good solvent, it is also used in medicines such as tincture
    iodine, cough syrups, and many tonics. Ethanol is also soluble in water in all proportions.
    Consumption of small quantities of dilute ethanol causes drunkenness. Even though this practice
    is condemned, it is a socially widespread practice. However, intake of even a small quantity of
    pure ethanol (called absolute alcohol) can be lethal. Also, long-term consumption of alcohol
    leads to many health problems.
- id: "4.2.2"
  kind: heading
  page: 15
  title: Reactions of Ethanol
  text: Reactions of Ethanol
- id: "4.2.3"
  kind: text
  page: 15
  text: (i) Reaction with sodium –
- id: "4.2.4"
  kind: activity
  page: 15
