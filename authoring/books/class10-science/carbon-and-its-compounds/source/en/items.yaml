- id: "4.2.9"
  kind: text
  page: 15
  text: The concentrated sulphuric acid can be regarded as a dehydrating agent which removes water
    from ethanol.
- id: "4.2.10"
  kind: box
  page: 15
  title: Do You Know?
  text: Do You Know? How do alcohols affect living beings? When large quantities of ethanol are
    consumed, it tends to slow metabolic processes and to depress the central nervous system. This
    results in lack of coordination, mental confusion, drowsiness, lowering of the normal
    inhibitions, and finally stupor. The individual may feel relaxed without realising that his
    sense of judgement, sense of timing, and muscular coordination have been seriously impaired.
    Unlike ethanol, intake of methanol in very small quantities can cause death. Methanol is
    oxidised to methanal in the liver. Methanal reacts rapidly with the components of cells. It
    coagulates the protoplasm, in much the same way an egg is coagulated by cooking. Methanol also
    affects the optic nerve, causing blindness. Ethanol is an important industrial solvent. To
    prevent the misuse of ethanol produced for industrial use, it is made unfit for drinking by
    adding poisonous substances like methanol to it. Dyes are also added to colour the alcohol blue
    so that it can be identified easily. This is called denatured alcohol.
- id: "4.2.11"
  kind: box
  page: 16
  title: More to Know!
  text: More to Know! Alcohol as a fuel Sugarcane plants are one of the most efficient convertors of
    sunlight into chemical energy. Sugarcane juice can be used to prepare molasses which is
    fermented to give alcohol (ethanol). Some countries now use alcohol as an additive in petrol
    since it is a cleaner fuel which gives rise to only carbon dioxide and water on burning in
    sufficient air (oxygen).
- id: "4.3"
  kind: section
  page: 16
  number: 4.4.2
  title: Properties of Ethanoic Acid
  text: 4.4.2 Properties of Ethanoic Acid
- id: "4.3.1"
  kind: text
  page: 16
  text: Ethanoic acid is commonly called acetic acid and belongs to a group of acids called carboxylic
    acids. 5-8% solution of acetic acid in water is called vinegar and is used widely as a
    preservative in pickles. The melting point of pure ethanoic acid is 290 K and hence it often
    freezes during winter in cold climates. This gave rise to its name glacial acetic acid.
