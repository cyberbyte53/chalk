- id: "2.7.12"
  kind: text
  page: 8
  text: All these carbon compounds which contain only carbon and hydrogen are called hydrocarbons.
    Among these, the saturated hydrocarbons are called alkanes. The unsaturated hydrocarbons which
    contain one or more double bonds are called alkenes. Those containing one or more triple bonds
    are called alkynes.
- id: "2.8"
  kind: section
  page: 8
  number: 4.2.3
  title: Will you be my Friend?
  text: 4.2.3 Will you be my Friend?
- id: "2.8.1"
  kind: text
  page: 8
  text: Carbon seems to be a very friendly element. So far we have been looking at compounds
    containing carbon and hydrogen only. But carbon also forms bonds with other elements such as
    halogens, oxygen, nitrogen and sulphur. In a hydrocarbon chain, one or more hydrogens can be
    replaced by these elements, such that the valency of carbon remains satisfied. In such
    compounds, the element replacing hydrogen is referred to as a heteroatom. These heteroatoms are
    also present in some groups as given in Table 4.3. These heteroatoms and the group containing
    these confer specific properties to the compound, regardless of the length and nature of the
    carbon chain and hence are called functional groups. Some important functional groups are given
    in the Table 4.3. Free valency or valencies of the group are shown by the single line. The
    functional group is attached to the carbon chain through this valency by replacing one hydrogen
    atom or atoms.
