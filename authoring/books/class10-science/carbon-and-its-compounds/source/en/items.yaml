  text: Group Activity I Use molecular model kits to make models of the compounds you have learnt in
    this Chapter. II Take about 20 mL of castor oil/cotton seed oil/linseed oil/soyabean oil in a
    beaker. Add 30 mL of 20 % sodium hydroxide solution. Heat the mixture with continuous stirring
