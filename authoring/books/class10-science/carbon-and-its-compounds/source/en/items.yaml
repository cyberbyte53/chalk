  title: BONDING IN CARBON – THE COVALENT BOND
  text: 4.1 BONDING IN CARBON – THE COVALENT BOND
- id: "1.1"
  kind: text
  page: 1
  text: In the previous Chapter, we have studied the properties of ionic compounds. We saw that ionic
    compounds have high melting and boiling points and conduct electricity in solution or in the
    molten state. We also saw how the nature of bonding in ionic compounds explains these
    properties. Let us now study the properties of some carbon compounds.
- id: "1.2"
  kind: text
  page: 2
  text: Most carbon compounds are poor conductors of electricity as we have seen in Chapter 2. From
    the data given in Table 4.1 on the boiling and melting points of the carbon compounds, we find
    that these compounds have low melting and boiling points as compared to ionic compounds (Chapter
    3). We can conclude that the forces of attraction between the molecules are not very strong.
    Since these compounds are largely non-conductors of electricity, we can conclude that the
    bonding in these compounds does not give rise to any ions.
