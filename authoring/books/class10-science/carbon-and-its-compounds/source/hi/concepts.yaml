concepts:
  - key: carbon-is-everywhere-in-things-we-use
    concept: भोजन, कपड़े, दवाओं, पुस्तकों आदि अनेक वस्तुएँ तथा सभी सजीव संरचनाएँ कार्बन पर आधारित होती हैं, जबकि भूपर्पटी तथा वायुमंडल में अत्यंत अल्प मात्रा में कार्बन उपस्थित है।
    terms: []
    items: ["0.3", "0.5", "0.6"]
  - key: carbon-compounds-low-melting-non-conducting
    concept: अधिकांश कार्बन यौगिकों के गलनांक एवं क्वथनांक कम होते हैं तथा ये विद्युत के कुचालक होते हैं, अतः इनके बीच प्रबल आकर्षण बल नहीं है और इनके आबंधन से किसी आयन की उत्पत्ति नहीं होती।
    terms: []
    items: ["1.2", "1.3"]
  - key: carbon-cannot-gain-or-lose-four-electrons
    concept: कार्बन के सबसे बाहरी कोश में चार इलेक्ट्रॉन होते हैं; चार इलेक्ट्रॉन प्राप्त कर C⁴⁻ ऋणायन या चार इलेक्ट्रॉन खो कर C⁴⁺ धनायन बनाना इसके लिए कठिन है।
    terms: []
    items: ["1.4", "1.5"]
  - key: sharing-electrons-gives-noble-gas-configuration
    concept: जिन इलेक्ट्रॉनों की साझेदारी की जाती है, वे दोनों परमाणुओं के बाहरी कोश के ही होते हैं, तथा इनके फलस्वरूप दोनों ही परमाणु उत्कृष्ट गैस विन्यास की स्थिति को प्राप्त करते हैं।
    terms: []
    items: ["1.6", "1.7", "1.13"]
  - key: single-double-triple-bonds
    concept: इलेक्ट्रॉन का एक सहभागी युग्म एकल बंध बनाता है, जैसे H₂ में; दो सहभागी युग्म द्विआबंध, जैसे O₂ में; तीन सहभागी युग्म त्रिआबंध, जैसे N₂ में; आबंध को दो परमाणुओं के बीच एक रेखा के द्वारा भी व्यक्त किया जाता है।
    terms: [एकल बंध, द्विआबंध, त्रिआबंध]
    items: ["1.8", "1.9", "1.10", "1.12", "1.14", "1.15", "1.16"]
  - key: carbon-is-tetravalent-methane
    concept: कार्बन चतुःसंयोजक है, क्योंकि इसमें चार संयोजकता इलेक्ट्रॉन होते हैं; मेथेन (CH₄) में कार्बन इन इलेक्ट्रॉनों की साझेदारी हाइड्रोजन के चार परमाणुओं के साथ करता है।
    terms: [चतुःसंयोजक]
    items: ["1.18", "1.19"]
  - key: covalent-bonds-and-their-compounds
    concept: दो परमाणुओं के बीच इलेक्ट्रॉन के एक युग्म की साझेदारी के द्वारा बनने वाले आबंध सहसंयोजी आबंध कहलाते हैं; इन अणुओं में भीतर प्रबल आबंध, किंतु दुर्बल अंतराअणुक बल होता है, फलस्वरूप इनके क्वथनांक एवं गलनांक कम होते हैं और ये विद्युत के कुचालक होते हैं।
    terms: [सहसंयोजी आबंध]
    items: ["1.20"]
  - key: allotropes-of-carbon
    concept: कार्बन तत्व अनेक विभिन्न भौतिक गुणों के साथ विविध रूपों में पाया जाता है; हीरा (दृढ़ त्रिआयामी संरचना, सर्वाधिक कठोर), ग्रेफ़ाइट (षट्कोणीय तल, चिकना और विद्युत का सुचालक) तथा C-60 जैसे फुलेरीन।
    terms: [हीरा, ग्रेफ़ाइट, फुलेरीन]
    items: ["1.21", "1.22", "1.23", "1.24"]
  - key: catenation
    concept: कार्बन में कार्बन के ही अन्य परमाणुओं के साथ आबंध बनाने की अद्वितीय क्षमता होती है, जिससे लंबी शृंखला, शाखाओं वाली शृंखला अथवा वलय बनते हैं; इस गुण को शृंखलन कहते हैं, और कार्बन-कार्बन आबंध अत्यधिक प्रबल होता है।
    terms: [शृंखलन]
    items: ["2.1"]
  - key: tetravalency-and-strong-bonds-give-many-compounds
    concept: कार्बन की संयोजकता चार होती है और इसके छोटे आकार के कारण अन्य तत्वों के साथ इसके आबंध अत्यंत प्रबल होते हैं; शृंखलन के साथ इससे कई मिलियन स्थायी कार्बन यौगिक बनते हैं।
    terms: []
    items: ["2.1", "2.2"]
  - key: organic-compounds
    concept: यह समझा गया था कि कार्बनिक यौगिक केवल सजीवों में ही निर्मित हो सकते हैं, किंतु 1828 में फ्रेडरिक वोहलर ने अमोनियम सायनेट से यूरिया बनाकर इसे असत्य प्रमाणित किया; इनका अध्ययन अभी भी कार्बनिक रसायन के अंतर्गत होता है।
    terms: [कार्बनिक यौगिक]
    items: ["2.3"]
  - key: saturated-compounds
    concept: कार्बन परमाणुओं के बीच केवल एक आबंध से जुड़े कार्बन के यौगिक, जैसे एथेन और प्रोपेन, संतृप्त यौगिक कहलाते हैं; सामान्यतः ये अधिक अभिक्रियाशील नहीं होते।
    terms: [संतृप्त यौगिक]
    items: ["2.1", "2.4.1", "2.4.2", "2.4.3", "2.4.4", "2.4.5", "2.4.6"]
  - key: unsaturated-compounds
    concept: द्वि अथवा त्रि-आबंध वाले कार्बन के यौगिक, जैसे एथीन और एथाइन, असंतृप्त यौगिक कहलाते हैं; ये संतृप्त कार्बन यौगिकों की तुलना में अधिक अभिक्रियाशील होते हैं।
    terms: [असंतृप्त यौगिक]
    items: ["2.1", "2.4.7", "2.4.8", "2.4.9", "2.4.10", "2.4.11", "2.4.12", "2.4.13", "2.4.14"]
  - key: drawing-a-carbon-compound
    concept: सरल कार्बन यौगिकों की संरचना प्राप्त करने के लिए सबसे पहले कार्बन के परमाणुओं को एक आबंध के द्वारा आपस में जोड़ा जाता है तथा फिर कार्बन की शेष संयोजकता को हाइड्रोजन के परमाणुओं से संतुष्ट करते हैं; असंतुष्ट संयोजकता द्विआबंध से संतुष्ट होती है।
    terms: []
    items: ["2.4.1", "2.4.10"]
  - key: carbon-chains
    concept: कार्बन परमाणुओं की शृंखलाओं में दसों कार्बन परमाणु हो सकते हैं, जैसे मेथेन, एथेन, प्रोपेन, ब्यूटेन, पेन्टेन तथा हेक्सेन।
    terms: []
    items: ["2.5.1", "2.5.2"]
  - key: structural-isomers
    concept: समान आणविक सूत्र, लेकिन विभिन्न संरचनाओं वाले ऐसे यौगिक, जैसे C₄H₁₀ की दो संरचनाएँ, संरचनात्मक समावयन कहलाते हैं।
    terms: [संरचनात्मक समावयन]
    items: ["2.5.3", "2.5.4", "2.5.5", "2.5.6"]
  - key: carbon-rings
    concept: कुछ यौगिकों में कार्बन के परमाणु वलय के आकार में व्यवस्थित होते हैं; ये संतृप्त, जैसे साइक्लोहेक्सेन, अथवा असंतृप्त, जैसे बेन्जीन, हो सकते हैं।
    terms: []
    items: ["2.5.7", "2.5.8", "2.5.9", "2.5.10"]
  - key: hydrocarbons-alkanes-alkenes-alkynes
    concept: केवल कार्बन एवं हाइड्रोजन वाले कार्बन यौगिक हाइड्रोकार्बन कहलाते हैं; संतृप्त हाइड्रोकार्बन ‘ऐल्केन’, दोहरे आबंध वाले ‘ऐल्कीन’ तथा त्रि-आबंध वाले ‘ऐल्काइन’ कहलाते हैं।
    terms: [हाइड्रोकार्बन, ऐल्केन, ऐल्कीन, ऐल्काइन]
    items: ["2.5.11"]
  - key: heteroatoms-and-functional-groups
    concept: हाइड्रोकार्बन श्रंखला में हाइड्रोजन को प्रतिस्थापित करने वाले तत्वों को विषम परमाणु कहते हैं; ये और इनके समूह यौगिकों को विशिष्ट गुण प्रदान करते हैं, जो कार्बन शृंखला की लँबाई और प्रकृति पर निर्भर नहीं होते, इसलिए ये प्रकार्यात्मक समूह कहलाते हैं।
    terms: [विषम परमाणु, प्रकार्यात्मक समूह]
    items: ["2.6.1", "2.6.2"]
  - key: homologous-series
    concept: यौगिकों की ऐसी शृंखला जिसमें कार्बन शृंखला में स्थित हाइड्रोजन को एक ही प्रकार का प्रकार्यात्मक समूह प्रतिस्थापित करता है, उसे समजातीय श्रेणी कहते हैं; उत्तरोत्तर यौगिकों में एक –CH₂- इकाई का अंतर होता है।
    terms: [समजातीय श्रेणी]
    items: ["2.7.1", "2.7.2", "2.7.3", "2.7.4", "2.7.5", "2.7.8"]
  - key: homologous-series-general-formula
    concept: समजातीय श्रेणी के सदस्यों का एक सामान्य सूत्र होता है, जैसे ऐल्कीनों का सामान्य सूत्र CₙH₂ₙ।
    terms: []
    items: ["2.7.6"]
  - key: homologous-series-gradation
    concept: समजातीय श्रेणी में आणविक द्रव्यमान बढ़ने पर गलनांक एवं क्वथनांक जैसे भौतिक गुणधर्मों में क्रमबद्धता दिखाई देती है, किंतु प्रकार्यात्मक समूह के द्वारा सुनिश्चित किए जाने वाले रासायनिक गुण एकसमान बने रहते हैं।
    terms: [क्रमबद्धता]
    items: ["2.7.7"]
  - key: naming-carbon-compounds
    concept: यौगिक का नाम मूल कार्बन शृंखला (तीन कार्बन परमाणु वाले यौगिक का नाम प्रोपेन) से, प्रकार्यात्मक समूह के अनुसार पूर्वलग्न अथवा अनुलग्न लगाकर, स्वर से प्रारंभ होने वाले अनुलग्न से पहले अंत का ‘e’ हटाकर, तथा द्विआबंध या त्रि-आबंध के लिए ‘ene' या ‘yne' लगाकर दिया जाता है।
    terms: [पूर्वलग्न, अनुलग्न]
    items: ["2.8.1", "2.8.2", "2.8.3"]
  - key: combustion
    concept: अपने सभी अपररूपों में कार्बन, ऑक्सीजन में दहन करके ऊष्मा एवं प्रकाश के साथ कार्बन डाइऑक्साइड देता है; दहन पर अधिकांश कार्बन यौगिक भी प्रचुर मात्रा में ऊष्मा एवं प्रकाश मुक्त करते हैं।
    terms: [दहन]
    items: ["3.1", "3.2.1", "3.2.2", "3.2.3", "3.2.4", "3.2.5"]
  - key: clean-and-sooty-flames
    concept: संतृप्त हाइड्रोकार्बन से सामान्यतः स्वच्छ ज्वाला निकलेगी, जबकि असंतृप्त कार्बन यौगिकों से काले धुएँ वाली पीली ज्वाला; वायु की आपूर्ति को सीमित कर देने से अपूर्ण दहन होने पर संतृप्त हाइड्रोकार्बनों से भी कज्जली ज्वाला निकलेगी।
    terms: [अपूर्ण दहन]
    items: ["3.2.6", "3.2.7", "3.2.8", "3.2.9"]
  - key: burning-fuels-pollute
    concept: कोयले तथा पेट्रोलियम जैसे ईंधनों में कुछ मात्रा में नाइट्रोजन तथा सल्फ़र होती हैं, जिनके दहन से सल्फ़र तथा नाइट्रोजन के ऑक्साइड बनते हैं, जो पर्यावरण में प्रमुख प्रदूषक हैं।
    terms: []
    items: ["3.2.9"]
  - key: flames-come-from-gases
    concept: केवल गैसीय पदार्थों के जलने पर ही ज्वाला उत्पन्न होती है; गैसीय पदार्थों के परमाणुओं को ताप देने पर दीप्त ज्वाला दिखाई देती है, तथा प्रत्येक तत्व के द्वारा उत्पन्न रंग उस तत्व का अभिलाक्षणिक गुण होता है।
    terms: []
    items: ["3.2.10"]
  - key: fossil-fuels
    concept: कोयला लाखों वर्ष पुराने पौधों का तथा तेल एवं गैस छोटे समुद्री पौधों तथा जीवों के अवशेष हैं, जो दाब में बदल गए; इसलिए कोयले तथा पेट्रोलियम को जीवाश्मी ईंधन कहते हैं।
    terms: [जीवाश्मी ईंधन]
    items: ["3.2.11"]
  - key: oxidation-of-alcohols
    concept: क्षारीय पोटैशियम परमैंगनेट अथवा अम्लीकृत पोटैशियम डाइक्रोमेट एल्कोहलों को अम्लों में आक्सीकृत करते हैं अर्थात ये आरंभिक पदार्थ में ऑक्सीजन जोड़ते हैं; अतएव इनको ऑक्सीकारक कहते हैं।
    terms: [ऑक्सीकारक]
    items: ["3.3.1", "3.3.2", "3.3.3", "3.3.4", "3.3.5"]
  - key: addition-reaction-hydrogenation
    concept: पैलेडियम अथवा निकैल जैसे उत्प्रेरकों की उपस्थिति में असंतृप्त हाइड्रोकार्बन हाइड्रोजन जोड़कर संतृप्त हाइड्रोकार्बन देते हैं; वनस्पति तेलों के हाड्रोजनीकरण में इस अभिक्रिया का उपयोग होता है।
    terms: [उत्प्रेरक, हाड्रोजनीकरण]
    items: ["3.4", "3.4.1"]
  - key: saturated-and-unsaturated-fats
    concept: साधारणतः, जंतु वसा में संतृप्त वसा अम्ल होते हैं, जो स्वास्थ्य के लिए हानिकारक माने जाते हैं; भोजन पकाने के लिए असंतृप्त वसा अम्लों वाले तेलों का उपयोग करना चाहिए।
    terms: []
    items: ["3.4.1", "3.4.2"]
  - key: substitution-reaction
    concept: संतृप्त हाइड्रोकार्बन अधिकांश अभिकर्मकों की उपस्थिति में अक्रिय होते हैं, किंतु सूर्य के प्रकाश में क्लोरीन एक-एक करके हाइड्रोजन के परमाणुओं का प्रतिस्थापन करती है; इसको प्रतिस्थापन अभिक्रिया कहते हैं।
    terms: [प्रतिस्थापन अभिक्रिया]
    items: ["3.5.1", "3.5.2"]
  - key: ethanol-properties-and-uses
    concept: एथनॉल (एल्कोहल) कक्ष के ताप पर द्रव है, किसी भी अनुपात में जल में मिलाया जा सकता है और अच्छा विलायक होने से औषधियों में प्रयुक्त होता है; शुद्ध एथनॉल (परिशुद्ध एल्कोहल) की थोड़ी सी भी मात्रा घातक सिद्ध हो सकती है।
    terms: [परिशुद्ध एल्कोहल]
