  text: क्या आपने कभी स्नान करते समय अनुभव किया है कि झाग मुश्किल से बन रहा है एवं जल  से शरीर धो लेने
    के  बाद भी कुछ अघुलनशील पदार्थ (स्कम) जमा रहता है। ऐसा इसलिए होता है, क्योंकि साबुन कठोर जल में
    उपस्थित कैल्सियम एवं मैग्नीशियम लवणों से अभिक्रिया करता है। ऐसे में आपको अधिक मात्रा में साबुन
    का उपयोग करना पड़ता है। एक अन्य प्रकार के यौगिक यानी अपमार्जक का उपयोग कर इस समस्या को निपटाया
    जा सकता है। अपमार्जक सामान्यतः लंबी कार्बन शृंखला वाले सल्फ़ोनिक लवण अथवा लंबी कार्बन शृंखला
    वाले अमोनियम लवण होते हैं, जो क्लोराइड या बोमाइड आयनों के साथ बनते हैं। इन यौगिकों का आवेशित
    सिरा कठोर जल में उपस्थित कैल्शियम एवं मैग्नीशियम आयनों के साथ अघुलनशील पदार्थ नहीं बनाते हैं। इस
    प्रकार वह कठोर जल में भी प्रभावी बने रहते हैं। सामान्यतः अपमार्जकों का उपयोग शैंपू एवं कपड़े
    धोने के उत्पाद बनाने में होता है।
