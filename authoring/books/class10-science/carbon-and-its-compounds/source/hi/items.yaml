    अवयव होता है। इसके अतिरिक्त यह एक अच्छा विलायक है। इसलिए, इसका उपयोग टिंचर आयोडीन, कफ़ सीरप,
    टॉनिक आदि जैसी औषधियों में होता है। एथनॉल को किसी भी अनुपात में जल में मिलाया जा सकता है। तनु
    एथनॉल की थोड़ी सी भी मात्रा लेने पर नशा आ जाता है। हालाँकि एल्कोहल पीना निंदनीय है, लेकिन समाज
