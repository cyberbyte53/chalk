  title: आपने क्या सीखा
  text: आपने क्या सीखा कार्बन एक सर्वतोमुखी तत्व है, जो सभी जीवों एवं हमारे उपयोग में आने वाली वस्तुओं
    का आधार है। कार्बन की चतुःसंयोजकता एवं शृंखलन प्रकृति के कारण यह कई यौगिक बनाता है।  अपने-अपने
    बाहरी कोशों को पूर्ण रूप से भरने के  लिए दो परमाणुओं के  बीच इलेक्ट्रॉनों की साझेदारी से
    सहसंयोजक आबंध बनता है। कार्बन अपने या दूसरे तत्वों; जैसे– हाइड्रोजन, ऑक्सीजन, सल्फ़र, नाइट्रोजन
    एवं क्लोरीन के साथ सहसंयोजक आबंध बनाता है। कार्बन ऐसे यौगिक भी बनाता है, जिसमें कार्बन परमाणुओं
    के बीच द्वि या त्रिआबंध होते हैं। कार्बन की यह श्रंखला, सीधी, शाखायुक्त या वलीय किसी भी रूप में
    हो सकती है। कार्बन की शृंखला बनाने की क्षमता के कारण यौगिकों की एक समजाती श्रेणी उत्पन्न होती
    है, जिसमें विभिन्न लंबाई वाली कार्बन शृंखला से समान प्रकार्यात्मक समूह जुड़ा होता है। एल्कोहल,
    ऐल्डिहाइड, कीटोन एवं कार्बोक्सिलिक अम्ल जैसे समूह कार्बन यौगिकों का अभिलाक्षणिक गुण प्रदान करते
    हैं। कार्बन तथा उसके यौगिक हमारे ईंधन के  प्रमुख स्रोत हैं। कार्बन यौगिक एथनॉल एवं एथेनॉइक अम्ल
    का हमारे दैनिक जीवन में काफ़ी महत्व है। साबुन एवं अपमार्जक की प्रक्रिया अणुओं में जलरागी तथा
    जलविरागी दोनों समूहों की उपस्थिति पर आधारित है। इसकी मदद से तैलीय मैल का पायस बनता है और बाहर
    निकलता है।
