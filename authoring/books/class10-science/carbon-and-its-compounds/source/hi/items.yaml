- id: "2.6.1"
  kind: text
  page: 9
  text: कार्बन अत्यंत मैत्रीपूर्ण तत्व है। अभी तक हमने कार्बन तथा हाइड्रोजन के यौगिकों की चर्चा की,
    लेकिन कार्बन अन्य तत्वों; जैसे– हैलोजेन, ऑक्सीजन, नाइट्रोजन तथा सल्फ़र के साथ भी आबंध बनाता है।
    हाइड्रोकार्बन श्रंखला में यह तत्व एक या अधिक हाइड्रोजन को इस प्रकार प्रतिस्थापित करते हैं कि
    कार्बन की संयोजकता संतुष्ट रहती है। ऐसे यौगिकों में हाइड्रोजन को प्रतिस्थापित करने वाले तत्वों
    को विषम परमाणु कहते हैं। यह विषम परमाणु कुछ प्रकार्यात्मक समूहों में भी उपस्थित होते हैं, जैसा
    कि सारणी 4.3 में दिया गया है। यह विषम परमाणु और वे प्रकार्यात्मक समूह जिनमें यह उपस्थित होते
    हैं, यौगिकों को विशिष्ट गुण प्रदान करते हैं। यह गुण कार्बन शृंखला की लँबाई और प्रकृति पर निर्भर
    नहीं होते, फलस्वरूप यह प्रकार्यात्मक समूह (Functional group) कहलाते हैं। सारणी 4.3 में कुछ
    महत्वपूर्ण प्रकार्यात्मक समूह दिए गए हैं। एकल रेखा के द्वारा समूह की मुक्त संयोजकता अथवा
    संयोजकताएँ दर्शाई गई हैं। हाइड्रोजन के एक या अधिक अणुओं को प्रतिस्थापित करके इस संयोजकता के
    द्वारा प्रकार्यात्मक समूह कार्बन शृंखला से जुड़े रहते हैं।
