  title: क्या आप जानते हैं?
  text: क्या आप जानते हैं? सजीव प्राणियों पर एल्कोहल का क्या प्रभाव पड़ता है? जब अधिक मात्रा में एथनॉल
    का सेवन किया जाता है तो इससे उपापचयी प्रक्रिया धीमी हो जाती है तथा केंद्रीय तंत्रिका तंत्र
    कमज़ोर हो जाता है। इसके फलस्वरूप समन्वय की कमी, मानसिक दुविधा, उनींदापन, सामान्य अर्न्तबाध का कम
    हो जाना एवं भावशून्यता आती है। यद्यपि व्यक्ति राहत महसूस करता है, लेकिन उसे पता नहीं चल पाता कि
    उसके सोचने, समझने की क्षमता तथा मांसपेशी बुरी तरह प्रभावित हुई है। एथनॉल के विपरीत मेथेनॉल की
    थोड़ी सी थी मात्रा लेने से मृत्यु हो सकती है। यकृत में मेथेनॉल ऑक्सीकृत होकर मेथेनैल बन जाता है।
    मेथेनैल यकृत की कोशिकाओं के घटकों के साथ शीघ्र अभिक्रिया करने लगता है। इससे प्रोटोप्लाज्म उसी
    प्रकार स्कंदित हो जाता है, जिस प्रकार पकाने पर अंडा स्कंदित होता है। मेथेनैल चाक्षुष तंत्रिका को
    भी प्रभावित करता है, जिससे व्यक्ति अंधा हो सकता है। एथनॉल एक महत्वपूर्ण औद्योगिक विलायक है।
    औद्योगिक उपयोग के लिए तैयार एथनॉल का दुरुपयोग रोकने के लिए इसमें मेथेनॉल जैसा ज़हरीला पदार्थ
    मिला दिया जाता है, जिससे यह पीने योग्य न रह जाए। एल्कोहल की पहचान करने के लिए इसमें रंजक मिलाकर
    इसका रंग नीला बना दिया जाता है। इसे विकृत एल्कोहल कहा जाता है।
