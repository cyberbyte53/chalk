    परमाणुओं की संख्या ज्ञात कीजिए। तीन कार्बन परमाणु वाले यौगिक का नाम प्रोपेन होगा। (ii)
    प्रकार्यात्मक समूह की उपस्थिति में इसको पूर्वलग्न अथवा अनुलग्न के साथ यौगिक के नाम में दर्शाया
    जाता है। (सारणी 4.4 के अनुसार) (iii) यदि प्रकार्यात्मक सूमह का नाम अनुलग्न के आधार पर दिया जाना
    हो तथा यदि प्रकार्यात्मक समूह के अनुलग्न नाम स्वर a, e, i, o, u से प्रारंभ होता हो तो कार्बन
    शृंखला के नाम से अंत का ‘e’ हटाकर, उसमें समुचित अनुलग्न लगाकर संशोधित करते हैं, जैसे– कीटोन समूह
    की तीन कार्बन वाली श्रंखला को निम्नलिखित विधि से नाम दिया जाएगा– Propane – ‘e' = propan + ‘one'
    = propanone प्रोपेनोन. (iv) असंतृप्त कार्बन शृंखला में कार्बन शृंखला के नाम में दिए गए अंतिम
    ‘ane' को सारणी 4.4 के अनुसार ‘ene' या ‘yne' से प्रतिस्थापित करते हैं, जैसे– द्विआबंध वाली तीन
