- id: "1.21"
  kind: box
  page: 4
  title: क्या आप जानते हैं?
  text: क्या आप जानते हैं? कार्बन के अपररूप प्रकृति में कार्बन तत्व अनेक विभिन्न भौतिक गुणों के साथ
    विविध रूपों में पाया जाता है। हीरा एवं ग्रेफ़ाइट दोनों ही कार्बन के परमाणुओं से बने हैं, कार्बन
    के परमाणुओं के परस्पर आबंधन के तरीकों के आधार पर ही इनमें अंतर होता है। हीरे में कार्बन का
    प्रत्येक परमाणु कार्बन के चार अन्य परमाणुओं के साथ आबंधित होता है, जिससे एक दृढ़ त्रिआयामी
    संरचना बनती है। ग्रेफ़ाइट में कार्बन के प्रत्येक परमाणु का आबंधन कार्बन के तीन अन्य परमाणुओं के
    साथ एक ही तल पर होता है, जिससे षट्कोणीय व्यूह मिलता है। इनमें से एक आबंध द्विआबंधी होता है,
    जिसके कारण कार्बन की संयोजकता पूर्ण होती है। ग्रेफ़ाइट की संरचना में षट्कोणीय तल एक-दूसरे के ऊपर
    व्यवस्थित होते हैं। इन दो विभिन्न संरचनाओं के कारण हीरे एवं ग्रेफ़ाइट के भौतिक गुणधर्म अत्यंत
    भिन्न होते हैं, जबकि उनके रासायनिक गुणधर्म एकसमान होते हैं। हीरा अब तक का ज्ञात सर्वाधिक कठोर
    पदार्थ है, जबकि ग्रेफ़ाइट चिकना तथा फिसलनशील होता है। पिछले अध्याय में आपने जिन अधातुओं के बारे
    में अध्ययन किया, उनके विपरीत ग्रेफ़ाइट विद्युत का सुचालक होता है। शुद्ध कार्बन को अत्यधिक उच्च
    दाब एवं ताप पर उपचारित (subjecting) करके हीरे को संश्लेषित किया जा सकता है। ये संश्लिष्ट हीरे
    आकार में छोटे होते हैं, लेकिन अन्यथा ये प्राकृतिक हीरों से अभेदनीय होते हैं। फुलेरीन कार्बन
    अपररूप का अन्य वर्ग है। सबसे पहले C-60 की पहचान की गई, जिसमें कार्बन के परमाणु फुटबॉल के रूप में
    व्यवस्थित होते हैं। चूँकि, यह अमेरिकी आर्किटेक्ट बकमिंसटर फ़ुलर (Buckminster Fuller) द्वारा
    डिज़ाइन किए गए जियोडेसिक गुंबद के समान लगते हैं, इसीलिए, इस अणु को फुलेरीन नाम दिया गया।
