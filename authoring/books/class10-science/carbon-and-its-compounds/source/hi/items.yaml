  text: विभिन्न तत्वों एवं यौगिकों में हमने इलेक्ट्रॉनों की साझेदारी द्वारा सहसंयोजी आबंध का निर्माण
    देखा। हमने सरल कार्बन यौगिक, मेथेन की संरचना भी देखी। अध्याय के आरंभ में हमने देखा कि कितनी
    वस्तुओं में कार्बन पाया जाता है। वस्तुतः हम स्वयं भी कार्बन के यौगिकों से बने हुए हैं। हाल ही
    में रसायनशास्त्रियों द्वारा सूत्र सहित ज्ञात कार्बन यौगिकों की गणना की गई है, जो लगभग कई मिलियन
    आँकी गई है। अन्य सभी तत्वों के यौगिकों को एक साथ रखने पर भी इनकी संख्या उन सबसे कहीं अधिक है।
    ऐसा क्यों है कि यह गुणधर्म केवल कार्बन में ही मिलता है किसी और तत्व में नहीं? सहसंयोजी बंध की
    प्रकृति के कारण कार्बन में बड़ी संख्या में यौगिक बनाने की क्षमता होती है। कार्बन में दो कारक
    देखे गए हैं— (i) कार्बन में कार्बन के ही अन्य परमाणुओं के साथ आबंध बनाने की अद्वितीय क्षमता होती
    है, जिससे बड़ी संख्या मे अणु बनते हैं। इस गुण को शृंखलन (catenation) कहते हैं। इन यौगिकों में
    कार्बन की लंबी शृंखला, कार्बन की विभिन्न शाखाओं वाली शृंखला अथवा वलय में व्यवस्थित कार्बन भी पाए
    जाते हैं। साथ ही कार्बन के परमाणु एक, द्वि अथवा त्रि आबंध से जुड़े हो सकते हैं। कार्बन परमाणुओं
    के बीच केवल एक आबंध से जुड़े कार्बन के यौगिक संतृप्त यौगिक कहलाते हैं। द्वि अथवा त्रि-आबंध वाले
    कार्बन के यौगिक असंतृप्त यौगिक कहलाते हैं। कार्बन यौगिकों में जिस सीमा तक शृंखलन का गुण पाया
    जाता है वह किसी और तत्व में नहीं मिलता है। सिलिकॉन हाइड्रोजन के साथ यौगिक बनाते हैं, जिनमें सात
    या आठ परमाणुओं तक की शृंखला हो सकती है, लेकिन यह यौगिक अति अभिक्रियाशील होते हैं। कार्बन-कार्बन
    आबंध अत्यधिक प्रबल होता है, अतः यह स्थायी होता है। फलस्वरूप अनेक कार्बन परमाणुओं के साथ आपस में
    जुड़े हुए अनेक यौगिक प्राप्त होते हैं। (ii) चूँकि , कार्बन की संयोजकता चार होती है, अतः इसमें
    कार्बन के चार अन्य परमाणुओं अथवा कुछ अन्य एक संयोजक तत्वों के परमाणुओं के साथ आबंधन की क्षमता
    होती है। ऑक्सीजन, हाइड्रोजन, नाइट्रोजन, सल्फ़र, क्लोरीन तथा अनेक अन्य तत्वों के साथ कार्बन के
    यौगिक बनते हैं, फलस्वरूप ऐसे विशेष गुण वाले यौगिक बनते हैं, जो अणु में कार्बन के अतिरिक्त
    उपस्थित तत्व पर निर्भर करते हैं।
