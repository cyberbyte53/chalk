- id: "2.3"
  kind: box
  page: 6
  title: क्या आप जानते हैं?
  text: क्या आप जानते हैं? कार्बनिक यौगिक कार्बन में पाए जाने वाले दो विशिष्ट लक्षणों, चतुःसंयोजकता और
    शृंखलन से बड़ी संख्या में यौगिकों का निर्माण होता है। अनेक यौगिकों के अकार्बनिक परमाणु अथवा
    परमाणु के समूह विभिन्न कार्बन शृंखलाओं से जुड़े होते हैं। मूल रूप से इन यौगिकों को प्राकृतिक
    पदार्थों से प्राप्त किया गया था तथा यह समझा गया था कि ये कार्बन यौगिक अथवा कार्बनिक यौगिक केवल
    सजीवों में ही निर्मित हो सकते हैं। अर्थात, यह माना गया कि उनके संश्लेषण के लिए एक ‘जीवन शक्ति’
    आवश्यक थी। 1828 में फ्रेडरिक वोहलर (Friedrich Wöhler) ने अमोनियम सायनेट से यूरिया बनाकर इसे
    असत्य प्रमाणित किया, लेकिन कार्बाईड, कार्बोनेट तथा बाइकार्बोनेट लवणों के अतिरिक्त सभी कार्बन
    यौगिकों का अध्ययन अभी भी कार्बनिक रसायन के अंतर्गत होता है।
