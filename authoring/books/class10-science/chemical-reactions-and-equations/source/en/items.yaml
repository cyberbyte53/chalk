  title: Chemical Reactions and Equations
  text: Chemical Reactions and Equations
- id: "0.3"
  kind: text
  page: 1
  text: Consider the following situations of daily life and think what happens when – milk is left at
    room temperature during summers. an iron tawa/pan/nail is left exposed to humid atmosphere.
    grapes get fermented. food is cooked. food gets digested in our body. we respire.
  made:
    - {words: L7.1-L8.1, by: agent}
- id: "0.4"
  kind: text
  page: 1
  text: In all the above situations, the nature and the identity of the initial substance have
    somewhat changed. We have already learnt about physical and chemical changes of matter in our
    previous classes. Whenever a chemical change occurs, we can say that a chemical reaction has
    taken place.
- id: "0.5"
  kind: text
  page: 1
  text: You may perhaps be wondering as to what is actually meant by a chemical reaction. How do we
    come to know that a chemical reaction has taken place? Let us perform some activities to find
    the answer to these questions.
- id: "0.6"
  kind: activity
  page: 1
  number: Activity 1.1
  text: "Activity 1.1 CAUTION: This Activity needs the teacher’s assistance. It would be better if
    students wear suitable eyeglasses. Clean a magnesium ribbon about 3-4 cm long by rubbing it with
    sandpaper. Hold it with a pair of tongs. Burn it using a spirit lamp or burner and collect the
    ash so formed in a watch-glass as shown in Fig. 1.1. Burn the magnesium ribbon keeping it away
    as far as possible from your eyes. What do you observe?"
- id: "0.7"
  kind: figure
  page: 1
  number: Figure 1.1
  text: Figure 1.1 Burning of a magnesium ribbon in air and collection of magnesium oxide in a
    watch-glass
  crop: [272, 514.9, 548.2, 710.5]
