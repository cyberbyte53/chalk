- id: "2.1"
  kind: text
  page: 6
  text: We have learnt in Class IX that during a chemical reaction atoms of one element do not change
    into those of another element. Nor do atoms disappear from the mixture or appear from elsewhere.
    Actually, chemical reactions involve the breaking and making of bonds between atoms to produce
    new substances. You will study about types of bonds formed between atoms in Chapters 3 and 4.
