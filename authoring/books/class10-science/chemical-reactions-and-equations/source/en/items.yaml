- id: "0.12"
  kind: text
  page: 2
  text: From the above three activities, we can say that any of the following observations helps us to
    determine whether a chemical reaction has taken place – change in state change in colour
    evolution of a gas change in temperature.
- id: "0.13"
  kind: text
  page: 2
  text: As we observe the changes around us, we can see that there is a large variety of chemical
    reactions taking place around us. We will study about the various types of chemical reactions
    and their symbolic representation in this Chapter.
