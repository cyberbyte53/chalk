- id: "0.8"
  kind: text
  page: 2
  text: You must have observed that magnesium ribbon burns with a dazzling white flame and changes
    into a white powder. This powder is magnesium oxide. It is formed due to the reaction between
    magnesium and oxygen present in the air.
- id: "0.9"
  kind: activity
  page: 2
  number: Activity 1.2
  text: Activity 1.2 Take lead nitrate solution in a test tube. Add potassium iodide solution to this.
    What do you observe?
- id: "0.10"
  kind: activity
  page: 2
  number: Activity 1.3
  text: "Activity 1.3 Take a few zinc granules in a conical flask or a test tube. Add dilute
    hydrochloric acid or sulphuric acid to this (Fig. 1.2). CAUTION: Handle the acid with care. Do
    you observe anything happening around the zinc granules? Touch the conical flask or test tube.
    Is there any change in its temperature?"
- id: "0.11"
  kind: figure
  page: 2
