    - {words: L60.3-L62.1, by: agent}
- id: "2.2.18"
  kind: text
  page: 7
  text: (ii) Do you know that respiration is an exothermic process?
- id: "2.2.19"
  kind: text
  page: 7
  text: We all know that we need energy to stay alive. We get this energy from the food we eat. During
    digestion, food is broken down into simpler substances. For example, rice, potatoes and bread
    contain carbohydrates. These carbohydrates are broken down to form glucose. This glucose
    combines with oxygen in the cells of our body and provides energy. The special name of this
    reaction is respiration, the process of which you will study in Chapter 6.
- id: "2.2.20"
  kind: equation
  page: 7
  number: (1.18)
  text: C₆H₁₂O₆(aq) + 6O₂(aq) → 6CO₂(aq) + 6H₂O(l) + energy (1.18) (Glucose)
  made:
