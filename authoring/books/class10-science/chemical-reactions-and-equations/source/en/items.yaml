    - {words: L79.3-L81.1, by: agent}
    - {words: L81.3-L83.1, by: agent}
    - {words: L83.3-L85.1, by: agent}
- id: "2.2.21"
  kind: text
  page: 7
  text: (iii) The decomposition of vegetable matter into compost is also an example of an exothermic
    reaction.
- id: "2.2.22"
  kind: text
  page: 7
  text: Identify the type of the reaction taking place in Activity 1.1, where heat is given out along
    with the formation of a single product.
