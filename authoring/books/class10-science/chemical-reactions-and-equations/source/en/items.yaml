- id: "2.2.13"
  kind: text
  page: 7
  text: In simple language we can say that when two or more substances (elements or compounds) combine
    to form a single product, the reactions are called combination reactions.
- id: "2.2.14"
  kind: text
  page: 7
  text: In Activity 1.4, we also observed that a large amount of heat is evolved. This makes the
    reaction mixture warm. Reactions in which heat is released along with the formation of products
    are called exothermic chemical reactions.
- id: "2.2.15"
  kind: text
  page: 7
  text: Other examples of exothermic reactions are –
- id: "2.2.16"
  kind: text
  page: 7
  text: (i) Burning of natural gas
- id: "2.2.17"
  kind: equation
  page: 7
  number: (1.17)
  text: CH₄(g) + 2O₂ (g) → CO₂ (g) + 2H₂O (g) (1.17)
