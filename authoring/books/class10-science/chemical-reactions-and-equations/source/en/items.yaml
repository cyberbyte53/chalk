- id: "1.1"
  kind: text
  page: 2
  text: Activity 1.1 can be described as – when a magnesium ribbon is burnt in oxygen, it gets
    converted to magnesium oxide. This description of a chemical reaction in a sentence form is
    quite long. It can be written in a shorter form. The simplest way to do this is to write it in
    the form of a word-equation.
- id: "1.2"
  kind: text
  page: 2
  text: The word-equation for the above reaction would be –
- id: "1.3"
  kind: equation
  page: 2
  number: (1.1)
  text: Magnesium + Oxygen → Magnesium oxide (Reactants) (Product) (1.1)
- id: "1.4"
  kind: text
  page: 2
  text: The substances that undergo chemical change in the reaction (1.1), magnesium and oxygen, are
    the reactants. The new substance is magnesium oxide, formed during the reaction, as a product.
- id: "1.5"
  kind: text
  page: 2
  text: A word-equation shows change of reactants to products through an arrow placed between them.
    The reactants are written on the left-hand side (LHS) with a plus sign (+) between them.
    Similarly, products are written on the right-hand side (RHS) with a plus sign (+) between them.
    The arrowhead points towards the products, and shows the direction of the reaction.
- id: "1.6"
  kind: section
  page: 3
  number: 1.1.1
  title: Writing a Chemical Equation
  text: 1.1.1 Writing a Chemical Equation
- id: "1.6.1"
  kind: text
  page: 3
  text: Is there any other shorter way for representing chemical equations? Chemical equations can be
    made more concise and useful if we use chemical formulae instead of words. A chemical equation
    represents a chemical reaction. If you recall formulae of magnesium, oxygen and magnesium oxide,
    the above word-equation can be written as –
- id: "1.6.2"
  kind: equation
  page: 3
  number: (1.2)
  text: Mg + O₂ → MgO (1.2)
  made:
    - {words: L7.3-L8.1, by: agent}
- id: "1.6.3"
  kind: text
  page: 3
  text: Count and compare the number of atoms of each element on the LHS and RHS of the arrow. Is the
    number of atoms of each element the same on both the sides? If yes, then the equation is
    balanced. If not, then the equation is unbalanced because the mass is not the same on both sides
    of the equation. Such a chemical equation is a skeletal chemical equation for a reaction.
    Equation (1.2) is a skeletal chemical equation for the burning of magnesium in air.
- id: "1.7"
  kind: section
  page: 3
  number: 1.1.2
  title: Balanced Chemical Equations
  text: 1.1.2 Balanced Chemical Equations
- id: "1.7.1"
  kind: text
  page: 3
  text: Recall the law of conservation of mass that you studied in Class IX; mass can neither be
    created nor destroyed in a chemical reaction. That is, the total mass of the elements present in
    the products of a chemical reaction has to be equal to the total mass of the elements present in
    the reactants.
- id: "1.7.2"
  kind: text
  page: 3
  text: In other words, the number of atoms of each element remains the same, before and after a
    chemical reaction. Hence, we need to balance a skeletal chemical equation. Is the chemical Eq.
    (1.2) balanced? Let us learn about balancing a chemical equation step by step.
- id: "1.7.3"
  kind: text
  page: 3
  text: The word-equation for Activity 1.3 may be represented as –
