  page: 13
  number: 1.3.1
  title: Corrosion
  text: 1.3.1 Corrosion
- id: "3.1.1"
  kind: text
  page: 13
  text: You must have observed that iron articles are shiny when new, but get coated with a reddish
    brown powder when left for some time. This process is commonly known as rusting of iron. Some
    other metals also get tarnished in this manner. Have you noticed the colour of the coating
    formed on copper and silver? When a metal is attacked by substances around it such as moisture,
    acids, etc., it is said to corrode and this process is called corrosion. The black coating on
    silver and the green coating on copper are other examples of corrosion.
- id: "3.1.2"
  kind: text
  page: 13
  text: Corrosion causes damage to car bodies, bridges, iron railings, ships and to all objects made
    of metals, specially those of iron. Corrosion of iron is a serious problem. Every year an
    enormous amount of money is spent to replace damaged iron. You will learn more about corrosion
    in Chapter 3.
- id: "3.2"
  kind: section
  page: 13
  number: 1.3.2
  title: Rancidity
  text: 1.3.2 Rancidity
- id: "3.2.1"
  kind: text
  page: 13
  text: Have you ever tasted or smelt the fat/oil containing food materials left for a long time?
- id: "3.2.2"
  kind: text
  page: 13
  text: When fats and oils are oxidised, they become rancid and their smell and taste change. Usually
    substances which prevent oxidation (antioxidants) are added to foods containing fats and oil.
    Keeping food in air tight containers helps to slow down oxidation. Do you know that chips
    manufacturers usually flush bags of chips with gas such as nitrogen to prevent the chips from
    getting oxidised ?
