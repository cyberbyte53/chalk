concepts:
  - key: chemical-reaction-changes-identity
    concept: जब कोई रासायनिक परिवर्तन होता है तो एक रासायनिक अभिक्रिया होती है और प्रारंभिक वस्तु की प्रकृति तथा पहचान बदल जाती है।
    terms: [रासायनिक अभिक्रिया]
    items: ["0.3"]
  - key: signs-of-a-reaction
    concept: अवस्था में परिवर्तन, रंग में परिवर्तन, गैस का निकास अथवा तापमान में परिवर्तन से हम निर्धारित कर सकते हैं कि एक रासायनिक अभिक्रिया हुई है।
    terms: []
    items: ["0.11"]
  - key: word-equation
    concept: शब्द-समीकरण में अभिकारकों को बाईं ओर तथा उत्पादों को दाईं ओर लिखा जाता है, उनके मध्य तीर का निशान होता है जिसका सिरा उत्पाद की ओर होता है।
    terms: [शब्द-समीकरण, अभिकारक, उत्पाद]
    items: ["1.1", "1.4", "1.5"]
  - key: chemical-equation
    concept: रासायनिक समीकरण शब्दों की जगह रासायनिक सूत्र का उपयोग करके किसी रासायनिक अभिक्रिया को दर्शाता है।
    terms: [रासायनिक समीकरण]
    items: ["1.6.1"]
  - key: skeletal-equation
    concept: जिस समीकरण के दोनों ओर तत्वों के परमाणुओं की संख्या समान नहीं है वह असंतुलित है; ऐसा समीकरण ढाँचा रासायनिक समीकरण कहलाता है।
    terms: [ढाँचा रासायनिक समीकरण]
    items: ["1.6.3"]
  - key: balance-for-conservation-of-mass
    concept: रासायनिक अभिक्रिया में द्रव्यमान का न तो निर्माण होता है न ही विनाश, इसलिए अभिक्रिया के पहले एवं पश्चात प्रत्येक तत्व के परमाणुओं की संख्या समान रहती है।
    terms: [द्रव्यमान के संरक्षण का नियम]
    items: ["1.7.1", "1.7.2"]
  - key: hit-and-trial-balancing
    concept: सूत्रों को बदले बिना, सबसे अधिक परमाणु वाले यौगिक से आरंभ करके, सबसे छोटी पूर्णांक संख्या के गुणांक लगाकर समीकरण संतुलित करते हैं और अंत में दोनों ओर के परमाणुओं की गिनती करते हैं।
    terms: [हिट एंड ट्रायल]
    items: ["1.7.12", "1.7.16", "1.7.19", "1.7.30", "1.7.32"]
  - key: state-symbols
    concept: (g), (l), (aq) तथा (s) संकेत अभिकारकों तथा उत्पादों की गैस, द्रव, जलीय तथा ठोस अवस्थाओं को दर्शाते हैं।
    terms: [जलीय]
    items: ["1.7.34"]
  - key: reaction-conditions
    concept: अभिक्रिया की परिस्थितियाँ जैसे कि ताप, दाब, उत्प्रेरक आदि तीर के निशान के ऊपर या नीचे दर्शाई जाती हैं।
    terms: []
    items: ["1.7.39"]
  - key: bonds-break-and-form
    concept: रासायनिक अभिक्रिया में एक तत्व का परमाणु दूसरे तत्व के परमाणु में नहीं बदलता; परमाणुओं के आपसी आबंध के टूटने एवं जुड़ने से नए पदार्थों का निर्माण होता है।
    terms: []
    items: ["2.1"]
  - key: combination-reaction
    concept: जब दो या दो से अधिक पदार्थ संयोग करके एकल उत्पाद का निर्माण करते हैं, उसे संयोजन अभिक्रिया कहते हैं।
    terms: [संयोजन अभिक्रिया]
    items: ["2.2.5", "2.2.13"]
  - key: whitewash-turns-to-calcium-carbonate
    concept: सफ़ेदी में प्रयुक्त बुझा हुआ चूना वायु की कार्बन डाइऑक्साइड के साथ धीमी गति से अभिक्रिया करके दीवारों पर कैल्सियम कार्बोनेट की चमकदार पतली परत बनाता है।
    terms: []
    items: ["2.2.6"]
  - key: exothermic-reaction
    concept: जिन अभिक्रियाओं में उत्पाद के निर्माण के साथ-साथ ऊष्मा उत्पन्न होती है वे ऊष्माक्षेपी हैं, जैसे प्राकृतिक गैस का दहन या शाक-सब्जियों का विघटित होकर कंपोस्ट बनना।
    terms: [ऊष्माक्षेपी रासायनिक अभिक्रिया]
    items: ["2.2.14", "2.2.16", "2.2.21"]
  - key: respiration-is-exothermic
    concept: श्वसन एक ऊष्माक्षेपी अभिक्रिया है; भोजन से प्राप्त ग्लूकोज़ शरीर की कोशिकाओं में ऑक्सीजन से मिलकर हमें ऊर्जा प्रदान करता है।
    terms: [श्वसन]
    items: ["2.2.19"]
  - key: decomposition-reaction
    concept: वियोजन अभिक्रिया में एकल अभिकर्मक टूट कर छोटे-छोटे उत्पाद प्रदान करता है।
    terms: [वियोजन]
    items: ["2.3.4"]
  - key: thermal-decomposition
    concept: ऊष्मा के द्वारा की गई वियोजन अभिक्रिया ऊष्मीय वियोजन है, जैसे कैल्सियम कार्बोनेट से बिना बुझा हुआ चूना तथा कार्बन डाइऑक्साइड, या लेड नाइट्रेट से भूरे रंग का नाइट्रोजन डाइऑक्साइड।
    terms: [ऊष्मीय वियोजन]
    items: ["2.3.5", "2.3.10"]
  - key: decomposition-by-electricity
    concept: जल में विद्युत धारा प्रवाहित करने पर उसका हाइड्रोजन तथा ऑक्सीजन में वियोजन होता है।
    terms: []
    items: ["2.3.13"]
  - key: decomposition-by-light
    concept: सूर्य के प्रकाश में श्वेत सिल्वर क्लोराइड सिल्वर तथा क्लोरीन में वियोजित होकर धूसर हो जाता है, सिल्वर ब्रोमाइड भी इसी प्रकार; इनका उपयोग श्याम-श्वेत फ़ोटोग्राफी में होता है।
    terms: []
    items: ["2.3.17", "2.3.19", "2.3.21"]
  - key: endothermic-reaction
    concept: वियोजन अभिक्रिया में ऊष्मा, प्रकाश या विद्युत ऊर्जा की आवश्यकता होती है; जिन अभिक्रियाओं में ऊर्जा अवशोषित होती है, उन्हें ऊष्माशोषी अभिक्रिया कहते हैं।
    terms: [ऊष्माशोषी अभिक्रिया]
    items: ["2.3.22"]
  - key: displacement-reaction
    concept: विस्थापन अभिक्रिया में अधिक क्रियाशील तत्व दूसरे तत्व को उसके यौगिक से विस्थापित कर देता है, जैसे लोहा, जिंक तथा लेड कॉपर को।
    terms: [विस्थापन अभिक्रिया]
    items: ["2.4.7", "2.4.11"]
  - key: precipitation-reaction
    concept: अभिक्रिया में बना जल में अविलेय पदार्थ अवक्षेप है, और जिस अभिक्रिया में अवक्षेप का निर्माण होता है उसे अवक्षेपण अभिक्रिया कहते हैं।
    terms: [अवक्षेप, अवक्षेपण अभिक्रिया]
    items: ["2.5.2"]
  - key: double-displacement-reaction
    concept: द्विविस्थापन अभिक्रियाओं में अभिकारकों के बीच आयनों का आदान-प्रदान होता है।
    terms: [द्विविस्थापन अभिक्रियाएँ]
    items: ["2.5.4"]
  - key: oxidation-and-reduction
    concept: जिस पदार्थ में ऑक्सीजन की वृद्धि या हाइड्रोजन का ह्रास होता है उसका उपचयन होता है; जिसमें ऑक्सीजन का ह्रास या हाइड्रोजन की वृद्धि होती है उसका अपचयन होता है।
    terms: [उपचयन, अपचयन]
    items: ["2.6.8", "2.6.16"]
  - key: redox-reaction
    concept: उपचयन-अपचयन अथवा रेडॉक्स अभिक्रियाओं में एक अभिकारक उपचयित तथा दूसरा अभिकारक अपचयित होता है।
    terms: [उपचयन-अपचयन, रेडॉक्स]
    items: ["2.6.9"]
  - key: corrosion
    concept: अम्ल, आर्द्रता आदि के संपर्क में आने पर धातु संक्षारित होती है, जैसे लोहे पर जंग लगना; संक्षारण से धातु की वस्तुओं की बहुत क्षति होती है और अधिक पैसा खर्च होता है।
    terms: [संक्षारण, जंग लगना]
    items: ["3.1.1", "3.1.2"]
  - key: rancidity
    concept: उपचयित होने पर तेल एवं वसा विकृतगंधी हो जाते हैं; प्रति ऑक्सीकारक, वायुरोधी बर्तन तथा नाइट्रोजन जैसी गैस उपचयन को रोकते या धीमा करते हैं।
    terms: [विकृतगंधी, प्रति ऑक्सीकारक]
    items: ["3.2.2"]
