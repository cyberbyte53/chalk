  title: आपने क्या सीखा
  text: आपने क्या सीखा एक पूर्ण रासायनिक समीकरण अभिकारक, उत्पाद एवं प्रतीकात्मक रूप से उनकी भौतिक
    अवस्था को प्रदर्शित करता है। रासायनिक समीकरण को संतुलित किया जाता है, जिससे समीकरण में अभिकारक
    तथा उत्पाद, दोनों ही ओर रासायनिक अभिक्रिया में भाग लेने वाले प्रत्येक परमाणु की संख्या समान हो।
    समीकरण का संतुलित होना आवश्यक है। संयोजन अभिक्रिया में दो या दो से अधिक पदार्थ मिलकर एक नया
    पदार्थ बनाते हैं। वियोजन अभिक्रिया संयोजन अभिक्रिया के विपरीत होती है। वियोजन अभिक्रिया में एकल
    पदार्थ वियोजित होकर दो या दो से अधिक पदार्थ देता है। जिन अभिक्रियाओं में उत्पाद के साथ ऊष्मा का
    भी उत्सर्जन होता है, उन्हें ऊष्माक्षेपी अभिक्रियाएँ कहते हैं। जिन अभिक्रियाओं में ऊष्मा का
    अवशोषण होता है, उन्हें ऊष्माशोषी अभिक्रियाएँ कहते हैं। जब कोई एक तत्व दूसरे तत्व को उसके यौगिक
    से विस्थापित कर देता है, विस्थापन अभिक्रिया होती है। द्विविस्थापन अभिक्रिया में दो अलग-अलग
    परमाणु या परमाणुओं के समूह (आयन) का आपस में आदान-प्रदान होता है। अवक्षेपण अभिक्रिया से अविलेय
    लवण प्राप्त होता है। अभिक्रिया में पदार्थों से ऑक्सीजन या हाइड्रोजन का योग अथवा ह्रास भी होता
    है। ऑक्सीजन का योग या हाइड्रोजन का ह्रास ऑक्सीकरण या उपचयन कहलाता है। ऑक्सीजन का ह्रास या
    हाइड्रोजन का योग अपचयन कहलाता है।
