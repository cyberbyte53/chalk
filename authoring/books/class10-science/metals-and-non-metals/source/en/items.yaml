- id: "3.1"
  kind: text
  page: 10
  text: In the above activities, you saw the reactions of metals with a number of reagents. Why do
    metals react in this manner? Let us recall what we learnt about the electronic configuration of
    elements in Class IX. We learnt that noble gases, which have a completely filled valence shell,
    show little chemical activity. We, therefore, explain the reactivity of elements as a tendency
    to attain a completely filled valence shell.
- id: "3.2"
  kind: text
  page: 10
  text: Let us have a look at the electronic configuration of noble gases and some metals and non-metals.
- id: "3.3"
  kind: text
  page: 10
  text: We can see from Table 3.3 that a sodium atom has one electron in its outermost shell. If it
    loses the electron from its M shell then its L shell now becomes the outermost shell and that
    has a stable octet. The nucleus of this atom still has 11 protons but the number of electrons
    has become 10, so there is a net positive charge giving us a sodium cation Na⁺. On the other
    hand chlorine has seven electrons in its outermost shell and it requires one more electron to
    complete its octet. If sodium and chlorine were to react, the electron lost by sodium could be
    taken up by chlorine. After gaining an electron, the chlorine atom gets a unit negative charge,
    because its nucleus has 17 protons and there are 18 electrons in its K, L and M shells. This
    gives us a chloride anion C1⁻. So both these elements can have a give-and-take relation between
    them as follows (Fig. 3.5).
  made:
    - {words: L53.1-3, by: agent}
    - {words: L42.10-12, page: 11, by: agent}
