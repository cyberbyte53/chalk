  text: 3.4.4 Extracting Metals in the Middle of the Activity Series
- id: "4.5.1"
  kind: text
  page: 15
  text: The metals in the middle of the activity series such as iron, zinc, lead, copper, are
    moderately reactive. These are usually present as sulphides or carbonates in nature. It is
    easier to obtain a metal from its oxide, as compared to its sulphides and carbonates. Therefore,
    prior to reduction, the metal sulphides and carbonates must be converted into metal oxides. The
    sulphide ores are converted into oxides by heating strongly in the presence of excess air. This
    process is known as roasting. The carbonate ores are changed into oxides by heating strongly in
    limited air. This process is known as calcination. The chemical reaction that takes place during
    roasting and calcination of zinc ores can be shown as follows –
