- id: "4.1"
  kind: text
  page: 13
  text: The earth’s crust is the major source of metals. Seawater also contains some soluble salts
    such as sodium chloride, magnesium chloride, etc. The elements or compounds, which occur
    naturally in the earth’s crust, are known as minerals. At some places, minerals contain a very
    high percentage of a particular metal and the metal can be profitably extracted from it. These
    minerals are called ores.
- id: "4.2"
  kind: section
  page: 13
  number: 3.4.1
  title: Extraction of Metals
  text: 3.4.1 Extraction of Metals
- id: "4.2.1"
  kind: text
  page: 13
  text: You have learnt about the reactivity series of metals. Having this knowledge, you can easily
    understand how a metal is extracted from its ore. Some metals are found in the earth’s crust in
    the free state. Some are found in the form of their compounds. The metals at the bottom of the
    activity series are the least reactive. They are often found in a free state. For example, gold,
    silver, platinum and copper are found in the free state. Copper and silver are also found in the
    combined state as their sulphide or oxide ores. The metals at the top of the activity series (K,
    Na, Ca, Mg and Al) are so reactive that they are never found in nature as free elements. The
    metals in the middle of the activity series (Zn, Fe, Pb, etc.) are moderately reactive. They are
    found in the earth’s crust mainly as oxides, sulphides or carbonates. You will find that the
    ores of many metals are oxides. This is because oxygen is a very reactive element and is very
    abundant on the earth.
- id: "4.2.2"
  kind: figure
  page: 14
  number: Figure 3.9
  text: K Na Ca Electrolysis Mg Al Zn Fe Reduction using carbon Pb Cu Ag Au Found in native state
    Figure 3.9 Activity series and related metallurgy
  crop: [62.2, 87.1, 178.8, 371.3]
  made:
    - {box: true, by: figure-snap}
- id: "4.2.3"
  kind: text
  page: 14
  text: Thus on the basis of reactivity, we can group the metals into the following three categories
    (Fig. 3.9) – (i) Metals of low reactivity; (ii) Metals of medium reactivity; (iii) Metals of
    high reactivity. Different techniques are to be used for obtaining the metals falling in each
    category.
- id: "4.2.4"
  kind: text
  page: 14
  text: Several steps are involved in the extraction of pure metal from ores. A summary of these steps
    is given in Fig.3.10. Each step is explained in detail in the following sections.
- id: "4.2.5"
  kind: figure
