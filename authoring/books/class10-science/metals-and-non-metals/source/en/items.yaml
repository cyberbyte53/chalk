  page: 15
  text: You are already familiar with the process of oxidation and reduction explained in the first
    Chapter. Obtaining metals from their compounds is also a reduction process.
- id: "4.5.9"
  kind: text
  page: 15
  text: Besides using carbon (coke) to reduce metal oxides to metals, sometimes displacement reactions
    can also be used. The highly reactive metals such as sodium, calcium, aluminium, etc., are used
    as reducing agents because they can displace metals of lower reactivity from their compounds.
