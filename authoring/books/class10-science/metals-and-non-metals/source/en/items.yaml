- id: "1.1.18"
  kind: text
  page: 3
  text: You must have seen that the wires that carry current in your homes have a coating of
    polyvinylchloride (PVC) or a rubber-like material. Why are electric wires coated with such
    substances?
- id: "1.1.19"
  kind: text
  page: 3
  text: What happens when metals strike a hard surface? Do they produce a sound? The metals that
    produce a sound on striking a hard surface are said to be sonorous. Can you now say why school
    bells are made of metals?
