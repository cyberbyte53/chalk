- id: "4.6"
  kind: section
  page: 16
  number: 3.4.5
  title: Extracting Metals towards the Top of the Activity Series
  text: 3.4.5 Extracting Metals towards the Top of the Activity Series
- id: "4.6.1"
  kind: text
  page: 16
  text: The metals high up in the reactivity series are very reactive. They cannot be obtained from
    their compounds by heating with carbon. For example, carbon cannot reduce the oxides of sodium,
    magnesium, calcium, aluminium, etc., to the respective metals. This is because these metals have
    more affinity for oxygen than carbon. These metals are obtained by electrolytic reduction. For
    example, sodium, magnesium and calcium are obtained by the electrolysis of their molten
    chlorides. The metals are deposited at the cathode (the negatively charged electrode), whereas,
    chlorine is liberated at the anode (the positively charged electrode). The reactions are –
- id: "4.6.2"
  kind: equation
  page: 16
  text: At cathode Na⁺ + e⁻ → Na
  made:
    - {words: L48.1, by: agent}
    - {words: L48.3, by: agent}
- id: "4.6.3"
  kind: equation
  page: 16
  text: At anode 2Cl⁻ → Cl₂ + 2e⁻
  made:
    - {words: L49.1, by: agent}
    - {words: L49.3-L50.1, by: agent}
    - {words: L51.2, by: agent}
- id: "4.6.4"
  kind: text
  page: 16
  text: Similarly, aluminium is obtained by the electrolytic reduction of aluminium oxide.
- id: "4.7"
  kind: section
  page: 16
  number: 3.4.6
  title: Refining of Metals
  text: 3.4.6 Refining of Metals
- id: "4.7.1"
  kind: text
  page: 16
  text: The metals produced by various reduction processes described above are not very pure. They
    contain impurities, which must be removed to obtain pure metals. The most widely used method for
    refining impure metals is electrolytic refining.
- id: "4.7.2"
  kind: figure
  page: 16
  number: Figure 3.12
  text: Figure 3.12 Electrolytic refining of copper. The electrolyte is a solution of acidified copper
    sulphate. The anode is impure copper, whereas, the cathode is a strip of pure copper. On passing
    electric current, pure copper is deposited on the cathode.
  crop: [58, 500, 251, 711]
  made:
    - {box: true, by: agent}
- id: "4.7.3"
  kind: text
  page: 16
  text: "Electrolytic Refining: Many metals, such as copper, zinc, tin, nickel, silver, gold, etc.,
    are refined electrolytically. In this process, the impure metal is made the anode and a thin
    strip of pure metal is made the cathode. A solution of the metal salt is used as an electrolyte.
    The apparatus is set up as shown in Fig. 3.12. On passing the current through the electrolyte,
    the pure metal from the anode dissolves into the electrolyte. An equivalent amount of pure metal
    from the electrolyte is deposited on the cathode. The soluble impurities go into the solution,
    whereas, the insoluble impurities settle down at the bottom of the anode and are known as anode
    mud."
