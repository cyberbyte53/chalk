  text: "Activity 3.9 CAUTION: The following activity needs the teacher’s assistance. It would be
    better if students wear eye protection. Hold any of the samples taken above with a pair of tongs
    and try burning over a flame. Repeat with the other metal samples. Collect the product if
    formed. Let the products and the metal surface cool down. Which metals burn easily? What flame
    colour did you observe when the metal burnt? How does the metal surface appear after burning?
    Arrange the metals in the decreasing order of their reactivity towards oxygen. Are the products
    soluble in water?"
