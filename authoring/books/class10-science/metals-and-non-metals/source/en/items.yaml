- id: "5.5.7"
  kind: box
  page: 18
  title: More to Know!
  text: More to Know! The wonder of ancient Indian metallurgy The iron pillar near the Qutub Minar in
    Delhi was built more than 1600 years ago by the iron workers of India. They had developed a
    process which prevented iron from rusting. For its quality of rust resistance it has been
    examined by scientists from all parts of the world. The iron pillar is 8 m high and weighs 6
    tonnes (6000 kg).
