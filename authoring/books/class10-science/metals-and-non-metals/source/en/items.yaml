  text: 3.1.2 Non-metals
- id: "1.2.1"
  kind: text
  page: 3
  text: In the previous Class you have learnt that there are very few non-metals as compared to
    metals. Some of the examples of non-metals are carbon, sulphur, iodine, oxygen, hydrogen, etc.
    The non-metals are either solids or gases except bromine which is a liquid.
- id: "1.2.2"
  kind: text
  page: 3
  text: Do non-metals also have physical properties similar to that of metals? Let us find out.
- id: "1.2.3"
