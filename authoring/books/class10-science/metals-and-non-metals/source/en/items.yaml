- id: "2.4.7"
  kind: text
  page: 8
  text: You must have observed in Activity 3.11, that the rate of formation of bubbles was the fastest
    in the case of magnesium. The reaction was also the most exothermic in this case. The reactivity
    decreases in the order Mg > Al > Zn > Fe. In the case of copper, no bubbles were seen and the
    temperature also remained unchanged. This shows that copper does not react with dilute HCl.
- id: "2.4.8"
  kind: box
  page: 8
  title: Do You Know?
  text: Do You Know? Aqua regia, (Latin for ‘royal water’) is a freshly prepared mixture of
    concentrated hydrochloric acid and concentrated nitric acid in the ratio of 3:1. It can dissolve
    gold, even though neither of these acids can do so alone. Aqua regia is a highly corrosive,
    fuming liquid. It is one of the few reagents that is able to dissolve gold and platinum.
