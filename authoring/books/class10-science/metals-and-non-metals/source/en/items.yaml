  text: 3.2.1 What happens when Metals are burnt in Air?
- id: "2.2.1"
  kind: text
  page: 5
  text: You have seen in Activity 3.8 that magnesium burns in air with a dazzling white flame. Do all
    metals react in the same manner? Let us check by performing the following Activity.
