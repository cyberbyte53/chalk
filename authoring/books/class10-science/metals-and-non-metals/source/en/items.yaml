- id: "1.2.6"
  kind: text
  page: 3
  text: On the bases of the observations recorded in Table 3.1, discuss the general physical
    properties of metals and non-metals in the class. You must have concluded that we cannot group
    elements according to their physical properties alone, as there are many exceptions. For example
    – (i) All metals except mercury exist as solids at room temperature. In Activity 3.5, you have
    observed that metals have high melting points but gallium and caesium have very low melting
    points. These two metals will melt if you keep them on your palm. (ii) Iodine is a non-metal but
    it is lustrous. (iii) Carbon is a non-metal that can exist in different forms. Each form is
    called an allotrope. Diamond, an allotrope of carbon, is the hardest natural substance known and
    has a very high melting and boiling point. Graphite, another allotrope of carbon, is a conductor
    of electricity. (iv) Alkali metals (lithium, sodium, potassium) are so soft that they can be cut
    with a knife. They have low densities and low melting points.
- id: "1.2.7"
  kind: text
  page: 4
  text: Elements can be more clearly classified as metals and non-metals on the basis of their
    chemical properties.
- id: "1.2.8"
  kind: activity
  page: 4
  number: Activity 3.8
  text: Activity 3.8 Take a magnesium ribbon and some sulphur powder. Burn the magnesium ribbon.
    Collect the ashes formed and dissolve them in water. Test the resultant solution with both red
    and blue litmus paper. Is the product formed on burning magnesium acidic or basic? Now burn
    sulphur powder. Place a test tube over the burning sulphur to collect the fumes produced. Add
    some water to the above test tube and shake. Test this solution with blue and red litmus paper.
    Is the product formed on burning sulphur acidic or basic? Can you write equations for these
    reactions?
- id: "1.2.9"
  kind: text
  page: 4
  text: Most non-metals produce acidic oxides when dissolve in water. On the other hand, most metals,
    give rise to basic oxides. You will be learning more about these metal oxides in the next
    section.
