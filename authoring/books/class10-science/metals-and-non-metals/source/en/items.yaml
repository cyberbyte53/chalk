  text: 3.1.1 Metals
- id: "1.1.1"
  kind: text
  page: 1
  text: The easiest way to start grouping substances is by comparing their physical properties. Let us
    study this with the help of the following activities. For performing Activities 3.1 to 3.6,
    collect the samples of following metals – iron, copper, aluminium, magnesium, sodium, lead, zinc
    and any other metal that is easily available.
- id: "1.1.2"
  kind: activity
  page: 1
  number: Activity 3.1
  text: Activity 3.1 Take samples of iron, copper, aluminium and magnesium. Note the appearance of
    each sample. Clean the surface of each sample by rubbing them with sand paper and note their
    appearance again.
- id: "1.1.3"
  kind: text
  page: 1
  text: Metals, in their pure state, have a shining surface. This property is called metallic lustre.
- id: "1.1.4"
  kind: activity
  page: 1
  number: Activity 3.2
  text: "Activity 3.2 Take small pieces of iron, copper, aluminium, and magnesium. Try to cut these
    metals with a sharp knife and note your observations. Hold a piece of sodium metal with a pair
    of tongs. CAUTION: Always handle sodium metal with care. Dry it by pressing between the folds of
    a filter paper. Put it on a watch-glass and try to cut it with a knife. What do you observe?"
- id: "1.1.5"
  kind: text
  page: 2
  text: You will find that metals are generally hard. The hardness varies from metal to metal.
- id: "1.1.6"
  kind: activity
  page: 2
  number: Activity 3.3
  text: Activity 3.3 Take pieces of iron, zinc, lead and copper. Place any one metal on a block of
    iron and strike it four or five times with a hammer. What do you observe? Repeat with other
    metals. Record the change in the shape of these metals.
- id: "1.1.7"
  kind: text
  page: 2
  text: You will find that some metals can be beaten into thin sheets. This property is called
    malleability. Did you know that gold and silver are the most malleable metals?
- id: "1.1.8"
  kind: activity
  page: 2
  number: Activity 3.4
  text: Activity 3.4 List the metals whose wires you have seen in daily life.
- id: "1.1.9"
  kind: text
  page: 2
  text: The ability of metals to be drawn into thin wires is called ductility. Gold is the most
    ductile metal. You will be surprised to know that a wire of about 2 km length can be drawn from
    one gram of gold.
- id: "1.1.10"
  kind: text
  page: 2
  text: It is because of their malleability and ductility that metals can be given different shapes
    according to our needs.
- id: "1.1.11"
  kind: text
  page: 2
  text: Can you name some metals that are used for making cooking vessels? Do you know why these
    metals are used for making vessels? Let us do the following Activity to find out the answer.
- id: "1.1.12"
  kind: activity
  page: 2
  number: Activity 3.5
  text: Activity 3.5 Take an aluminium or copper wire. Clamp this wire on a stand, as shown in Fig.
    3.1. Fix a pin to the free end of the wire using wax. Heat the wire with a spirit lamp, candle
    or a burner near the place where it is clamped. What do you observe after some time? Note your
    observations. Does the metal wire melt?
