  number: "3.5"
  title: CORROSION
  text: 3.5 CORROSION
- id: "5.1"
  kind: text
  page: 17
  text: You have learnt the following about corrosion in Chapter 1 – Silver articles become black
    after some time when exposed to air. This is because it reacts with sulphur in the air to form a
    coating of silver sulphide. Copper reacts with moist carbon dioxide in the air and slowly loses
    its shiny brown surface and gains a green coat. This green substance is basic copper carbonate.
    Iron when exposed to moist air for a long time acquires a coating of a brown flaky substance
    called rust. Let us find out the conditions under which iron rusts.
  made:
    - {words: L11.2-3, by: agent}
    - {words: L20.4-5, by: agent}
- id: "5.2"
  kind: activity
  page: 17
  number: Activity 3.14
  text: Activity 3.14 Take three test tubes and place clean iron nails in each of them. Label these
    test tubes A, B and C. Pour some water in test tube A and cork it. Pour boiled distilled water
    in test tube B, add about 1 mL of oil and cork it. The oil will float on water and prevent the
    air from dissolving in the water. Put some anhydrous calcium chloride in test tube C and cork
    it. Anhydrous calcium chloride will absorb the moisture, if any, from the air. Leave these test
    tubes for a few days and then observe (Fig. 3.13).
- id: "5.3"
  kind: figure
  page: 17
  number: Figure 3.13
  text: A B C Figure 3.13 Investigating the conditions under which iron rusts. In tube A, both air and
    water are present. In tube B, there is no air dissolved in the water. In tube C, the air is dry.
  crop: [369.8, 415.2, 548.2, 699.4]
  made:
    - {box: true, by: figure-snap}
- id: "5.4"
  kind: text
  page: 17
  text: You will observe that iron nails rust in test tube A, but they do not rust in test tubes B and
    C. In the test tube A, the nails are exposed to both air and water. In the test tube B, the
    nails are exposed to only water, and the nails in test tube C are exposed to dry air. What does
    this tell us about the conditions under which iron articles rust?
- id: "5.5"
  kind: section
  page: 18
  number: 3.5.1
  title: Prevention of Corrosion
  text: 3.5.1 Prevention of Corrosion
- id: "5.5.1"
  kind: text
  page: 18
  text: The rusting of iron can be prevented by painting, oiling, greasing, galvanising, chrome
    plating, anodising or making alloys.
- id: "5.5.2"
  kind: text
  page: 18
  text: Galvanisation is a method of protecting steel and iron from rusting by coating them with a
    thin layer of zinc. The galvanised article is protected against rusting even if the zinc coating
    is broken. Can you reason this out?
- id: "5.5.3"
  kind: text
  page: 18
  text: Alloying is a very good method of improving the properties of a metal. We can get the desired
    properties by this method. For example, iron is the most widely used metal. But it is never used
    in its pure state. This is because pure iron is very soft and stretches easily when hot. But, if
    it is mixed with a small amount of carbon (about 0.05 %), it becomes hard and strong. When iron
    is mixed with nickel and chromium, we get stainless steel, which is hard and does not rust.
    Thus, if iron is mixed with some other substance, its properties change. In fact, the properties
    of any metal can be changed if it is mixed with some other substance. The substance added may be
    a metal or a non-metal. An alloy is a homogeneous mixture of two or more metals, or a metal and
    a non-metal. It is prepared by first melting the primary metal, and then, dissolving the other
    elements in it in definite proportions. It is then cooled to room temperature.
  made:
    - {words: L21.13-L22.1, by: agent}
- id: "5.5.4"
  kind: box
  page: 18
  title: Do You Know?
  text: Do You Know? Pure gold, known as 24 carat gold, is very soft. It is, therefore, not suitable
    for making jewellery. It is alloyed with either silver or copper to make it hard. Generally, in
    India, 22 carat gold is used for making ornaments. It means that 22 parts of pure gold is
    alloyed with 2 parts of either copper or silver.
- id: "5.5.5"
  kind: text
  page: 18
  text: If one of the metals is mercury, then the alloy is known as an amalgam. The electrical
    conductivity and melting point of an alloy is less than that of pure metals. For example, brass,
    an alloy of copper and zinc (Cu and Zn), and bronze, an alloy of copper and tin (Cu and Sn), are
    not good conductors of electricity whereas copper is used for making electrical circuits.
    Solder, an alloy of lead and tin (Pb and Sn), has a low melting point and is used for welding
    electrical wires together.
- id: "5.5.6"
  kind: figure
  page: 18
  text: Iron pillar at Delhi
  crop: [64.3, 528.5, 172.8, 708.1]
  made:
