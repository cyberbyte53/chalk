  title: Extracting Metals Low in the Activity Series
  text: 3.4.3 Extracting Metals Low in the Activity Series
- id: "4.4.1"
  kind: text
  page: 15
  text: Metals low in the activity series are very unreactive. The oxides of these metals can be
    reduced to metals by heating alone. For example, cinnabar (HgS) is an ore of mercury. When it is
    heated in air, it is first converted into mercuric oxide (HgO). Mercuric oxide is then reduced
    to mercury on further heating.
