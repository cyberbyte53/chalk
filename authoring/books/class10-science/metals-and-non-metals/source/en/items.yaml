  page: 2
  text: The above activity shows that metals are good conductors of heat and have high melting points.
    The best conductors of heat are silver and copper. Lead and mercury are comparatively poor
    conductors of heat.
- id: "1.1.15"
  kind: text
  page: 2
  text: Do metals also conduct electricity? Let us find out.
