- id: "0.3"
  kind: text
  page: 1
  text: Think of some uses of metals and non-metals in your daily life. What properties did you think
    of while categorising elements as metals or non-metals? How are these properties related to the
    uses of these elements? Let us look at some of these properties in detail.
