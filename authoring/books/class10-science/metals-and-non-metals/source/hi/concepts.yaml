concepts:
  - key: elements-are-metals-or-non-metals
    concept: तत्वों को उनके गुणधर्मों के आधार पर धातु एवं अधातु में वर्गीकृत किया जाता है।
    terms: []
    items: ["0.2"]
  - key: metallic-lustre
    concept: अपने शुद्ध रूप में धातु की सतह चमकदार होती है; धातु के इस गुणधर्म को धात्विक चमक कहते हैं।
    terms: [धात्विक चमक]
    items: ["1.1.2", "1.1.3"]
  - key: metals-are-generally-hard
    concept: धातुएँ सामान्यतः कठोर होती हैं; प्रत्येक धातु की कठोरता अलग-अलग होती है।
    terms: []
    items: ["1.1.4", "1.1.5"]
  - key: malleability
    concept: कुछ धातुओं को पीटकर पतली चादर बनाया जा सकता है, इस गुणधर्म को आघातवर्ध्यता कहते हैं; सोना तथा चाँदी सबसे अधिक आघातवर्ध्य धातुएँ हैं।
    terms: [आघातवर्ध्यता]
    items: ["1.1.6", "1.1.7"]
  - key: ductility
    concept: धातु के पतले तार के रूप में खींचने की क्षमता को तन्यता कहा जाता है; सोना सबसे अधिक तन्य धातु है, और आघातवर्ध्यता तथा तन्यता के कारण धातुओं को हमारी आवश्यकता के अनुसार विभिन्न आकार दिए जा सकते हैं।
    terms: [तन्यता]
    items: ["1.1.8", "1.1.9", "1.1.10"]
  - key: metals-conduct-heat
    concept: धातु ऊष्मा के सुचालक हैं तथा इनका गलनांक बहुत अधिक होता है; सिल्वर तथा कॉपर ऊष्मा के सबसे अच्छे चालक हैं, लेड तथा मर्करी ऊष्मा के कुचालक हैं।
    terms: []
    items: ["1.1.11", "1.1.12", "1.1.14"]
  - key: metals-conduct-electricity
    concept: धातुएँ विद्युत की चालक हैं, इसलिए विद्युत तार पर पॉलिवाइनिल क्लोराइड (PVC) अथवा रबड़ जैसी सामग्री की परत चढ़ी होती है।
    terms: []
    items: ["1.1.15", "1.1.16", "1.1.18"]
  - key: metals-are-sonorous
    concept: जो धातुएँ कठोर सतह से टकराने पर आवाज़ उत्पन्न करती हैं, उन्हें ध्वानिक कहते हैं; इसीलिए स्कूल की घंटी धातु की बनी होती है।
    terms: [ध्वानिक]
    items: ["1.1.19"]
  - key: non-metals-physical-properties
    concept: धातुओं की तुलना में अधातुओं की संख्या कम है, जैसे कार्बन, सल्फ़र, आयोडीन, ऑक्सीजन, हाइड्रोजन; ब्रोमीन द्रव है, बाकी सारी अधातुएँ या तो ठोस या फिर गैसें होती हैं।
    terms: []
    items: ["1.2.1", "1.2.2", "1.2.5"]
  - key: physical-properties-have-exceptions
    concept: केवल भौतिक गुणधर्मों के आधार पर ही हम तत्वों का वर्गीकरण नहीं कर सकते, क्योंकि इसमें कई अपवाद हैं; मर्करी द्रव है, गैलियम और सीज़ियम हथेली पर पिघलने लगते हैं, आयोडीन अधातु होते हुए भी चमकीला होता है, और क्षारीय धातु मुलायम होती हैं तथा इनके घनत्व तथा गलनांक कम होते हैं।
    terms: []
    items: ["1.2.5"]
  - key: carbon-allotropes
    concept: कार्बन विभिन्न रूपों में विद्यमान रहता है, प्रत्येक रूप को अपररूप कहते हैं; हीरा सबसे कठोर प्राकृतिक पदार्थ है और ग्रेफ़ाइट विद्युत का सुचालक है।
    terms: [अपररूप]
    items: ["1.2.5"]
  - key: oxides-sort-metals-and-non-metals
    concept: तत्वों को उनके रासायनिक गुणधर्मों के आधार पर अधिक स्पष्टता से वर्गीकृत किया जा सकता है; अधिकांश अधातुएँ ऐसे ऑक्साइड प्रदान करती हैं जो जल में घुलकर अम्ल बनाते हैं, वहीं अधिकतर धातुएँ क्षारकीय ऑक्साइड प्रदान करती हैं।
    terms: []
    items: ["1.2.6", "1.2.7", "1.2.8"]
  - key: metals-burn-to-oxides
    concept: लगभग सभी धातुएँ ऑक्सीजन के साथ मिलकर धातु के ऑक्साइड बनाती हैं, जैसे कॉपर काले रंग का कॉपर (II) ऑक्साइड और एल्युमिनियम, एल्युमिनियम ऑक्साइड बनाता है।
    terms: []
    items: ["2.2.2", "2.2.3", "2.2.4", "2.2.5", "2.2.6", "2.2.7", "2.2.8"]
  - key: amphoteric-oxides
    concept: एल्युमिनियम ऑक्साइड, जिंक ऑक्साइड जैसे धातु ऑक्साइड, जो अम्ल तथा क्षारक दोनों से अभिक्रिया करके लवण तथा जल प्रदान करते हैं, उभयधर्मी ऑक्साइड कहलाते हैं।
    terms: [उभयधर्मी ऑक्साइड]
    items: ["2.2.9", "2.2.10", "2.2.11"]
  - key: soluble-oxides-form-alkalis
    concept: अधिकांश धातु ऑक्साइड जल में अघुलनशील हैं, लेकिन सोडियम ऑक्साइड एवं पोटैशियम ऑक्साइड जैसे कुछ जल में घुलकर क्षार प्रदान करते हैं।
    terms: []
    items: ["2.2.12", "2.2.13", "2.2.14"]
  - key: reactivity-with-oxygen-differs
    concept: विभिन्न धातुएँ ऑक्सीजन के साथ विभिन्न अभिक्रियाशीलता प्रदर्शित करती हैं; पोटैशियम तथा सोडियम खुले में आग पकड़ लेती हैं इसलिए किरोसिन तेल में डुबोकर रखी जाती हैं, मैग्नीशियम, एल्युमिनियम, जिंक, लेड पर ऑक्साइड की सुरक्षा परत चढ़ जाती है, गर्म कॉपर पर काली परत चढ़ जाती है, और सिल्वर एवं गोल्ड ऑक्सीजन के साथ अभिक्रिया नहीं करते।
    terms: []
    items: ["2.2.15", "2.2.17"]
  - key: anodising
    concept: ऐनोडीकरण एल्युमिनियम पर मोटी ऑक्साइड की परत बनाने की प्रक्रिया है, जिसमें एल्युमिनियम की वस्तु को ऐनोड बनाकर तनु सल्फ़्यूरिक अम्ल के साथ इसका विद्युत-अपघटन किया जाता है।
    terms: [ऐनोडीकरण]
    items: ["2.2.16"]
  - key: metals-with-water
    concept: जल के साथ अभिक्रिया करके धातुएँ हाइड्रोजन गैस तथा धातु ऑक्साइड उत्पन्न करती हैं; जो धातु ऑक्साइड जल में घुलनशील हैं, वे जल में घुलकर धातु हाइड्रॉक्साइड प्रदान करते हैं।
    terms: []
    items: ["2.3.3", "2.3.4", "2.3.5"]
  - key: metals-differ-with-water
    concept: पोटैशियम एवं सोडियम ठंडे जल के साथ तेज़ी से अभिक्रिया करते हैं, कैल्सियम की अभिक्रिया थोड़ी धीमी होती है, मैग्नीशियम गर्म जल के साथ, एल्युमिनियम, आयरन तथा जिंक केवल भाप के साथ अभिक्रिया करते हैं, और लेड, कॉपर, सिल्वर तथा गोल्ड जल के साथ बिल्कुल अभिक्रिया नहीं करते।
    terms: []
    items: ["2.3.1", "2.3.6", "2.3.9", "2.3.11", "2.3.12", "2.3.13", "2.3.16"]
  - key: metals-with-dilute-acids
    concept: धातुएँ अम्ल के साथ अभिक्रिया करके लवण तथा हाइड्रोजन गैस प्रदान करती हैं; अभिक्रियाशीलता इस क्रम में घटती है— Mg > Al > Zn > Fe, और कॉपर तनु HCl के साथ अभिक्रिया नहीं करता है।
    terms: []
    items: ["2.4.1", "2.4.2", "2.4.4", "2.4.7"]
  - key: nitric-acid-gives-no-hydrogen
    concept: धातुएँ नाइट्रिक अम्ल के साथ अभिक्रिया करती हैं तब हाइड्रोजन गैस उत्सर्जित नहीं होती, क्योंकि HNO₃ एक प्रबल ऑक्सीकारक है जो H₂ को ऑक्सीकृत करके जल में परिवर्तित कर देता है; लेकिन मैग्नीशियम एवं मैंगनीज अति तनु HNO₃ के साथ H₂ गैस उत्सर्जित करते हैं।
    terms: []
    items: ["2.4.6"]
  - key: aqua-regia
    concept: एक्वा रेजिया 3:1 के अनुपात में सांद्र हाइड्रोक्लोरिक अम्ल एवं सांद्र नाइट्रिक अम्ल का ताज़ा मिश्रण है, जो गोल्ड एवं प्लैटिनम को गलाने में समर्थ होता है।
    terms: [एक्वा रेजिया]
    items: ["2.4.8"]
  - key: displacement-shows-reactivity
    concept: अभिक्रियाशील धातु अपने से कम अभिक्रियाशील धातु को उसके यौगिक के विलयन से विस्थापित कर देती है; अगर धातु (A) धातु (B) को उसके विलयन से विस्थापित कर देती है तो यह धातु (B) की अपेक्षा अधिक अभिक्रियाशील है।
    terms: []
    items: ["2.5.1", "2.5.3", "2.5.4", "2.5.5"]
  - key: reactivity-series
    concept: सक्रियता श्रेणी वह सूची है, जिसमें धातुओं की क्रियाशीलता को अवरोही क्रम में व्यवस्थित किया जाता है, सबसे ऊपर पोटैशियम से सबसे नीचे गोल्ड तक, और हाइड्रोजन लेड तथा कॉपर के बीच।
    terms: [सक्रियता श्रेणी]
    items: ["2.6.1", "2.6.2"]
  - key: reactivity-is-reaching-a-full-shell
    concept: संयोजकता कोश पूर्ण होने के कारण उत्कृष्ट गैसों की रासायनिक अभिक्रियाएँ बहुत कम होती हैं, इसलिए हम तत्वों की अभिक्रियाशीलता को संयोजकता कोश को पूर्ण करने की प्रवृत्ति के रूप में समझ सकते हैं।
    terms: []
    items: ["3.1"]
  - key: ions-by-electron-transfer
    concept: सोडियम परमाणु अपने बाह्यतम कोश का एक इलेक्ट्रॉन त्यागकर सोडियम धनायन Na⁺ बनता है, और क्लोरीन एक इलेक्ट्रॉन ग्रहण करके क्लोराइड ऋणायन Cl⁻ बनता है; दोनों में स्थायी अष्टक होता है।
    terms: [धनायन, ऋणायन]
    items: ["3.3", "3.4", "3.6", "3.7"]
  - key: ionic-compounds
    concept: धातु से अधातु में इलेक्ट्रॉन के स्थानांतरण से बने यौगिकों को आयनिक यौगिक या वैद्युत संयोजक यौगिक कहा जाता है; विपरीत आवेश वाले आयन मजबूत स्थिर वैद्युत बल में बँधे रहते हैं, और सोडियम क्लोराइड अणु के रूप में नहीं पाया जाता।
    terms: [आयनिक यौगिक, वैद्युत संयोजक यौगिक]
    items: ["3.5", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
  - key: properties-of-ionic-compounds
    concept: आयनिक यौगिक ठोस, थोड़े कठोर एवं भंगुर होते हैं, इनका गलनांक एवं क्वथनांक बहुत अधिक होता है, ये जल में घुलनशील तथा किरोसिन, पेट्रोल में अविलेय होते हैं, और ठोस अवस्था में नहीं, गलित अवस्था में या विलयन में विद्युत का चालन करते हैं।
    terms: []
    items: ["3.14.2", "3.14.5", "3.14.6"]
  - key: minerals-and-ores
    concept: पृथ्वी की भूपर्पटी धातुओं का मुख्य स्रोत है; उसमें प्राकृतिक रूप से पाए जाने वाले तत्वों या यौगिकों को खनिज कहते हैं, और जिन खनिजों से धातु निकालना लाभकारी होता है उन्हें अयस्क कहते हैं।
    terms: [खनिज, अयस्क]
    items: ["4.1"]
  - key: occurrence-follows-reactivity
    concept: सक्रियता श्रेणी में नीचे आने वाली धातुएँ स्वतंत्र अवस्था में पाई जाती हैं, मध्य की धातुएँ मुख्यतः ऑक्साइड, सल्फ़ाइड या कार्बोनेट के रूप में, और सबसे ऊपर की धातुएँ कभी भी स्वतंत्र तत्व के रूप में नहीं पाई जातीं।
    terms: []
    items: ["4.2.1", "4.2.4"]
  - key: extraction-depends-on-reactivity
    concept: निम्न, मध्यम एवं उच्च अभिक्रियाशील धातुओं को प्राप्त करने के लिए विभिन्न तकनीकों का उपयोग किया जाता है, और अयस्क से शुद्ध धातु का निष्कर्षण कई चरणों में होता है।
    terms: []
    items: ["4.2.2", "4.2.3", "4.3.2"]
  - key: enrichment-removes-gangue
    concept: पृथ्वी से खनित अयस्कों में मिट्टी, रेत आदि जैसी कई अशुद्धियाँ होती हैं, जिन्हें गैंग कहते हैं; धातुओं के निष्कर्षण से पहले इन्हें हटाना आवश्यक होता है।
    terms: [गैंग]
    items: ["4.3.1"]
  - key: low-reactivity-metals-by-heating
    concept: सक्रियता श्रेणी में नीचे आने वाली धातुएँ केवल गर्म करने से ही प्राप्त की जा सकती हैं, जैसे सिनाबार (HgS) से मर्करी और Cu₂S से ताँबा।
    terms: []
    items: ["4.4.1", "4.4.2", "4.4.3", "4.4.4", "4.4.5", "4.4.6"]
  - key: roasting-and-calcination
    concept: अपचयन से पहले सल्फ़ाइड अयस्क को वायु की उपस्थिति में अधिक ताप पर गर्म करके ऑक्साइड में बदला जाता है, इसे भर्जन कहते हैं; कार्बोनेट अयस्क को सीमित वायु में अधिक ताप पर गर्म करके, इसे निस्तापन कहा जाता है।
    terms: [भर्जन, निस्तापन]
    items: ["4.5.1", "4.5.2", "4.5.3"]
  - key: reduction-with-carbon
    concept: कार्बन जैसे उपयुक्त अपचायक का उपयोग कर धातु ऑक्साइड से धातु प्राप्त किया जाता है, जैसे जिंक ऑक्साइड को कार्बन के साथ गर्म करने पर जिंक धातु मिलती है।
    terms: []
    items: ["4.5.4", "4.5.5", "4.5.6"]
  - key: reduction-by-displacement
