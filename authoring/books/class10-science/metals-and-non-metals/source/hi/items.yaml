    सामान्यतः भंगुर होते हैं तथा दाब डालने पर टुकड़ों में टूट जाते हैं। (ii) गलनांक एवं क्वथनांक—
    आयनिक यौगिकों का गलनांक एवं क्वथनांक बहुत अधिक होता है, क्योंकि मजबूत अंतर-आयनिक आकर्षण को
    तोड़ने के लिए ऊर्जा की पर्याप्त मात्रा की आवश्यकता होती है। (iii) घुलनशीलता— वैद्युत संयोजक
    यौगिक सामान्यतः जल में घुलनशील तथा किरोसिन, पेट्रोल आदि जैसे विलायकों में अविलेय होते हैं। (iv)
    विद्युत चालकता— किसी विलयन से विद्युत के चालन के लिए आवेशित कणों की गतिशीलता आवश्यक होती है।
    आयनिक यौगिकों के जलीय विलयन में आयन उपस्थित होते हैं। जब विलयन में विद्युत धारा प्रवाहित की जाती
