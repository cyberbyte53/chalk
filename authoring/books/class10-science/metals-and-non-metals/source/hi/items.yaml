- id: "4.2.1"
  kind: text
  page: 15
  text: धातुओं की सक्रियता श्रेणी के बारे में आप पढ़ चुके हैं। इसलिए, आप आसानी से समझ सकते हैं कि
    अयस्क से धातु का निष्कर्षण कैसे होता है। कुछ धातुएँ भूपर्पटी में स्वतंत्र अवस्था में पाई जाती
    हैं। कुछ धातुएँ अपने यौगिकों के रूप में मिलती हैं। सक्रियता श्रेणी में नीचे आने वाली धातुएँ सबसे
    कम अभिक्रियाशील होती हैं। ये स्वतंत्र अवस्था में पाई जाती हैं। उदाहरण के लिए— गोल्ड (सोना),
    सिल्वर (चाँदी), प्लैटिनम एवं कॉपर (ताँबा) स्वतंत्र अवस्था में पाए जाते हैं। कॉपर एवं सिल्वर,
    अपने सल्फ़ाइड या ऑक्साइड के अयस्क के रूप में संयुक्त अवस्था में भी पाए जाते हैं। सक्रियता श्रेणी
    में सबसे ऊपर की धातुएँ (K, Na, Ca, Mg एवं Al) इतनी अधिक अभिक्रियाशील होती हैं कि ये कभी भी
