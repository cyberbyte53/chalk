  text: क्या आप जानते हैं? ऐनोडीकरण (Anodising) एल्युमिनियम पर मोटी ऑक्साइड की परत बनाने की प्रक्रिया
    है। वायु के संपर्क में आने पर एल्युमिनियम पर ऑक्साइड की पतली परत का निर्माण होता है। एल्युमिनियम
    ऑक्साइड की परत इसे संक्षारण से बचाती है। इस परत को मोटा करके इसे संक्षारण से अधिक सुरक्षित किया
    जा सकता है। ऐनोडीकरण के लिए एल्युमिनियम की एक साफ़ वस्तु को ऐनोड बनाकर तनु सल्फ़्यूरिक अम्ल के
    साथ इसका विद्युत-अपघटन किया जाता है। ऐनोड पर उत्सर्जित ऑक्सीजन गैस एल्युमिनियम के साथ अभिक्रिया
    करके ऑक्साइड की एक मोटी परत बनाती है। इस ऑक्साइड की परत को आसानी से रँगकर एल्युमिनियम की आकर्षक
    वस्तुएँ बनाई जा सकती हैं।
