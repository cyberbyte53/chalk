  text: धातु के गुणधर्मों को बेहतर बनाने की अच्छी विधि मिश्रात्वन है। इस विधि से हम इच्छानुसार धातुओं
    के अत्यन्त गुणधर्म प्राप्त कर सकते हैं। उदाहरण के लिए— लोहा सर्वाधिक उपयोग मे आने वाली धातु है,
    लेकिन कभी भी शुद्ध अवस्था में इसका उपयोग नहीं किया जाता। ऐसा इसलिए, क्योंकि शुद्ध लोहा अत्यन्त
    नर्म होता है एवं गर्म करने पर सुगमतापूर्वक खिंच जाता है। लेकिन यदि इसमें थोड़ा कार्बन (लगभग 0.05
    प्रतिशत) मिला दिया जाता है तो यह कठोर तथा प्रबल हो जाता है। लोहे के साथ निकैल एवं क्रोमियम
