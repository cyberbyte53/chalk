  title: आपने क्या सीखा
  text: आपने क्या सीखा तत्वों को धातुओं एवं अधातुओं में वर्गीकृत किया जा सकता है। धातुएँ तन्य,
    आघातवर्ध्य, चमकीली एवं ऊष्मा तथा विद्युत की सुचालक होती हैं। पारद के अलावा सभी धातुएँ कमरे के
    ताप पर ठोस होती हैं। कमरे के ताप पर पारद द्रव होता है। धातुएँ विद्युत धनात्मक तत्व होते हैं,
    क्योंकि यह अधातुओं को इलेक्ट्रॉन देकर स्वयं धन आयन में परिवर्तित हो जाते हैं। ऑक्सीजन के साथ
    संयुक्त होकर धातुएँ क्षारकीय ऑक्साइड बनाती हैं। एल्युमिनियम ऑक्साइड एवं जिंक ऑक्साइड, क्षारकीय
    ऑक्साइड तथा अम्लीय ऑक्साइड, दानों के गुणधर्म प्रदर्शित करती हैं। इन ऑक्साइड को उभयधर्मी ऑक्साइड
    कहते हैं। जल एवं तनु अम्लों के साथ विभिन्न धातुओं की अभिक्रियाशीलता भिन्न-भिन्न होती है।
    अभिक्रियाशीलता के आधार पर अवरोही क्रम में व्यवस्थित सामान्य धातुओं की सूची को सक्रियता श्रेणी
    कहते हैं। सक्रियता श्रेणी में हाइड्रोजन के ऊपर स्थित धातुएँ तनु अम्ल से हाइड्रोजन को विस्थापित
    कर सकती हैं। अधिक अभिक्रियाशील धातुएँ अपने से कम अभिक्रियाशील धातुओं को उसके लवण विलयन से
    विस्थापित कर सकती हैं। प्रकृति में धातुएँ स्वतंत्र अवस्था में या अपने यौगिकों के रूप में पाई
    जाती हैं। अयस्क से धातु का निष्कर्षण तथा उसका परिष्करण कर उपयोगी बनाने के प्रक्रम को धातुकर्म
    कहते हैं। दो या दो से अधिक धातुओं अथवा एक धातु या एक अधातु के समांगी मिश्रण को मिश्रातु कहते
    हैं। लंबे समय तक आर्द्र वायु के संपर्क में रखने से लोहा जैसे कुछ धातुओं की सतह संक्षारित हो जाती
    है। इस परिघटना को संक्षारण कहते हैं। अधातुओं के गुणधर्म धातुओं के विपरीत होते हैं। यह न तो
    आघातवर्ध्य तथा न ही तन्य होते हैं। ग्रेफ़ाइट के अलावा सभी अधातुएँ ऊष्मा एवं विद्युत की कुचालक
    होती हैं। ग्रेफ़ाइट विद्युत का चालक होता है। अधातुएँ विद्युत ऋणात्मक तत्व होती हैं, क्योंकि
    धातुओं के साथ अभिक्रिया में इलेक्ट्रॉन ग्रहण कर ऋण आवेशित आयन बनाती हैं। अधातुएँ ऑक्साइड बनाती
    हैं, जो अम्लीय या उदासीन होती हैं। अधातुएँ तनु अम्लों में से हाइड्रोजन का विस्थापन नहीं करती
    हैं। यह हाइड्रोजन के साथ अभिक्रिया कर हाइड्राइड बनाती हैं।
