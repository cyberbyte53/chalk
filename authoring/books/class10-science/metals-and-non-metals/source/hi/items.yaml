    अलग-अलग डालिए। कौन सी धातु ठंडे जल से अभिक्रिया करती है? ठंडे पानी के साथ अभिक्रियाशीलता के आधार
    पर उन्हें आरोही क्रम में व्यवस्थित कीजिए। क्या कोई धातु जल में आग उत्पन्न करती है? थोड़ी देर बाद
