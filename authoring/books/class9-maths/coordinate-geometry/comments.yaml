  commit: 66c339f1b3893cf25d65653e561b158dce0d3a96
  text: "The options change with the answer, which gives the answer away. A point in a quadrant gets
    the four quadrants. A point on an axis, (−1, 0), gets \"On the x-axis\", \"On the y-axis\" and
    two quadrants. So whenever the axis options appear, the answer is an axis, and it's a 50/50
    between them. Principle 8: the right option must not stand out. Mechanical (give-away option):
    give every question the same set (all six: I, II, III, IV, on the x-axis, on the y-axis), or a
    fixed four that always includes an axis."
