  text: "Give-away option (principle 8): the right answer is always the last option. On reading-points
    it is last for B, M, L and S. On points-on-axes it is last for B, C and E. On find-the-point it
    is last for H's pair and for (5, −5) → C. In the fig-3-14 family it is last too (board 0ca66388:
    (−5, 2) last), and read-a-point is built the same way. After one or two questions a student
    learns \"tap the last one\" and stops reading the figure. The cause is in
    library/patterns/choice-question.ts#settle, not in this lesson. Its shuffle almost always moves
    the first-written option to the end. Run on 10,000 random seeds with 4 options, the
    first-written one landed last 9,991 times (positions 0/1/2/3: 0, 6, 3, 9991). s * 1103515245
    overflows exact doubles, and the low bits of that generator hardly vary. Every choice() writes
    the right option first, so this reaches every choice in Chalk that doesn't set keepOrder. The
    cmvz6l8l9911 fix (questions in place of worked examples) put four more such questions in this
    lesson. Fix settle (e.g. an integer-safe generator: Math.imul, or a hash per step) and check
    that the right option's place varies. Mechanical, but in shared code: rebuild and recheck the
    other chapters' choices too."
