  quote: overshooting misses the turn
  text: >-
    The dice game as the book states it can get stuck. Neither coordinate may go past 10, and a move
    that would overshoot misses the turn. Once a counter reaches x = 10 with y below 10 (say (10,
    6)), every throw adds at least 1 to x, so every throw overshoots and that counter never moves
    again. The same happens at y = 10. In a class, the game can end with one player stuck for ever.


    A. (Recommended) A die that would overshoot isn't used, and the counter moves by the other die
    alone. From (10, 6), red 3 and green 2 goes to (10, 8). Only a throw where both dice overshoot
    is missed. Nothing ever passes 10, and every game can finish.

    B. Keep the book's rule exactly, and the game can get stuck.

    C. Once a counter is at 10 on one coordinate, that player throws only the other die.


    Until you choose, the code follows the book (B). The rest of the prop doesn't depend on this.
