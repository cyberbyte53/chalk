  quote: "Departs from Fig. 3.1: every street runs north of the main road"
  text: "In Fig. 3.1, Streets 2, 4, 6 and 8 run south of the road, with houses counted downward. I've
    put every street on one side, so lesson 1's town is exactly the first quadrant and the walk is
    always along, then up. The south side comes back in lesson 2 (town-grows, a new board), when the
    town grows past Riya's corner and needs negative numbers. My recommendation: keep it this way.
    Or do you want the source's layout from the start?"
  messages:
    - by: you
      role: person
      at: 2026-10-29T04:00:10.740Z
      text: Can you elaborate?
    - by: fixer
      role: fixer
      at: 2026-10-29T04:00:27.284Z
      text: >-
        Sure. Here's what the textbook's street map (Fig. 3.1, page 1 of the PDF) looks like.
        There's one main road running West–East. Streets 1, 3, 5 and 7 go UP from it (north), with
        houses 1–5 counted upward. Streets 2, 4, 6 and 8 go DOWN from it (south), with houses 1–5
        counted downward. So Aman's house at Street 2, House 5 is BELOW the road.


        Why that's awkward for Riya's walk: to some houses she walks along and then up, and to
        others along and then down. In both cases House 5 is just 'the 5th house from the road'; the
        textbook doesn't use minus signs here. Later, on the plane, 'down' means a negative number.
        A student who learned 'down 5 = House 5' in lesson 1 then has to unlearn it in lesson 2.


        What I proposed instead: all eight streets go UP from the road, with houses 1–5 counted
        upward. The walk is always 'along, then up', and the town is exactly the top-right quarter
        of the plane (quadrant I). Aman's house H is still Street 2, House 5 and P is still Street
        7, House 4, just drawn above the road.


        Then in lesson 2 (town-grows), the town gets new houses south of the road and new streets
        west of Riya's corner. Now 'down' and 'west' really are the other direction, so they get
        minus signs: House −2 is two houses south of the road. That's where negative coordinates
        come from.


        So the question is: (A) all streets up in lesson 1, and the south side arrives in lesson 2
        with minus signs (my recommendation), or (B) the textbook's map with streets up and down
        from the start?
