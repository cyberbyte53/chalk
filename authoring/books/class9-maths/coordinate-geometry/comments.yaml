  commit: 66c339f1b3893cf25d65653e561b158dce0d3a96
  text: "On the phone, the moving point's coordinate label collides with the quadrant names and their
    sign patterns. At the start \"(4, 1)\" sits on top of quadrant I's \"(+, +)\" (the comment in
    the code says the start was chosen to avoid this, but at 360 it doesn't). At (−3, 2) the label
    runs into \"II\" and the point covers \"(−, +)\". At (3, −2) \"(3, −2)\" touches \"IV\". These
    are exactly the spots a student drags to. Mechanical (overlap): place the reading label on the
    side away from the quadrant's name, or put the names and patterns further out."
