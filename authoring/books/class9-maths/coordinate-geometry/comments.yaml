  text: "Played on the phone, dragging the point to Q. (1) With the point near the y-axis, e.g. at
    (−2, 3), the \"x = −2\" and \"y = 3\" labels sit on the y-axis numbers 3, 4 and on Y, so they
    can't be read (overlap, mechanical). (2) At Q the two labels end up side by side under the point
    and read \"y = −2   x = −6\" from left to right: y first, one board before the lesson teaches
    that x comes first. (3) The flow asks for the signed distances to be named abscissa and ordinate
    on the prop, but they only say x = and y =. Keep each label beside its own dashed line, with x's
    label always on the horizontal one, and consider \"abscissa x = −6\" / \"ordinate y = −2\"."
