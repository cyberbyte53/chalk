            hi: रिया ने पुरानी गलियाँ अपने कोने से **पूर्व** की ओर 1, 2, 3, … गिनी थीं। अपने कोने से उसी तरह गिनते हुए, उसके **पश्चिम** में पहली नई गली को कौन-सी संख्या मिलनी चाहिए?
        signs:
          style: body
          text:
            en: Each road is a number line now. Her corner is **0 on both**, and the street through it is Street 0. Going west, the streets are −1, −2, −3; going south, the houses are −1, −2, −3. **The minus sign says which way:** west along the main road, south down a street.
            hi: अब हर सड़क एक संख्या रेखा है। उसका कोना **दोनों पर 0** है, और उससे होकर जाने वाली गली, गली 0 है। पश्चिम की ओर गलियाँ −1, −2, −3 हैं; दक्षिण की ओर मकान −1, −2, −3 हैं। **माइनस का चिह्न बताता है कि किस ओर:** मुख्य सड़क पर पश्चिम, गली में दक्षिण।
        story:
          style: body
          text:
            en: "Riya's town has grown, and her corner is now the main crossroads: the main road and a street cross there. New streets were built **west** of it (to the left on the map), and new houses **south** of the main road (down the map)."
            hi: "रिया का शहर बढ़ गया है, और उसका कोना अब मुख्य चौराहा है: मुख्य सड़क और एक गली वहाँ एक-दूसरे को काटती हैं। उसके **पश्चिम** में (नक्शे पर बाईं ओर) नई गलियाँ बनीं, और मुख्य सड़क के **दक्षिण** में (नक्शे पर नीचे) नए मकान।"
