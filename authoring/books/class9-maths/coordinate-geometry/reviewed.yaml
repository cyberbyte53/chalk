          kind: prop
          name: notP
          prop: text
          with:
            style: body
            text:
              en: "**(3, 4) is not P.** The same two numbers in the other order are another point: 3 along and 4 up, not 4 along and 3 up. The coordinates name exactly one point."
              hi: "**(3, 4), P नहीं है।** वही दो संख्याएँ उलटे क्रम में एक दूसरा बिंदु हैं: 3 आगे और 4 ऊपर, न कि 4 आगे और 3 ऊपर। निर्देशांक ठीक एक ही बिंदु बताते हैं।"
        - isHidden: true
          kind: prop
          name: agreement
          prop: text
          with:
            style: body
            text:
              en: "Why x first? Nothing in mathematics makes it so. It is an **agreement** kept all over the world, so a pair means the same point to everyone, as Aman's address did: Street 4, House 5, the street first. Lewis Carroll once joked that the lines on a map \"are merely conventional signs\": agreed, not discovered."
