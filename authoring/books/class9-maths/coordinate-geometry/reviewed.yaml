      scene:
        describe: The board pointsOnAxes.
        facts:
          isOpen: ƒ me=>me.isPassed
        hear:
          pairOfB.checked: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          pairOfB.correct: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          pairOfC.checked: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          pairOfC.correct: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          pairOfE.checked: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          pairOfE.correct: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          sheet.reading.moved: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
        on:
          continue: ƒ (me,_,t)=>me.isPassed&&t.tell.continued()
          goOn: ƒ (me,_,t)=>{const[read,...reads]=me.reads;if(me.saying.length>0||read===void 0)return;const step=t.cause.step;return[t.set({saying:[{line:read,step}],reads}),sayAfterBreath(t,{line:read,step})]}
          hearAgain: ƒ (me,_,t)=>[t.set({saying:[],reads:names.filter(n=>!me.hidden.includes(n))}),t.hush(),t.self.goOn()]
          hide: ƒ (me,{name:piece},t)=>{if(me.hidden.includes(piece))return;const{saying,isCut,next}=pieceHidden(me.saying,piece);const tt=t;return[t.set({hidden:[...me.hidden,piece],saying,reads:me.reads.filter(n=>n!==piece)}),...isCut?[tt.hush(),next===void 0?t.self.goOn():sayNow(tt,next)]:[]]}
          hush: ƒ (_,__,t)=>[t.set({saying:[],reads:[]}),t.hush()]
          lineEnded: ƒ (me,{line,step},t)=>{const after=lineEnded(me.saying,line,step);const tt=t;return[tell(t,"said",{line}),...after===void 0?[]:[t.set({saying:after.saying})],...after?.next===void 0?[]:[sayAfterBreath(tt,after.next)],...dueAtBoard("said",me,{line}).map(due=>t.self.say(due)),...list(onSaid[line]?.(me,t)),t.self.goOn()]}
          pass: ƒ (me,_,t)=>!me.isPassed&&[t.set({isPassed:true}),tell(t,"passed",{}),...dueAtBoard("passed",me,{}).map(due=>t.self.say(due))]
          say: "ƒ (me,{line,values},t)=>{if(!Object.hasOwn(spec.pieces,line)&&!Object.hasOwn(freeLines,line))throw new Error(`Board ${name}: no line \"${line}\" (a piece's name, or one of its lines)`);const tt=t;const{byStudent,step}=tt.cause;const mine={line,step,...values===void 0?{}:{values}};const next=lineDue(me.saying,mine,byStudent);return[t.set({saying:next.saying,...next.isCut?{reads:[]}:{}}),...next.say===void 0?[]:[sayNow(tt,next.say)]]}"
          show: ƒ (me,{name:piece},t)=>me.hidden.includes(piece)&&[t.set({hidden:me.hidden.filter(n=>n!==piece)}),t.self.say({line:piece}),tell(t,"shown",{name:piece}),...dueAtBoard("shown",me,{name:piece}).map(due=>t.self.say(due))]
          start: ƒ (me,_,t)=>{const atOnce=spec.passBy!=="rules"&&questions.length===0;return[t.set({reads:names.filter(n=>!me.hidden.includes(n))}),tell(t,"started",{}),...dueAtBoard("started",me,{}).map(due=>t.self.say(due)),...atOnce?[t.self.pass()]:[],t.self.goOn()]}
        start:
          hidden:
            - onX
            - onY
            - atO
            - q
            - figure
            - pairOfB
            - whyB
            - pairOfC
            - whyC
            - pairOfE
            - whyE
          isPassed: false
          reads: []
          saying: []
