          text:
            en: Back on the agreed axes, P is (3, 2) again, the same for everyone.
            hi: माने हुए अक्षों पर लौटकर P फिर (3, 2) है, सबके लिए एक जैसा।
        choice:
          style: body
          text:
            en: "P never moved, yet its coordinates changed: **coordinates depend on the axes we choose.** So everyone uses the same pair, the agreed x-axis across and y-axis up, just as everyone writes x first. Then a pair of numbers means one point to everyone."
            hi: "P कभी नहीं हिला, फिर भी उसके निर्देशांक बदल गए: **निर्देशांक उन अक्षों पर निर्भर करते हैं जो हम चुनते हैं।** इसलिए सब एक ही जोड़ा लेते हैं, माना हुआ आड़ा x-अक्ष और खड़ा y-अक्ष, जैसे सब x पहले लिखते हैं। तब संख्याओं का एक जोड़ा सबके लिए एक ही बिंदु बताता है।"
        link:
          style: body
          text:
            en: Two perpendicular lines can be drawn anywhere, pointing any way. The dot is the point P. On the agreed axes, P is **(3, 2)**, and P stays where it is. **Drag O** to move the axes, and **turn them by the ↻ handle** on the x-axis. Watch P's coordinates.
            hi: दो लंब रेखाएँ कहीं भी, किसी भी दिशा में खींची जा सकती हैं। यह बिंदु P है। माने हुए अक्षों पर P **(3, 2)** है, और P अपनी जगह रहता है। अक्षों को खिसकाने के लिए **O को खींचो**, और x-अक्ष पर बने **↻ हैंडल से उन्हें घुमाओ**। P के निर्देशांक देखो।
        putBack:
          style: body
          text:
            en: "On the agreed axes P was (3, 2). **Put the axes back** and see: O at the crossing it started on, and the x-axis level again."
            hi: "माने हुए अक्षों पर P (3, 2) था। **अक्षों को वापस रखो** और देखो: O फिर उसी जगह पर, और x-अक्ष फिर से आड़ा।"
