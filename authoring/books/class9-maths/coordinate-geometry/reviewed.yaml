      lines:
        aunt:
          says:
            en: For their stall at the fair, Aman's aunt is lending them a table. She lives in the new part of town, at Street minus 2, House minus 3. Walk Riya there to fetch it.
            hi: मेले में उनके स्टॉल के लिए अमन की मौसी उन्हें एक मेज़ दे रही हैं। वे शहर के नए हिस्से में, गली माइनस 2, मकान माइनस 3 पर रहती हैं। उसे लाने के लिए रिया को वहाँ ले चलो।
        firstWest-next-note:
          about: firstWest
          says:
            en: Street 6 would come after Street 5, on the east side. This street is 1 street from her corner, the other way.
            hi: गली 6 तो गली 5 के बाद, पूर्व की ओर आती। यह गली उसके कोने से 1 गली दूर है, दूसरी ओर।
          when: firstWest.checked
          where:
            optionId: next
            status: wrong
        firstWest-one-note:
          about: firstWest
          says:
            en: "Street 1 is already there, 1 street east. Two streets can't have one number: this one is 1 street west."
            hi: "गली 1 पहले से है, 1 गली पूर्व में। दो गलियों का एक ही नंबर नहीं हो सकता: यह 1 गली पश्चिम में है।"
          when: firstWest.checked
          where:
            optionId: one
            status: wrong
        firstWest-zero-note:
          about: firstWest
          says:
            en: 0 is the street through her corner itself, 0 streets from it. This one is 1 street away.
            hi: 0 तो उसके कोने से गुज़रने वाली गली है, उससे 0 गली दूर। यह गली 1 गली दूर है।
          when: firstWest.checked
          where:
            optionId: zero
            status: wrong
        signs:
          says:
            en: "Each road is a number line now. Her corner is 0 on both, and the street through it is Street 0. Going west, the streets are minus 1, minus 2, minus 3; going south, the houses are minus 1, minus 2, minus 3. The minus sign says which way: west along the main road, south down a street."
            hi: "अब हर सड़क एक संख्या रेखा है। उसका कोना दोनों पर 0 है, और उससे होकर जाने वाली गली, गली 0 है। पश्चिम की ओर गलियाँ माइनस 1, माइनस 2, माइनस 3 हैं; दक्षिण की ओर मकान माइनस 1, माइनस 2, माइनस 3 हैं। माइनस का चिह्न बताता है कि किस ओर: मुख्य सड़क पर पश्चिम, गली में दक्षिण।"
        there:
          says:
            en: "Street minus 2, House minus 3: 2 streets west along the main road, then 3 houses south. Each number says how far from her corner; its sign says which way."
            hi: "गली माइनस 2, मकान माइनस 3: मुख्य सड़क पर 2 गली पश्चिम, फिर 3 मकान दक्षिण। हर संख्या बताती है कि उसके कोने से कितनी दूर; उसका चिह्न बताता है कि किस ओर।"
      scene:
        describe: The board townGrows.
        facts:
          isOpen: ƒ me=>me.isPassed
        hear:
          firstWest.checked: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          firstWest.correct: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          town.places.targetChosen: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
          town.walker.arrived: ƒ (me,payload,t)=>[...(own[key]??[]).flatMap(rule=>rule(me,payload,t)),...dueAt(key,me,payload).map(due=>t.self.say(due)),...rulesFrom.flatMap(r=>list(r[key]?.(me,payload,t)))]
        on:
          continue: ƒ (me,_,t)=>me.isPassed&&t.tell.continued()
          goOn: ƒ (me,_,t)=>{const[read,...reads]=me.reads;if(me.saying.length>0||read===void 0)return;const step=t.cause.step;return[t.set({saying:[{line:read,step}],reads}),sayAfterBreath(t,{line:read,step})]}
          hearAgain: ƒ (me,_,t)=>[t.set({saying:[],reads:names.filter(n=>!me.hidden.includes(n))}),t.hush(),t.self.goOn()]
          hide: ƒ (me,{name:piece},t)=>{if(me.hidden.includes(piece))return;const{saying,isCut,next}=pieceHidden(me.saying,piece);const tt=t;return[t.set({hidden:[...me.hidden,piece],saying,reads:me.reads.filter(n=>n!==piece)}),...isCut?[tt.hush(),next===void 0?t.self.goOn():sayNow(tt,next)]:[]]}
          hush: ƒ (_,__,t)=>[t.set({saying:[],reads:[]}),t.hush()]
          lineEnded: ƒ (me,{line,step},t)=>{const after=lineEnded(me.saying,line,step);const tt=t;return[tell(t,"said",{line}),...after===void 0?[]:[t.set({saying:after.saying})],...after?.next===void 0?[]:[sayAfterBreath(tt,after.next)],...dueAtBoard("said",me,{line}).map(due=>t.self.say(due)),...list(onSaid[line]?.(me,t)),t.self.goOn()]}
          pass: ƒ (me,_,t)=>!me.isPassed&&[t.set({isPassed:true}),tell(t,"passed",{}),...dueAtBoard("passed",me,{}).map(due=>t.self.say(due))]
          say: "ƒ (me,{line,values},t)=>{if(!Object.hasOwn(spec.pieces,line)&&!Object.hasOwn(freeLines,line))throw new Error(`Board ${name}: no line \"${line}\" (a piece's name, or one of its lines)`);const tt=t;const{byStudent,step}=tt.cause;const mine={line,step,...values===void 0?{}:{values}};const next=lineDue(me.saying,mine,byStudent);return[t.set({saying:next.saying,...next.isCut?{reads:[]}:{}}),...next.say===void 0?[]:[sayNow(tt,next.say)]]}"
          show: ƒ (me,{name:piece},t)=>me.hidden.includes(piece)&&[t.set({hidden:me.hidden.filter(n=>n!==piece)}),t.self.say({line:piece}),tell(t,"shown",{name:piece}),...dueAtBoard("shown",me,{name:piece}).map(due=>t.self.say(due))]
          start: ƒ (me,_,t)=>{const atOnce=spec.passBy!=="rules"&&questions.length===0;return[t.set({reads:names.filter(n=>!me.hidden.includes(n))}),tell(t,"started",{}),...dueAtBoard("started",me,{}).map(due=>t.self.say(due)),...atOnce?[t.self.pass()]:[],t.self.goOn()]}
        start:
          hidden:
            - town
            - signs
            - aunt
            - there
            - anyHouse
          isPassed: false
          reads: []
          saying: []
