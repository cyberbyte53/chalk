  stamp: c4c09cc572c76989
  props:
    coordinatePlane: 70e1c5edb94b96be
    text: 79b6e0fab9e596c9
  content:
    is: []
    jugnu:
      props:
        sheet: a notebook page squared in centimetres, with a dot on it, and the ways of saying where it is
      purpose: "A dot on a notebook page, which has no roads. The book's ways of saying where it is, one at a time, each shading where it could still be: \"upper half\" half the page, \"near the left edge\" a patch, 5 cm from the left edge a whole line, and 9 cm above the bottom one point, where the two lines cross."
    name: dotOnPaper
    root:
      children:
        - kind: prop
          name: w1
          prop: text
          with:
            style: title
            text:
              en: A dot on a page
              hi: पन्ने पर एक बिंदु
        - kind: prop
          name: w2
          prop: text
          with:
            style: body
            text:
              en: Here is a dot on a page of your notebook, and each small square is 1 cm across. How would you say exactly where the dot is? Try these, one at a time, and watch where it could still be.
              hi: यह तुम्हारी कॉपी के पन्ने पर एक बिंदु है, और हर छोटा खाना 1 cm चौड़ा है। तुम ठीक-ठीक कैसे बताओगे कि बिंदु कहाँ है? ये एक-एक करके आज़माओ, और देखो कि वह अब भी कहाँ हो सकता है।
        - kind: prop
          name: sheet
          prop: coordinatePlane
          with:
            axisNames:
              - en: left edge
