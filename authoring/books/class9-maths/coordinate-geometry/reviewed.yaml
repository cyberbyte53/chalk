class9-maths/coordinate-geometry/questions/cross-street-count/44136fa3:
  stamp: 03e3e317d8b10bd4
  props:
    choice: 79b6e0fab9e596c9
  content:
    is: []
    name: crossStreetCount
    root:
      children:
        - kind: prop
          name: ask
          prop: choice
          with:
            answer: oneEach
            concepts:
              - fab4d618fc2c9277
            isGraded: true
            options:
              - feedback:
                  en: (4, 3) is the 4th North-South street with the 3rd East-West one; (3, 4) is the 3rd North-South street with the 4th East-West one. Those are different crossings.
                  hi: (4, 3) चौथी उत्तर-दक्षिण गली और तीसरी पूर्व-पश्चिम गली है; (3, 4) तीसरी उत्तर-दक्षिण गली और चौथी पूर्व-पश्चिम गली। ये अलग चौराहे हैं।
                id: sameOne
                label:
                  en: (i) one; (ii) the same one as (i)
                  hi: (i) एक; (ii) वही जो (i) में है
              - feedback:
                  en: Two streets cross only once. The 4th North-South street and the 3rd East-West street meet at one crossing.
                  hi: दो गलियाँ केवल एक बार मिलती हैं। चौथी उत्तर-दक्षिण गली और तीसरी पूर्व-पश्चिम गली एक ही चौराहे पर मिलती हैं।
                id: twoEach
                label:
                  en: (i) two; (ii) two
                  hi: (i) दो; (ii) दो
              - id: oneEach
                label:
                  en: (i) one; (ii) one, a different crossing
                  hi: (i) एक; (ii) एक, अलग चौराहा
            prompt:
              en: "(Street Plan): A city has two main roads which cross each other at the centre of the city. These two roads are along the North-South direction and East-West direction. All the other streets of the city run parallel to these roads and are 200 m apart. There are 5 streets in each direction. Using 1 cm = 200 m, draw a model of the city on your notebook. Represent the roads/streets by single lines. There are many cross-streets in your model. A particular cross-street is made by two streets, one running in the North-South direction and another in the East-West direction. Each cross-street is referred to in the following manner: If the 2nd street running in the North-South direction and 5th in the East-West direction meet at some crossing, then we will call this cross-street (2, 5). Using this convention, find: (i) how many cross-streets can be referred to as (4, 3); (ii) how many cross-streets can be referred to as (3, 4)."
              hi: "(गली योजना): एक शहर में दो मुख्य सड़कें हैं, जो शहर के केंद्र पर एक-दूसरे को काटती हैं। ये दोनों सड़कें उत्तर-दक्षिण दिशा और पूर्व-पश्चिम दिशा में हैं। शहर की अन्य सभी गलियाँ इन सड़कों के समांतर हैं और 200 m की दूरी पर हैं। हर दिशा में 5 गलियाँ हैं। 1 cm = 200 m लेकर अपनी कॉपी में शहर का एक मॉडल बनाइए। सड़कों/गलियों को एक-एक रेखा से दर्शाइए। आपके मॉडल में कई चौराहे हैं। एक चौराहा दो गलियों से बनता है, एक उत्तर-दक्षिण दिशा में चलने वाली और दूसरी पूर्व-पश्चिम दिशा में। हर चौराहे को इस तरह कहा जाता है: अगर उत्तर-दक्षिण दिशा की दूसरी गली और पूर्व-पश्चिम दिशा की पाँचवीं गली किसी चौराहे पर मिलती हैं, तो इस चौराहे को (2, 5) कहेंगे। इस परिपाटी से ज्ञात कीजिए: (i) कितने चौराहों को (4, 3) कहा जा सकता है; (ii) कितने चौराहों को (3, 4) कहा जा सकता है।"
        - kind: space
          name: space1
      kind: column
      name: page
    studentOnly: []
    when:
      - do:
          call: board.pass
        on: ask.correct
