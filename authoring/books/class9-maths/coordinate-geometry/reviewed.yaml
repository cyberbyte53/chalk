class9-maths/coordinate-geometry/coordinates-of-a-point/writing-coordinates:
  content:
    model:
      freeLines: []
      given:
        agreement:
          style: body
          text:
            en: "Why x first? Nothing in mathematics makes it so. It is an **agreement** kept all over the world, so a pair means the same point to everyone, as Aman's address did: Street 4, House 5, the street first. Lewis Carroll once joked that the lines on a map \"are merely conventional signs\": agreed, not discovered."
            hi: 'x पहले क्यों? गणित में ऐसा कुछ नहीं जो इसे ज़रूरी बनाए। यह पूरी दुनिया में माना गया एक **समझौता** है, ताकि एक जोड़ा सबके लिए एक ही बिंदु बताए, जैसे अमन का पता बताता था: गली 4, मकान 5, गली पहले। लुईस कैरल ने एक बार मज़ाक में कहा था कि नक्शे की रेखाएँ "बस माने हुए चिह्न हैं": तय की गई, खोजी नहीं गई।'
        ask:
          style: body
          text:
            en: "**Drag the point anywhere on the plane:** its coordinates go with it. Then put it at **(3, 4)**."
            hi: "**बिंदु को तल पर कहीं भी खींचो:** उसके निर्देशांक उसके साथ चलते हैं। फिर उसे **(3, 4)** पर रखो।"
        ground:
          places:
            choosing: always
            placeKind: stall
            places:
              - label:
                  en: Snacks
                  hi: नाश्ता
                x: 3
                y: 2
              - label:
                  en: Books
                  hi: किताबें
                x: -4
                y: 1
            showAddress: true
            targetName:
              en: The stall you tapped
              hi: तुम्हारा चुना स्टॉल
          plane:
            hasGrid: false
            marks: numbers
            numbered:
              - x
              - y
            scene: fairGround
            showAxisNames: false
            showDirections: false
            window:
              xMax: 5.5
              xMin: -5.5
              yMax: 5.5
              yMin: -5.5
        notP:
          style: body
          text:
            en: "**(3, 4) is not P.** The same two numbers in the other order are another point: 3 along and 4 up, not 4 along and 3 up. The coordinates name exactly one point."
            hi: "**(3, 4), P नहीं है।** वही दो संख्याएँ उलटे क्रम में एक दूसरा बिंदु हैं: 3 आगे और 4 ऊपर, न कि 4 आगे और 3 ऊपर। निर्देशांक ठीक एक ही बिंदु बताते हैं।"
        pair:
          color: null
          style: definition
          text:
            en: "**The coordinates of a point are written x-coordinate first, then y-coordinate, in brackets: P is (4, 3) and Q is (−6, −2).**"
            hi: "**किसी बिंदु के निर्देशांक पहले x-निर्देशांक, फिर y-निर्देशांक, कोष्ठक में लिखे जाते हैं: P है (4, 3) और Q है (−6, −2)।**"
        plan:
          style: body
          text:
            en: "On the fair ground's plan, the two main paths are the axes, crossing at O. Riya writes where the first stalls stand: **snacks at (3, 2), books at (−4, 1)**. **Tap a stall** to see its coordinates."
            hi: "मेले के मैदान के नक्शे पर दो मुख्य रास्ते अक्ष हैं, जो O पर काटते हैं। रिया पहले स्टॉल की जगहें लिखती है: **नाश्ता (3, 2) पर, किताबें (−4, 1) पर**। उसके निर्देशांक देखने के लिए **किसी स्टॉल को दबाओ**।"
        sheet:
          plane:
            hasGrid: true
            marks: numbers
            numbered:
              - x
              - y
            points:
              - hasDropLines: false
                isShown: true
                name: P
                tone: main
                x: 4
                y: 3
            showAxisNames: false
            showDirections: true
