          prop: text
          with:
            style: body
            text:
              en: "Street 4 rises from the 4: a second number line, going up, with **five houses** on it. Which one is Aman's?"
              hi: "4 से गली 4 ऊपर उठती है: एक दूसरी संख्या रेखा, ऊपर की ओर, जिस पर **पाँच मकान** हैं। अमन का कौन-सा है?"
        - isHidden: true
          kind: prop
          name: reply
          prop: text
          with:
            style: body
            text:
              en: "Riya messages him again. He replies: **House 5**, a number on the street that rose. Walk her up to it."
              hi: "रिया उसे फिर संदेश भेजती है। वह जवाब देता है: **मकान 5**, उठी हुई गली पर एक संख्या। उसे वहाँ तक ऊपर चलाओ।"
        - isHidden: true
          kind: prop
          name: found
          prop: text
          with:
            style: definition
            text:
              en: "**Aman's house isn't on one line: it's along the main road and then up a street, so one number couldn't say where it is.** It took two numbers: how far along the main road (Street 4), then how far up the street that rises there (House 5)."
              hi: "**अमन का घर एक रेखा पर नहीं है: वह मुख्य सड़क पर आगे और फिर एक गली में ऊपर है, इसलिए एक संख्या नहीं बता सकी कि वह कहाँ है।** इसके लिए दो संख्याएँ लगीं: मुख्य सड़क पर कितना आगे (गली 4), फिर वहाँ से उठती गली में कितना ऊपर (मकान 5)।"
        - isHidden: true
          kind: prop
          name: anyHouse
          prop: text
          with:
            style: body
            text:
              en: "Now every street rises, and the town is there. **Tap any house** to make it Aman's: Riya goes back to the corner. Say how she gets there, then walk her and check."
              hi: "अब हर गली उठती है, और शहर बन जाता है। **किसी भी मकान को दबाओ** ताकि वह अमन का घर बन जाए: रिया कोने पर लौट जाती है। बोलो कि वह वहाँ कैसे पहुँचेगी, फिर उसे चलाकर जाँचो।"
        - kind: space
          name: space1
      kind: column
      name: page
    studentOnly: []
    when:
      - do:
          args:
            at: 4
          call: town.raiseUpLine
        if: ƒ at=>{const p=at(plane).at;return p.x===x&&p.y===y}
        on: town.stepped
      - do:
          seq:
            - args:
                axis: x
                value: 4
              call: town.lightLine
            - wait: 2.5
            - args:
                x: 4
                y: 5
              call: town.chooseTarget
        if: ƒ at=>at(town).upLines?.length===1
        on: town.risen
      - do:
          - args:
              name: fiveHouses
            call: board.show
        if: ƒ at=>at(town).upLines?.length===1
        on: town.risen
      - do:
          - args:
              name: reply
            call: board.show
        if: ƒ at=>at(town).target?.x===4
        on: town.targetChosen
      - do:
          - args:
              name: found
            call: board.show
          - args:
              name: anyHouse
            call: board.show
        if: ƒ at=>{const p=at(plane).at;return p.x===x&&p.y===y}
        on: town.arrived
      - do:
          call: town.raiseAllUpLines
        if: ƒ at=>{const p=at(plane).at;return p.x===x&&p.y===y}
        on: town.arrived
      - do:
          call: board.pass
        if: ƒ at=>{const p=at(plane).at;return p.x===x&&p.y===y}
        on: town.arrived
