class9-maths/coordinate-geometry/the-cartesian-plane/two-number-lines:
  content:
    model:
      freeLines: []
      given:
        any:
          style: body
          text:
            en: "In Riya's town, two roads at right angles, each a number line, told where every house is. To give the place of any point in a plane, we do the same: **two number lines at right angles, one horizontal and one vertical.**"
            hi: "रिया के शहर में, समकोण पर मिलती दो सड़कों ने, जिनमें हर एक संख्या रेखा थी, हर मकान की जगह बताई। तल में किसी भी बिंदु की जगह बताने के लिए हम यही करते हैं: **समकोण पर दो संख्या रेखाएँ, एक क्षैतिज और एक ऊर्ध्वाधर।**"
        axes:
          color: null
          style: definition
          text:
            en: "**The horizontal line X′X is the x-axis, and the vertical line Y′Y is the y-axis. The point where they cross is the origin, O.**"
            hi: "**क्षैतिज रेखा X′X, x-अक्ष है, और ऊर्ध्वाधर रेखा Y′Y, y-अक्ष है। जिस बिंदु पर ये काटती हैं, वह मूल बिंदु O है।**"
        lines:
          style: body
