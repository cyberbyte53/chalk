class9-maths/coordinate-geometry/the-cartesian-plane/number-line:
  content:
    model:
      freeLines: []
      given:
        ask:
          style: body
          text:
            en: "The point is at 2: **2 units from 0**, on the positive side. Drag it to **−3**."
            hi: "बिंदु 2 पर है: **0 से 2 इकाई**, धनात्मक ओर। उसे **−3** पर खींचो।"
        line:
          plane:
            axes: horizontal
            marks: numbers
            numbered:
              - x
            showAxisNames: false
            showOrigin: false
            window:
              xMax: 5.5
              xMin: -5.5
              yMax: 0.5
              yMin: -0.5
          reading:
            point:
              x: 2
              y: 0
            pointStep: 1
            reading: none
            unit: ""
        link:
          style: body
          text:
            en: Riya's town, the dot on the page and the desks in class each took two numbers, along two lines at right angles. To give the place of **any** point that way, each line will be a **number line**. First, what a number line says.
            hi: रिया का शहर, पन्ने पर बिंदु और कक्षा के डेस्क, हर एक के लिए दो समकोण रेखाओं के साथ दो संख्याएँ लगीं। **किसी भी** बिंदु का स्थान इस तरह बताने के लिए, हर रेखा एक **संख्या रेखा** होगी। पहले देखें कि संख्या रेखा क्या बताती है।
        recap:
          style: body
          text:
            en: "A number line has a fixed point, the **origin**, marked 0. Equal units are marked from it: 1, 2, 3, … on one side, the positive side, and −1, −2, −3, … on the other, the negative side."
            hi: "संख्या रेखा पर एक निश्चित बिंदु होता है, **मूल बिंदु**, जिस पर 0 लिखा होता है। उससे बराबर इकाइयाँ लगाई जाती हैं: एक ओर, धनात्मक ओर, 1, 2, 3, … और दूसरी ओर, ऋणात्मक ओर, −1, −2, −3, …।"
        rule:
          color: null
          style: definition
          text:
            en: "**−3 is 3 units from 0, on the negative side.** So a point at distance $r$ from 0 is the number $r$ on the positive side, and $-r$ on the negative side: the sign says which side."
            hi: "**−3, 0 से 3 इकाई दूर है, ऋणात्मक ओर।** इसलिए 0 से $r$ दूरी पर एक बिंदु धनात्मक ओर संख्या $r$ है, और ऋणात्मक ओर $-r$: चिह्न बताता है कि किस ओर।"
        title:
          style: title
          text:
            en: Back to the number line
            hi: फिर से संख्या रेखा
      lines:
        ask:
          says:
            en: "The point is at 2: 2 units from 0, on the positive side. Drag it to minus 3."
            hi: "बिंदु 2 पर है: 0 से 2 इकाई, धनात्मक ओर। उसे माइनस 3 पर खींचो।"
        recap:
          says:
            en: "A number line has a fixed point, the origin, marked 0. Equal units are marked from it: 1, 2, 3, and so on, on one side, the positive side, and minus 1, minus 2, minus 3, and so on, on the other, the negative side."
            hi: "संख्या रेखा पर एक निश्चित बिंदु होता है, मूल बिंदु, जिस पर 0 लिखा होता है। उससे बराबर इकाइयाँ लगाई जाती हैं: एक ओर, धनात्मक ओर, 1, 2, 3, और आगे, और दूसरी ओर, ऋणात्मक ओर, माइनस 1, माइनस 2, माइनस 3, और आगे।"
        rule:
          says:
            en: "Minus 3 is 3 units from 0, on the negative side. So a point at distance r from 0 is the number r on the positive side, and minus r on the negative side: the sign says which side."
            hi: "माइनस 3, 0 से 3 इकाई दूर है, ऋणात्मक ओर। इसलिए 0 से आर दूरी पर एक बिंदु धनात्मक ओर संख्या आर है, और ऋणात्मक ओर माइनस आर: चिह्न बताता है कि किस ओर।"
