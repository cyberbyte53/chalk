class9-maths/coordinate-geometry/two-numbers-for-a-place/bus-stops:
  stamp: 833c8a75c85efca1
  props:
    choice: 79b6e0fab9e596c9
    coordinatePlane: 70e1c5edb94b96be
    text: 79b6e0fab9e596c9
  content:
    is: []
    jugnu:
      props:
        road: "a straight road as a number line: the bus stand at 0, stops both ways"
      purpose: "A refresher on the number line: from the bus stand at 0, the bus moves stop by stop either way, and one number (how far, and which side) fixes where it is."
    name: busStops
    root:
      children:
        - kind: prop
          name: w1
          prop: text
          with:
            style: title
            text:
              en: A bus on a straight road
              hi: सीधी सड़क पर एक बस
        - kind: prop
          name: w2
          prop: text
          with:
            style: body
            text:
              en: "A bus runs on a straight road. Its stand is at **0**. The stops to the right are 1, 2, 3, …, and the stops to the left are −1, −2, −3, …: a number line."
              hi: "एक बस सीधी सड़क पर चलती है। उसका अड्डा **0** पर है। दाईं ओर के स्टॉप 1, 2, 3, … हैं, और बाईं ओर के −1, −2, −3, …: एक संख्या रेखा।"
        - kind: prop
          name: w3
          prop: text
          with:
            style: body
            text:
              en: Move the bus one stop at a time with ← and →. Take it to stop **3**.
              hi: बस को ← और → से एक-एक स्टॉप चलाओ। इसे स्टॉप **3** पर ले जाओ।
        - kind: prop
          name: road
          prop: coordinatePlane
          with:
            at:
              x: 0
              y: 0
            axes: horizontal
            canChooseTarget: false
            marks: numbers
            placeKind: crossing
            places:
              - label:
                  en: bus stand
                  hi: बस अड्डा
                x: 0
                y: 0
              - x: -6
                y: 0
              - x: -5
                y: 0
              - x: -4
                y: 0
              - x: -3
                y: 0
              - x: -2
                y: 0
              - x: -1
                y: 0
              - x: 1
                y: 0
              - x: 2
                y: 0
              - x: 3
                y: 0
              - x: 4
                y: 0
              - x: 5
                y: 0
              - x: 6
                y: 0
            roads: grid
            showAxisNames: false
            showOrigin: false
            walkFrom:
              x: 0
              y: 0
            walkerKind: bus
            walkerName:
              en: The bus
              hi: बस
            window:
              xMax: 6
              xMin: -6
              yMax: 0.5
              yMin: 0
        - isHidden: true
          kind: prop
          name: atThree
          prop: text
          with:
            style: body
            text:
              en: "The bus is at **3**: three stops from the stand, to the right. Now take it to **−2**."
              hi: "बस **3** पर है: अड्डे से तीन स्टॉप, दाईं ओर। अब इसे **−2** पर ले जाओ।"
        - isHidden: true
          kind: prop
          name: side
          prop: choice
          with:
            answer: left
            concepts:
              - fab4d618fc2c9277
            isGraded: false
            options:
              - feedback:
                  en: "Look at the bus: it went left from 0. The minus sign says which side."
                  hi: "बस को देखो: वह 0 से बाईं ओर गई। ऋण चिह्न बताता है कि किस ओर।"
                id: right
                label:
                  en: 2 stops from the stand, to the right
                  hi: अड्डे से 2 स्टॉप, दाईं ओर
              - feedback:
                  en: It is 2 stops away; the − only says which way, left.
                  hi: वह 2 स्टॉप दूर है; − केवल दिशा बताता है, बाईं ओर।
                id: minus
                label:
                  en: −2 stops from the stand
                  hi: अड्डे से −2 स्टॉप
              - id: left
                label:
                  en: 2 stops from the stand, to the left
                  hi: अड्डे से 2 स्टॉप, बाईं ओर
            prompt:
              en: The bus is at −2. Where is it?
              hi: बस −2 पर है। वह कहाँ है?
        - isHidden: true
          kind: prop
          name: enough
          prop: text
          with:
            style: definition
            text:
              en: "**The bus can only go along the road, so one number tells you exactly where it is:** how far from the stand, and which side."
              hi: "**बस केवल सड़क के साथ-साथ चल सकती है, इसलिए एक संख्या ठीक-ठीक बता देती है कि वह कहाँ है:** अड्डे से कितनी दूर, और किस ओर।"
        - kind: space
          name: space1
      kind: column
      name: page
    studentOnly: []
    when:
      - do:
          - args:
              name: atThree
            call: board.show
        if: ƒ at=>{const p=at(plane).at;return p.x===x&&p.y===y}
        on: road.stepped
      - do:
          - args:
              name: side
            call: board.show
        if: ƒ at=>{const p=at(plane).at;return p.x===x&&p.y===y}
        on: road.stepped
      - do:
          - args:
              name: enough
            call: board.show
        on: side.correct
      - do:
          call: board.pass
        on: side.correct
