- id: "4"
  kind: section
  page: 15
  number: "3.4"
  text: Summary
- id: "4.1"
  kind: text
  page: 15
  text: "In this chapter, you have studied the following points :"
- id: "4.2"
  kind: text
  page: 15
  text: >-
    1. To locate the position of an object or a point in a plane, we require two perpendicular
    lines. One of them is horizontal, and the other is vertical.
- id: "4.3"
  kind: text
  page: 15
  text: >-
    2. The plane is called the Cartesian, or coordinate plane and the lines are called the
    coordinate axes.
- id: "4.4"
  kind: text
  page: 15
  text: 3. The horizontal line is called the x -axis, and the vertical line is called the y - axis.
- id: "4.5"
  kind: text
  page: 15
  text: 4. The coordinate axes divide the plane into four parts called quadrants.
- id: "4.6"
  kind: text
  page: 15
  text: 5. The point of intersection of the axes is called the origin.
- id: "4.7"
  kind: text
  page: 15
  text: >-
    6. The distance of a point from the y - axis is called its x-coordinate, or abscissa, and the
    distance of the point from the x-axis is called its y-coordinate, or ordinate.
- id: "4.8"
  kind: text
  page: 15
  text: >-
    7. If the abscissa of a point is x and the ordinate is y, then (x, y) are called the coordinates
    of the point.
- id: "4.9"
  kind: text
  page: 15
  text: >-
    8. The coordinates of a point on the x-axis are of the form (x, 0) and that of the point on the
    y-axis are (0, y).
- id: "4.10"
  kind: text
  page: 15
  text: 9. The coordinates of the origin are (0, 0).
- id: "4.11"
  kind: text
  page: 15
  text: >-
    10. The coordinates of a point are of the form (+ , +) in the first quadrant, (−, +) in the
    second quadrant, (−, −) in the third quadrant and (+, −) in the fourth quadrant, where + denotes
    a positive real number and − denotes a negative real number.
- id: "4.12"
  kind: text
  page: 15
  text: 11. If x ≠ y, then (x, y) ≠ (y, x), and (x, y) = (y, x), if x = y.
