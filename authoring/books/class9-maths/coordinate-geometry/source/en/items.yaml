    coordinates of M are (__, __). (iii) The x-coordinate and the y-coordinate of the point L are
    ___ and ___, respectively. Hence, the coordinates of L are (__, __). (iv) The x-coordinate and
    the y-coordinate of the point S are ___ and ___, respectively. Hence, the coordinates of S are
