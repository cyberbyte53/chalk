  text: >-
    II. Suppose you put a dot on a sheet of paper [Fig.3.2 (a)]. If we ask you to tell us the
    position of the dot on the paper, how will you do this? Perhaps you will try in some such
    manner: “The dot is in the upper half of the paper”, or “It is near the left edge of the paper”,
    or “It is very near the left hand upper corner of the sheet”. Do any of these statements fix the
    position of the dot precisely? No! But, if you say “The dot is nearly 5 cm away from the left
    edge of the paper”, it helps to give some idea but still does not fix the position of the dot. A
    little thought might enable you to say that the dot is also at a distance of 9 cm above the
    bottom line. We now know exactly where the dot is!
