  page: 13
  number: Fig. 3.16
  text: X′, X, Y, Y′, O, (− 3, 5), (0, 5), (2, 5), (5, 2), (6, 1), (5, 0), (5, −3), (− 3, − 5)
  crop: [115, 124, 430, 398]
- id: "3.7"
  kind: text
  page: 13
  text: >-
    Note : In the example above, you see that (5, 0) and (0, 5) are not at the same position.
    Similarly, (5, 2) and (2, 5) are at different positions. Also, (−3, 5) and (5, −3) are at
    different positions. By taking several such examples, you will find that, if x ≠ y, then the
    position of (x, y) in the Cartesian plane is different from the position of (y, x). So, if we
    interchange the coordinates x and y, the position of (y, x) will differ from the position of (x,
    y). This means that the order of x and y is important in (x, y). Therefore, (x, y) is called an
    ordered pair. The ordered pair (x, y) ≠ ordered pair (y, x), if x ≠ y. Also (x, y) = (y, x), if
    x = y.
