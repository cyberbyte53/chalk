  text: >-
    A game for two persons (Requirements: two counters or coins, graph paper, two dice of different
    colours, say red and green): Place each counter at (0, 0). Each player throws two dice
    simultaneously. When the first player does so, suppose the red die shows 3 and the green one
    shows 1. So, she moves her counter to (3, 1). Similarly, if the second player throws 2 on the
    red and 4 on the green, she moves her counter to (2, 4). On the second throw, if the first
    player throws 1 on the red and 4 on the green, she moves her counter from (3, 1) to (3 + 1, 1 +
    4), that is, adding 1 to the x - coordinate and 4 to the y - coordinate of (3, 1). The purpose
    of the game is to arrive first at (10, 10) without overshooting, i.e., neither the abscissa nor
    the ordinate can be greater than 10. Also, a counter should not coincide with the position held
    by another counter. For example, if the first player’s counter moves on to a point already
    occupied by the counter of the second player, then the second player’s counter goes to (0, 0).
    If a move is not possible without overshooting, the player misses that turn. You can extend this
    game to play with more friends.
- id: "3.13"
  kind: text
  page: 15
  text: >-
    Remark : Plotting of points in the Cartesian plane can be compared to some extent with drawing
    of graphs in different situations such as Time-Distance Graph, Side-Perimeter Graph, etc which
    you have come across in earlier classes. In such situations, we may call the axes, t-axis,
    d-axis, s-axis or p-axis, etc. in place of the x and y axes.
