- id: "3"
  kind: section
  page: 11
  number: "3.3"
  text: Plotting a Point in the Plane if its Coordinates are Given
- id: "3.1"
  kind: text
  page: 11
  text: >-
    Uptil now we have drawn the points for you, and asked you to give their coordinates. Now we will
    show you how we place these points in the plane if we know its coordinates. We call this process
    “plotting the point”.
- id: "3.2"
  kind: text
  page: 11
  text: >-
    Let the coordinates of a point be (3, 5). We want to plot this point in the coordinate plane. We
    draw the coordinate axes, and choose our units such that one centimetre represents one unit on
    both the axes. The coordinates of the point (3, 5) tell us that the distance of this point from
    the y - axis along the positive x - axis is 3 units and the distance of the point from the x -
    axis along the positive y - axis is 5 units. Starting from the origin O, we count 3 units on the
    positive x - axis and mark the corresponding point as A. Now, starting from A, we move in the
    positive direction of the y - axis and count 5 units and mark the corresponding point as P (see
    Fig.3.15). You see that the distance of P from the y - axis is 3 units and from the x - axis is
    5 units. Hence, P is the position of the point. Note that P lies in the 1st quadrant, since both
    the coordinates of P are positive. Similarly, you can plot the point Q (5, − 4) in the
    coordinate plane. The distance of Q from the x - axis is 4 units along the negative y - axis, so
    that its y - coordinate is − 4 (see Fig.3.15). The point Q lies in the 4th quadrant. Why?
- id: "3.3"
  kind: figure
  page: 12
  number: Fig. 3.15
  text: X′, X, Y, Y′, O, A, B, P (3, 5), Q (5, − 4)
  crop: [115, 252, 388, 523]
