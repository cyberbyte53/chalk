- id: "2.25"
  kind: text
  page: 9
  text: >-
    Since every point on the x - axis has no distance (zero distance) from the x - axis, therefore,
    the y - coordinate of every point lying on the x - axis is always zero. Thus, the coordinates of
    any point on the x - axis are of the form (x, 0), where x is the distance of the point from the
    y - axis. Similarly, the coordinates of any point on the y - axis are of the form (0, y), where
    y is the distance of the point from the x - axis. Why?
- id: "2.26"
  kind: text
  page: 9
  text: >-
    What are the coordinates of the origin O? It has zero distance from both the axes so that its
    abscissa and ordinate are both zero. Therefore, the coordinates of the origin are (0, 0).
- id: "2.27"
  kind: text
  page: 9
  text: >-
    In the examples above, you may have observed the following relationship between the signs of the
    coordinates of a point and the quadrant of a point in which it lies. (i) If a point is in the
    1st quadrant, then the point will be in the form (+, +), since the 1st quadrant is enclosed by
    the positive x - axis and the positive y - axis. (ii) If a point is in the 2nd quadrant, then
    the point will be in the form (−, +), since the 2nd quadrant is enclosed by the negative x -
    axis and the positive y - axis. (iii) If a point is in the 3rd quadrant, then the point will be
    in the form (−, −), since the 3rd quadrant is enclosed by the negative x - axis and the negative
    y - axis. (iv) If a point is in the 4th quadrant, then the point will be in the form (+, −),
    since the 4th quadrant is enclosed by the positive x - axis and the negative y - axis (see Fig.
    3.13).
