- id: "1.10"
  kind: text
  page: 3
  text: >-
    In the discussion above, you observe that position of any object lying in a plane can be
    represented with the help of two perpendicular lines. In case of ‘dot’, we require distance of
    the dot from bottom line as well as from left edge of the paper. In case of seating plan, we
    require the number of the column and that of the row. This simple idea has far reaching
    consequences, and has given rise to a very important branch of Mathematics known as Coordinate
    Geometry. In this chapter, we aim to introduce some basic concepts of coordinate geometry. You
    will study more about these in your higher classes. This study was initially developed by the
    French philosopher and mathematician René Déscartes.
- id: "1.11"
  kind: text
  page: 3
  text: >-
    René Déscartes, the great French mathematician of the seventeenth century, liked to lie in bed
    and think! One day, when resting in bed, he solved the problem of describing the position of a
    point in a plane. His method was a development of the older idea of latitude and longitude. In
    honour of Déscartes, the system used for describing the position of a point in a plane is also
    known as the Cartesian system.
