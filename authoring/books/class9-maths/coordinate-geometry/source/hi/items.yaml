  text: कार्तीय पद्धति
- id: "2.1"
  kind: text
  page: 5
  text: >-
    ‘संख्या पद्धति’ के अध्याय में आप संख्या रेखा के बारे में पढ़ चुके हैं। संख्या रेखा पर एक नियत
    बिन्दु से दूरियों को बराबर एककों में एक दिशा में धनात्मक और दूसरी दिशा में ऋणात्मक अंकित किया
    जाता है। उस बिन्दु को, जहाँ से दूरियाँ अंकित की जाती हैं, मूल-बिन्दु (origin) कहा जाता है। एक
    रेखा पर समान दूरियों पर बिन्दुओं को अंकित करके, हम संख्या रेखा का प्रयोग संख्याओं को निरूपित
    करने के लिए करते हैं। यदि एक एकक दूरी संख्या ‘1’ को निरूपित करती हो, तो 3 एकक दूरी संख्या ‘3’ को
    निरूपित करेगी, जहाँ 'O' मूलबिन्दु है। मूलबिन्दु से धनात्मक दिशा में दूरी r पर स्थित बिन्दु
    संख्या r को निरूपित करती है। मूलबिन्दु से ऋणात्मक दिशा में दूरी r पर स्थित बिन्दु संख्या −r को
    निरूपित करती है। संख्या रेखा पर विभिन्न संख्याओं के स्थान आकृति 3.5 में दिखाए गए हैं।
