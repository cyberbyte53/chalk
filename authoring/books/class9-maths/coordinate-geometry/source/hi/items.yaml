  text: >-
    (बैठने की योजना) : सभी मेज़ों को एक साथ खींचकर अपनी कक्षा में बैठने की एक योजना बनाइए। प्रत्येक
    मेज़ को एक वर्ग से निरूपित कीजिए। प्रत्येक वर्ग में उस विद्यार्थी का नाम लिखिए जिस पर वह बैठता
    है और जिसे वह वर्ग निरूपित करता है। कक्षा में प्रत्येक विद्यार्थी की स्थिति का ठीक-ठीक निर्धारण
    निम्नलिखित दो सूचनाओं की सहायता से किया जाता है। (i) वह स्तंभ जिसमें वह बैठता / बैठती है। (ii)
    वह पंक्ति जिसमें वह बैठता / बैठती है। यदि आप उस मेज़ पर बैठते हैं जो 5वें स्तंभ और तीसरी पंक्ति
    में है, जिसे आकृति 3.3 में छायित वर्ग से दिखाया गया है, तो आपकी स्थिति को (5, 3) के रूप में
    व्यक्त किया जा सकता है, जहाँ पहली संख्या स्तंभ संख्या को प्रकट करती है और दूसरी संख्या पंक्ति
    संख्या को प्रकट करती है। क्या यह वही है जो कि (3, 5) है? आप अपनी कक्षा के अन्य विद्यार्थियों के
    नाम और उनके बैठने की स्थितियाँ लिखें। उदाहरण के लिए, यदि सोनिया चौथे स्तंभ और पहली पंक्ति में
    बैठती है, तो उसके लिए S(4, 1) लिखिए। शिक्षक की मेज़ आपके बैठने की योजना के अंतर्गत नहीं आती है।
    यहाँ हम शिक्षक को केवल एक प्रेक्षक ही मानते हैं।
