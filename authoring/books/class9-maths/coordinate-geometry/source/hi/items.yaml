    बिन्दु, जहाँ X′X और Y′Y एक-दूसरे को काटती हैं, उसे मूलबिन्दु (origin) कहा जाता है और इसे O से
    प्रकट किया जाता है। क्योंकि धनात्मक संख्याएँ OX और OY की दिशाओं में स्थित हैं, इसलिए OX और OY को
    क्रमशः x-अक्ष और y-अक्ष की धनात्मक दिशाएँ कहा जाता है। इसी प्रकार, OX′ और OY′ को x-अक्ष और
    y-अक्ष की क्रमशः ऋणात्मक दिशाएँ कहा जाता है।
