  text: >-
    (सड़क योजना) : एक नगर में दो मुख्य सड़कें हैं, जो नगर के केन्द्र पर मिलती हैं। ये दो सड़कें
    उत्तर-दक्षिण की दिशा और पूर्व-पश्चिम की दिशा में हैं। नगर की अन्य सभी सड़कें इन मुख्य सड़कों के
    समांतर परस्पर 200 मीटर की दूरी पर हैं। प्रत्येक दिशा में लगभग पाँच सड़कें हैं। 1 सेंटीमीटर = 200
    मीटर का पैमाना लेकर अपनी नोट बुक में नगर का एक मॉडल बनाइए। सड़कों को एकल रेखाओं से निरूपित
    कीजिए। आपके मॉडल में एक-दूसरे को काटती हुई अनेक क्रॉस-स्ट्रीट (चौराहे) हो सकती हैं। एक विशेष
    क्रॉस-स्ट्रीट दो सड़कों से बनी है, जिनमें से एक उत्तर-दक्षिण दिशा में जाती है और दूसरी
    पूर्व-पश्चिम की दिशा में। प्रत्येक क्रॉस-स्ट्रीट का निर्देशन इस प्रकार किया जाता है: यदि दूसरी
    सड़क उत्तर-दक्षिण दिशा में जाती है और पाँचवीं सड़क पूर्व-पश्चिम दिशा में जाती है और ये एक
    क्रॉसिंग पर मिलती हैं, तब इसे हम क्रॉस-स्ट्रीट (2, 5) कहेंगे। इसी परंपरा से यह ज्ञात कीजिए कि
    (i) कितनी क्रॉस-स्ट्रीटों को (4, 3) माना जा सकता है। (ii) कितनी क्रॉस-स्ट्रीटों को (3, 4) माना
    जा सकता है।
