    What’s the good of Mercator’s North Poles and Equators, Tropics, Zones and Meridian Lines? So
    the Bellman would cry; and crew would reply ‘They are merely conventional signs!’ (मरकेटर के
    उत्तरी ध्रुवों और विषुवत वृत्तों, उष्ण कटिबंधों, मंडलों और यामोत्तर रेखाओं में क्या अच्छाई है?
    इसलिए बेलमैन ने शोर मचाया होगा और नाविक दल ने उत्तर दिया होगा, “ये केवल परंपरागत चिह्न हैं”।)
    LEWIS CARROLL, The Hunting of the Snark
