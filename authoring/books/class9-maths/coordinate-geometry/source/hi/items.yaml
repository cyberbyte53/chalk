  text: >-
    ऊपर की चर्चा में आपने यह देखा है कि एक तल पर रखी हुई किसी वस्तु की स्थिति दो लंब रेखाओं की
    सहायता से निरूपित की जा सकती है। यदि वस्तु एक बिन्दु है, तो हमें सबसे नीचे वाली रेखा से और कागज
    की बायीं कोर से बिन्दु की दूरी ज्ञात होना आवश्यक होता है। “बैठने की योजना” के संबंध में हमें
    स्तंभ की संख्या और पंक्ति की संख्या का जानना आवश्यक होता है। इस सरल विचारधारा के दूरगामी परिणाम
    होते हैं और इससे गणित की निर्देशांक ज्यामिति (Coordinate Geometry) नामक एक अति महत्वपूर्ण शाखा
    की व्युत्पत्ति हुई। इस अध्याय में, हमारा लक्ष्य निर्देशांक ज्यामिति की कुछ आधारभूत संकल्पनाओं से
    आपको परिचित कराना है। इसके बारे में आप विस्तार से अध्ययन उच्च कक्षाओं में करेंगे। प्रारंभ में
    फ्रांसीसी दार्शनिक और गणितज्ञ रेने दकार्ते ने इस अध्ययन को विकसित किया था।
- id: "1.11"
  kind: text
  page: 4
  text: >-
    कुछ लोग प्रातःकाल में बिस्तर पर लेटे रहना पसंद करते हैं। यही आदत सत्रहवीं शताब्दी के महान
    फ्रांसीसी गणितज्ञ रेने दकार्ते की थी। परन्तु वह आलसी व्यक्ति नहीं था, वह यह समझता था कि बिस्तर
    पर पड़े-पड़े ही अधिक चिंतन किया जा सकता है। एक दिन जबकि वह अपने बिस्तर पर लेटे-लेटे आराम कर रहा
    था, उसने एक तल में एक बिन्दु की स्थिति का निर्धारण करने से संबंधित समस्या का हल ढूँढ़ निकाला।
    जैसाकि आप देखेंगे उसकी विधि अक्षांश और देशांतर की पुरानी विचारधारा की ही एक विकसित रूप थी। एक तल
    की एक बिन्दु की स्थिति का निर्धारण करने में प्रयुक्त पद्धति को दकार्ते के सम्मान में कार्तीय
    पद्धति (Cartesian System) भी कहा जाता है।
