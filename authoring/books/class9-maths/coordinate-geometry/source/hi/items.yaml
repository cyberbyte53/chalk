    I. आकृति 3.1 में एक मुख्य मार्ग है जो पूर्व से पश्चिम की ओर जाता है और इस पर कुछ सड़कें बनी हैं,
    इनकी सड़क (मार्ग) संख्याएँ पश्चिम से पूर्व की ओर दी गई हैं। प्रत्येक सड़क (मार्ग) पर बने मकानों
    पर संख्याएँ अंकित कर दी गई हैं। आपको यहाँ अपनी सहेली के मकान का पता लगाना है। क्या इसके लिए केवल
    एक निर्देश-बिन्दु का ज्ञात होना पर्याप्त होगा? उदाहरण के लिए, यदि हमें केवल यह ज्ञात हो कि वह
    सड़क 2 पर रहती है तो क्या हम उसके घर का पता सरलता से लगा सकते हैं? उतनी सरलता से नहीं जितनी
    सरलता से तब जबकि हमें दो जानकारियाँ अर्थात् सड़क की वह संख्या जिस पर उसका मकान है और मकान की
    संख्या ज्ञात होने पर होती है। यदि आप उस मकान पर जाना चाहते हैं जो सड़क 2 पर स्थित है और जिसकी
    संख्या 5 है, तो सबसे पहले आपको यह पता लगाना होगा कि सड़क 2 कौन-सी है और तब उस मकान का पता लगाना
    होता है जिसकी संख्या 5 है। आकृति 3.1 में H इसी मकान का स्थान दर्शाता है। इसी प्रकार, P उस मकान
    को दर्शाता है जो सड़क संख्या 7 पर है और जिसकी संख्या 4 है।
