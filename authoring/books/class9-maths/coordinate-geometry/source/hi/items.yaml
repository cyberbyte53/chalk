  number: "3.3"
  text: तल में एक बिन्दु आलेखित करना जबकि इसके निर्देशांक दिए हुए हों
- id: "3.1"
  kind: text
  page: 14
  text: >-
    अभी तक हमने आपके लिए बिन्दु खींचे हैं और आपसे उनके निर्देशांक बताने के लिए कहा है। अब हम आपको यह
    दर्शाएँगे कि तल में इन बिन्दुओं को किस प्रकार अंकित करते हैं जबकि इनके निर्देशांक हमें ज्ञात
    हों। इस प्रक्रम को हम “बिन्दु का आलेखन” (plotting the point) कहते हैं।
- id: "3.2"
  kind: text
  page: 14
  text: >-
    मान लीजिए एक बिन्दु के निर्देशांक (3, 5) हैं। हम इस बिन्दु को निर्देशांक तल में आलेखित करना
    चाहते हैं। हम निर्देशांक अक्ष खींचते हैं और अपने एककों का चयन इस प्रकार करते हैं कि दोनों अक्षों
    पर एक सेंटीमीटर एक एकक को निरूपित करता हो। बिन्दु (3, 5) के निर्देशांक से हमें यह पता चलता है कि
    धनात्मक x-अक्ष पर इस बिन्दु की y-अक्ष से दूरी 3 एकक है और धनात्मक y-अक्ष पर इस बिन्दु की x-अक्ष
    से दूरी 5 एकक है। मूलबिन्दु O से प्रारंभ करके हम धनात्मक x-अक्ष पर 3 एकक की गिनती करते हैं और
    संगत बिन्दु को A के रूप में अंकित करते हैं। अब A से प्रारंभ करके हम y-अक्ष की धनात्मक दिशा में
    चलते हैं और 5 एकक की गिनती करते हैं तथा संगत बिन्दु को P के रूप में अंकित करते हैं (देखिए आकृति
    3.15)। आप यहाँ यह देखते हैं कि y-अक्ष से P की दूरी 3 एकक है और x-अक्ष से 5 एकक है। अतः P
    विचाराधीन बिन्दु की स्थिति है। ध्यान दीजिए कि P पहले चतुर्थांश में स्थित है, क्योंकि P के दोनों
    निर्देशांक धनात्मक हैं। इसी प्रकार आप निर्देशांक तल में बिन्दु Q (5, −4) आलेखित कर सकते हैं।
    ऋणात्मक y-अक्ष के अनुदिश x-अक्ष से Q की दूरी 4 एकक है जिससे कि इसका y-निर्देशांक −4 है (देखिए
    आकृति 3.15)। बिन्दु Q चौथे चतुर्थांश में स्थित है। क्यों?
