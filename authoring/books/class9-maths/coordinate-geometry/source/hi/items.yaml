  number: क्रियाकलाप 2
  text: >-
    दो व्यक्तियों का एक खेल। (आवश्यक वस्तुएँ - दो काउंटर या सिक्के, ग्राफ पेपर, अलग-अलग रंगों के दो
    पासे, मान लीजिए लाल और हरे रंग के दो पासे)। प्रत्येक काउंटर को (0, 0) पर रखिए। प्रत्येक खिलाड़ी
    एक साथ दो पासे फेंकती हैं। जब पहली खिलाड़ी ऐसा करती है, तो मान लीजिए लाल पासे पर 3 आता है और हरे
    पासे पर 1 आता है। अतः वह अपना काउंटर (3, 1) की ओर ले जाती है। इसी प्रकार, यदि दूसरी खिलाड़ी लाल
    पर 2 और हरे पर 4 फेंकती है, तो वह अपना काउंटर (2, 4) की ओर ले जाती है। दूसरी बार फेंकने पर यदि
    पहली खिलाड़ी लाल पर 1 और हरे पर 4 फेंकती है, तो वह अपना काउंटर (3, 1) से (3 + 1, 1 + 4) की ओर ले
    जाती है। अर्थात् (3, 1) के x-निर्देशांक में 1 जोड़ देती है और y-निर्देशांक में 4 जोड़ देती है।
    इस खेल का उद्देश्य सीमा लाँघे बिना पहले (10, 10) पर पहुँचना है, अर्थात् न तो भुज और न ही कोटि 10
    से अधिक हो सकती है। ध्यान रहे कि एक काउंटर की स्थिति दूसरे काउंटर की स्थिति के साथ संपाती नहीं
    होनी चाहिए। उदाहरण के लिए, यदि पहली खिलाड़ी का काउंटर उस बिन्दु की ओर गतिमान होता है जहाँ पहले
    से ही दूसरी खिलाड़ी का काउंटर स्थित है, तो दूसरी खिलाड़ी का काउंटर (0, 0) पर आ जाएगा। यदि सीमा
    लाँघे बिना चाल चलना संभव नहीं है, तो खिलाड़ी से वह बारी छूट जाती है। इस खेल को अधिक संख्या में
    अपनी सहेलियों को लेकर आप खेल सकती हैं।
- id: "3.13"
  kind: text
  page: 17
  text: >-
    टिप्पणी : कार्तीय तल में बिन्दुओं के आलेखन की तुलना कुछ सीमा तक समय-दूरी ग्राफ, भुजा-परिमाप
    ग्राफ, आदि जिनका अध्ययन आप पिछली कक्षाओं में कर चुके हैं, जैसी विभिन्न स्थितियों से की जा सकती
    है। ऐसी स्थिति में, x-अक्ष और y-अक्ष के स्थान पर अक्षों को t-अक्ष, d-अक्ष, s-अक्ष या p-अक्ष आदि
    कह सकते हैं।
