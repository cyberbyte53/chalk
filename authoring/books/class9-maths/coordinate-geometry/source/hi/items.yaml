    II. मान लीजिए आप एक कागज की शीट पर एक बिन्दु लगा देते हैं [आकृति 3.2 (a)]। यदि हम आपसे कागज़ पर
    लगे बिन्दु की स्थिति के बारे में पूछें, तो आप इसे कैसे बताएँगे? संभवतः आप इस प्रश्न का उत्तर इस
    प्रकार दें : “बिन्दु कागज़ के आधे के ऊपरी भाग में स्थित है” या “यह भी कह सकते हैं कि यह बिन्दु
    कागज़ की बायीं कोर के निकट स्थित है” या “यह बिन्दु कागज़ की बायीं ओर के ऊपरी कोने के काफी निकट
    स्थित है।” क्या ऊपर दिए गए कथनों में से किसी भी कथन के आधार पर आप बिन्दु की ठीक-ठीक स्थिति बता
    सकते हैं? स्पष्ट है कि उत्तर “नहीं” है। परन्तु, यदि आप यह कहें कि “बिन्दु कागज़ की बायीं कोर से
    लगभग 5 cm दूर है, तो इससे आपको बिन्दु की स्थिति का आभास तो हो जाता है फिर भी ठीक-ठाक स्थिति का
    पता नहीं चलता। थोड़ा बहुत सोच-विचार के बाद आप यह कह सकते हैं कि सबसे नीचे वाली रेखा से बिन्दु 9
    cm की दूरी पर है। अब हम बिन्दु की स्थिति ठीक-ठाक बता सकते हैं।
