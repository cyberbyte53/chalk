  number: "3.4"
  text: सारांश
- id: "4.1"
  kind: text
  page: 18
  text: "इस अध्याय में, आपने निम्नलिखित बिन्दुओं का अध्ययन किया है:"
- id: "4.2"
  kind: text
  page: 18
  text: >-
    1. एक तल में एक वस्तु या एक बिन्दु का स्थान निर्धारण करने के लिए दो लांबिक रेखाओं की आवश्यकता
    होती है जिसमें एक क्षैतिज होती है और दूसरी ऊर्ध्वाधर होती है।
- id: "4.3"
  kind: text
  page: 18
  text: 2. तल को कार्तीय या निर्देशांक तल कहा जाता है और रेखाओं को निर्देशांक अक्ष कहा जाता है।
- id: "4.4"
  kind: text
  page: 18
  text: 3. क्षैतिज रेखा को x-अक्ष और ऊर्ध्वाधर रेखा को y-अक्ष कहा जाता है।
- id: "4.5"
  kind: text
  page: 18
  text: 4. निर्देशांक अक्ष तल को चार भागों में बाँट देते हैं, जिन्हें चतुर्थांश कहा जाता है।
- id: "4.6"
  kind: text
  page: 18
  text: 5. अक्षों के प्रतिच्छेद बिन्दु को मूलबिन्दु कहा जाता है।
- id: "4.7"
  kind: text
  page: 18
  text: >-
    6. y-अक्ष से किसी बिन्दु की दूरी को उसका x-निर्देशांक या भुज कहा जाता है। साथ ही, x-अक्ष से
    बिन्दु की दूरी को y-निर्देशांक या कोटि कहा जाता है।
- id: "4.8"
  kind: text
  page: 18
  text: 7. यदि एक बिन्दु का भुज x हो और कोटि y हो, तो (x, y) को बिन्दु के निर्देशांक कहा जाता है।
- id: "4.9"
  kind: text
  page: 18
  text: >-
    8. x-अक्ष पर एक बिन्दु के निर्देशांक (x, 0) के रूप के होते हैं और y-अक्ष पर बिन्दु के निर्देशांक
    (0, y) के रूप के होते हैं।
- id: "4.10"
  kind: text
  page: 18
  text: 9. मूलबिन्दु के निर्देशांक (0, 0) होते हैं।
- id: "4.11"
  kind: text
  page: 18
  text: >-
    10. एक बिन्दु के निर्देशांक पहले चतुर्थांश में (+, +) के रूप के दूसरे चतुर्थांश में (−, +) के
    रूप के, तीसरे चतुर्थांश में (−, −) के रूप के और चौथे चतुर्थांश में (+, −) के रूप के होते हैं,
    जहाँ + एक धनात्मक वास्तविक संख्या को और − एक ऋणात्मक वास्तविक संख्या को प्रकट करते हैं।
- id: "4.12"
  kind: text
  page: 18
  text: 11. यदि x ≠ y हो, तो (x, y) ≠ (y, x) होगा और यदि x = y हो, तो (x, y) = (y, x) होगा।
