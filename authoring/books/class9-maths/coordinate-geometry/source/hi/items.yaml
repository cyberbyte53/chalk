    आप यह पढ़ चुके हैं कि एक संख्या रेखा पर एक बिन्दु का स्थान निर्धारण किस प्रकार किया जाता है। आप
    यह भी पढ़ चुके हैं कि एक रेखा पर एक बिन्दु की स्थिति की व्याख्या किस प्रकार की जाती है। ऐसी अनेक
    स्थितियाँ हैं जिनमें एक बिन्दु ज्ञात करने के लिए हमें एक से अधिक रेखाओं के संदर्भ में उसकी
    स्थिति की व्याख्या करनी होती है। उदाहरण के लिए, निम्नलिखित स्थितियों पर विचार कीजिए:
