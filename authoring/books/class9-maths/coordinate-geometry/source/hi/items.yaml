    दकार्ते ने एक तल पर एक दूसरे पर लंब दो रेखाओं को खींचने और इन रेखाओं के सापेक्ष तल पर बिन्दुओं
    का स्थान निर्धारण करने का विचार प्रस्तुत किया। लंब रेखाएँ किसी भी दिशा में हो सकती हैं, जैसा कि
    आकृति 3.6 में दिखाया गया है। लेकिन जब हम इस अध्याय में एक तल में स्थित एक बिन्दु का स्थान
    निर्धारण करने के लिए दो रेखाएँ लेंगे, तो एक रेखा क्षैतिज होगी और दूसरी रेखा ऊर्ध्वाधर, जैसा कि
    आकृति 3.6 (c) में दिखाया गया है।
