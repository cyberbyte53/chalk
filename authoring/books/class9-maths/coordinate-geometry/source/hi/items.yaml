- id: "3.7"
  kind: text
  page: 16
  text: >-
    नोट : ऊपर दिए गए उदाहरण में हम यह देखते हैं कि (5, 0) और (0, 5) समान नहीं हैं। इसी प्रकार, (5,
    2) और (2, 5) अलग-अलग स्थितियाँ हैं और (−3, 5) और (5, −3) भिन्न-भिन्न स्थितियाँ हैं। इसी प्रकार
    के अनेक उदाहरण लेने पर आप यह देखेंगे कि यदि x ≠ y हो, तो कार्तीय तल में (x, y) की स्थिति (y, x)
    की स्थिति से भिन्न होती है। अतः यदि हम निर्देशांकों x और y में अदला-बदली करें, तो (y, x) की
    स्थिति (x, y) की स्थिति से भिन्न हो जाएगी। इससे यह अर्थ निकलता है कि (x, y) में x और y के क्रम
    का काफी महत्व होता है। अतः (x, y) को क्रमित युग्म (ordered pair) कहा जाता है। क्रमित युग्म (x,
    y) ≠ क्रमित युग्म (y, x), यदि x ≠ y है और (x, y) = (y, x), यदि x = y है।
