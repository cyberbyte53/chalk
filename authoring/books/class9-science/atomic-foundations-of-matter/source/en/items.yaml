- id: "2.10"
  kind: text
  page: 7
  text: The two laws discussed here formed the basis of Dalton’s Atomic Theory. This theory attempts
    to logically explain why substances combine in fixed proportions and why there is no loss or
    gain of mass during a chemical reaction. Dalton later explained these by proposing that during a
    chemical reaction, atoms are indivisible and merely rearrange, rather than being created or
    destroyed.
- id: "3"
  kind: section
  page: 7
  number: "9.3"
  title: Dalton’s Atomic Theory
  text: 9.3 Dalton’s Atomic Theory
- id: "3.1"
  kind: text
  page: 7
  text: John Dalton proposed his atomic theory in terms of certain postulates. These postulates
    combined earlier experimental observations and served as the basis for modern scientific theory.
    A postulate is a fundamental assumption accepted as truth without formal proof from which
    further ideas are formed or developed.
- id: "3.2"
  kind: text
  page: 7
  text: "John Dalton postulated that: All matter is made up of very tiny particles called atoms, which
    participate in chemical reactions. Atoms are indivisible particles, which cannot be created or
    destroyed in a chemical reaction. Atoms of a given element are identical in mass and chemical
    properties. Atoms of different elements have different masses and chemical properties. Atoms
    combine in the ratio of simple whole numbers to form compounds. The relative number and kinds of
    atoms are constant in a given compound."
- id: "3.3"
  kind: text
  page: 7
  text: Dalton’s postulates provide the basis for the modern understanding of atoms and their behaviour.
- id: "3.4"
  kind: box
  page: 7
  title: Meet a Scientist
  text: Meet a Scientist John Dalton was born in England. In 1793, Dalton moved to Manchester to teach
    mathematics, physics and chemistry at a college. He spent most of his life teaching and
    researching there. In 1808, he presented his atomic theory, which proved to be a turning point
    in the study of matter.
- id: "3.5"
  kind: text
  page: 7
  text: For example, hydrogen and oxygen atoms combine to form water, but the atoms themselves are not
    destroyed or changed into something else. Similarly, when magnesium burns in air, a white powder
    of magnesium oxide forms. This shows that the atoms of magnesium have combined with those of
    oxygen to form magnesium oxide.
- id: "3.6"
  kind: box
  page: 7
  title: Pause and Ponder
  text: "Pause and Ponder 7. Assertion (A): 2 g of hydrogen combines with 16 g of oxygen to form 18 g
    of water. Reason (R): According to Dalton’s Atomic Theory, atoms combine in a simple whole
    number ratio by mass to form compounds. Choose the correct option: (i) Both A and R are true,
    and R is the correct explanation of A. (ii) Both A and R are true, but R is not the correct
    explanation of A. (iii) A is true, but R is false. (iv) A is false, but R is true."
- id: "3.7"
  kind: text
  page: 7
  text: Later, scientists discovered how atoms combine to form molecules. Let us explore further!
- id: "4"
  kind: section
  page: 8
  number: "9.4"
  title: How Atoms Combine?
  text: 9.4 How Atoms Combine?
- id: "4.1"
  kind: text
  page: 8
  text: Atoms of an element can combine to form a molecule of that element. For example, a hydrogen
    molecule consists of two hydrogen atoms. Atoms of different elements combine to form a molecule
    of a compound. For example, one hydrogen atom and one chlorine atom combine to form a molecule
    of hydrogen chloride. A molecule can be defined as an electrically neutral entity consisting of
    more than one atom that is capable of independent existence and shows all the properties of that
    substance. It should also be remembered that some elements, such as helium, exist only as atoms
    because its atoms are stable.
- id: "4.2"
  kind: text
  page: 8
  text: "In Chapter 8, Journey Inside the Atom, you learnt that atoms with 8 electrons in the
    outermost (valence) shell (2 electrons if the K-shell is the outermost shell) are stable. If the
    number of electrons in a valence shell is less than eight, then they may share, gain or lose
    electrons to complete their valence shell and become stable. In this process, atoms of elements
    combine to form compounds. This generally takes place in two ways. These are: Sharing of
    electrons — Share a few or all of their valence electrons with another atom. Transfer of
    electrons — Transfer one or more of the valence electrons to another atom, or accept one or more
    electrons from some other atom."
- id: "4.3"
  kind: text
  page: 8
  text: When atoms combine, the total energy of the system becomes lower than the sum of the energies
    of the individual atoms, making the resulting arrangement more stable. The force that holds
    atoms together is called a chemical bond. Let us explore it further.
- id: "4.4"
  kind: section
  page: 8
  number: 9.4.1
  title: Bonding by sharing of electrons — Covalent Bond
  text: 9.4.1 Bonding by sharing of electrons — Covalent Bond
- id: "4.4.1"
  kind: heading
  page: 8
  title: A. Molecules of elements
  text: A. Molecules of elements
- id: "4.4.2"
  kind: text
  page: 8
  text: Let us understand the formation of molecules of elements by the sharing of electrons, as
    described below.
- id: "4.4.3"
  kind: text
  page: 8
  text: "Consider the formation of a hydrogen molecule: Write the electronic configuration of hydrogen
    (atomic number 1). It has only one electron in the K-shell. Since, a K-shell can have a total of
    two electrons, it needs one more electron to become stable."
- id: "4.4.4"
  kind: figure
  page: 8
  number: "Fig. 9.6:"
  text: "+ Hydrogen atom Hydrogen atom Hydrogen molecule Fig. 9.6: Formation of a hydrogen molecule"
  crop: [338.5, 502.2, 590.4, 590.2]
  made:
    - {box: true, by: figure-snap}
- id: "4.4.5"
  kind: text
  page: 8
  text: Thus, a hydrogen atom shares one electron with another hydrogen atom to form a hydrogen
    molecule (H₂), as shown in Fig. 9.6. The shared pair of electrons attracts both the nuclei and
    makes the molecule stable. This type of interaction between atoms through a shared pair of
    electrons is called a covalent bond. If two atoms are joined by sharing one electron each, they
    are said to be joined by a single bond.
  made:
    - {words: L42.7-L44.1, by: agent}
- id: "4.4.6"
  kind: text
  page: 8
  text: This is generally depicted by drawing a single line between the symbols of the two atoms as H—H.
- id: "4.4.7"
  kind: text
  page: 8
  text: Let us take the case of a chlorine molecule.
- id: "4.4.8"
  kind: box
