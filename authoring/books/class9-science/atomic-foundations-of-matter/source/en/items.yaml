- id: "4.5.8"
  kind: text
  page: 12
  text: Cations and anions are collectively called ions. Once the sodium and chloride ions are formed,
    they are held together by the electrostatic force of attraction due to their opposite charges
    (Fig. 9.13). The electrostatic force of attraction between oppositely charged ions that holds
    them together is called an ionic bond.
