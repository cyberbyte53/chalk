  title: Bonding by electron transfer — Ionic bond
  text: 9.4.2 Bonding by electron transfer — Ionic bond
- id: "4.5.1"
  kind: text
  page: 11
  text: If the valence shell of an atom has less than four electrons, it would generally donate its
    valence electrons to achieve a stable electronic configuration. Identify four such elements
    among the first 18 elements by using their electronic configurations given in Table 8.4 of the
    Chapter 8, Journey Inside the Atom. Atoms with more than 4 valence electrons usually gain or
    share electrons to complete an octet.
- id: "4.5.2"
  kind: text
  page: 11
  text: You are familiar with sodium chloride (common salt), whose chemical formula is NaCl. Let us
    take the bonding in NaCl as an example.
- id: "4.5.3"
  kind: text
  page: 11
  text: The atomic number of sodium is 11. Its valence shell contains only one electron, which can
    attain a stable electronic configuration after losing this valence electron. Will it still be
    neutral after losing one electron? If not, what charge would it carry and why?
- id: "4.5.4"
  kind: text
  page: 11
  text: When sodium atom (Fig. 9.11a) loses its valence electron, it becomes a positively charged
    species, called a sodium cation, represented as Na⁺ (Fig. 9.11b). It is so because it would have
    11 protons and 10 electrons.
  made:
    - {words: L60.11-12, by: agent}
