- id: "4.4.28"
  kind: box
  page: 10
  title: Bridging Science and Society
  text: Bridging Science and Society Atoms can release enormous energy when their nuclei split or
    combine to form new elements. This is called atomic or nuclear energy, and it plays a vital role
    in modern life. Beyond electricity generation, it is used in medicine, scientific research and
    space exploration. In nuclear power plants, the thermal energy from nuclear reactions produces
    steam that drives turbines and generates electricity, a cleaner alternative to fossil fuels. In
    India, scientists like Raja Ramanna (often called the Father of the Indian Nuclear Programme)
    made significant contributions in developing the nation’s Nuclear Energy Programme and promoting
    its peaceful use for development.
- id: "4.4.29"
  kind: heading
  page: 10
  title: C. Naming covalent compounds
  text: C. Naming covalent compounds
- id: "4.4.30"
  kind: text
  page: 10
  text: Covalent compounds are named by indicating the number of atoms of each element in the
    compound. To name these compounds, a prefix system is used to indicate the number of atoms of
    each element in the molecule. The first element retains its regular name, while the second
    element ends in -ide. Prefixes, such as mono- (1), di- (2), tri- (3), tetra- (4), penta- (5),
    hexa- (6), etc., indicate the number of atoms. However, mono- is usually omitted for the first
    element but is used for the second element. If a prefix ends with ‘o’ or ‘a’ and the element
    starts with a vowel, drop the last vowel (for example, monoxide, pentoxide). If the prefix ends
    with ‘i’, keep it for pronunciation (for example, dioxide, trioxide).
- id: "4.4.31"
  kind: heading
  page: 11
  title: Examples
  text: Examples
- id: "4.4.32"
  kind: text
  page: 11
  text: CO is named as carbon monoxide (not monooxide). CO₂ is named as carbon dioxide (not monocarbon
    dioxide). CS₂ is named as carbon disulfide, showing two sulfur atoms. PCl₃ is named as
    phosphorus trichloride, showing three chlorine atoms. SF₆ is named as sulfur hexafluoride,
    showing six fluorine atoms. N₂O₄ is named as dinitrogen tetroxide (not tetraoxide). N₂O₅ is
    named as dinitrogen pentoxide.
  made:
    - {words: L11.2-L12, by: agent}
    - {words: L14.2-L15, by: agent}
    - {words: L17.2-L18, by: agent}
    - {words: L20.2-L21, by: agent}
    - {words: L23.2-L26, by: agent}
    - {words: L28.2-L31, by: agent}
- id: "4.4.33"
  kind: text
  page: 11
  text: When hydrogen is the first element in the formula, no prefix is added before hydrogen,
    irrespective of the number of its atoms. For example, H₂S is named hydrogen sulfide, not
    dihydrogen sulfide.
  made:
    - {words: L34.12-L36, by: agent}
- id: "4.4.34"
  kind: text
  page: 11
  text: A few binary compounds are known only by their common names. For example, H₂O, which would
    usually be named hydrogen monoxide, is commonly known as water. Similarly, NH₃, which is
    actually nitrogen trihydride, is known as ammonia.
  made:
    - {words: L39.3-L41.1, by: agent}
    - {words: L42.7-L44.1, by: agent}
- id: "4.5"
