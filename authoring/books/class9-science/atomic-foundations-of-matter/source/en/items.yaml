  title: Let us investigate a physical change
  text: "Activity 9.1: Let us investigate a physical change 1. Place a clean and dry 100 mL beaker on
    a digital weighing balance. 2. Set the balance reading to zero by pressing the tare or reset
    button. 3. Pour about 50 mL of water into the beaker. 4. Add a spatula full of common salt to
    the water contained in the beaker. 5. Record the reading on the weighing balance (Fig. 9.1a). 6.
    Swirl until the added salt dissolves and record your observations (Fig. 9.1b)."
- id: "0.7"
  kind: text
  page: 2
  text: What do you observe? You may notice that the mass of the solution is equal to the sum of the
    masses of water and salt taken. This shows that there is practically no change in the mass
    during the formation of a solution, which is a physical change. This is true for all physical
    changes. You can repeat the above activity by weighing a piece of paper before and after tearing
    it into pieces, and observe whether its mass changes or not.
