- id: "4.5.6"
  kind: text
  page: 12
  text: On the other hand, the electronic configuration of a chlorine atom shows that it has seven
    valence electrons (Fig. 9.12a). It can attain a stable electronic configuration by gaining one
    electron from another atom. After gaining one extra electron, it acquires a negative charge and
    is called a chloride anion, represented as Cl⁻ (Fig. 9.12b).
