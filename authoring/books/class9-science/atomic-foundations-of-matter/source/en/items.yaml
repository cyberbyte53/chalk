- id: "1.20"
  kind: text
  page: 6
  text: In the above activities, we have used many compounds. Let us learn how these are formed from
    the elements. Let us take an example of water, is there a fixed ratio in which hydrogen can
    combine with oxygen to form it, or can they combine in any ratio? This leads us to another
    important law.
- id: "2"
  kind: section
  page: 6
  number: "9.2"
  title: Law of Constant Proportions
  text: 9.2 Law of Constant Proportions
- id: "2.1"
  kind: text
  page: 6
  text: Soon after Lavoisier, Joseph Proust proposed that in any compound formed by two or more
    elements, the elements combine in a fixed ratio by mass. In other words, elements in a compound
    have definite proportions irrespective of its source. For example, if the water collected from
    various sources, such as rivers, borewells or the ocean, is purified and analysed. It is always
    found to contain hydrogen and oxygen in a mass ratio of 1:8. What does it convey? If 9 g of
    purified water from any source is decomposed, 1 g of hydrogen and 8 g of oxygen are always
    obtained. This proportion is written as 1:8.
- id: "2.2"
  kind: text
  page: 6
  text: This is known as the Law of Constant Proportions, or the Law of Definite Proportions, or
    sometimes as Proust’s Law.
- id: "2.3"
  kind: box
  page: 6
  title: Meet a Scientist
  text: Meet a Scientist Joseph Louis Proust was a prominent French chemist known for his careful
    experimental work. He contributed to the Law of Definite Proportions by showing that chemical
    compounds always contain elements in fixed ratios by mass. For example, Proust studied the
    composition of copper carbonate. He showed that copper carbonate always contains copper, carbon
    and oxygen in the same proportion by mass, no matter how it was prepared or where it was found.
    His work laid an important foundation that helped shape modern chemistry.
- id: "2.4"
  kind: box
  page: 6
  title: Threads of Curiosity
  text: Threads of Curiosity In many ancient civilisations, red pigment derived from rocks was widely
    used in painting and as a colouring agent for various objects. In India, it was known as
    hingula, and in Latin and English, as cinnabar. Over the centuries, it was discovered in many
    civilisations that heating cinnabar could yield two elements — mercury and sulfur in mass
    percentage of around 86.22% and 13.78%, respectively. Interestingly, most civilisations also
    found that grinding mercury and sulfur together in this ratio could form cinnabar, although the
    toxic nature of both prevented this process from becoming widespread.
