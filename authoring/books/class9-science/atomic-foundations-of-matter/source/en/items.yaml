  title: A. Naming ionic compounds
  text: A. Naming ionic compounds
- id: "4.5.16"
  kind: text
  page: 13
  text: In naming ionic compounds, the name of the cation is written first, followed by the name of
    the anion. Names of simple anions end with -ide. Generally, metals form cations and non-metals
    form anions. Ionic compounds are typically formed when metals combine with non-metals, for
    example, sodium chloride, calcium oxide, magnesium sulfide, etc. Some ions are formed by the
    combination of atoms of two or more elements, and are called polyatomic ions. Names of
    polyatomic ions generally do not end with -ide. Names, formulae and valencies of some common
    ions are given in Table 9.1.
