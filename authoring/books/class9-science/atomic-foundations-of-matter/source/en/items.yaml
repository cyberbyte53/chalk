- id: "4.4.23"
  kind: text
  page: 10
  text: Since the hydrogen and chlorine atoms in a hydrogen chloride (HCl) molecule bond by sharing
    electrons, it is a covalent compound. Also, since hydrogen and chlorine atoms share one pair of
    electrons, they are bonded by a single bond and it can be depicted as H—Cl.
  made:
