- id: "4.4.24"
  kind: text
  page: 10
  text: You know that hydrogen and oxygen combine to form water. Hydrogen needs only one electron,
    while oxygen needs two electrons to acquire stable electronic configurations. How can oxygen
    share its two electrons with another atom that requires only one electron? This is achieved by
    two hydrogen atoms sharing an electron each with an oxygen atom, as shown in Fig. 9.10.
