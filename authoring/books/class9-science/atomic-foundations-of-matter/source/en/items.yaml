- id: "6.6"
  kind: text
  page: 17
  text: Ionic compounds like sodium chloride (Fig. 9.16a) and copper sulfate (Fig. 9.16b) are
    generally soluble in water but insoluble in solvents, such as kerosene and petrol. In contrast,
    most covalent compounds, such as camphor (Fig. 9.17a) and naphthalene (Fig. 9.17b) are insoluble
    in water but dissolve in kerosene and petrol.
- id: "6.7"
  kind: text
  page: 17
  text: Ionic compounds do not conduct electricity in the solid state because their ions are held in
    fixed positions by strong forces. To conduct electricity, ions must be free to move, which
    occurs only when the ionic compounds, such as sodium chloride and copper sulfate, are dissolved
    in water. On the other hand, some covalent compounds, such as sugar, are soluble in water but do
    not provide ions in solution; therefore, they do not conduct electricity. Other covalent
    compounds, such as camphor and naphthalene, also do not conduct electricity. Can you give a
    reason?
- id: "6.8"
  kind: text
  page: 17
  text: Predict whether ionic and covalent compounds would conduct electricity in the molten state
    (the melted state of a substance).
- id: "6.9"
  kind: text
  page: 18
  text: Ionic compounds generally have high melting and boiling points due to strong inter-ionic
    attractions, whereas covalent compounds usually have low melting and boiling points.
