- id: "4.5.10"
  kind: box
  page: 12
  title: Threads of Curiosity
  text: Threads of Curiosity Ionic compounds usually do not remain as single units. They form
    three-dimensional (3-D) crystals in which ions are arranged in a repeating pattern. For example,
    in sodium chloride (NaCl), each sodium ion (Na⁺) is surrounded by six chloride ions (Cl⁻), and
    each chloride ion is surrounded by six sodium ions (Fig. 9.14a). These oppositely charged ions
    are arranged in a regular, repeating 3-D pattern known as a crystal structure (Fig. 9.14b). The
    crystal structure is represented as a crystal lattice, with ions depicted as points or dots
    (Fig. 9.14c). It helps to visualise the arrangement of ions in the crystal. You will learn more
    about the crystal structure in higher grades.
  made:
