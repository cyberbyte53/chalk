  number: "9.1"
  title: Law of Conservation of Mass
  text: 9.1 Law of Conservation of Mass
- id: "1.1"
  kind: text
  page: 4
  text: The Activity 9.2 demonstrates that the total mass remains the same before and after a chemical
    reaction. So, matter can neither be created nor destroyed in a chemical reaction. This is known
    as the Law of Conservation of Mass, proposed by Antoine Lavoisier in 1789.
- id: "1.2"
  kind: box
  page: 4
  title: Meet a Scientist
  text: Meet a Scientist Antoine Lavoisier is known as the Father of Modern Chemistry. He proposed the
    Law of Conservation of Mass. This law applies to every chemical reaction. Lavoisier continued to
    study this and proposed that “…in every operation an equal quantity of matter exists both before
    and after the operation”.
- id: "1.3"
  kind: text
  page: 4
  text: Let us consider the reaction between sodium sulfate and barium chloride to further verify this
    law.
- id: "1.4"
  kind: activity
  page: 4
  number: "Activity 9.3:"
  title: Let us verify the law — Group activity
  text: "Activity 9.3: Let us verify the law — Group activity 1. Place two clean and dry 100 mL
    conical flasks on a weighing balance, and mark them A and B. 2. Set the balance reading to zero
    by pressing the tare or reset button. 3. Pour about 10 mL of 1 % m/v sodium sulfate solution
    into the Conical Flask marked A. 4. In the Conical Flask B, pour about 10 mL of 1 % m/v barium
    chloride solution. 5. Leave both Conical Flasks A and B on the weighing balance undisturbed, and
    record the total mass of both the solutions (Fig. 9.4a). 6. Transfer the solution from Conical
    Flask B to Conical Flask A and mix the two solutions carefully. 7. What do you observe? 8. Now,
    place both the Conical Flasks A and B on the weighing balance again as shown in Fig. 9.4b, and
    note the reading. 9. Do you observe any change in the reading after mixing the solutions?"
