  page: 9
  text: Let us explore the bonding in an oxygen molecule.
- id: "4.4.14"
  kind: text
  page: 9
  text: Write down the electronic configuration of the oxygen atom (atomic number 8). You can observe
    that the number of electrons present in its valence shell is six, and it requires two more
    electrons to complete its octet.
- id: "4.4.15"
  kind: text
  page: 9
  text: So, two oxygen atoms share two electrons each, forming an oxygen molecule (O₂), as shown in
    Fig. 9.8.
