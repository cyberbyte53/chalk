  title: B. Molecules of compounds
  text: B. Molecules of compounds
- id: "4.4.19"
  kind: text
  page: 9
  text: In the section 9.4.1A, you learnt about the formation of molecules of elements, where two
    atoms of the same element combine. What happens if atoms of two different elements combine? Let
    us understand by taking an example of the formation of hydrogen chloride molecule.
- id: "4.4.20"
  kind: text
  page: 9
  text: "You can do it by using the following steps: Write the electronic configurations of hydrogen
    and chlorine atoms (atomic number of hydrogen is 1 and chlorine is 17). Calculate the number of
    electrons required by chlorine to complete its octet and by hydrogen to complete its duplet."
- id: "4.4.21"
  kind: text
  page: 10
  text: You must have noticed that atoms of both hydrogen and chlorine need one electron each to
    attain stable electronic configurations. Hence, both the atoms share one electron each to form a
    molecule of hydrogen chloride, as shown in Fig. 9.9.
- id: "4.4.22"
  kind: figure
