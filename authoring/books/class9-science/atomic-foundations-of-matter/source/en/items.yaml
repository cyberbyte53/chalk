- id: "1.14"
  kind: example
  page: 5
  number: "Example 9.1:"
  text: "Example 9.1: In a group activity, students place 4.0 g of calcium carbonate with 2.92 g of
    hydrochloric acid in a closed container. After the reaction is over, they measured 1.76 g of
    carbon dioxide, 0.72 g of water, and 4.44 g of calcium chloride. Verify whether the Law of
    Conservation of Mass is obeyed or not."
- id: "1.15"
  kind: text
  page: 5
  text: "Solution: Mass of calcium carbonate = 4.0 g Mass of hydrochloric acid = 2.92 g Total mass of
    reactants: 4.0 g + 2.92 g = 6.92 g Mass of carbon dioxide = 1.76 g Mass of water = 0.72 g Mass
    of calcium chloride = 4.44 g Total mass of products: 1.76 g + 0.72 g + 4.44 g = 6.92 g Compare
    the total mass of reactants with the total mass of products. Mass of reactants = Mass of
    products Hence, the Law of Conservation of Mass is obeyed."
