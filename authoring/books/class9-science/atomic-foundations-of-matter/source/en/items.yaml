- id: "4.4.9"
  kind: box
  page: 9
  title: Together we are strong …
  text: Together we are strong … Just as atoms share electrons to form covalent bonds, we too, can
    share and care to build strong relationships with people around us. This sharing brings unity
    and stability, laying the foundation for a stronger community, and ultimately, a strong nation.
- id: "4.4.10"
  kind: text
  page: 9
  text: The chlorine atom has seven electrons in its valence shell. Each chlorine atom requires one
    electron to attain a stable electronic configuration. A chlorine molecule is formed by the
    sharing of one electron each by two chlorine atoms, as shown in Fig. 9.7. This shared pair of
    electrons holds the two chlorine atoms together as a molecule.
