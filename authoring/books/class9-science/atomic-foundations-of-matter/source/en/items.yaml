- id: "8.5"
  kind: text
  page: 19
  text: Understanding atoms, molecules and chemical bonding reveals the hidden science behind
    everything we use and consume each day. It shows how tiny atoms combine to build the universe we
    live in!
- id: "8.6"
  kind: box
  page: 19
  title: At a Glance
  text: At a Glance Mass can neither be created nor destroyed in a chemical reaction. This is known as
    the Law of Conservation of Mass. A compound always contains the same elements combined in a
    fixed ratio by mass, no matter how it is formed or from where it is obtained. This is called the
    Law of Definite Proportions. A molecule is defined as an electrically neutral entity consisting
    of more than one atom that can exist independently and shows all its chemical properties. Atoms
    combine to form molecules of elements or compounds to become stable. Atoms are held together by
    a force called a chemical bond. A covalent bond is formed by the sharing of electrons between
    atoms. An ionic bond is formed by the transfer of electrons between atoms, where one atom loses
    electrons and the other gains electrons to form cations and anions, respectively. The chemical
    formula of a covalent compound represents the elements and number of atoms of each element
    present in it. The chemical formula of an ionic compound represents the simplest whole number
    ratio of atoms of different elements present in it. Molecular mass is the total mass of a
    molecule, calculated by adding the atomic masses of all the atoms constituting it. Formula unit
    mass of an ionic compound is the sum of the atomic masses of all the atoms present in a formula
    unit (simplest whole number ratio of ions in an ionic compound).
