  text: Atomic Foundations of Matter
- id: "0.2"
  kind: text
  page: 1
  text: In Chapter 8, Journey Inside the Atom, you explored the structure of the atom. You also
    studied subatomic particles, viz., electrons, protons and neutrons, in terms of their
    discoveries, properties and locations in the atom. You also learnt that atoms with an octet of
    electrons in their valence shell are stable. Atoms can lose, gain or share electrons to achieve
    an octet of valence electrons.
- id: "0.3"
  kind: text
  page: 1
  text: You have also learnt that many properties of the elements are not retained when they form a
    compound. For example, hydrogen and oxygen are gases, whereas the substance formed when they
    combine is water, which is a liquid at ordinary temperatures.
- id: "0.4"
  kind: text
  page: 1
  text: Interestingly, water does not have the same properties as hydrogen or oxygen. Hydrogen gas is
    combustible and oxygen supports combustion, whereas water neither burns nor helps in burning;
    rather, it extinguishes fire. However, it was found that the mass of the water formed equals to
    the sum of the masses of the hydrogen and oxygen that combined to form it. Let us explore
    whether the mass remains unchanged during physical and chemical changes.
