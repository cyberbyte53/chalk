  number: "9.5"
  title: Writing Chemical Formulae
  text: 9.5 Writing Chemical Formulae
- id: "5.1"
  kind: text
  page: 14
  text: You have learnt earlier how to write the formulae of compounds by finding the number of
    electrons which can be shared or transferred. There is yet another way to write the formulae
    quickly.
- id: "5.2"
  kind: section
  page: 14
  number: 9.5.1
  title: Writing chemical formulae of covalent compounds
  text: 9.5.1 Writing chemical formulae of covalent compounds
- id: "5.2.1"
  kind: text
  page: 14
  text: "Follow these steps to write the chemical formula of a covalent compound: (i) Write the
    symbols of the constituent elements of the compound. (ii) Write the valencies of these elements
    (refer to Table 9.1). (iii) Crossover the valencies of the combining atoms and write them as
    subscripts after the symbols of elements, as shown below."
- id: "5.2.2"
  kind: box
  page: 14
  title: Examples
  text: Examples The formula of hydrogen chloride — Symbol of element H Cl Valency 1 1 The formula of
    the compound would be HCl. If the valency is one after criss-crossing, it is not written. The
    formula of hydrogen sulfide — Symbol of element H S Valency 1 2 The formula of the compound
    would be H₂S. The formula of carbon tetrachloride — Symbol of element C Cl Valency 4 1 The
    formula of the compound would be CCl₄.
  made:
    - {words: L45.3-L47, by: agent}
    - {words: L51.8-L53, by: agent}
- id: "5.3"
  kind: section
  page: 14
  number: 9.5.2
  title: Writing chemical formulae of ionic compounds
  text: 9.5.2 Writing chemical formulae of ionic compounds
- id: "5.3.1"
  kind: text
  page: 14
  text: "Follow the steps given below to write the chemical formula of an ionic compound: (i) Write
    the symbol of the cation first, followed by the symbol of the anion. (ii) Write the charges
    under the symbols rather than as superscripts. (iii) Crossover the charges (only the numbers) as
    shown below to obtain the formula. (iv) The chemical formula gives the simplest ratio of the
    elements in a compound. Therefore, after criss-crossing, the subscripts are divided by a common
    factor, if any. For example, if we get the subscripts 2 and 4, they are divided by 2 to get 1
    and 2, which are then used as subscripts in the formula."
- id: "5.3.2"
  kind: box
  page: 15
  title: Note
  text: Note The charges on the ions are not indicated in the formula of the compound.
- id: "5.3.3"
  kind: box
  page: 15
  title: Examples
  text: Examples The formula of calcium chloride — Symbol Ca Cl Charge 2+ 1– Formula CaCl₂ Thus, in
    calcium chloride, there are two chloride ions (Cl⁻) for each calcium ion (Ca²⁺). The positive
    and negative charges must balance each other, and the overall structure must be neutral. The
    formula of aluminium oxide — Symbol Al O Charge 3+ 2– Formula Al₂O₃ The formula for magnesium
    oxide — Symbol Mg O Charge 2+ 2– Here, the valencies of the two elements are the same. We arrive
    at the formula Mg₂O₂ but it is simply written as MgO.
  made:
    - {words: L20.2-L21, by: agent}
    - {words: "L23.10, L22, L23.11", by: agent}
    - {words: L24.3-5, by: agent}
    - {words: L31-L34, by: agent}
    - {words: L39.3-L42, by: agent}
- id: "5.3.4"
  kind: text
  page: 15
  text: This method can also be used to write formulae of compounds of metals with other polyatomic
    ions, such as calcium carbonate.
- id: "5.3.5"
  kind: text
  page: 15
  text: For magnesium hydroxide, we write the symbol of the cation (Mg²⁺) first, followed by the
    symbol of the anion (OH⁻). Then, their charges (only the numbers) are criss-crossed to get the
    formula.
  made:
    - {words: L47.11-13, by: agent}
    - {words: L48.9-11, by: agent}
- id: "5.3.6"
  kind: box
  page: 15
  title: Examples
  text: Examples The formula for calcium carbonate — Symbol Ca CO₃ Charge 2+ 2– Formula CaCO₃ Here,
    the valencies of the two ions are the same. The formula Ca₂(CO₃)₂ is simply written as CaCO₃, as
    explained above. The formula of magnesium hydroxide — Symbol Mg OH Charge 2+ 1– Formula Mg(OH)₂
  made:
    - {words: L52-L53, by: agent}
