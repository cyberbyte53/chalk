concepts:
  - key: mass-unchanged-in-physical-change
    concept: विलयन बनाने जो एक भौतिक परिवर्तन है, के समय द्रव्यमान में व्यावहारिक रूप से कोई परिवर्तन नहीं होता; यह सभी भौतिक परिवर्तनों के लिए सत्य है।
    terms: []
    items: ["0.8"]
  - key: escaping-gas-and-closed-set-up
    concept: प्रायोगिक व्यवस्था 1 में उत्पन्न गैस मुक्त हो जाती है जिससे आरंभिक और अंतिम पाठ्यांकों में अंतर आ जाता है; बंद व्यवस्था में अंतिम पाठ्यांक, आरंभिक पाठ्यांक के समान है।
    terms: []
    items: ["0.28"]
  - key: law-of-conservation-of-mass
    concept: किसी भी रासायनिक अभिक्रिया में द्रव्य का न तो सृजन किया जा सकता है और न ही उसे नष्ट किया जा सकता है; इसे द्रव्यमान संरक्षण का नियम कहते हैं जिसे आन्तवॉ लवाइजिए ने प्रतिपादित किया।
    terms: [द्रव्यमान संरक्षण का नियम]
    items: ["1.1"]
  - key: mass-of-reactants-equals-products
    concept: रासायनिक अभिक्रिया के पूर्व और पश्चात कुल द्रव्यमान समान रहता है, अतः अभिक्रिया में किसी पदार्थ का अज्ञात द्रव्यमान ज्ञात किया जा सकता है।
    terms: []
    items: ["1.12", "1.14"]
  - key: law-of-constant-proportions
    concept: किसी यौगिक में तत्वों का एक निश्चित अनुपात होता है और वह उसके स्रोत पर निर्भर नहीं करता; इसे स्थिर अनुपात का नियम अथवा निश्चित अनुपात का नियम अथवा प्राउस्ट का नियम कहते हैं।
    terms: [स्थिर अनुपात का नियम, निश्चित अनुपात का नियम, प्राउस्ट का नियम]
    items: ["2.1", "2.2"]
  - key: using-the-fixed-ratio
    concept: यौगिक में तत्वों के द्रव्यमान अनुपात से यह ज्ञात किया जा सकता है कि एक तत्व के दिए गए द्रव्यमान के लिए दूसरे तत्व की कितनी मात्रा की आवश्यकता होगी।
    terms: []
    items: ["2.5"]
  - key: daltons-atomic-theory
    concept: दोनों नियम डॉल्टन के परमाणु सिद्धांत का आधार हैं; संपूर्ण द्रव्य अविभाज्य परमाणुओं से बना है, किसी तत्व के सभी परमाणु समान होते हैं, विभिन्न तत्वों के परमाणु भिन्न होते हैं, और परमाणु सरल पूर्णांकों के अनुपात में संयोजित होते हैं तथा अभिक्रिया में केवल पुनर्व्यवस्थित होते हैं।
    terms: [डॉल्टन के परमाणु सिद्धांत]
    items: ["2.9", "3.2"]
  - key: molecule
    concept: अणु विद्युतरूप से उदासीन कण है जिसमें एक से अधिक परमाणु होते हैं, जो स्वतंत्र रूप से अस्तित्व में रह सकता है तथा उस पदार्थ के सभी गुणधर्मों को प्रदर्शित करता है; यह किसी तत्व का अथवा किसी यौगिक का हो सकता है।
    terms: [अणु]
    items: ["3.6", "4.1"]
  - key: some-elements-exist-as-atoms
    concept: कुछ तत्व, जैसे— हीलियम केवल परमाणुओं के रूप में ही अस्तित्व में होते हैं क्योंकि इसके परमाणु स्थायी होते हैं।
    terms: []
    items: ["4.1"]
  - key: atoms-share-or-transfer-electrons
    concept: परमाणु इलेक्ट्रॉनों को साझा कर, ग्रहण कर अथवा त्याग कर अपने संयोजकता कोश को पूर्ण कर सकता है (8 इलेक्ट्रॉन, अथवा 2 यदि K बाह्यतम कोश है) और स्थायी हो सकता है।
    terms: [इलेक्ट्रॉनों की साझेदारी, इलेक्ट्रॉनों का स्थानांतरण]
    items: ["4.2"]
  - key: chemical-bond
    concept: वह बल जो परमाणुओं को एक साथ बाँधे रखता है, रासायनिक आबंध कहलाता है; संयोजन से कुल ऊर्जा कम हो जाती है और व्यवस्था अधिक स्थायी हो जाती है।
    terms: [रासायनिक आबंध]
    items: ["4.3"]
  - key: covalent-bond
    concept: परमाणुओं के मध्य इलेक्ट्रॉनों के सहभाजित युग्म की परस्पर क्रिया सहसंयोजी आबंध कहलाती है, जैसे हाइड्रोजन का अणु (H₂)।
    terms: [सहसंयोजी आबंध]
    items: ["4.4.3"]
  - key: single-and-double-bonds
    concept: एक इलेक्ट्रॉन युग्म साझा करने वाले परमाणु एकल आबंध द्वारा जुड़े होते हैं (H-H, Cl-Cl); साझा इलेक्ट्रॉनों के दो युग्मों द्वारा जुड़े परमाणु द्वि-आबंध द्वारा बंधे रहते हैं (O = O)।
    terms: [एकल आबंध, द्वि-आबंध]
    items: ["4.4.3", "4.4.14"]
  - key: covalent-compounds
    concept: विभिन्न तत्वों के परमाणु भी इलेक्ट्रॉनों को साझा करके सहसंयोजी यौगिक बनाते हैं, जैसे हाइड्रोजन क्लोराइड (HCl) और जल (H₂O)।
    terms: []
    items: ["4.4.22", "4.4.25"]
  - key: naming-covalent-compounds
    concept: सहसंयोजी यौगिकों के नामकरण में उपसर्ग (मोनो-, डाइ-, ट्राइ- इत्यादि) परमाणुओं की संख्या व्यक्त करते हैं और दूसरे तत्व के नाम के अंत में आइड (-ide) लगाया जाता है; कुछ यौगिक सामान्य नामों से जाने जाते हैं, जैसे जल और अमोनिया।
    terms: []
    items: ["4.4.28", "4.4.33"]
  - key: cation
    concept: जब सोडियम परमाणु अपना संयोजकता इलेक्ट्रॉन त्यागता है तो यह एक धनावेशी स्पीशीज बन जाता है जिसे सोडियम धनायन कहते हैं (Na⁺)।
    terms: [धनायन]
    items: ["4.5.4"]
  - key: anion
    concept: इलेक्ट्रॉन ग्रहण करने पर परमाणु पर ऋण आवेश आ जाता है और वह ऋणायन बनता है, जैसे Cl⁻ अथवा S²⁻।
    terms: [ऋणायन]
    items: ["4.5.6", "4.5.12"]
  - key: ionic-bond
    concept: विपरीत आवेश वाले आयनों के मध्य स्थिर विद्युत आकर्षण बल जो उन्हें बाँधे रखता है, आयनिक आबंध कहलाता है, जैसे सोडियम क्लोराइड में।
    terms: [आयनिक आबंध]
    items: ["4.5.8"]
  - key: ionic-crystals
    concept: आयनिक यौगिक अणु नहीं बनाते हैं; वे त्रिविमीय (3-D) क्रिस्टल बनाते हैं जिसमें आयन पुनरावृत्ति प्रतिरूप में व्यवस्थित होते हैं।
    terms: []
    items: ["4.5.10", "7.6"]
  - key: naming-ionic-compounds
    concept: आयनिक यौगिकों का नाम लिखते हुए पहले धनायन का नाम लिखा जाता है तत्पश्चात ऋणायन का; सरल ऋणायनों के नामों का अंत आइड (-ide) से होता है, और दो अथवा अधिक तत्वों के परमाणुओं से बने आयन बहुपरमाण्विक आयन कहलाते हैं।
    terms: [बहुपरमाण्विक आयन]
    items: ["4.5.15"]
  - key: common-ions-and-valency
    concept: प्रत्येक सामान्य आयन का एक सूत्र और एक संयोजकता होती है जो उसके आवेश के बराबर है।
    terms: []
    items: ["4.5.16", "4.5.18"]
  - key: formulae-of-covalent-compounds
    concept: सहसंयोजी यौगिक का सूत्र लिखने के लिए तत्वों के प्रतीक लिखिए और उनकी संयोजकताओं का तिर्यक कर उन्हें पादांक के रूप में लिखिए; संयोजकता एक हो तो उसे लिखा नहीं जाता (H₂S, CCl₄)।
    terms: []
    items: ["5.2.1", "5.2.2"]
  - key: formulae-of-ionic-compounds
    concept: आयनिक यौगिक का सूत्र प्राप्त करने के लिए आवेशों (केवल संख्या) का तिर्यक बनाइए और सरलतम अनुपात लीजिए; धन एवं ऋण आवेश एक-दूसरे को संतुलित करते हैं (CaCl₂, MgO)।
    terms: []
    items: ["5.3.1", "5.3.2"]
  - key: brackets-for-polyatomic-ions
    concept: जब किसी सूत्र में एक ही प्रकार के दो अथवा अधिक बहुपरमाण्विक आयन होते हैं तब हम कोष्ठकों का उपयोग करते हैं, जैसे Al(OH)₃ और Al₂(SO₄)₃।
    terms: []
    items: ["5.3.7", "5.3.8"]
  - key: solubility-of-ionic-and-covalent
    concept: आयनिक यौगिक जल में प्रायः घुलनशील होते हैं किंतु किरोसिन और पेट्रोल में अघुलनशील; इसके विपरीत अधिकांश सहसंयोजी यौगिक जल में अघुलनशील हैं परंतु किरोसिन और पेट्रोल में घुलनशील हैं।
    terms: []
    items: ["6.5"]
  - key: conductivity-of-ionic-and-covalent
    concept: आयनिक यौगिक ठोस अवस्था में विद्युत का चालन नहीं करते, परंतु जल में घोलने पर उनके आयन गति करने हेतु मुक्त होते हैं; सहसंयोजी यौगिक आयन नहीं बनाते इसलिए विद्युत का चालन नहीं करते।
    terms: []
    items: ["6.6"]
  - key: melting-and-boiling-points
    concept: प्रबल अंतर-आयनिक आकर्षण बलों के कारण आयनिक यौगिकों के गलनांक एवं क्वथनांक प्रायः उच्च होते हैं जबकि सहसंयोजी यौगिकों के गलनांक एवं क्वथनांक निम्न होते हैं।
    terms: []
    items: ["6.9"]
  - key: molecular-mass
    concept: सहसंयोजी यौगिक का आण्विक द्रव्यमान उसके अणु में उपस्थित परमाणुओं के द्रव्यमानों को जोड़ कर ज्ञात होता है (H₂O = 18 u)।
    terms: []
    items: ["7.1", "7.2"]
  - key: formula-unit-mass
    concept: आयनिक यौगिकों में आयनों की सरलतम पूर्ण संख्या अनुपात के संग्रह को सूत्र इकाई कहते हैं; सूत्र इकाई का द्रव्यमान सूत्र इकाई द्रव्यमान कहलाता है।
    terms: [सूत्र इकाई, सूत्र इकाई द्रव्यमान]
    items: ["8.1"]
