    प्रायोगिक कार्यों के लिए जाना जाता है। इन्होंने निश्चित अनुपात के नियम में योगदान दिया और यह
    दर्शाया कि रासायनिक यौगिकों में तत्व सदैव द्रव्यमान के एक निश्चित अनुपात में विद्यमान होते हैं।
    उदाहरणार्थ— प्राउस्ट ने कॉपर कार्बोनेट के संघटन का अध्ययन किया। इन्होंने दर्शाया कि कॉपर
    कार्बोनेट में कॉपर, कार्बन और ऑक्सीजन के द्रव्यमानों का अनुपात समान होता है जो इस बात पर निर्भर
    नहीं करता कि उसे किस प्रकार बनाया गया है अथवा किस स्रोत से प्राप्त किया गया है। इनके इस कार्य ने
    एक महत्त्वपूर्ण आधारशिला रखी जिसने आधुनिक रसायन को आकार देने में सहायता प्रदान की।
