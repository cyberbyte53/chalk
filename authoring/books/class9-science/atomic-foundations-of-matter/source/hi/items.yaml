  text: एक प्रयोग की अभिकल्पना और निष्पादन यह दर्शाने और तुलना करने हेतु कीजिए कि जल में हाइड्रोजन और
    ऑक्सीजन सदैव समान अनुपात में अस्तित्व में होते हैं चाहे उसका स्रोत कुछ भी हो। किंन्ही तीन तत्वों
    के परमाणुओं एवं आयनों की तुलना कीजिए। स्तंभ आलेखों (Bar graphs) का उपयोग करते हुए आयन निर्माण के
    पूर्व और पश्चात इलेक्ट्रॉनों की संख्या दर्शाइए। धनायनों और ऋणायनों का एक कार्ड गेम बनाइए। इसमें
    आप निम्नलिखित संभावित विचारों को संज्ञान में ले सकते हैं— कार्डों की ढेरी में से अथवा फैले हुए
    कार्डों में से एक कार्ड उठा सकते हैं और अपने हाथ के कार्डों से उनका मिलान करते हुए यौगिक बना
    सकते हैं। आप अवांछनीय कार्डों को छोड़ सकते हैं। यौगिक बनाने हेतु अन्य खिलाड़ियों से भी कार्ड ले
    सकते हैं और उन कार्डों का उपयोग भी कर सकते हैं जो उनके पास पहले से हैं। अणुओं के विषय में और
