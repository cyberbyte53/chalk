    प्रयास कीजिए। 3. अपने प्रेक्षणों को तालिका 9.2 में अभिलेखित कीजिए। (ख) जल में विद्युत चालकता
    सुरक्षा प्रथम— यह कार्य अध्यापक की देखरेख में किया जाना चाहिए। जब इलेक्ट्रोड बैटरी से जुड़े हों
    तब उन्हें स्पर्श न करें अपितु प्रघात के जोखिम से बचाव हेतु एक निम्न-वोल्टता की बैटरी का उपयोग
    कीजिए। पेट्रोल और किरोसिन ज्वलनशील द्रव हैं, अत: उनके साथ कार्य करते हुए सावधान रहिए। 4. कार्बन
