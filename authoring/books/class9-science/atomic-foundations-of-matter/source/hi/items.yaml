  text: अध्याय 8 ‘एक यात्रा — परमाणु के भीतर’ में आपने परमाणु की संरचना का अन्वेषण किया। आपने
    अवपरमाणुक कणों, जैसे — इलेक्ट्रॉन, प्रोटॉन और न्यूट्रॉन की खोज, उनके गुणधर्मों और परमाणु में
    उनकी अवस्थिति के विषय में भी अध्ययन किया। आपने यह भी सीखा कि जिन परमाणुओं के संयोजकता (बाह्यतम)
    कोश में इलेक्ट्रॉनों का अष्टक (आठ इलेक्ट्रॉन) होता है, वे स्थायी होते हैं। संयोजकता इलेक्ट्रॉनों
    का अष्टक प्राप्त करने के लिए परमाणु इलेक्ट्रॉनों को त्याग सकते हैं, ग्रहण कर सकते हैं अथवा साझा
    कर सकते हैं।
