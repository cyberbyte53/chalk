  title: विज्ञान एवं समाज
  text: विज्ञान एवं समाज जब परमाणुओं के नाभिक टूटते हैं अथवा जुड़ते हैं और नए तत्वों का निर्माण करते
    हैं तो एक बड़ी मात्रा में ऊर्जा उत्सर्जित करते हैं। इसे परमाण्विक अथवा नाभिकीय ऊर्जा कहते हैं और
    यह आधुनिक जीवन में अत्यंत महत्त्वपूर्ण भूमिका निभाती है। विद्युत ऊर्जा के उत्पादन के अतिरिक्त
    इसका उपयोग औषधि, वैज्ञानिक अनुसंधान और अंतरिक्ष की खोज में किया जाता है। नाभिकीय शक्ति संयंत्रों
    में नाभिकीय अभिक्रियाओं की ऊष्मीय ऊर्जा भाप उत्पन्न करती है जो टरबाइन को प्रचालित करती है और
    विद्युत उत्पन्न करती है, यह जीवाश्म ईंधनों का एक स्वच्छ विकल्प है। भारत में राजा रमन्ना जैसे
    वैज्ञानिकों ने राष्ट्र के नाभिकीय ऊर्जा कार्यक्रम का विकास और राष्ट्र विकास के लिए इसके
    शांतिपूर्ण उपयोग को बढ़ावा देकर महत्त्वपूर्ण योगदान दिया है।
