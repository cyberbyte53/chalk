- id: "4.4.28"
  kind: text
  page: 10
  text: सहसंयोजी यौगिकों का नामकरण यौगिक में प्रत्येक तत्व के परमाणुओं की संख्या को इंगित करके किया
    जाता है। इन यौगिकों के नामकरण के लिए एक उपसर्ग प्रणाली का उपयोग किया जाता है जो किसी अणु में
    प्रत्येक तत्व के परमाणुओं की संख्या को इंगित करती है। प्रथम तत्व का नाम सामान्य ही रखा जाता है
    जबकि दूसरे तत्व के नाम के अंत में आइड (-ide) लगाया जाता है। उपसर्ग, जैसे — मोनो-(1), डाइ-(2),
    ट्राइ-(3), टेट्रा-(4), पेन्टा-(5), हेक्सा-(6) इत्यादि परमाणुओं की संख्या व्यक्त करते हैं। यद्यपि
    प्रथम तत्व के लिए मोनो को सामान्यतः नहीं लिखा जाता है परंतु दूसरे तत्व के लिए इसका उपयोग किया
    जाता है। तत्व के अंग्रेजी नाम में यदि कोई उपसर्ग ‘o’ या ‘a’ के साथ समाप्त होता है और तत्व के नाम
    का प्रारंभ स्वर (vowel) के साथ आरंभ होता है तो अंतिम स्वर को छोड़ दिया जाता है (उदाहरणार्थ—
    मोनोक्सॉइड– monoxide , पेंटऑक्साइड –pentoxide)। यदि उपसर्ग ‘i’ के साथ समाप्त हो तब उच्चारण के
    लिए इसे रख लिया जाता है, (उदाहरणार्थ, डाइऑक्साइड – dioxide, ट्राइऑक्साइड – trioxide)।
