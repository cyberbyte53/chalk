- id: "0.4"
  kind: text
  page: 1
  text: यह रोचक है कि जल के गुणधर्म हाइड्रोजन अथवा ऑक्सीजन के गुणधर्मों के समान नहीं होते हैं।
    हाइड्रोजन एक ज्वलनशील गैस है और ऑक्सीजन दहन में सहायक होती है जबकि जल न तो ज्वलनशील पदार्थ है और
    न ही दहन में सहायता करता है अपितु यह अग्नि को बुझा देता है। यद्यपि यह ज्ञात हुआ कि जल का
    द्रव्यमान हाइड्रोजन और ऑक्सीजन के द्रव्यमानों के योग के समान है जिनके संयोजन से वह बना है। आइए,
    अन्वेषण करें कि क्या भौतिक और रासायनिक परिवर्तनों में द्रव्यमान अपरिवर्तित रहता है।
