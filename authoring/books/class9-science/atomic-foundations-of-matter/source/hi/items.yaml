- id: "4.5.15"
  kind: text
  page: 13
  text: "आयनिक यौगिकों का नाम लिखते हुए पहले धनायन का नाम लिखा जाता है तत्पश्चात ऋणायन का नाम लिखते
    हैं। सरल ऋणायनों के नामों का अंत आइड (-ide) से होता है। प्रायः धातुएँ धनायन बनाती हैं और अधातुएँ
    ऋणायन बनाती हैं। आयनिक यौगिक विशेषतः तब बनते हैं जब धातुओं का संयोजन अधातुओं से होता है,
    उदाहरणार्थ— सोडियम क्लोराइड, कैल्सियम ऑक्साइड, मैग्नीशियम सल्फाइड इत्यादि। कुछ आयन दो अथवा दो से
    अधिक तत्वों के परमाणुओं के संयोजन से बनते हैं और बहुपरमाण्विक आयन कहलाते हैं। सामान्यत:
    बहुपरमाण्विक आयनों के नाम का अंत आइड (-ide) से नहीं होता। कुछ सामान्य आयनों के नाम, सूत्र एवं
    संयोजकताएँ तालिका 9.1 में दर्शाए गए हैं।"
