  text: CO का नाम कार्बन मोनोक्सॉइड (carbon monoxide) के रूप में लिखा जाता है न कि कार्बन मोनो ऑक्साइड
    (carbon monooxide) के रूप में। CO₂ को कार्बन डाइऑक्साइड नाम दिया जाता है (न कि मोनोकार्बन
    डाइऑक्साइड)। CS₂ को कार्बन डाइसल्फाइड नाम दिया जाता है जिसमें दो सल्फर परमाणु प्रदर्शित हो रहे
    हैं। PCl₃ को फॉस्फोरस ट्राइक्लोराइड नाम दिया जाता है जिसमें तीन क्लोरीन परमाणु प्रदर्शित हो रहे
    हैं। SF₆ को सल्फर हेक्साफ्लुओराइड नाम दिया जाता है जिसमें छह फ्लुओरीन परमाणु प्रदर्शित हो रहे
    हैं। N₂O₄ को डाइनाइट्रोजन टेट्रॉक्साइड नाम दिया जाता है (न कि टेट्राऑक्साइड)। N₂O₅ को
    डाइनाइट्रोजन पेंटऑक्साइड नाम दिया जाता है।
