  text: लवाइजिए के पश्चात जोसेफ प्राउस्ट (Joseph Proust) ने प्रस्तावित किया कि दो अथवा दो से अधिक
    तत्वों से बने किसी भी यौगिक में तत्व द्रव्यमान के एक निश्चित अनुपात में संयोजित होते हैं। यदि
    दूसरे शब्दों में कहा जाए तो किसी यौगिक में तत्वों का एक निश्चित अनुपात होता है और वह उसके स्रोत
    पर निर्भर नहीं करता है। उदाहरणार्थ—यदि विभिन्न स्रोतों, जैसे नदियों, बोरवेल अथवा समुद्र से
    एकत्रित जल का शोधन करके विश्लेषण किया जाए तो इसमें सदैव हाइड्रोजन और ऑक्सीजन का द्रव्यमान 1:8 के
    अनुपात में होता है। यह क्या इंगित करता है? यदि किसी स्रोत से 9 g शोधित जल को विघटित किया जाए तो
    सदैव 1 g हाइड्रोजन और 8 g ऑक्सीजन प्राप्त होती है। इस अनुपात को 1:8 के रूप में भी लिखा जाता है।
