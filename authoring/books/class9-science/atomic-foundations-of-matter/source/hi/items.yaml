  text: "अध्याय 8 ‘एक यात्रा— परमाणु के भीतर’ में आपने अध्ययन किया है कि बाह्यतम (संयोजकता) कोश में 8
    इलेक्ट्रॉन (2 इलेक्ट्रॉन यदि K बाह्यतम कोश है) वाले परमाणु स्थायी होते हैं। यदि किसी परमाणु के
    संयोजकता कोश में इलेक्ट्रॉनों की संख्या आठ से कम हो तो वह इलेक्ट्रॉनों को साझा कर, ग्रहण कर अथवा
    त्याग कर अपने संयोजकता कोश को पूर्ण कर सकता है और स्थायी हो सकता है। इस प्रक्रिया में तत्वों के
    परमाणु संयोजित होकर यौगिक बनाते हैं। यह सामान्यत: दो प्रकार से होता है जो निम्नलिखित हैं—
    इलेक्ट्रॉनों की साझेदारी — इस प्रक्रिया में दूसरे परमाणु के साथ कुछ अथवा सभी इलेक्ट्रॉनों को
    साझा किया जाता है। इलेक्ट्रॉनों का स्थानांतरण — इसके अंतर्गत एक अथवा अधिक संयोजकता इलेक्ट्रॉनों
    को दूसरे परमाणु को स्थानांतरित किया जाता है अथवा किसी दूसरे परमाणु से एक अथवा एक से अधिक
