  text: जिज्ञासा-सूत्र आयनिक यौगिक सामान्यतः एकल इकाई के रूप में नहीं पाए जाते हैं। वे त्रिविमीय (3-D)
    क्रिस्टल बनाते हैं जिसमें आयन पुनरावृत्ति प्रतिरूप में व्यवस्थित होते हैं। उदाहरण के लिए— सोडियम
    क्लोराइड (NaCl) (चित्र 9.14 क) में प्रत्येक सोडियम आयन (Na⁺) छह क्लोराइड आयनों (Cl⁻) से घिरा
    होता है और प्रत्येक क्लोराइड आयन छह सोडियम आयनों से घिरा होता है। ये विपरीत आवेशित आयन एक नियमित
    पुनरावृत्ति 3-D प्रतिरूप में व्यवस्थित होते हैं जिसे एक क्रिस्टल संरचना कहा जाता है (चित्र 9.14
    ख)। क्रिस्टल संरचना को क्रिस्टल जालक (lattice) के रूप में निरूपित किया जाता है जिसमें आयन
    बिंदुओं अथवा गोलों के रूप में दर्शाए जाते हैं (चित्र 9.14 ग))। इससे क्रिस्टल में आयनों की
    व्यवस्था को दृष्टिगत करने में सहायता मिलती है। आप उच्च कक्षाओं में क्रिस्टल संरचना के विषय में
    और अधिक सीखेंगे।
