    के स्थिर अनुपात में संयोजित होते हैं, चाहे उसका निर्माण किसी भी प्रकार से किया जाए अथवा उसे कहीं
    से भी प्राप्त किया जाए। इसे स्थिर अनुपात का नियम कहते हैं। एक अणु को एक ऐसे वैद्युत उदासीन कण के
    रूप में परिभाषित किया जा सकता है जो एक से अधिक परमाणुओं से बनता है और स्वतंत्र रूप से अस्तित्व
    में रह सकता है तथा अपने सभी रासायनिक गुणधर्म दर्शाता है। परमाणु स्थायित्व प्राप्त करने के लिए
    तत्वों अथवा यौगिक के संयोजन से अणु बनाते हैं। परमाणु जिस बल द्वारा एक-दूसरे से जुड़े रहते हैं
    उसे रासायनिक आबंध कहते हैं। एक सहसंयोजी आबंध परमाणुओं के मध्य इलेक्ट्रॉनों को साझा करने से बनता
    है। परमाणुओं के मध्य इलेक्ट्रॉनों के स्थानांतरण से आयनिक आबंध बनता है जिसमें एक परमाणु
    इलेक्ट्रॉन त्यागता है और दूसरा परमाणु इलेक्ट्रॉन ग्रहण करता है जिससे क्रमशः धनायन और ऋणायन बनते
    हैं। किसी सहसंयोजी यौगिक का रासायनिक सूत्र उसके संघटक तत्वों तथा प्रत्येक तत्व के परमाणुओं की
    संख्या को निरूपित करता है। किसी आयनिक यौगिक का रासायनिक सूत्र उसमें उपस्थित विभिन्न तत्वों के
    परमाणुओं की सरलतम पूर्ण संख्या के अनुपात को व्यक्त करता है। किसी अणु का आण्विक द्रव्यमान वह कुल
    द्रव्यमान है जो उसके सभी संघटक परमाणुओं के परमाणु द्रव्यमानों के योग द्वारा परिकलित किया जाता
    है। किसी आयनिक यौगिक का सूत्र इकाई द्रव्यमान उसकी सूत्र इकाई में उपस्थित सभी परमाणुओं के परमाणु
    द्रव्यमानों का योग है। (किसी आयनिक यौगिक में आयनों की सरलतम पूर्ण संख्या का अनुपात उसकी सूत्र
    इकाई होता है।)
