  page: 8
  text: एक ही तत्व के परमाणु संयोजन कर उस तत्व का अणु बना सकते हैं, उदाहरणार्थ — हाइड्रोजन के एक अणु
    में दो हाइड्रोजन परमाणु होते हैं। विभिन्न तत्वों के परमाणु संयोजित होकर किसी यौगिक का एक अणु
    बनाते हैं। उदाहरणार्थ— हाइड्रोजन का एक परमाणु और क्लोरीन का एक परमाणु संयोजन द्वारा हाइड्रोजन
    क्लोराइड का एक अणु बनाते हैं। अणु को विद्युतरूप से उदासीन किसी कण के रूप में परिभाषित कर सकते
    हैं जिसमें एक से अधिक परमाणु होते हैं जो स्वतंत्र रूप से अस्तित्व में रह सकता है तथा उस पदार्थ
    के सभी गुणधर्मों को प्रदर्शित करता है। यह भी स्मरण रखना चाहिए कि कुछ तत्व, जैसे— हीलियम केवल
    परमाणुओं के रूप में ही अस्तित्व में होता है क्योंकि इसके परमाणु स्थायी होते हैं।
