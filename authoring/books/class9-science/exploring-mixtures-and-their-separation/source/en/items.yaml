- id: "3.2.9"
  kind: box
  page: 10
  title: Ready to Go Beyond
  text: Ready to Go Beyond A petroleum refinery (Fig. 5.14a) is an industrial unit where crude oil is
    processed to obtain various useful petroleum products. Petroleum products are mixtures of useful
    gases and liquids, such as petroleum gas, petrol, kerosene, diesel, etc. Crude petroleum is
    extracted from the Earth’s crust and separated into these different fractions using the process
    of fractional distillation (Fig. 5.14b). Fractional distillation is the process of separating
    components of a mixture with relatively small differences (less than 25 °C) in their boiling
    points. The gaseous fraction is filled in steel cylinders under high pressure, where it gets
    liquefied. It is used as domestic fuel in the form of Liquefied Petroleum Gas (LPG).
