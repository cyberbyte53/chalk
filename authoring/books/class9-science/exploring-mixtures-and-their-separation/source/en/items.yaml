- id: "2.4.6"
  kind: text
  page: 6
  text: What do you think will happen if you make a saturated solution at a higher temperature and
    cool it slowly? Let us find out!
- id: "3"
  kind: section
  page: 6
  number: "5.3"
  title: Methods of Separation of Homogeneous Mixtures
  text: 5.3 Methods of Separation of Homogeneous Mixtures
- id: "3.1"
  kind: section
  page: 6
  number: 5.3.1
  title: Crystallization
  text: 5.3.1 Crystallization
- id: "3.1.1"
  kind: text
  page: 6
  text: You have learnt to prepare a saturated solution. If you take a saturated solution of compound
    ‘B’ in water at 60 °C, prepared by dissolving 287 g of compound ‘B’ in 100 g of water, what will
    happen if you gradually cool it to 40 °C? As per Fig. 5.6, the solubility of compound ‘B’ is 241
    g per 100 g of water at 40 °C. It implies that only 241 g of compound ‘B’ can remain in the
    solution and the rest of it will separate out as a pure solid, often as crystals. A crystal is a
    solid that is made up of particles arranged in a regular geometric pattern.
- id: "3.1.2"
  kind: text
  page: 7
  text: You might have observed many types of crystals in everyday life, such as rock salt crystals
    (Fig. 5.7a) or sugar crystals (Fig. 5.7b) that grow while making candy sugar (called mishri in
    Hindi). Snowflakes are also crystals, formed when water vapour freezes in the air. Even frost on
    windows is formed when water vapour turns into ice crystals (Fig. 5.7c). This is how crystals
    form naturally.
- id: "3.1.3"
  kind: text
  page: 7
  text: In laboratories, the process of forming crystals from a saturated solution is called
    crystallization. This method can be used for the separation of two solids, in which one of the
    compounds is present in small quantity and both are soluble in the same solvent. This method can
    also be used for purification of solids. The principle of purification by crystallization is
    based on the differences in the solubility of a substance at different temperatures.
- id: "3.1.4"
  kind: text
  page: 7
  text: Try creating your own crystals.
- id: "3.1.5"
  kind: activity
  page: 7
  number: "Activity 5.3:"
  title: Let us prepare
  text: "Activity 5.3: Let us prepare 1. Collect a sample of copper sulfate (blue vitriol). If copper
    sulfate is unavailable, you can use common salt as an alternative. Safety first: Copper sulfate
    is toxic. Perform the experiment under adult supervision and do not touch it with your bare
    hands. 2. Take 1 g of copper sulfate and place it in a 100 mL beaker. Add 25 mL of water to the
    beaker and add a drop of dilute sulfuric acid. Gently heat the mixture in a water bath while
    stirring constantly. Sulfuric acid helps in making pure crystals by preventing unwanted
    reactions. Safety first: It is advised that the teacher should add a drop of sulfuric acid.
    Handle sulfuric acid very carefully! 3. Gradually, add more copper sulfate until the solution
    becomes saturated (Fig. 5.8a). 4. Filter the hot solution to remove insoluble impurities (Fig.
    5.8b). Collect it in a clean beaker and cover it with a watch glass. 5. Allow the solution to
    cool slowly without disturbing it (Fig. 5.8c). It gives enough time to the particles in the
    solution to come together, resulting in the formation of larger, shiny, well-shaped and
    blue-coloured crystals. 6. Filter the crystals, rinse them with cold water and allow them to dry
    on a watch glass (Fig. 5.8d). You may also try: 1. Place 1 – 2 mL of the saturated copper
    sulfate solution on a small glass plate or a lamination sheet. 2. Leave it for some time. What
    do you observe? Did you get crystals? If yes, is this a good way to experiment? Explain."
