- id: "5.16.24"
  kind: box
  page: 22
  title: The Journey Beyond
  text: "The Journey Beyond Demonstrate the Tyndall effect using different colloids. Create a series
    of experiments showcasing how light scatters in colloids making the beam visible. Use laser
    pointers (Safety first: Use it under the supervision of an adult), flashlights, or other light
    sources for your demonstrations. Make crystals of different compounds (common salt, epsom salt,
    sugar, borax, nickel sulfate, etc.). Observe them under a magnifying glass or a microscope. Note
    down their colours and shapes. Do red leaves also contain green pigments? Investigate it using
    paper chromatography. You can try chromatography to find the number of components present in a
    food colour (green, orange, yellow, etc.) or in coloured mouth fresheners (fennel seeds). Design
    an educational game where players identify and apply separation techniques to different mixtures
    through interactive challenges and hands-on activities. If you are camping outdoors and running
    short on clean water, you can obtain clean water by distillation. Can you think of a set-up with
    the items available to you? To learn more about the states of matter and concentration of
    solutions, you can explore the links given below:
