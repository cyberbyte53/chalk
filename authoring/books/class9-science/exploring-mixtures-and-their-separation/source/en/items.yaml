- id: "3.2.6"
  kind: text
  page: 10
  text: A mixture of acetone and water can be separated by distillation because their boiling points
    differ sufficiently. Acetone boils at about 56 °C and water boils at 100 °C. A large difference
    in boiling points allows one liquid to vaporise before the vapours of the other liquid are
    formed in significant amount.
- id: "3.2.7"
  kind: box
  page: 10
  title: India’s Scientific Contributions
  text: India’s Scientific Contributions The process of distillation has been used for a long time for
    various purposes, including extraction of fragrances from flowers to make perfumes. You must
    have noticed the pleasant earthy smell that rises from the ground after the first rain. In
    Kannauj, a town in Uttar Pradesh known as the perfume capital of India, this beautiful fragrance
    is captured and turned into a natural perfume called Mitti ka Ittar (earthy fragrance). This
    perfume is made using a traditional distillation method known as the Deg-Bhapka method (Fig.
    5.13), which has been passed down through generations in Kannauj. It is in great demand, both in
    India and around the world. The Fragrance and Flavour Development Centre in Kannauj has
    facilities for separating flavour and fragrance components from flowers, leaves and other parts
    of plants. It also supports farmers in cultivating fragrance-producing plants and offers
    expertise to those looking to establish their own perfume businesses.
- id: "3.2.8"
  kind: figure
  page: 10
  number: "Fig. 5.13:"
  text: "Fig. 5.13: Deg-Bhapka method"
  crop: [377.3, 187.4, 568.2, 338.7]
  made:
