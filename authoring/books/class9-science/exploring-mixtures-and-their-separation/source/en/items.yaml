- id: "3.3"
  kind: section
  page: 11
  number: 5.3.3
  title: Paper Chromatography
  text: 5.3.3 Paper Chromatography
- id: "3.3.1"
  kind: text
  page: 11
  text: Have you ever observed what happens when a drop of water falls on something written with a
    sketch pen on a paper? You may have noticed that the colour spreads. If the sketch pen is black,
    different colours might spread out. If you have not noticed this before, try it now!
- id: "3.3.2"
  kind: activity
  page: 11
  number: "Activity 5.5:"
  title: Let us investigate
  text: "Activity 5.5: Let us investigate 1. Take a 3 cm wide strip of chromatographic paper and draw
    a straight, horizontal line, 2 cm from the bottom of the paper with a pencil (Fig. 5.15a).
    Alternatively, you can use a strip of filter paper. 2. Mark a spot with a black sketch pen at
    the centre of the line (Fig. 5.15b). 3. Take enough water to make a thin layer at the bottom of
    a gas jar, a measuring cylinder, or a beaker. 4. Place the paper strip with the ink spot
    vertically into the container, so that its lower end dips into the water. The water level should
    be below the spot, as shown in Fig. 5.15c. 5. Observe the paper as the water rises through the
    paper. What do you notice? 6. As the water rises, the ink starts to separate into different
    colour spots. What can you infer from this?"
- id: "3.3.3"
  kind: figure
  page: 11
  number: "Fig. 5.15:"
  text: "Chromatographic paper Line drawn with pencil (a) Watch glass Gas jar Water Ink spot (b) (c)
    Fig. 5.15: Paper chromatography"
  crop: [35.5, 293.8, 334.9, 471.6]
  made:
    - {box: true, by: figure-snap}
- id: "3.3.4"
  kind: text
  page: 11
  text: This method of separating the components of a mixture is known as paper chromatography. It
    uses differences in the interactions of the components with the solvent and the paper to
    separate them. The liquid carries the substances up the paper, separating them based on how fast
    they move. You can also try this with green food colour instead of black ink and use a 2 % m/v
    salt solution as the solvent.
- id: "3.3.5"
  kind: text
  page: 11
  text: Similarly, you can separate different pigments present in the green extract of spinach leaves
    or coloured pigments from the flower petals. Will water work as a solvent in every case? In some
    cases, you may need to use a different solvent, such as alcohol or a mixture of solvents.
- id: "3.3.6"
  kind: box
  page: 11
  title: Pause and Ponder
  text: Pause and Ponder 6. State whether the following statements are True or False. Also, correct
    the False statements. (i) Salt can be separated from a salt solution by evaporation or
    distillation. (ii) Distillation can be used for separation of two liquids even when these have
    the same boiling point. (iii) In paper chromatography, the solvent level should be above the
    sample spot at the beginning of the experiment. (iv) Evaporation and crystallization are the
    same processes.
- id: "3.3.7"
  kind: box
  page: 11
  title: Threads of Curiosity
  text: Threads of Curiosity The word ‘chromatography’ comes from the Greek words chroma, meaning
    ‘colour’ and graphein, meaning ‘to write’. It actually means ‘writing with colour’ because it
    was first used to separate coloured substances like dyes and inks.
- id: "4"
  kind: section
  page: 12
  number: "5.4"
  title: How Can We Separate the Components of Heterogeneous Mixtures?
  text: 5.4 How Can We Separate the Components of Heterogeneous Mixtures?
- id: "4.1"
  kind: section
  page: 12
  number: 5.4.1
  title: Separation of two immiscible liquids
  text: 5.4.1 Separation of two immiscible liquids
- id: "4.1.1"
  kind: text
  page: 12
  text: You have learnt about non-uniform mixtures. Have you noticed what happens when water falls
    into a container that has oil? The oil and water form separate layers. They do not mix and are
    called immiscible liquids. Similarly, sand and water do not mix, nor do iron filings and sulfur.
    These are examples of heterogeneous mixtures.
- id: "4.1.2"
  kind: text
  page: 12
  text: How can you separate the components of a mixture of two immiscible liquids?
- id: "4.1.3"
  kind: text
  page: 12
  text: Let us try to separate mustard oil from water.
- id: "4.1.4"
  kind: activity
  page: 12
  number: "Activity 5.6:"
  title: Let us separate
  text: "Activity 5.6: Let us separate 1. Pour a mixture of 5 mL mustard oil and 20 mL water into a 50
    mL separating funnel. 2. Let it stand undisturbed. What do you observe? 3. You will see the
    formation of two separate layers of mustard oil and water (Fig. 5.16). The yellow-coloured
    mustard oil forms the upper layer and water forms the lower layer. Can you explain why? 4. Open
    the stopcock of the separating funnel slowly to collect the lower layer of water carefully into
    a container. 5. Close the stopcock when the water is almost fully drained. 6. Collect the next
    small portion that may contain both liquids and discard it. 7. Collect the layer of oil
    separately by opening the stopcock again."
- id: "4.1.5"
  kind: figure
  page: 12
  number: "Fig. 5.16:"
  text: "Laboratory stand Separating funnel Mustard oil Water Stopcock Conical flask Glass stopper
    Fig. 5.16: Separation of immiscible liquids"
  crop: [345, 276, 556.1, 502.1]
  made:
    - {box: true, by: figure-snap}
- id: "4.1.6"
  kind: text
  page: 12
  text: You now have two separate liquids.
- id: "4.1.7"
  kind: text
  page: 12
  text: Can you think of any heterogeneous mixtures with a gas as one of the components?
- id: "4.1.8"
  kind: text
  page: 12
  text: Gas particles are free to move in all directions, so they mix easily and uniformly with other
    gases. Hence, most mixtures of gases are homogeneous, such as a mixture of hydrogen and oxygen,
    which is used as a rocket fuel. On the other hand, smoke (solid particles suspended in air), fog
    (tiny liquid water droplets present in air) and dust in the air are some heterogeneous mixtures
    with gas as one of the components.
- id: "4.1.9"
  kind: text
  page: 12
  text: Most of the solid-solid mixtures are heterogeneous. You can use a property of one of the
    solids to separate the mixture. You have learnt how to separate iron nails from sawdust using a
    magnet. Now, let us explore another technique to separate solid-solid mixtures.
- id: "4.1.10"
  kind: box
  page: 12
  title: What if …
  text: What if … two immiscible liquids of the same density are mixed in a separating funnel, how
    will the layers form?
- id: "4.2"
  kind: section
  page: 13
  number: 5.4.2
  title: Sublimation
  text: 5.4.2 Sublimation
- id: "4.2.1"
  kind: activity
  page: 13
  number: "Activity 5.7:"
  title: Let us explore
  text: "Activity 5.7: Let us explore 1. Take a spatula full of the mixture containing crushed camphor
    and sand. Put it into a clean and dry china dish. Place it on the tripod stand using a wire
    gauze. 2. Take a clean and dry glass funnel. Plug its nozzle with cotton. 3. Keep this funnel
    inverted on the china dish and set up the apparatus as shown in Fig. 5.17. 4. Light the burner
    and place it under the wire gauze. 5. Heat the china dish gently for a few minutes. 6. Observe
    the inner wall of the funnel carefully. Do you notice any solid deposits? 7. You may find white,
    solid camphor deposits on the inner wall of the funnel while sand remains in the china dish."
- id: "4.2.2"
  kind: figure
  page: 13
  number: "Fig. 5.17:"
  text: "Cotton plug Glass funnel China dish containing mixture of camphor and sand Wire gauze Tripod
    stand Burner Fig. 5.17: Sublimation of camphor"
  crop: [46.6, 174.6, 280.8, 405.4]
  made:
    - {box: true, by: figure-snap}
- id: "4.2.3"
  kind: text
  page: 13
  text: Camphor, on heating (below its melting point), changes directly from the solid state to the
    vapour state without passing through the liquid state, this process is called sublimation. On
    cooling, vapours condense back into a solid without becoming a liquid, this is called
    deposition. Hence, camphor sublimes and separates from sand because sand does not sublime on
    heating.
- id: "4.2.4"
  kind: text
  page: 13
  text: You can also perform this activity using any other sublimable substance, such as naphthalene,
    in place of camphor.
- id: "4.2.5"
  kind: text
  page: 13
  text: Similarly, solid carbon dioxide, known as dry ice which is used for ice cream storage, also
    undergoes sublimation. Can you think of any other mixtures where sublimation can be used to
    separate the components?
- id: "4.2.6"
  kind: text
  page: 13
  text: Is it possible to dissolve one metal in another?
- id: "4.2.7"
  kind: text
  page: 13
  text: Metals do not dissolve into each other at room temperature. However, when metals are melted at
    high temperatures, they can be mixed to form a solution. When such a hot mixture of two or more
    metals cools, it solidifies into a new material that appears to be a single metal. A homogeneous
    mixture of two or more metals, or a metal and a non-metal, is called an alloy. Physical methods
    cannot separate the components of an alloy. Alloys are generally prepared to produce materials
    that are stronger, more rigid, or more corrosion-resistant. Common examples of alloys include
    brass — a mixture of approximately 80% copper and 20% zinc; bronze — a mixture of approximately
    80% copper and 20% tin; stainless steel — usually a mixture of iron and other elements, such as
    carbon (about 0.03 – 0.8%), chromium (16 – 18%), nickel (10.0 –14.0%) and molybdenum (2.0 –
    3.0%).
- id: "4.2.8"
  kind: box
  page: 13
  title: Pause and Ponder
  text: Pause and Ponder 7. Why do immiscible liquids form two separate layers in a separating funnel?
    8. Is sublimation different from evaporation? Justify.
- id: "4.3"
  kind: section
  page: 14
  number: 5.4.3
  title: Suspensions
  text: 5.4.3 Suspensions
- id: "4.3.1"
  kind: text
  page: 14
  text: Let us look closely at the container shown in Fig. 5.2. No matter how well you stir, the sand
    particles can be seen clearly, unlike in a solution, where the solute particles are not visible.
    Such heterogeneous mixtures in which the solid particles (sand) do not dissolve but remain
    suspended throughout the bulk of the medium (water) are called suspensions. In the case of a
    suspension, the particles of the undissolved substance are larger in size than the particles
    present in the solution. Particles of a suspension are visible to the naked eye. Some other
    examples of suspension are sawdust suspended in water and tea leaves in water.
- id: "4.3.2"
  kind: heading
  page: 14
  title: How can we separate mud from water?
  text: How can we separate mud from water?
- id: "4.3.3"
  kind: text
  page: 14
  text: If you leave a container of muddy water undisturbed, the heavier mud particles settle at the
    bottom and the water may still appear cloudy. You can filter the muddy water through a cotton
    cloth or filter paper. While some larger particles will be removed, the water often remains
    cloudy. This shows that filtration is not always enough to separate tiny particles. If the muddy
    water is still not clear even after keeping for some time, how can it be cleaned? In such cases,
    we use techniques, such as centrifugation and/or coagulation.
- id: "4.3.4"
  kind: text
  page: 14
  text: Let us explore these processes!
- id: "4.3.5"
  kind: heading
  page: 14
  title: A. Centrifugation
  text: A. Centrifugation
- id: "4.3.6"
  kind: text
  page: 14
  text: Let us understand this by playing a game. Choose a partner. Then, cross your arms and hold
    each other’s hands as shown in Fig. 5.18. Now spin around together. Do you feel as if you are
    being pulled outwards? A similar force helps to separate a mixture in a tube by centrifugation.
    This process involves spinning a mixture in a tube at a high speed (Fig. 5.19). During
    centrifugation, the tubes become horizontal and the centrifugal force (outward force acting on a
    body moving in circular motion) causes the heavier particles to move outwards, where they settle
    at the bottom of the tube, while the lighter liquid remains at the top.
- id: "4.3.7"
  kind: box
  page: 14
  title: Threads of Curiosity
  text: Threads of Curiosity The spinning game is a folk dance called phugadi in Marathi and kikli in
    Punjabi. What is this called in your local language?
- id: "4.3.8"
  kind: figure
  page: 14
  number: "Fig. 5.18:"
  text: "Fig. 5.18: A spinning game"
  crop: [428, 463, 579, 590]
  made:
    - {box: true, by: agent}
- id: "4.3.9"
  kind: figure
  page: 14
  number: "Fig. 5.19:"
  text: "(a) (b) Fig. 5.19: Centrifugation machine (a) outer view and (b) inner view"
  crop: [109.6, 530.5, 390.9, 696.4]
  made:
    - {box: true, by: figure-snap}
- id: "4.3.10"
  kind: text
  page: 14
  text: Centrifugation is widely used in laboratories to separate the components of blood, such as red
    blood cells and plasma, and in many chemical industries.
- id: "4.3.11"
  kind: box
  page: 15
  title: Bridging Science and Society
  text: Bridging Science and Society The Paperfuge Centrifugation is usually done using an electric
    machine but by applying ideas from a common toy, a simple hand-powered device called a paperfuge
    (Fig. 5.20) can perform the same process without electricity. By spinning the blood samples at a
    very high speed, the paperfuge separates heavier components from lighter ones, just like a
    laboratory centrifuge. This low-cost tool can help detect diseases like malaria and anaemia in
    remote areas. Find out more about such simple technological inventions that improve access to
    medical care in remote places.
- id: "4.3.12"
  kind: figure
  page: 15
  number: "Fig. 5.20:"
  text: "Blood sample Tape String Cardboard disc Handle Fig. 5.20: Paperfuge"
  crop: [335.5, 120.9, 532.3, 246.9]
  made:
    - {box: true, by: figure-snap}
- id: "4.3.13"
  kind: activity
  page: 15
  number: "Activity 5.8:"
  title: Let us make a model
  text: "Activity 5.8: Let us make a model Make your own centrifuge with a cardboard disc and thick
    thread. You will be able to see how the heavier particles move outwards. It is a fun and
    hands-on way to understand the science behind separation. Which mixture would you like to
    separate using this mini centrifuge?"
- id: "4.3.14"
  kind: heading
  page: 15
  title: B. Coagulation
  text: B. Coagulation
- id: "4.3.15"
  kind: text
  page: 15
  text: Powdered alum (fitkari) can be added to a beaker containing muddy water (Fig. 5.21a). Alum is
    a white crystalline chemical substance often used in water purification. The alum causes the
    fine suspended particles to clump together. This process is called coagulation and the alum is
    said to act as a coagulant (Fig. 5.21b). These larger clumps thus formed, settle by gravity
    (sedimentation), as shown in Fig. 5.21c and can be separated from water by decantation or
    filtration.
- id: "4.3.16"
  kind: figure
  page: 15
  number: "Fig. 5.21:"
  text: "Powdered alum Muddy water (a) Adding powdered alum to suspended impurities in water (b) Alum
    coagulates the suspended impurities Settled impurities (c) Impurities settle at the bottom Fig.
    5.21: Process of coagulation"
  crop: [49.7, 296, 309.8, 595.9]
  made:
    - {box: true, by: figure-snap}
- id: "4.3.17"
  kind: text
  page: 15
  text: Can you think of any other coagulation processes used in everyday life?
- id: "4.3.18"
  kind: text
  page: 15
  text: The formation of cheese (paneer) from milk also involves coagulation, in which acid (lemon
    juice or vinegar) is used as a coagulant. It causes the coagulation of milk proteins, forming
    cheese.
- id: "4.4"
  kind: section
  page: 15
  number: 5.4.4
  title: Colloids
  text: 5.4.4 Colloids
- id: "4.4.1"
  kind: text
  page: 15
  text: If the components of blood can be separated by centrifugation and the blood coagulates, is it
    a suspension? However, we cannot see blood cells with the naked eye. Is it a solution?
- id: "4.4.2"
  kind: text
  page: 15
  text: Blood is neither a solution nor a true suspension. It is a colloid. Some other examples of
    colloids are milk, tomato sauce and ice cream.
- id: "4.4.3"
  kind: box
  page: 16
  title: Bridging Science and Society
  text: Bridging Science and Society Donate Blood Donating blood saves lives. People in emergencies,
    during surgeries, or with serious illnesses may need a blood transfusion, which is the transfer
    of blood from a healthy person to a patient. Donated blood is tested and when the blood group is
    identified, it is separated into its components, such as plasma, platelets, white and red blood
    cells (Fig. 5.22). These are stored safely in blood banks and supplied when required. In Chapter
    3, Tissues in Action, you have learnt that blood connects different parts of the body by
    transporting nutrients, gases and hormones. The body replaces the donated blood naturally within
    a few weeks, making blood donation safe and helpful. Do you know your blood group? Find out!
- id: "4.4.4"
  kind: figure
  page: 16
  number: "Fig. 5.22:"
  text: "Blood sample Test tube stand (a) Plasma Platelets and white blood cells Red blood cells (b)
    Fig. 5.22: Components of blood (a) before centrifugation and (b) after centrifugation"
  crop: [378, 98, 576, 318]
  made:
    - {box: true, by: agent}
- id: "4.4.5"
  kind: text
  page: 16
  text: Let us try to understand what colloids are. How are they different from solutions and
    suspensions? Can you think of some other substances that could be colloids?
- id: "4.4.6"
  kind: text
  page: 16
  text: Solutions, suspensions and colloids (Fig. 5.23) differ mainly in the size of the dissolved or
    the suspended particles. The particle size of a solute is the smallest (less than 1 nm diameter)
    in a solution. Colloids have larger particles (1 – 1000 nm), while suspensions have much larger
    particles (more than 1000 nm in diameter).
- id: "4.4.7"
  kind: figure
  page: 16
  number: "Fig. 5.23:"
  text: "(a) (b) (c) Fig. 5.23: (a) Solution, (b) suspension, and (c) colloid"
  crop: [341.2, 337.7, 587.5, 479.4]
  made:
    - {box: true, by: figure-snap}
- id: "4.4.8"
  kind: text
  page: 16
  text: Unlike suspension, the particles in a colloid do not settle over time from the mixture. They
    are uniformly dispersed throughout the mixture as in a solution.
- id: "5"
  kind: section
  page: 16
  number: "5.5"
  title: Tyndall Effect
  text: 5.5 Tyndall Effect
- id: "5.1"
  kind: text
  page: 16
  text: Let us go back to Activity 5.1. What happened to the thin beam of laser light when it was
    passed through the beakers containing the mixtures? You might have observed that the path of the
    light beam was not visible in solution A. The particles in suspension B scattered (spread) the
    beam of light making its path visible. In mixture C too, the path of light was visible,
    indicating that the particles scattered the light, though the mixture appeared homogeneous.
- id: "5.2"
  kind: text
  page: 16
  text: Have you ever observed light scattering by particles in your surroundings? The scattering of
    light by particles is known as the Tyndall effect. It is called so because it was first
    explained by the scientist John Tyndall, who studied the scattering of light by particles.
- id: "5.3"
  kind: text
  page: 16
  text: This effect can also be observed when a fine beam of light enters a dark room through a small
    hole. This happens because light gets scattered by the dust and smoke particles in the air. You
    might have also observed this phenomenon in the floodlights in a sports stadium (Fig. 5.24).
    Think of some more examples!
- id: "5.4"
  kind: text
  page: 17
  text: Scattering of light occurs when it passes through a colloid or a suspension but not when it
    passes through a transparent solution.
- id: "5.5"
  kind: text
  page: 17
  text: The components of a colloid are called the dispersed phase and the dispersion medium. The
    solute-like component or the dispersed particles, in a colloid form the dispersed phase and the
    component in which the dispersed phase is suspended is known as the dispersion medium.
- id: "5.6"
  kind: figure
  page: 17
  number: "Fig. 5.24:"
  text: "Fig. 5.24: Demonstration of Tyndall effect in a sports stadium"
  crop: [49.2, 83, 233, 237.1]
  made:
    - {box: true, by: figure-snap}
- id: "5.7"
  kind: box
  page: 17
  title: Threads of Curiosity
  text: Threads of Curiosity Some common colloids we encounter in our daily lives have both the
    dispersed phase and the dispersion medium as liquids. These are called emulsions. Emulsions
    containing oil and water are further classified as oil-in-water or water-in-oil, depending on
    the nature of the dispersed phase and the dispersion medium. Milk and vanishing creams are
    common examples of oil-in-water emulsions, whereas butter, body lotions, cold cream, etc., are
    examples of water-in-oil emulsions. Some medicines are prepared as emulsions to disperse them in
    water and make them easily palatable. This also reduces the greasy feeling of the liquid
    medicine. The presence of emulsifying agents stabilises emulsions. For example, proteins in milk
    and butter act as emulsifying agents. You can make an emulsion by thoroughly mixing and shaking
    a few drops of cooking oil with water containing a few drops of soap solution.
- id: "5.8"
  kind: box
  page: 17
  title: Pause and Ponder
  text: Pause and Ponder 9. Clouds are made up of tiny water droplets or ice crystals floating in the
    air. Based on what you know about solutions, suspensions and colloids, what type of mixture do
    you think clouds are and why? 10. Why do cities with a lot of smoke and dust in the air often
    look hazy?
- id: "5.9"
  kind: activity
  page: 17
  number: "Activity 5.9:"
  text: "Activity 5.9: Complete Table 5.1 and review what you have learnt about solutions, suspensions
    and colloids."
