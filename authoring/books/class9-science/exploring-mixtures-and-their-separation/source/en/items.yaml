- id: "3.1.8"
  kind: box
  page: 7
  title: Note
  text: Note Sulfuric acid is required for the crystallization of only some salts.
- id: "3.1.9"
  kind: text
  page: 8
  text: Crystallization is a common technique for separating pure substances (crystals) from
    homogeneous mixtures. When new compounds are prepared, they are often accompanied by unwanted
    impurities. Crystallization helps to separate the desired pure substance from the undesired
    impurities.
- id: "3.1.10"
  kind: box
  page: 8
  title: Think as a Scientist
  text: "Think as a Scientist If a hot, saturated solution of copper sulfate is cooled rapidly in
    ice-cold water, smaller and less well-formed crystals will form than if it is cooled slowly at
    room temperature. How would you design and perform an experiment to test this hypothesis? Hint:
    Prepare a hot saturated solution of copper sulfate and divide it into two equal parts."
- id: "3.1.11"
  kind: box
  page: 8
  title: Pause and Ponder
  text: Pause and Ponder 4. Refer to the solubility curves given in Activity 5.2. If equal masses of
    hot, saturated solutions of compounds ‘A’ and ‘B’ are cooled from 80 °C to 60 °C, which solution
    is likely to deposit more solid? 5. Will there be any change in the size of common salt crystals
    if the rate of evaporation is increased or decreased? Explain.
- id: "3.1.12"
  kind: activity
  page: 8
  number: "Activity 5.4:"
  title: Let us describe a process
  text: "Activity 5.4: Let us describe a process Observe Fig. 5.9, it shows how salt crystals are
    obtained from seawater. Can you describe the process in your own words?"
