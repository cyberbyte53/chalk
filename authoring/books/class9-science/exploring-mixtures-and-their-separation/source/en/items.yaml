  title: Exploring Mixtures and their Separation
  text: Exploring Mixtures and their Separation
- id: "0.2"
  kind: text
  page: 1
  text: Have you ever wondered how sweet, white crystals of sugar are obtained from tall, green
    sugarcane plants? Or how do doctors detect diseases like malaria using just a few drops of
    blood? Many such everyday activities are made possible by techniques based on the fascinating
    science of separating mixtures.
- id: "0.3"
  kind: text
  page: 1
  text: You have learnt about mixtures and some simple methods to separate them. In this chapter, you
    will explore mixtures in greater depth, including their properties, behaviour and the various
    techniques used to separate them. From industrial processes like sugar production to life-saving
    medical tests, the separation of mixtures plays a crucial role in our daily lives.
- id: "0.4"
  kind: box
  page: 1
  title: Think It Over
  text: Think It Over Why do suspended particles settle in muddy water over time but not in milk? How
    is evaporation different from boiling? Why do you see bright rays of sunlight when it passes
    through small gaps between the leaves of a dense tree?
- id: "1"
  kind: section
  page: 2
  number: "5.1"
  title: How Can We Classify Mixtures?
  text: 5.1 How Can We Classify Mixtures?
- id: "1.1"
  kind: text
  page: 2
  text: You have learnt that a mixture of sugar and water has a uniform composition throughout.
- id: "1.2"
  kind: text
  page: 2
  text: A well-stirred mixture of sugar and water is equally sweet in the first and the last sip. Such
    a mixture is called a homogeneous mixture (Fig. 5.1) or a solution. Other examples of
    homogeneous mixtures are vinegar (acetic acid in water), aerated drinks like soda (carbon
    dioxide in water), etc. A solution always remains homogeneous.
- id: "1.3"
  kind: text
  page: 2
  text: On the other hand, a stirred mixture of sand and water is not uniform. The sand particles are
    easily visible in the water and settle with time. Such a mixture is called a heterogeneous
    mixture (Fig. 5.2). Is the mixture of oil and water homogeneous or heterogeneous? Can you think
    of some other heterogeneous mixtures?
- id: "1.4"
  kind: activity
  page: 2
  number: "Activity 5.1:"
  title: Let us experiment — Group activity
  text: "Activity 5.1: Let us experiment — Group activity Divide the class into three groups — A, B
    and C. Each group prepares a mixture in a colourless, transparent glass tumbler or a 100 mL
    beaker by following these steps: 1. Group A: Add one spatula of common salt to 50 mL of water in
    a beaker and stir it well. Label it A. 2. Group B: Add one spatula of chalk powder to 50 mL of
    water in a beaker and stir it well. Label it B. 3. Group C: Add a few drops of milk to 50 mL of
    water in a beaker and stir it well. Label it C. 4. Are the particles visible in each mixture?
    Record your observations. 5. Direct the light from a laser pointer through the beakers
    containing the mixtures (Fig. 5.3) and observe it from the side of the beaker in a direction
    perpendicular to the laser beam. Record your observations. Safety first: Do not look directly
    into the laser beam. It can cause irreversible eye damage. 6. Predict what you would observe in
    each of the beakers if you leave them undisturbed for a few minutes. 7. Set up a filtration
    apparatus and filter each mixture separately. Is there any residue left on the filter paper? 8.
    Based on your observations, do you think these are the same types of mixtures or are they
    different?"
