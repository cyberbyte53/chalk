- id: "3.1.16"
  kind: text
  page: 9
  text: When we allow a solvent to evaporate to get a solute, such as salt from a salt solution, the
    solvent disappears. However, we may also want to recover the solvent. What should we do then?
- id: "3.1.17"
  kind: text
  page: 9
  text: While experimenting in the laboratory, a student accidentally mixed acetone and water, two
    miscible liquids. How can we separate the two miscible liquids? Is it possible to separate the
    mixture of two miscible liquids by evaporation and obtain both the liquids?
- id: "3.2"
  kind: section
  page: 9
  number: 5.3.2
  title: Distillation
  text: 5.3.2 Distillation
- id: "3.2.1"
  kind: text
  page: 9
  text: A homogeneous mixture of two miscible liquids can be separated by heating the mixture until
    the liquid with the lower boiling point vaporises. The vapour is then cooled, turning back into
    liquid (Fig. 5.11). This process is known as distillation. It allows the recovery of the solvent
    or the separation of liquids that differ in boiling point by at least about 25 °C. This method
    can also be used to separate a liquid from a solution containing dissolved solids.
- id: "3.2.2"
  kind: text
  page: 9
  text: During the process, vapours of the lower-boiling liquid are passed through a condenser where
    they are cooled, usually by circulating water or air and condensed as a pure liquid. The pure
    liquid is collected in a separate vessel, while the solid or other liquid from the mixture
    remains in the distillation flask. A distillation set-up is shown in Fig. 5.12.
- id: "3.2.3"
  kind: box
  page: 9
  title: India’s Scientific Contributions
  text: India’s Scientific Contributions Crystallization of salt was an ancient process used by the
    local communities of the coastal areas in India. The panga salt was obtained by boiling
    concentrated sea brines, while the evaporation of sea water produced the karkatch salt. Salt
    crystals of different sizes were produced by these methods.
- id: "3.2.4"
  kind: figure
