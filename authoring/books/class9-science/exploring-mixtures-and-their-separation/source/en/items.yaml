- id: "2"
  kind: section
  page: 3
  number: "5.2"
  title: Solutions
  text: 5.2 Solutions
- id: "2.1"
  kind: text
  page: 3
  text: You have learnt that solutions are homogeneous mixtures. You have also learnt that solutions
    are prepared when a solute (the substance that gets dissolved) is mixed with a solvent (the
    substance that dissolves the solute). In the mixture of sugar and water, sugar is the solute,
    and water is the solvent. In what proportion are a solute and a solvent present in a solution?
    Can these be expressed quantitatively?
- id: "2.2"
  kind: section
  page: 3
  number: 5.2.1
  title: Concentration of a solution
  text: 5.2.1 Concentration of a solution
- id: "2.2.1"
  kind: text
  page: 3
  text: You have learnt how Oral Rehydration Solution (ORS) is prepared. We add specified amounts of
    salt and sugar to a fixed amount of water to prepare ORS. If we change the amount of salt or
    sugar added to the same volume of water, or change the volume of water for the specified amounts
    of salt and sugar, we will get a solution of salt and sugar in water, but that will not be ORS.
    In other words, we cannot freely add any amount of salt and sugar to a fixed amount of water to
    make ORS.
- id: "2.2.2"
  kind: text
  page: 3
  text: Let us take another example. When farmers spray pesticides on their crops, they must mix the
    right amount of pesticide with a fixed amount of water to prepare a solution. If they do not do
    so, what is likely to happen? Too little pesticide may not protect crops, while too much can
    damage crops, soil and the environment.
- id: "2.2.3"
  kind: text
  page: 3
  text: Can you think of other such examples?
- id: "2.2.4"
  kind: text
  page: 3
  text: The right proportion is always essential when preparing a solution.
- id: "2.2.5"
  kind: text
  page: 3
  text: The amount of solute dissolved in a given amount of solvent or solution is termed as the
    concentration of the solution.
- id: "2.2.6"
  kind: text
  page: 3
  text: Understanding concentration is essential not only in science laboratories but also in everyday
    life, whether in medicine, agriculture, food, cosmetics, or even while making a simple cup of
    tea!
- id: "2.3"
  kind: section
  page: 3
  number: 5.2.2
  title: How do we express concentration?
  text: 5.2.2 How do we express concentration?
- id: "2.3.1"
  kind: text
  page: 3
  text: Let us now explore the different ways to express the concentration of a solution, and
    understand where and why each method is more suitable.
- id: "2.3.2"
  kind: text
  page: 3
  text: Collect some commercial packaged products (Fig. 5.4) and note down the information given for
    each item.
- id: "2.3.3"
  kind: box
  page: 3
  title: Note
  text: Note Not all sugary drinks prepared at home or sold in the market are ORS.
- id: "2.3.4"
  kind: box
  page: 3
  title: Meet a Scientist
  text: Meet a Scientist Dilip Mahalanabis, an Indian paediatrician, first developed and implemented
    the treatment for dehydration caused by diseases, such as diarrhoea and cholera. He formulated
    the ORS that has revolutionised rehydration therapy. It has saved millions of lives after the
    World Health Organization (WHO) popularised it worldwide.
- id: "2.3.5"
  kind: text
  page: 4
  text: The concentration of a solution can be expressed in several ways, a common one being the
    percentage which we are discussing here. You will learn about other methods in higher grades.
- id: "2.3.6"
  kind: text
  page: 4
  text: The three main ways to express the concentration of a solution in terms of percentage are
    given below.
- id: "2.3.7"
  kind: heading
  page: 4
  title: A. Mass by mass percentage (% m/m or % w/w)
  text: A. Mass by mass percentage (% m/m or % w/w)
- id: "2.3.8"
  kind: text
  page: 4
  text: This method is commonly used to express the concentration of homogeneous mixtures. It tells us
    how many grams of solute are present in 100 grams of the total solution.
- id: "2.3.9"
  kind: text
  page: 4
  text: This can be expressed mathematically as,
- id: "2.3.10"
  kind: equation
  page: 4
  number: (5.1)
  text: Mass by mass percentage = Mass of solute Mass of solution × 100 (5.1)
- id: "2.3.11"
  kind: text
  page: 4
  text: This method of expressing concentration is also used for heterogeneous mixtures, such as milk
    powder (Fig. 5.4a) and spice mixtures. It is also used to label the composition of packaged
    foods, showing how much salt, sugar, or protein is present in them.
- id: "2.3.12"
  kind: example
  page: 4
  number: "Example 5.1:"
  text: "Example 5.1: If 10 g of salt is dissolved in 90 g of water, calculate the mass by mass
    percentage of the solution formed."
- id: "2.3.13"
  kind: text
  page: 4
  text: "Answer: Mass of salt (solute) = 10 g Mass of water (solvent) = 90 g Total mass of solution =
    Mass of solute + Mass of solvent = 10 g + 90 g = 100 g Mass by mass percentage = Mass of solute
    Mass of solution × 100 = 10 g 100 g × 100 = 10 % m/m"
  made:
    - {words: L36.6-8, by: agent}
- id: "2.3.14"
  kind: heading
  page: 4
  title: B. Mass by volume percentage (% m/v or % w/v)
  text: B. Mass by volume percentage (% m/v or % w/v)
- id: "2.3.15"
  kind: text
  page: 4
  text: This method is used where measuring the volume of a liquid is easier than weighing it, for
    example, in medicines and laboratories. A common example is 5% glucose solution (Fig. 5.4b). It
    tells us how many grams of the solute is present in 100 millilitres of the solution.
- id: "2.3.16"
  kind: text
  page: 4
  text: Mathematically,
- id: "2.3.17"
  kind: equation
  page: 4
  number: (5.2)
  text: Mass by volume percentage = Mass of solute Volume of solution × 100 (5.2)
- id: "2.3.18"
  kind: example
  page: 4
  number: "Example 5.2:"
  text: "Example 5.2: If 5 g of glucose is dissolved in water to make 100 mL of solution, calculate
    its concentration in mass by volume percentage."
- id: "2.3.19"
  kind: text
  page: 4
  text: "Answer: Mass of glucose (solute) = 5 g Volume of solution = 100 mL Mass by volume percentage
    = Mass of solute Volume of solution × 100 = 5 g 100 mL × 100 = 5 % m/v"
  made:
    - {words: L55.6-8, by: agent}
- id: "2.3.20"
  kind: figure
  page: 4
  number: "Fig. 5.4:"
  text: "(a) (b) (c) Fig. 5.4: Composition of some commercial packaged products (a) milk powder, (b)
    glucose solution, and (c) vinegar"
  crop: [482.8, 129.7, 586.4, 762.1]
  made:
    - {box: true, by: figure-snap}
- id: "2.3.21"
  kind: heading
  page: 5
  title: C. Volume by volume percentage (% v/v)
  text: C. Volume by volume percentage (% v/v)
- id: "2.3.22"
  kind: text
  page: 5
  text: This method is used when two miscible liquids are mixed, for example, in perfumes, cosmetics
    and vinegar (Fig. 5.4c). The volume by volume percentage (% v/v) tells us how many millilitres
    of the solute is present in 100 millilitres of the solution.
- id: "2.3.23"
  kind: text
  page: 5
  text: Mathematically,
- id: "2.3.24"
  kind: equation
  page: 5
  number: "\b(5.3)"
  text: "Volume by volume percentage = Volume of solute Volume of solution × 100 \b(5.3)"
- id: "2.3.25"
  kind: example
  page: 5
  number: "Example 5.3:"
  text: "Example 5.3: If 1 mL of a liquid pesticide is mixed with a sufficient amount of water to form
    100 mL of a pesticide spray for rice crop, calculate its volume by volume percentage."
- id: "2.3.26"
  kind: text
  page: 5
  text: "Answer: Volume of pesticide (solute) = 1 mL Total volume of solution = 100 mL Volume by
    volume percentage = Volume of solute Volume of solution × 100 = 1 mL 100 mL × 100 = 1 % v/v"
  made:
    - {words: L45.6-8, by: agent}
- id: "2.3.27"
  kind: box
  page: 5
  title: Note
  text: Note Commonly used unit in industries is weight by weight percentage (% w/w), as weight and
    mass are generally used interchangeably. Numerically, both % m/m and % w/w are equal to each
    other.
- id: "2.3.28"
  kind: box
  page: 5
  title: Pause and Ponder
  text: Pause and Ponder 1. A common talcum powder contains 4 % m/m zinc oxide, which acts as an
    antiseptic. How much zinc oxide is present in 300 g of the talcum powder? 2. Your mother gives
    you a bottle of orange juice concentrate to mix with water and serve it to your visiting
    friends. She asks you to mix two tablespoons of the concentrate with water in a glass tumbler.
    If each tablespoon measures 15 mL and you make 150 mL of juice per person, what is the % v/v of
    orange juice concentrate in the mixture you prepared? 3. Vinegar, used as a food preservative
    and additive, contains 5 % v/v acetic acid. Glacial acetic acid is a liquid, i.e., 100% acetic
    acid. If you want to make vinegar from glacial acetic acid, how would you proceed?
- id: "2.4"
  kind: section
  page: 5
  number: 5.2.3
  title: Solubility of substances
  text: 5.2.3 Solubility of substances
- id: "2.4.1"
  kind: text
  page: 5
  text: You have learnt that the maximum amount of solute that dissolves in a fixed quantity of the
    solvent (100 mL or 100 g) is called its solubility at a given temperature. A solution that
    cannot dissolve any more solute at that temperature is called a saturated solution. Why do we
    mention the temperature? This is because the solubility of a solid solute in a liquid solvent
    generally increases with temperature. On the other hand, in the case of gases dissolved in
    liquids, their solubility generally decreases with an increase in temperature. Solubility is an
    important property used to separate substances from mixtures. Let us explore it further!
- id: "2.4.2"
  kind: box
  page: 5
  title: Threads of Curiosity
  text: Threads of Curiosity A saline drip in hospitals is usually 0.9 % m/v sodium chloride (common
    salt) in water. That means 0.9 g of salt in 100 mL of solution (Fig. 5.5). 0.9% saline solution
    is safe for blood and replaces lost fluids in the body.
- id: "2.4.3"
  kind: figure
  page: 5
  number: "Fig. 5.5:"
  text: "Fig. 5.5: Saline solution"
  crop: [124.4, 153, 208, 378]
  made:
