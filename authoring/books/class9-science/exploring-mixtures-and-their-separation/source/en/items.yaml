- id: "2.4.4"
  kind: activity
  page: 6
  number: "Activity 5.2:"
  title: Let us represent solubility graphically
  text: "Activity 5.2: Let us represent solubility graphically Consider water as the solvent, and
    compounds ‘A’ and ‘B’ as the solutes. Each substance has a different solubility. A graph of
    solubility versus temperature is called a solubility curve. The solubility curves for ‘A’ and
    ‘B’ as solutes are shown in Fig. 5.6. The x-axis shows temperature (°C), whereas the y-axis
    indicates the solubility of the solute in grams per 100 g of water. Based on the information
    from the above graph, predict which of the two compounds, ‘A’ or ‘B’, will dissolve more in a
    given amount of water at a given temperature? Observe Fig. 5.6 and fill in the blanks of the
    following statements: (i) The solubility of compound ‘A’ in water at 20 °C is ______________
    (less than/more than/similar to) its solubility at 60 °C. (ii) The solubility of compound ‘B’ at
    20 °C is ____________ (less than/ more than/similar to) its solubility at 60 °C. (iii) The
    solubility of _____________ increases more than that of ______________ with an increase in the
    temperature."
