concepts:
  - key: homogeneous-mixture
    concept: समांगी मिश्रण अथवा विलयन का संघटन पूर्णतया एकसमान होता है।
    terms: [समांगी मिश्रण, विलयन]
    items: ["1.1"]
  - key: heterogeneous-mixture
    concept: विषमांगी मिश्रण एकरूप नहीं होता; उसके कण स्पष्ट दिखाई देते हैं और तली पर बैठ सकते हैं।
    terms: [विषमांगी मिश्रण]
    items: ["1.2"]
  - key: solute-and-solvent
    concept: विलयन में विलेय वह पदार्थ है जो घुलता है और विलायक वह पदार्थ है जिसमें विलेय घुलता है।
    terms: [विलेय, विलायक]
    items: ["2.1"]
  - key: concentration
    concept: विलेय की वह मात्रा जो विलायक अथवा विलयन की किसी मात्रा में घुली होती है, विलयन की सांद्रता है; विलयन बनाने में सही अनुपात सदैव आवश्यक है।
    terms: [सांद्रता]
    items: ["2.2.4", "2.2.5"]
  - key: mass-by-mass-percentage
    concept: द्रव्यमान-द्रव्यमान प्रतिशत बताता है कि 100 g विलयन में विलेय के कितने ग्राम विद्यमान हैं।
    terms: []
    items: ["2.3.9", "2.3.11"]
  - key: mass-by-volume-percentage
    concept: द्रव्यमान-आयतन प्रतिशत बताता है कि 100 mL विलयन में विलेय के कितने ग्राम हैं; यह तब प्रयुक्त होता है जब द्रव का आयतन मापना तोलने से सुगम हो।
    terms: []
    items: ["2.3.16", "2.3.18"]
  - key: volume-by-volume-percentage
    concept: आयतन-आयतन प्रतिशत बताता है कि 100 mL विलयन में विलेय के कितने mL हैं; यह दो मिश्रणीय द्रवों को मिश्रित करते समय प्रयुक्त होता है।
    terms: []
    items: ["2.3.23", "2.3.24"]
  - key: solubility-and-saturation
    concept: किसी निश्चित तापमान पर विलायक की निश्चित मात्रा में घुलने वाली विलेय की अधिकतम मात्रा उसकी विलेयता है; जो विलयन और अधिक विलेय नहीं घोल सकता, वह संतृप्त विलयन है।
    terms: [विलेयता, संतृप्त]
    items: ["2.4.1"]
  - key: solubility-changes-with-temperature
    concept: द्रव विलायक में ठोस विलेयों की विलेयता प्रायः तापमान बढ़ने के साथ बढ़ती है, जबकि गैसों की विलेयता घटती है।
    terms: []
    items: ["2.4.1"]
  - key: solubility-curve
    concept: तापमान के सापेक्ष विलेयता का ग्राफ विलेयता वक्र है, जिससे पदार्थों की विलेयता की तुलना की जा सकती है।
    terms: [विलेयता वक्र]
    items: ["2.4.4"]
  - key: cooling-a-saturated-solution
    concept: गर्म संतृप्त विलयन को ठंडा करने पर नई विलेयता से अधिक विलेय शुद्ध ठोस क्रिस्टलों के रूप में पृथक हो जाता है; क्रिस्टल कणों के नियमित ज्यामितीय प्रतिरूप से बना ठोस है।
    terms: [क्रिस्टल]
    items: ["3.1.1"]
  - key: crystallization
    concept: संतृप्त विलयन से क्रिस्टल बनाने की प्रक्रिया क्रिस्टलीकरण है; यह विभिन्न तापमानों पर विलेयता के अंतर से घुलनशील ठोसों को पृथक अथवा शुद्ध करती है।
    terms: [क्रिस्टलीकरण]
    items: ["3.1.4", "3.1.10"]
  - key: distillation
    concept: आसवन में कम क्वथनांक वाला द्रव वाष्पित होकर संघनित्र में पुनः द्रव बनता है; इससे कम-से-कम 25 °C क्वथनांक अंतर वाले द्रव, अथवा घुले ठोसों से द्रव, पृथक होते हैं।
    terms: [आसवन]
    items: ["3.2.1", "3.2.2"]
  - key: fractional-distillation
    concept: प्रभाजी आसवन उन घटकों को पृथक करता है जिनके क्वथनांकों में 25 °C से कम अंतर हो, जैसे अपरिष्कृत पेट्रोलियम के परिशोधन में।
    terms: [प्रभाजी आसवन]
    items: ["3.2.9"]
  - key: paper-chromatography
    concept: कागज वर्णलेखिकी में विलायक मिश्रण के घटकों को कागज पर ऊपर ले जाता है और उनकी गति के अंतर से उन्हें पृथक कर देता है।
    terms: [कागज वर्णलेखिकी]
    items: ["3.3.3"]
  - key: separating-immiscible-liquids
    concept: अमिश्रणीय द्रव परस्पर नहीं मिलते, पृथक परतें बनाते हैं, और पृथक्कारी कीप से उन्हें एक-एक करके निकाला जाता है।
    terms: [अमिश्रणीय]
    items: ["4.1.1", "4.1.4"]
  - key: gas-mixtures
    concept: गैसें सरलता एवं समान रूप से मिल जाती हैं, अतः गैसों के अधिकांश मिश्रण समांगी होते हैं, जबकि धुआँ, कोहरा और वायु में धूल विषमांगी मिश्रण हैं।
    terms: []
    items: ["4.1.6"]
  - key: sublimation-and-deposition
    concept: ठोस का द्रव बने बिना सीधे वाष्प बनना ऊर्ध्वपातन है और वाष्प का सीधे ठोस बनना निक्षेपण है; इससे कर्पूर रेत से पृथक हो जाता है।
    terms: [ऊर्ध्वपातन, निक्षेपण]
    items: ["4.2.2"]
  - key: alloy
    concept: दो अथवा अधिक धातुओं का, अथवा एक धातु और एक अधातु का समांगी मिश्रण मिश्रधातु है, जिसके घटक भौतिक विधियों से पृथक नहीं होते।
    terms: [मिश्रधातु]
    items: ["4.2.6"]
  - key: suspension
    concept: निलंबन ऐसा विषमांगी मिश्रण है जिसमें अघुलनशील, नग्न आँखों से दिखने वाले कण संपूर्ण माध्यम में निलंबित रहते हैं।
    terms: [निलंबन]
    items: ["4.3.1"]
  - key: centrifugation
    concept: अपकेंद्रण में मिश्रण को तीव्र गति से घुमाया जाता है जिससे भारी कण बाहर की ओर जाकर तली पर बैठ जाते हैं, जैसे रक्त के घटकों को पृथक करने में।
    terms: [अपकेंद्रण]
    items: ["4.3.6", "4.3.10"]
  - key: coagulation
    concept: स्कंदन में फिटकरी जैसा स्कंदक मिलाया जाता है जिससे सूक्ष्म निलंबित कण गुच्छे बनाकर तली पर बैठ जाते हैं।
    terms: [स्कंदन, स्कंदक]
    items: ["4.3.13"]
  - key: colloid
    concept: रक्त और दुग्ध जैसे कोलॉइड न विलयन हैं न निलंबन; उनके कण तली पर नहीं बैठते और समान रूप से फैले रहते हैं।
    terms: [कोलॉइड]
    items: ["4.4.5", "4.4.10"]
  - key: particle-size-sets-the-kind
    concept: विलयन, कोलॉइड और निलंबन मुख्यतः कणों के आकार से भिन्न होते हैं — 1 nm से कम, 1 से 1000 nm तक, और 1000 nm से अधिक।
    terms: []
    items: ["4.4.9"]
  - key: tyndall-effect
    concept: कोलॉइड और निलंबन से गुजरने पर प्रकाश का प्रकीर्णन होता है, जिसे टिंडल प्रभाव कहते हैं, परंतु पारदर्शी विलयन में ऐसा नहीं होता।
    terms: [टिंडल प्रभाव]
    items: ["5.2", "5.5"]
  - key: dispersed-phase-and-medium
    concept: कोलॉइड के घटक परिक्षिप्त प्रावस्था (परिक्षिप्त कण) और परिक्षेपण माध्यम (जिसमें वे निलंबित रहते हैं) हैं।
    terms: [परिक्षिप्त प्रावस्था, परिक्षेपण माध्यम]
    items: ["5.6"]
