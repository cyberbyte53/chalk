  text: दूसरी ओर, जल और रेत का विलोडित मिश्रण एकरूप नहीं होता है। रेत के कण जल में स्पष्ट दिखाई देते
    हैं और कुछ समय पश्चात तली पर बैठ जाते हैं। ऐसे मिश्रण को विषमांगी मिश्रण (heterogeneous mixture)
