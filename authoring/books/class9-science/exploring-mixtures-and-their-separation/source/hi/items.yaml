- id: "2.2.1"
  kind: text
  page: 3
  text: आपने सीखा है कि ‘ओरल रिहाइड्रेशन सॉल्यूशन’ (ORS) किस प्रकार बनाया जाता है। हम ओरल रिहाइड्रेशन
    सॉल्यूशन बनाने के लिए नमक और चीनी की नियत मात्राएँ जल की एक निश्चित मात्रा में मिश्रित करते हैं।
    यदि हम जल के किसी निश्चित आयतन में नमक अथवा चीनी की मात्राओं में परिवर्तन कर देते हैं अथवा नमक
    एवं चीनी की निर्दिष्ट मात्राओं के लिए जल के आयतन में परिवर्तन कर देते हैं, तो हमें जल में नमक
    तथा चीनी का विलयन तो प्राप्त होगा परंतु वह ओरल रिहाइड्रेशन सॉल्यूशन नहीं होगा। अन्य शब्दों में,
    हम ओरल रिहाइड्रेशन सॉल्यूशन बनाने के लिए जल की एक निश्चित मात्रा में नमक तथा चीनी को अनियत
