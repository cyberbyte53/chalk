- id: "4.4.6"
  kind: box
  page: 16
  title: विज्ञान एवं समाज
  text: विज्ञान एवं समाज रक्तदान करें रक्तदान जीवनरक्षक है। व्यक्तियों को आपातकालीन स्थितियों में,
    शल्यचिकित्सा के समय अथवा गंभीर रोगों में रक्ताधान की आवश्यकता हो सकती है जिसमें एक स्वस्थ
    व्यक्ति के शरीर से किसी रोगी व्यक्ति के शरीर में रक्त का स्थानांतरण किया जाता है। दान किए गए
    रक्त का परीक्षण किया जाता है और रक्त समूह की पहचान कर उसे रक्त के घटकों, जैसे— प्लाज्मा,
    प्लेटलेट, श्वेत तथा लाल रक्त कणिकाओं में पृथक किया जाता है (चित्र 5.22)। इनका रक्त बैंकों में
    सुरक्षित भंडारण किया जाता है और आवश्यकता पड़ने पर आपूर्ति की जाती है। अध्याय 3, क्रियाशील ऊतक
    में आपने अध्ययन किया है कि रक्त पोषक तत्वों, जैसे — गैसों तथा हार्मोनों का परिवहन करके शरीर के
    विभिन्न भागों को जोड़ता है। शरीर कुछ ही सप्ताहों में दान किए गए रक्त की पूर्ति प्राकृतिक रूप से
    स्वयं कर लेता है जो रक्तदान को सुरक्षित और सहायक बनाता है। क्या आप अपना रक्त समूह जानते हैं? पता
    लगाइए!
