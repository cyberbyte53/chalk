- id: "4.3.13"
  kind: text
  page: 15
  text: फिटकरी (alum) के चूर्ण को पंकिल जल से भरे एक बीकर में मिलाया जा सकता है (चित्र 5.21क)। फिटकरी
    एक श्वेत क्रिस्टलीय रासायनिक पदार्थ है जिसका उपयोग प्रायः जल शुद्धिकरण में किया जाता है। फिटकरी
    सूक्ष्म निलंबित कणों को एकत्रित (गुच्छों के रूप में) कर देती है। इस प्रक्रिया को स्कंदन
    (coagulation) कहते हैं तथा फिटकरी एक स्कंदक (coagulant) के रूप में कार्य करती है (चित्र 5.21 ख)।
    इस प्रकार बने बड़े-बड़े गुच्छे गुरुत्वाकर्षण के कारण तली पर बैठ जाते हैं जिसे अवसादन
    (sedimentation) कहते हैं जैसा कि चित्र 5.21 ग में दर्शाया गया है। इन्हें जल से निस्तारण
    (decantation) अथवा निस्यंदन (filtration) द्वारा पृथक किया जा सकता है।
