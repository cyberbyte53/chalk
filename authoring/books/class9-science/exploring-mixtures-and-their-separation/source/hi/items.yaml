- id: "5.7"
  kind: box
  page: 17
  title: जिज्ञासा-सूत्र
  text: जिज्ञासा-सूत्र कुछ सामान्य कोलॉइड जिनका हम अपने दैनिक जीवन में प्रयोग करते हैं उनमें
    परिक्षिप्त प्रावस्था और परिक्षेपण माध्यम दोनों ही द्रव होते हैं। इन्हें पायस (इमल्शन) कहा जाता
    है। तेल और जल वाले पायसों को परिक्षिप्त प्रावस्था और परिक्षेपण माध्यम की प्रकृति के आधार पर दो
    प्रकारों में बाँटा जाता है — जल में तेल अथवा तेल में जल। दुग्ध, बॉडी लोशन और वैनिशिंग क्रीम जल
    में तेल पायस के सामान्य उदाहरण हैं जबकि मक्खन, कोल्ड क्रीम आदि तेल में जल पायस के उदाहरण हैं।
    कुछ औषधियाँ पायस के रूप में बनाई जाती हैं जिससे इन्हें जल में परिक्षेपित कर सुगम रूप से पीने
    योग्य बनाया जा सके। इससे द्रव औषधि में चिकनाई जैसा अनुभव भी कम हो जाता है। पायसी कारकों की
    उपस्थिति पायस को स्थिर करती है। उदाहरणार्थ — दुग्ध और मक्खन में प्रोटीन पायसी कारक का कार्य करता
    है। आप खाद्य तेल की कुछ बूँदों को साबुन के विलयन की कुछ बूँदों वाले जल में भली-भाँति मिलाकर एक
    पायस बना सकते हैं।
