  page: 18
  text: क्या आप जानते हैं कि प्रकृति में और हमारे शरीर में भी अपशिष्ट पदार्थों का पृथक्करण होता है?
    उदाहरणार्थ— हमारे गुर्दे हमारे रक्त से अपशिष्ट पदार्थों को पृथक करते हैं। वर्तमान में हम
    महासागरों और नदियों से प्लास्टिक कचरा हटाकर उन्हें साफ करने जैसी बड़ी चुनौतियों का सामना कर रहे
    हैं। इसके साथ ही वाहित मल जल को पर्यावरण में प्रवाहित करने से पूर्व उसका उपचार करना अति आवश्यक
    है। वाहित मल उपचार में अवसादन, स्कंदन और निस्यंदन जैसी प्रक्रियाएँ सम्मिलित हैं। इस प्रकार
    प्राप्त स्वच्छ जल को शौचालयों में अथवा पौधों को सींचने के लिए पुनः उपयोग में लाया जा सकता है।
