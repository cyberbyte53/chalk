  text: आप मिश्रणों तथा उनके पृथक्करण की कुछ सरल विधियों के विषय में पहले ही सीख चुके हैं। इस अध्याय
    में आप मिश्रणों के गुणधर्मों, व्यवहार और उन्हें पृथक करने की विभिन्न विधियों का विस्तारपूर्वक
