  text: "क्रियाकलाप 5.6 — आइए, पृथक करें 1. एक 50 mL पृथक्कारी कीप में 5 mL सरसों का तेल और 20 mL जल
    का मिश्रण लीजिए। 2. इसे प्रयोगशाला स्टैंड पर स्थिर रहने दीजिए। (चित्र 5.16) आप क्या देखते हैं?
    3. आप सरसों के तेल और जल की दो पृथक परतों को बनते हुए देखेंगे (चित्र 5.16)। पीले रंग का सरसों का
    तेल ऊपरी परत और जल निचली परत बनाता है। क्या आप समझा सकते हैं कि ऐसा क्यों होता है? 4. पृथक्कारी
    कीप का स्टॉपकॉक धीरे-धीरे खोलिए और जल की निचली परत को सावधानीपूर्वक एक पात्र में एकत्रित कीजिए।
    5. जब जल लगभग पूर्ण रूप से निकल जाए तो पृथक्कारी कीप का स्टॉपकॉक बंद कर दीजिए। 6. अब इसके थोड़े
    से भाग, जिसमें दोनों द्रव मिले हो सकते हैं, को एकत्रित कर लीजिए और इसे अलग रख दीजिए। 7. अब
    स्टॉपकॉक को पुन: खोल कर तेल की परत को एक अलग पात्र में एकत्रित कीजिए। अब आपके पास दो पृथक द्रव
    हैं।"
