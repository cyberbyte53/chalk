    इससे कुछ बड़े कण तो हट जाएँगे परंतु जल प्राय: धुँधला ही रहता है। यह दर्शाता है कि सूक्ष्म कणों
    को पृथक करने के लिए निस्यंदन सदैव पर्याप्त नहीं होता है। यदि कुछ समय रखने के पश्चात भी पंकिल जल
