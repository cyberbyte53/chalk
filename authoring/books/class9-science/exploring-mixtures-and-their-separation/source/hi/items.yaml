  title: आइए, क्रिस्टल बनाएँ
  text: क्रियाकलाप 5.3 — आइए, क्रिस्टल बनाएँ 1. कॉपर सल्फेट (नीला थोथा) का एक प्रतिदर्श लीजिए। यदि
    कॉपर सल्फेट उपलब्ध न हो, तो आप साधारण नमक का उपयोग भी विकल्प के रूप में कर सकते हैं। सुरक्षा
    सर्वोपरि— कॉपर सल्फेट अविषालु होता है। यह प्रयोग किसी वयस्क की देखरेख में ही करना चाहिए और ध्यान
    रखें कि कॉपर सल्फेट को नग्न हाथों से कभी भी स्पर्श न करें। 2. 100 mL के एक बीकर में 1 g कॉपर
    सल्फेट लीजिए। बीकर में 25 mL जल और तनु सल्फ्यूरिक अम्ल की एक बूँद डालिए। मिश्रण को निरंतर
    विलोडित करते हुए जल-ऊष्मक पर धीरे-धीरे गर्म कीजिए। सल्फ्यूरिक अम्ल अवांछित अभिक्रियाओं को
    अवरुद्ध कर शुद्ध क्रिस्टल बनाने में सहायता करता है। सुरक्षा सर्वोपरि— यह सलाह दी जाती है कि
    सल्फ्यूरिक अम्ल को शिक्षक द्वारा बीकर में डाला जाना चाहिए। सल्फ्यूरिक अम्ल का उपयोग अत्यंत
    सावधानीपूर्वक कीजिए। 3. धीरे-धीरे कॉपर सल्फेट की कुछ और मात्रा तब तक मिलाइए जब तक कि विलयन
    संतृप्त न हो जाए (चित्र 5.8 क)। 4. अघुलनशील अशुद्धियों को पृथक करने के लिए गर्म विलयन का
    निस्यंदन कीजिए (छान लीजिए) (चित्र 5.8 ख)। निस्यंद को एक स्वच्छ बीकर में एकत्रित कीजिए और इसे वॉच
    ग्लास से ढक दीजिए। 5. इसे स्थिर रखकर धीरे-धीरे ठंडा होने दीजिए (चित्र 5.8 ग)। इससे विलयन में
    विद्यमान कणों को संगठित होकर नीले रंग के बड़े, चमकदार एवं सुरूपित क्रिस्टल बनने के लिए पर्याप्त
    समय मिल जाता है। 6. निर्मित क्रिस्टलों को निस्यंदित कर लीजिए। अब इन्हें ठंडे जल से धोइए तथा वॉच
    ग्लास पर सूखने के लिए रख दीजिए (चित्र 5.8 घ)। आप यह प्रयास भी कर सकते हैं— 1. संतृप्त कॉपर
    सल्फेट विलयन के 1–2 mL काँच की एक छोटी प्लेट अथवा लेमिनेशन शीट पर रखिए। 2. इसे कुछ समय के लिए
