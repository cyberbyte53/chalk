- id: "1.1"
  kind: text
  page: 2
  text: आप जानते हैं कि चीनी और जल के मिश्रण का संघटन पूर्णतया एकसमान होता है। जल में घुली चीनी के
    मिश्रण का स्वाद प्रथम और अंतिम घूँट में समान रूप से मीठा होता है। ऐसे मिश्रण को समांगी मिश्रण
    (homogeneous mixture) (चित्र 5.1) अथवा विलयन कहते हैं। सिरका (जल में ऐसीटिक अम्ल), वातित पेय
    (aerated drinks) जैसे सोडा जल (जल में कार्बन डाइऑक्साइड) इत्यादि समांगी मिश्रणों के अन्य उदाहरण
    हैं। एक विलयन सदैव समांगी होता है।
