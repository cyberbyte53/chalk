- id: "5.16.25"
  kind: text
  page: 22
  text: विभिन्न कोलॉइडों का उपयोग करते हुए टिंडल प्रभाव प्रदर्शित कीजिए। प्रयोगों की एक ऐसी शृंखला
    बनाइए जो यह दर्शाए कि किस प्रकार कोलॉइडों में प्रकाश का प्रकीर्णन प्रकाश किरण पुँज को दृश्यमान
    बनाता है। प्रदर्शन के लिए लेसर संकेतक, (सुरक्षा सर्वप्रथम— किसी वयस्क के निरीक्षण में इसका उपयोग
    करें) क्षणदीपों अथवा अन्य प्रकाश स्रोतों का उपयोग कीजिए। विभिन्न यौगिकों (जैसे— साधारण नमक,
    एप्सम लवण, चीनी, बोरेक्स, निकेल सल्फेट इत्यादि) के क्रिस्टल बनाइए। उनका किसी आवर्धित लेंस अथवा
    सूक्ष्मदर्शी से अवलोकन कीजिए। उनके रंगों तथा आकारों को नोट कीजिए। क्या लाल पत्तियों में भी हरित
    वर्णक होता है? कागज वर्णलेखिकी द्वारा इसकी जाँच कीजिए। आप खाद्य वर्णकों (हरा, नारंगी, पीला
    इत्यादि) अथवा रंगीन मुखवासों (सौंफ) में उपस्थित संघटकों की संख्या ज्ञात करने के लिए वर्णलेखिकी
    का प्रयोग कर सकते हैं। ऐसे शैक्षिक खेल की अभिकल्पना कीजिए जिसमें खिलाड़ी पारस्परिक चुनौतियों और
    व्यावहारिक क्रियाकलापों द्वारा विभिन्न मिश्रणों को पहचानने एवं पृथक्करण करने की तकनीकों का
    अनुप्रयोग कर सकें। यदि आप किसी खुले स्थान में शिविर लगा रहे हैं और स्वच्छ जल कम पड़ जाए तो आप
    आसवन विधि द्वारा स्वच्छ जल प्राप्त कर सकते हैं। क्या आप वहाँ उपलब्ध वस्तुओं से ऐसी व्यवस्था
