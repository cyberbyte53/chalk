  title: विज्ञान एवं समाज
  text: "विज्ञान एवं समाज पेपरफ्यूज अपकेंद्रण की प्रक्रिया सामान्यत: विद्युत मशीन के उपयोग द्वारा
    संपन्न की जाती है किंतु नवीन विचारों को अनुप्रयुक्त कर एक साधारण खिलौना पेपरफ्यूज बनाया जाता है।
    यह सरल हस्तचालित उपकरण है (चित्र 5.20) और विद्युत के उपयोग के बिना भी इसी प्रक्रिया का निष्पादन
    कर सकता है। पेपरफ्यूज, रक्त के प्रतिदर्शों को अति तीव्र गति से घुमाकर भारी घटकों से हल्के घटकों
    को किसी प्रयोगशाला अपकेंद्रित्र (centrifuge) की भाँति ही पृथक कर देता है। यह निम्न लागत का उपकरण
    दूरस्थ क्षेत्रों में मलेरिया और ऐनीमिया जैसे रोगों की जाँच करने में सहायता कर सकता है। ऐसे सरल
    तकनीकी आविष्कारों के विषय में और जानकारी प्राप्त करें जो सुदूर क्षेत्रों में चिकित्सा सेवाओं को
    अधिक सुलभ बनाएँ।"
