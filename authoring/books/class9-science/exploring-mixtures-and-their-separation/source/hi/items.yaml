- id: "3.2.7"
  kind: box
  page: 10
  title: भारत का वैज्ञानिक योगदान
  text: भारत का वैज्ञानिक योगदान आसवन की प्रक्रिया का उपयोग लंबे समय से विभिन्न उद्देश्यों के लिए किया
    जाता रहा है जिसमें पुष्पों से सुगंधित पदार्थों का निष्कर्षण कर इत्र बनाना भी सम्मिलित है। आपने
    अवश्य अनुभव किया होगा कि पहली वर्षा के पश्चात मिट्टी से एक सोंधी सुगंध उठती है। उत्तर प्रदेश के
    कन्नौज शहर, जिसे भारत की इत्र राजधानी कहा जाता है, में इस मनमोहक सुगंध को संकलित कर सोंधी सुगंध
    वाला ‘मिट्टी का इत्र’ (सोंधी सुगंध) तैयार किया जाता है। यह इत्र एक पारंपरिक आसवन विधि द्वारा
    बनाया जाता है। इत्र बनाने की इस विधि को ‘देग भापका विधि’ (चित्र 5.13) कहा जाता है। यह विधि
    कन्नौज में पीढ़ी-दर-पीढ़ी हस्तांतरित होती रही है। इस इत्र की माँग भारत के साथ-साथ संपूर्ण विश्व
    में बड़े स्तर पर है। कन्नौज स्थित सुगंध एवं स्वाद विकास केंद्र में पुष्पों, पत्तियों तथा पादपों
    के अन्य भागों से स्वाद एवं सुगंध अवयवों को पृथक करने की सुविधाएँ उपलब्ध हैं। यह केंद्र
    सुगंध-उत्पादक पादपों की खेती में कृषकों की सहायता करता है तथा इत्र व्यवसाय स्थापित करने के
    इच्छुक व्यक्तियों को विशेषज्ञों द्वारा मार्गदर्शन प्रदान करता है।
