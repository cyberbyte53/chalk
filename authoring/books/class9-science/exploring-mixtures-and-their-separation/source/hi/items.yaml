- id: "5.15"
  kind: box
  page: 18
  title: सारांश
  text: सारांश मिश्रणों को समांगी अथवा विषमांगी के साथ-साथ विलयनों, निलंबनों और कोलॉइडों के रूप में भी
    वर्गीकृत किया जाता है। शुद्ध पदार्थ प्राप्त करने के लिए मिश्रणों का पृथक्करण एक महत्वपूर्ण
    प्रक्रिया है। क्रिस्टलीकरण, किसी शुद्ध ठोस को उसके संतृप्त विलयन से प्राप्त करने की एक तकनीक है।
    आसवन विधि का उपयोग उन दो मिश्रणीय द्रवों को पृथक करने के लिए किया जाता है जिनके क्वथनांकों में
    कम से कम 25°C का अंतर हो। इसका उपयोग किसी द्रव और ठोस के मिश्रण से द्रव प्राप्त करने के लिए भी
    किया जाता है। कागज वर्णलेखिकी का उपयोग कागज पर यौगिकों को उनकी गति के अंतर के आधार पर पृथक करने
    के लिए किया जाता है। दो भिन्न घनत्वों वाले मिश्रणीय द्रवों को पृथक करने के लिए पृथक्कारी कीप का
    उपयोग किया जाता है। ठोस का बिना द्रव में परिवर्तित हुए सीधे वाष्प में (उनके गलनांक से निम्न
    तापमान पर) परिवर्तन ऊर्ध्वपातन कहलाता है। वह प्रक्रिया जिसमें वाष्प ठंडी होकर द्रव में परिवर्तित
    हुए बिना सीधे ठोस में परिवर्तित हो जाती है, निक्षेपण कहलाती है। अपकेंद्रण में किसी ठोस-द्रव
    मिश्रण से भारी ठोस कणों को पृथक करने के लिए तीव्र चक्रण का उपयोग किया जाता है। स्कंदन की
