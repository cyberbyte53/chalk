- id: "1.3"
  kind: activity
  page: 2
  number: क्रियाकलाप 5.1—
  title: आइए, प्रयोग करें — सामूहिक क्रियाकलाप
  text: क्रियाकलाप 5.1— आइए, प्रयोग करें — सामूहिक क्रियाकलाप कक्षा को तीन समूहों—‘क’, ‘ख’ और ‘ग’ में
    विभाजित कीजिए। निम्नलिखित चरणों का पालन करते हुए प्रत्येक समूह एक रंगहीन, पारदर्शी काँच के गिलास
    अथवा एक 100 mL बीकर में मिश्रण बनाएगा। 1. समूह ‘क’— एक बीकर में 50 mL जल तथा एक स्पैचुला भरकर
    साधारण नमक डालिए और इसे भली-भाँति विलोडित कीजिए। बीकर पर ‘क’ अंकित कीजिए। 2. समूह ‘ख’— एक बीकर
    में 50 mL जल तथा एक स्पैचुला भरकर चॉक का चूर्ण लीजिए और भली-भाँति विलोडित कीजिए। बीकर पर ‘ख’
    अंकित कीजिए। 3. समूह ‘ग’— एक बीकर में 50 mL जल तथा दुग्ध की कुछ बूँदें डालिए और भली-भाँति
    विलोडित कीजिए। बीकर पर ‘ग’ अंकित कीजिए। 4. क्या आपको प्रत्येक मिश्रण में कण दिखाई दे रहे हैं?
    अपने अवलोकनों को अभिलेखित कीजिए। 5. किसी लेसर संकेतक से निकले प्रकाश किरणपुंज को एक-एक करके
    मिश्रणों के पात्रों पर डालिए (चित्र 5.3) और बीकर के पार्श्व से लेसर पुंज की लंबवत दिशा में उसका
    अवलोकन कीजिए। अपने अवलोकनों को अभिलेखित कीजिए। सुरक्षा सर्वोपरि — लेसर किरणपुंज पर सीधी दृष्टि
    नहीं डालनी चाहिए। इससे नेत्रों को अपूर्णीय क्षति पहुँच सकती है। 6. अनुमान लगाइए कि यदि इन बीकरों
    को कुछ क्षणों के लिए स्थिर रखा जाए तो प्रत्येक बीकर में आपको क्या दिखाई देगा? 7. एक निस्यंदन
    उपकरण व्यवस्थित कीजिए और उसकी सहायता से प्रत्येक मिश्रण का पृथक-पृथक निस्यंदन कीजिए। क्या
    निस्यंदक पत्र पर कोई अवशेष रहता है? 8. अपने अवलोकनों के आधार पर बताइए कि क्या ये सभी मिश्रण एक
    ही प्रकार के हैं अथवा भिन्न-भिन्न प्रकार के हैं?
