  text: आइए, चित्र 5.2 में दर्शाए गए पात्र को ध्यानपूर्वक देखें। आप चाहे कितना भी विलोडित करें, रेत के
    कण स्पष्ट रूप से देखे जा सकते हैं जबकि विलयन में विलेय के कण दिखाई नहीं देते हैं। ऐसे विषमांगी
    मिश्रण जिनमें ठोस कण (रेत) घुलते नहीं हैं अपितु संपूर्ण माध्यम (जल) में निलंबित रहते हैं, निलंबन
    (suspensions) कहलाते हैं। निलंबन में अघुलनशील पदार्थ के कणों का आकार विलयन के कणों की अपेक्षा
    बड़ा होता है। किसी निलंबन के कण नग्न आँखों से दिखाई देते हैं। जल में निलंबित लकड़ी का बुरादा और
