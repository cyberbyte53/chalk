  text: आइए, और आगे बढ़ें पेट्रोलियम परिशोधनशाला (refinery) (चित्र 5.14 क) एक औद्योगिक इकाई है जहाँ
    कच्चे तेल (crude oil) को संसाधित कर विभिन्न उपयोगी पेट्रोलियम उत्पाद प्राप्त किए जाते हैं।
    पेट्रोलियम उत्पाद उपयोगी गैसों और द्रवों के मिश्रण हैं, जैसे— पेट्रोलियम गैस, पेट्रोल, किरोसिन,
    डीजल इत्यादि। अपरिष्कृत पेट्रोलियम पृथ्वी की भू-पर्पटी से निकाला जाता है और इसे प्रभाजी आसवन
    (fractional distillation) की प्रक्रिया द्वारा विभिन्न प्रभाजों में पृथक किया जाता है (चित्र 5.14
    ख)। प्रभाजी आसवन वह प्रक्रिया है जिसके द्वारा मिश्रण के ऐसे घटकों को पृथक किया जाता है जिनके
    क्वथनांकों में अपेक्षाकृत कम अंतर (25 °C से कम) होता है। गैसीय प्रभाज को उच्च दाब पर इस्पात के
    सिलेंडरों में भरा जाता है जहाँ वह द्रवीकृत हो जाती है। इसका उपयोग घरेलू ईंधन के रूप में द्रवीकृत
    पेट्रोलियम गैस (LPG) के रूप में किया जाता है।
