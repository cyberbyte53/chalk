concepts:
  - key: matter-made-of-atoms
    concept: Everything around us, living or non-living, is matter, and matter is made of tiny particles called atoms, too small to see.
    terms: [matter, atoms]
    items: ["0.3"]
  - key: early-ideas-of-indivisible-particles
    concept: Acharya Kanada (parmanu) and the Greek thinkers Leucippus and Democritus (atomos) imagined matter as made of indivisible particles, an idea not yet based on experiments.
    terms: []
    items: ["1.2", "1.3", "1.4"]
  - key: dalton-atomic-theory
    concept: Dalton's atomic theory (1808), based on experiments, said all matter is made of indivisible atoms, the first scientific description of how matter is made.
    terms: []
    items: ["1.5"]
  - key: models-change-with-evidence
    concept: Scientists proposed models of the atom and changed them as new experiments gave new evidence; science moves forward one step at a time.
    terms: []
    items: ["2.1"]
  - key: radioactivity-shows-atoms-divisible
    concept: Some elements emit invisible energy and particles (radiation), a phenomenon called radioactivity, which showed that atoms are made of smaller particles.
    terms: [radiation, radioactivity]
    items: ["2.2"]
  - key: electron-discovered
    concept: Thomson's cathode ray experiments showed that all atoms contain electrons, tiny negatively charged particles much lighter than atoms; an electron's charge is taken as −1.
    terms: [electrons]
    items: ["2.3", "2.5"]
  - key: thomson-model
    concept: Thomson's model pictured the atom as a sphere of positive charge with electrons spread through it, like a plum pudding or the seeds in a watermelon, so that the atom is neutral.
    terms: []
    items: ["2.6.1"]
  - key: gold-foil-experiment
    concept: In the gold foil experiment, most alpha particles passed straight through thin gold foil, some were deflected sharply and a few bounced back, which Thomson's model could not explain.
    terms: [scattering, α-ray scattering experiment]
    items: ["2.7.1", "2.7.3"]
  - key: rutherford-nuclear-model
    concept: Rutherford concluded that an atom is mostly empty space, with all its positive charge and most of its mass in a tiny dense nucleus at the centre, and electrons revolving around it like planets.
    terms: [nucleus, planetary model]
    items: ["2.7.6"]
  - key: nucleus-is-tiny
    concept: The nucleus is about 10⁵ times smaller than the atom (atom about 10⁻¹⁰ m across, nucleus about 10⁻¹⁵ m), like a pepper grain at the centre of a cricket ground.
    terms: []
    items: ["2.7.7"]
  - key: rutherford-model-unstable
    concept: Rutherford's model could not explain why atoms are stable, since an electron moving in a circle accelerates, should lose energy and spiral into the nucleus.
    terms: []
    items: ["2.7.14", "2.7.15"]
  - key: proton-and-neutral-atom
    concept: The nucleus's positive charge comes from protons, much heavier than electrons, with a charge equal and opposite to an electron's; an atom has as many protons as electrons, so it is neutral.
    terms: [protons]
    items: ["2.7.18", "2.7.19"]
  - key: bohr-model
    concept: In Bohr's model, electrons move only in fixed shells (orbits, energy levels) K, L, M, N, ... (n = 1, 2, 3, 4, ...), each with a definite energy that rises away from the nucleus, and do not lose energy while in a shell.
    terms: [stationary states, orbits, shells, energy levels]
    items: ["2.8.1"]
  - key: electron-jumps-between-shells
    concept: An electron moves to another shell by absorbing or releasing energy equal to the difference between the two levels' energies.
    terms: []
    items: ["2.8.1"]
  - key: bohr-explains-stability
    concept: Bohr explained the atom's stability by stationary states, in which an electron's energy stays constant while it moves; later the quantum mechanical model replaced Bohr's model.
    terms: []
    items: ["2.8.2", "2.8.5"]
  - key: neutron-discovered
    concept: Chadwick discovered the neutron, a neutral particle in the nucleus with about a proton's mass, which explains why atoms are heavier than their protons alone; neutrons are in all nuclei except hydrogen's.
    terms: [neutron]
    items: ["3.2", "3.3.1"]
  - key: subatomic-particles-charges
    concept: The three subatomic particles are the electron (e⁻, charge −1), the proton (p⁺, +1) and the neutron (n⁰, 0).
    terms: []
    items: ["3.3.2"]
  - key: neutrons-hold-nucleus
    concept: Protons in a nucleus repel each other; neutrons reduce this and strengthen the nuclear force that binds the nucleus, so heavier atoms need many more neutrons than protons.
    terms: []
    items: ["3.3.3"]
  - key: symbols-of-elements
    concept: Elements are written with symbols, from Dalton's pictures to Berzelius's letters from Latin names, now approved by IUPAC so scientists everywhere understand them.
    terms: [pictorial symbols]
    items: ["4.1", "4.3", "4.5"]
  - key: rules-for-writing-symbols
    concept: A symbol is the first one or two letters of the element's name (or the first letter and a later one, or from its Latin, Greek or German name); the first letter is a capital and the second small.
    terms: []
    items: ["4.3", "4.4"]
  - key: atomic-number
    concept: The atomic number (Z) is the number of protons in an atom's nucleus, equal to its number of electrons; it identifies the element.
    terms: [atomic number]
    items: ["5.1", "5.2"]
  - key: mass-number
    concept: The mass number (A) is the number of protons and neutrons (nucleons) in the nucleus; electrons' mass is negligible.
    terms: [mass number, nucleons]
    items: ["6.1", "6.2", "6.5"]
  - key: atomic-notation
    concept: An atom is written with its mass number above and its atomic number below, before the symbol, as ¹²₆C.
    terms: []
    items: ["6.6", "6.9"]
  - key: shell-filling-rules
    concept: A shell holds at most 2n² electrons, the outermost shell at most 8, and shells fill in order from the nucleus outward (K, then L, then M).
    terms: []
    items: ["7.1"]
  - key: electronic-configuration
    concept: The distribution of an atom's electrons among its shells is its electronic configuration (sodium is 2, 8, 1).
    terms: [electronic configuration]
    items: ["7.3.1", "7.3.3"]
  - key: combining-capacity
    concept: An element's combining capacity is the number of hydrogen or chlorine atoms one of its atoms combines with (oxygen in H₂O has two).
    terms: [combining capacity]
    items: ["8.1"]
  - key: valence-shell-and-octet
    concept: The outermost shell is the valence shell and its electrons are valence electrons; atoms with a full octet (or 2 for helium) are stable and largely unreactive.
    terms: [valence shell, valence electrons, octet]
    items: ["8.3", "8.4"]
  - key: valency
    concept: Valency is the number of electrons an atom gains, loses or shares to complete its octet; atoms with fewer than four valence electrons tend to lose them, those with more tend to gain.
    terms: [valency]
    items: ["8.5"]
  - key: isotopes
    concept: Isotopes are atoms of the same element with the same atomic number but different mass numbers, because they have different numbers of neutrons (protium, deuterium, tritium).
    terms: [isotopes]
    items: ["9.1.1", "9.1.2", "9.1.5"]
  - key: isotopes-same-chemistry
    concept: Isotopes of an element have the same chemical properties, since they have the same electronic configuration, but different physical properties.
    terms: []
    items: ["9.1.4"]
  - key: atomic-mass-unit
    concept: The masses of atoms are measured in unified atomic mass units (u).
    terms: []
    items: ["9.1.8"]
  - key: weighted-average-atomic-mass
    concept: An element's average atomic mass is weighted by its isotopes' natural abundances, not their simple average (chlorine is 35.5 u, from 75% ³⁵Cl and 25% ³⁷Cl).
    terms: [average mass, weighted average atomic mass]
    items: ["9.1.11", "9.1.13", "9.1.15", "9.1.18"]
  - key: uses-of-isotopes
    concept: Some isotopes are useful, as fuel in nuclear power plants, in treating cancer and goitre, and in dating fossils and artefacts.
    terms: []
    items: ["9.1.16"]
  - key: isobars
    concept: Isobars are atoms of different elements with the same mass number but different atomic numbers (calcium, potassium and argon, all 40).
    terms: [isobars]
    items: ["9.2.1"]
