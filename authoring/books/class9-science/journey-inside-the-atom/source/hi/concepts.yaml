concepts:
  - key: matter-made-of-atoms
    concept: सजीव प्राणी और निर्जीव वस्तुएँ सभी द्रव्य हैं, और द्रव्य जिन सूक्ष्म कणों से बना होता है वे परमाणु कहलाते हैं, जो इतने सूक्ष्म होते हैं कि इन्हें नग्न आँखों से नहीं देखा जा सकता।
    terms: [द्रव्य, परमाणु]
    items: ["0.3"]
  - key: early-ideas-of-indivisible-particles
    concept: आचार्य कणाद (परमाणु) और ग्रीक दार्शनिक लियुसीपस एवं डेमोक्रिटस (एटोमॉस) ने द्रव्य को अविभाज्य कणों से बना माना; यह अवधारणा काल्पनिक विचार से उत्पन्न हुई थी, न कि प्रायोगिक अवलोकनों से।
    terms: []
    items: ["1.2", "1.3", "1.4"]
  - key: dalton-atomic-theory
    concept: वर्ष 1808 में जॉन डाल्टन का परमाणु सिद्धांत, जो वैज्ञानिक प्रयोगों पर आधारित था, कहता है कि सभी द्रव्य अविभाज्य परमाणुओं से बने हैं; यह द्रव्य किस प्रकार बना है इसका प्रथम वैज्ञानिक विवरण था।
    terms: []
    items: ["1.5"]
  - key: models-change-with-evidence
    concept: वैज्ञानिक परमाणु संरचना के मॉडल प्रस्तावित करते रहे और नए प्रयोगों एवं प्रमाणों के साथ इनमें परिवर्तन एवं सुधार किया गया; विज्ञान ने एक-एक कदम बढ़ाते हुए प्रगति की है।
    terms: []
    items: ["2.1"]
  - key: radioactivity-shows-atoms-divisible
    concept: कुछ तत्व अदृश्य ऊर्जा एवं कण उत्सर्जित करते हैं जिसे विकिरण कहा जाता है, इस परिघटना को रेडियोधर्मिता कहा गया, और इससे ज्ञात हुआ कि परमाणु और भी सूक्ष्म कणों से मिलकर बने हैं।
    terms: [विकिरण, रेडियोधर्मिता]
    items: ["2.2"]
  - key: electron-discovered
    concept: टॉमसन के कैथोड किरणों के अध्ययन से प्रमाणित हुआ कि इलेक्ट्रॉन, ऋणावेशित कण जिनका द्रव्यमान परमाणु से बहुत कम है, सभी परमाणुओं के मूल घटक हैं; इलेक्ट्रॉन का आवेश −1 लिया जाता है।
    terms: [इलेक्ट्रॉन]
    items: ["2.3", "2.5"]
  - key: thomson-model
    concept: टॉमसन के अनुसार परमाणु धनात्मक आवेश का एक गोला है जिसमें इलेक्ट्रॉन समान रूप से वितरित होते हैं, जैसे पुडिंग में प्लम्स या तरबूज में बीज; इससे परमाणु में धनावेश एवं ऋणावेश संतुलित रहते हैं।
    terms: []
    items: ["2.6.1"]
  - key: gold-foil-experiment
    concept: "स्वर्ण पर्णिका प्रयोग में अधिकांश अल्फा कण पर्णिका से सीधे निकल गए, कुछ बहुत अधिक विक्षेपित हुए और कुछ पुन: लौट आए, जिसकी व्याख्या टॉमसन का मॉडल नहीं कर सका।"
    terms: [प्रकीर्णन, α-किरण प्रकीर्णन प्रयोग]
    items: ["2.7.1", "2.7.3"]
  - key: rutherford-nuclear-model
    concept: रदरफोर्ड ने निष्कर्ष निकाला कि परमाणु का अधिकांश भाग रिक्त है, संपूर्ण धनावेश और अधिकांश द्रव्यमान केंद्र में एक अति सूक्ष्म सघन नाभिक में है, और इलेक्ट्रॉन नाभिक के चारों ओर ऐसे घूमते हैं जैसे ग्रह सूर्य की परिक्रमा करते हैं।
    terms: [नाभिक, परमाणु का ग्रहीय मॉडल]
    items: ["2.7.5", "2.7.6"]
  - key: nucleus-is-tiny
    concept: नाभिक परमाणु से लगभग 10⁵ गुना छोटा होता है (परमाणु का व्यास लगभग 10⁻¹⁰ m, नाभिक का लगभग 10⁻¹⁵ m), जैसे क्रिकेट मैदान के केंद्र में काली मिर्च का छोटा दाना।
    terms: []
    items: ["2.7.7"]
  - key: rutherford-model-unstable
    concept: रदरफोर्ड मॉडल परमाणु के स्थायित्व की व्याख्या नहीं कर सका, क्योंकि वृत्ताकार मार्ग में गति करता इलेक्ट्रॉन त्वरित होता है, उसकी ऊर्जा का ह्रास होना चाहिए और उसे नाभिक में गिर जाना चाहिए।
    terms: []
    items: ["2.7.14", "2.7.15"]
  - key: proton-and-neutral-atom
    concept: नाभिक पर धनावेश प्रोटॉन के कारण होता है, जिनका भार इलेक्ट्रॉन से बहुत अधिक है और आवेश इलेक्ट्रॉन के समान परंतु विपरीत; परमाणु में प्रोटॉनों की संख्या इलेक्ट्रॉनों के बराबर होती है, इसलिए वह विद्युत उदासीन होता है।
    terms: [प्रोटॉन]
    items: ["2.7.19", "2.7.20"]
  - key: bohr-model
    concept: बोर के मॉडल में इलेक्ट्रॉन केवल निश्चित कोशों (कक्षाएँ, ऊर्जा स्तर) K, L, M, N, ... (n = 1, 2, 3, 4, ...) में गति करते हैं, प्रत्येक कोश की ऊर्जा निश्चित है जो नाभिक से दूर जाने पर बढ़ती है, और कोश में गति करते हुए इलेक्ट्रॉन ऊर्जा का क्षय नहीं करता।
    terms: [स्थायी अवस्थाएँ, कक्षाएँ, कोश, ऊर्जा स्तर]
    items: ["2.8.1"]
  - key: electron-jumps-between-shells
    concept: दो कोशों की ऊर्जा के अंतर के बराबर ऊर्जा अवशोषित अथवा उत्सर्जित कर इलेक्ट्रॉन एक कोश से दूसरे कोश में जा सकता है।
    terms: []
    items: ["2.8.1"]
  - key: bohr-explains-stability
    concept: बोर ने स्थायी कक्षाओं की अवधारणा से परमाणु के स्थायित्व को समझाया, जिनमें इलेक्ट्रॉन की ऊर्जा गति करते हुए भी स्थिर रहती है; बाद में क्वाण्टम यांत्रिकीय मॉडल प्रस्तावित किया गया।
    terms: []
    items: ["2.8.3", "2.8.6"]
  - key: neutron-discovered
    concept: चैडविक ने न्यूट्रॉन की खोज की, नाभिक में एक उदासीन कण जिसका द्रव्यमान लगभग प्रोटॉन के बराबर है; इससे स्पष्ट हुआ कि परमाणु का द्रव्यमान उसके प्रोटॉनों के द्रव्यमान से अधिक क्यों होता है; न्यूट्रॉन हाइड्रोजन के अतिरिक्त सभी परमाणुओं में पाए जाते हैं।
    terms: [न्यूट्रॉन]
    items: ["3.2", "3.3.1"]
  - key: subatomic-particles-charges
    concept: तीन अवपरमाणुक कण हैं इलेक्ट्रॉन (e⁻, आवेश −1), प्रोटॉन (p⁺, +1) और न्यूट्रॉन (n⁰, 0)।
    terms: []
    items: ["3.3.2", "3.3.3"]
  - key: neutrons-hold-nucleus
    concept: नाभिक में प्रोटॉन एक-दूसरे को प्रतिकर्षित करते हैं; न्यूट्रॉन प्रतिकर्षण को कम करते हैं और नाभिकीय बल को प्रबल करते हैं, इसलिए भारी परमाणुओं में अधिक न्यूट्रॉनों की आवश्यकता होती है।
    terms: []
    items: ["3.3.4"]
  - key: symbols-of-elements
    concept: तत्वों को प्रतीकों से निरूपित किया जाता है, डाल्टन के चित्रात्मक प्रतीकों से बर्जेलियस के लैटिन नामों से लिए अक्षरों तक, जिन्हें अब आई.यू.पी.ए.सी. स्वीकृति देता है ताकि समस्त विश्व के वैज्ञानिक भाषा की बाधा के बिना संवाद कर सकें।
    terms: [चित्रात्मक प्रतीक]
    items: ["4.1", "4.3", "4.5"]
  - key: rules-for-writing-symbols
    concept: प्रतीक तत्व के नाम के प्रथम अक्षर अथवा प्रथम दो अक्षरों से (या प्रथम अक्षर और किसी अन्य अक्षर से, या लैटिन, ग्रीक अथवा जर्मन नाम से) बनता है; प्रथम अक्षर सदैव बड़ा और द्वितीय छोटा लिखा जाता है।
    terms: []
    items: ["4.3", "4.4"]
  - key: atomic-number
    concept: परमाणु के नाभिक में उपस्थित प्रोटॉनों की संख्या उसका परमाणु क्रमांक (Z) है, जो इलेक्ट्रॉनों की संख्या के बराबर होती है और तत्व की पहचान निर्धारित करती है।
    terms: [परमाणु क्रमांक]
    items: ["5.1", "5.2"]
  - key: mass-number
    concept: नाभिक में उपस्थित प्रोटॉनों एवं न्यूट्रॉनों (न्यूक्लिऑन) की कुल संख्या द्रव्यमान संख्या (A) है; इलेक्ट्रॉन का द्रव्यमान लगभग नगण्य होता है।
    terms: [द्रव्यमान संख्या, न्यूक्लिऑन]
    items: ["6.1", "6.2", "6.5"]
  - key: atomic-notation
    concept: मानक संकेतन में प्रतीक के साथ द्रव्यमान संख्या ऊपर और परमाणु क्रमांक नीचे लिखे जाते हैं, जैसे ¹²₆C।
    terms: []
    items: ["6.6", "6.9"]
  - key: shell-filling-rules
    concept: किसी कोश में अधिकतम 2n² इलेक्ट्रॉन हो सकते हैं, सबसे बाह्यतम कोश में अधिकतम 8, और कोश नाभिक के निकटतम कोश से आरंभ कर क्रम से भरे जाते हैं (K, फिर L, फिर M)।
    terms: []
    items: ["7.1"]
  - key: electronic-configuration
    concept: विभिन्न कोशों में इलेक्ट्रॉनों का वितरण परमाणु का इलेक्ट्रॉनिक विन्यास कहलाता है (सोडियम का 2, 8, 1)।
    terms: [इलेक्ट्रॉनिक विन्यास]
    items: ["7.3.1", "7.3.3"]
  - key: combining-capacity
    concept: हाइड्रोजन अथवा क्लोरीन के परमाणुओं की वह संख्या जिसके साथ किसी तत्व का एक परमाणु संयोजित होता है, उसकी संयोजन क्षमता है (H₂O में ऑक्सीजन की संयोजन क्षमता दो है)।
    terms: [संयोजन क्षमता]
    items: ["8.1"]
  - key: valence-shell-and-octet
    concept: परमाणु का बाह्यतम कोश संयोजकता कोश और उसके इलेक्ट्रॉन संयोजकता इलेक्ट्रॉन कहलाते हैं; जिन तत्वों के संयोजकता कोश में अष्टक (हीलियम में 2) होता है वे अधिक स्थायी और कम अभिक्रियाशील होते हैं।
    terms: [संयोजकता कोश, संयोजकता इलेक्ट्रॉन, अष्टक]
    items: ["8.3", "8.4"]
  - key: valency
    concept: अष्टक पूर्ण करने हेतु त्यागे, ग्रहण किए अथवा साझा किए गए इलेक्ट्रॉनों की संख्या तत्व की संयोजकता है; चार से कम संयोजकता इलेक्ट्रॉन वाला तत्व इलेक्ट्रॉन त्यागता है और चार से अधिक वाला ग्रहण करता है।
    terms: [संयोजकता]
    items: ["8.5"]
  - key: isotopes
    concept: एक ही तत्व के ऐसे परमाणु जिनके परमाणु क्रमांक समान परंतु न्यूट्रॉनों की संख्या भिन्न होने से द्रव्यमान संख्याएँ भिन्न होती हैं, समस्थानिक कहलाते हैं (प्रोटियम, ड्यूटीरियम, ट्राइटियम)।
    terms: [समस्थानिक]
    items: ["9.1.1", "9.1.2", "9.1.6"]
  - key: isotopes-same-chemistry
    concept: समस्थानिकों में इलेक्ट्रॉनिक विन्यास समान होता है इसलिए इनके रासायनिक गुण समान होते हैं परंतु भौतिक गुण भिन्न होते हैं।
    terms: []
    items: ["9.1.5"]
  - key: atomic-mass-unit
    concept: परमाणुओं का द्रव्यमान ‘एकीकृत परमाणु द्रव्यमान इकाई’ (u) में मापा जाता है।
    terms: []
    items: ["9.1.4"]
  - key: weighted-average-atomic-mass
    concept: तत्व का यथार्थ औसत परमाणु द्रव्यमान उसके समस्थानिकों की प्राकृतिक प्रचुरता को ध्यान में रखकर निकाला जाता है, साधारण औसत से नहीं (क्लोरीन 35.5 u, 75% ³⁵Cl और 25% ³⁷Cl से)।
    terms: [औसत द्रव्यमान, भारित औसत परमाणु द्रव्यमान]
    items: ["9.1.13", "9.1.15", "9.1.17", "9.1.18"]
  - key: uses-of-isotopes
    concept: कुछ समस्थानिक उपयोगी हैं, जैसे नाभिकीय संयंत्र में ईंधन, कैंसर और घेंघा रोग के उपचार, और जीवाश्मों एवं कलाकृतियों की आयु ज्ञात करने में।
    terms: []
    items: ["9.1.9"]
  - key: isobars
    concept: विभिन्न तत्वों के परमाणु जिनकी द्रव्यमान संख्या समान परंतु परमाणु क्रमांक भिन्न हों, समभारिक कहलाते हैं (कैल्सियम, पोटैशियम और आर्गन, सभी 40)।
    terms: [समभारिक]
    items: ["9.2.1"]
