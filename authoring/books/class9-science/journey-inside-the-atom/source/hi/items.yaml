    कार्बन परमाणु में छह प्रोटॉन और छह न्यूट्रॉन, ऑक्सीजन परमाणु में आठ प्रोटॉन और आठ न्यूट्रॉन)।
    परंतु जैसे-जैसे परमाणु भारी होते जाते हैं उनके नाभिकों में न्यूट्रॉनों की संख्या प्रोटॉनों की
    संख्या से अधिक होती जाती है। आयरन (लोहा) परमाणु में 26 प्रोटॉन और 30 न्यूट्रॉन होते हैं और जब हम
    यूरेनियम तक पहुँचते हैं तो उसके नाभिक में 92 प्रोटॉन तथा 146 न्यूट्रॉन होते हैं। आपको आश्चर्य
    होगा कि जब समान आवेशित प्रोटॉन नाभिक में संकुचित रहते हैं तो वे एक-दूसरे को दूर क्यों नहीं
    धकेलते? इसको इस प्रकार सोचिए कि नाभिक के भीतर प्रत्येक प्रोटॉन दूसरे को प्रतिकर्षित करते हैं
    क्योंकि वे सभी धनावेशी होते हैं। न्यूट्रॉन जो उदासीन होते हैं प्रोटॉनों के मध्य दूरी बढ़ाकर
    प्रतिकर्षण को कम कर देते हैं और इसके साथ ही कणों को परस्पर बाँधें रखने वाला बल जिसे नाभिकीय बल
    कहते हैं, को प्रबल कर देते हैं। अत: भारी परमाणुओं में अधिक न्यूट्रॉनों की आवश्यकता होती है जिससे
    वे नाभिक में स्थित सभी कणों को दृढ़ता से बाँधें रख सकें ।"
