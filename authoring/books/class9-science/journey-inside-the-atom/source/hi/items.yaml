- id: "2.8.3"
  kind: text
  page: 7
  text: आप आश्चर्य कर रहें होंगे कि बोर का मॉडल परमाणु के स्थायित्व को किस प्रकार समझाता है? बोर के
    मॉडल में भी इलेक्ट्रॉन, रदरफोर्ड मॉडल की भाँति धनावेशित नाभिक के चारों ओर वृत्ताकार पथों में गति
    करते हैं परंतु इस प्रकार गति करने से ऊर्जा का ह्रास क्यों नहीं होता। बोर ने इसे स्पष्ट करने के
