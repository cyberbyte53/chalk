- id: "4.3"
  kind: text
  page: 9
  text: बर्जेलियस ने वर्ष 1813 में यह सुझाव दिया कि तत्वों के प्रतीक उनके लैटिन नामों से लिए जाने
    चाहिए। इस प्रकार अक्षरों वाले रासायनिक प्रतीकों का आरंभ हुआ। वर्तमान समय में ‘शुद्ध और
    अनुप्रयुक्त रसायन विज्ञान का अंतर्राष्ट्रीय संघ’ (International Union of Pure and Applied
    Chemistry) नामक अंतर्राष्ट्रीय वैज्ञानिक संस्था, तत्वों के नामों और उनके प्रतीकों की स्वीकृति
    प्रदान करती है। इन प्रतीकों को लिखने के कुछ नियम इस प्रकार हैं— अनेक तत्वों के प्रतीक उनके
    आई.यू.पी.ए.सी. नाम के प्रथम अक्षर अथवा प्रथम दो अक्षरों से बने होते हैं। प्रतीक के नाम का प्रथम
    अक्षर सदैव बड़े अक्षर (capital letter) जबकि द्वितीय अक्षर अंग्रेजी भाषा में छोटे अक्षर में लिखा
    जाता है। उदाहरणार्थ— हाइड्रोजन (H), ऐलुमिनियम (Al) (न कि AL), कोबाल्ट Co (न कि CO) इत्यादि। कुछ
    तत्वों के प्रतीक उनके नाम के प्रथम अक्षर और द्वितीय अक्षर को छोड़कर किसी अन्य अक्षर से बनते हैं।
    उदाहरणार्थ— क्लोरीन Cl, जिंक Zn इत्यादि। कुछ तत्वों के प्रतीक उनके अंग्रेजी नाम से नहीं अपितु
    लैटिन, ग्रीक अथवा जर्मन नामों से लिए गए हैं। उदाहरणार्थ— आयरन का प्रतीक Fe [लैटिन नाम फेरम
    (ferrum)], मर्करी का प्रतीक Hg [ग्रीक नाम हाइड्रेगेईरोस (hydrargyros)] और टंगस्टन का प्रतीक W
    [जर्मन वोल्फ्रॉम (wolfram) से लिया गया] है। सामान्य रूप से उपयोगी कुछ तत्वों के नाम और प्रतीक
    तालिका 8.2 में दर्शाए गए हैं।
