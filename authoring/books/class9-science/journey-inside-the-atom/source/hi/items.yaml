- id: "9.1.1"
  kind: text
  page: 15
  text: डाल्टन ने प्रस्तावित किया कि किसी तत्व के सभी परमाणु एक समान होते हैं और उनका परमाणु द्रव्यमान
    भी एक समान होता है। परंतु वैज्ञानिकों ने कुछ समय पश्चात पाया कि एक ही तत्व के ऐसे परमाणु भी होते
    हैं जिनमें प्रोटॉनों की संख्या (परमाणु संख्या, Z) समान परंतु न्यूट्रॉनों की संख्या भिन्न-भिन्न
    हो सकती है और इस कारण से इनके द्रव्यमान भिन्न-भिन्न होते हैं (A = p⁺ + n⁰)। ये ‘युग्म परमाणु’
    जिनके परमाणु क्रमांक समान परंतु द्रव्यमान संख्याएँ भिन्न होती हैं, समस्थानिक (Isotopes) कहलाते
