    रदरफोर्ड के मार्गदर्शन में कार्य करते हुए वर्ष1932 में न्यूट्रॉन की खोज कर एक महत्त्वपूर्ण पहेली
    का समाधान निकाला। इस खोज से परमाणु द्रव्यमान को स्पष्ट किया जा सका और इसके लिए चैडविक को वर्ष
    1935 में भौतिकी का नोबेल पुरस्कार प्राप्त हुआ। न्यूट्रॉन की खोज ने अनुसंधान में क्रांतिकारी
    परिवर्तन किए जिससे वैज्ञानिकों को नाभिक के रहस्यों की खोज करने में सहायता मिली तथा परमाणु ऊर्जा
    को समझने एवं उसका उपयोग करने हेतु अन्वेषणों की शृंखला को बढ़ावा मिला।
