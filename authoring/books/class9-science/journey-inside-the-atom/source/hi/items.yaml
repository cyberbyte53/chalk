- id: "2.6.1"
  kind: text
  page: 3
  text: जब जे. जे. टॉमसन ने सूक्ष्म ऋणात्मक कण जिन्हें इलेक्ट्रॉन कहते हैं, की खोज की तो इनके सामने एक
    पहेली यह थी कि यदि परमाणु उदासीन होते हैं तो इनमें धनात्मक आवेश कहाँ विद्यमान होता है? इसके
    समाधान हेतु टॉमसन ने प्रस्तावित किया कि परमाणु धनात्मक आवेश का एक गोला होता है जिसमें इलेक्ट्रॉन
    समान रूप से वितरित होते हैं (चित्र 8.2)। इस मॉडल की तुलना पुडिंग में धँसे हुए प्लम्स (सूखा मेवा,
    आलूबुखारा) से की गई जिसे ‘प्लम पुडिंग मॉडल’ कहा गया। एक अत्यंत व्यावहारिक उदाहरण तरबूज का लिया
    जा सकता है (चित्र 8.3) जिसमें लाल गूदा धनात्मक आवेश को और बीज परमाणु में वितरित इलेक्ट्रॉनों को
    प्रदर्शित करता है। यह सरल चित्र भले ही बाद में परिवर्तित हो गया हो परंतु यह परमाणु में धनावेश
    एवं ऋणावेश के संतुलन को वर्णित करने का प्रथम सार्थक प्रयास था।
