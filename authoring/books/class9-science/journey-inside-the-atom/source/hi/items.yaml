- id: "9.2.1"
  kind: text
  page: 17
  text: आइए, तीन तत्वों पर विचार करें—कैल्सियम (परमाणु क्रमांक 20), पोटैशियम (परमाणु क्रमांक 19) और
    आर्गन (परमाणु क्रमांक 18)। इन तत्वों में प्रोटॉनों की संख्या भिन्न होती है परंतु इन सभी की
    द्रव्यमान संख्या 40 है। यह दर्शाता है कि इनके परमाणुओं में न्यूक्लिऑनों की कुल संख्या समान है
    यद्यपि ये भिन्न-भिन्न तत्व हैं। जब विभिन्न तत्वों के परमाणुओं की द्रव्यमान संख्या समान हों परंतु
    परमाणु क्रमांक भिन्न हों तो उन्हें समभारिक (Isobar) कहा जाता है।
