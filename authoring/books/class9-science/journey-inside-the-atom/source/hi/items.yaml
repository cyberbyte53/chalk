- id: "8.5"
  kind: text
  page: 14
  text: "अष्टक पूर्ण करने हेतु त्यागे गए, ग्रहण किए गए अथवा साझा किए गए इलेक्ट्रॉनों की संख्या को उस
    तत्व की ‘संयोजकता’ कहते हैं। सामान्यतः यदि किसी तत्व के संयोजकता कोश में चार से कम इलेक्ट्रॉन
    होते हैं तो वह अष्टक पूर्ण करने और स्थायित्व प्राप्त करने के लिए इलेक्ट्रॉनों का त्याग करता है।
    दूसरी ओर यदि संयोजकता इलेक्ट्रॉनों की संख्या चार से अधिक होती है तो वह अष्टक पूर्ण करने के लिए
    इलेक्ट्रॉन ग्रहण करने का प्रयास करता है। उदाहरण के लिए— सोडियम का इलेक्ट्रॉनिक विन्यास 2, 8, 1
    है। यह एक इलेक्ट्रॉन त्याग कर अष्टक प्राप्त कर सकता है। अतः इसकी संयोजकता अथवा संयोजन क्षमता 1
    है। दूसरी ओर ऑक्सीजन का इलेक्ट्रॉनिक विन्यास 2, 6 है। इसमें छह संयोजकता इलेक्ट्रॉन होते हैं। अत:
    यह अष्टक पूर्ण करने के लिए दो इलेक्ट्रॉन ग्रहण कर सकता है और इसकी संयोजकता 2 है। कार्बन का
    इलेक्ट्रॉनिक विन्यास 2, 4 है। कार्बन में चार संयोजकता इलेक्ट्रॉन हैं और यह सरलता से न तो उनका
    त्याग कर सकता है और न ही और चार इलेक्ट्रॉन ग्रहण कर सकता है। इसलिए यह अन्य परमाणुओं के साथ चार
    इलेक्ट्रॉनों की साझेदारी कर अपना अष्टक पूर्ण कर सकता है। अत: कार्बन की संयोजकता 4 है। सामान्यतः
    कुछ यौगिक संयोजकता नियम का उल्लंघन करते प्रतीत होते हैं जिनके विषय में आप उच्च कक्षाओं में
    पढ़ेंगे।"
