- id: "1.2"
  kind: text
  page: 2
  text: आचार्य कणाद ने यह सुझाव दिया कि यदि पदार्थ (द्रव्य) को निरंतर विभाजित किया जाए तो एक ऐसी
    स्थिति आएगी जिसमें इतने सूक्ष्म कण प्राप्त होंगे कि उन्हें और अधिक विभाजित नहीं किया जा सकेगा।
    इन्होंने इन कणों को परमाणु कहा। इनके विचार संस्कृत ग्रंथ वैशेषिक सूत्र में उल्लिखित हैं। परमाणु
    अत्यंत सूक्ष्म कण है और इसे हमारी इंद्रियाँ अनुभव नहीं कर सकती हैं। परमाणु संयोजित होकर द्वय (दो
    परमाणुओं का समूह) एवं त्रय (तीन परमाणुओं का समूह) इत्यादि बनाते हैं। इन्हीं संयोजनों से संपूर्ण
    भौतिक ब्रह्मांड के पदार्थ (जिसमें सजीवों की काया भी सम्मिलित हैं, निर्मित होते हैं), यद्यपि दिया
    गया विवरण यह निर्दिष्ट नहीं करता कि विभिन्न पदार्थों के निर्माण में परमाणुओं के संयोजन का अनुपात
    क्या होता है।
