  title: सोचिए और बताइए
  text: सोचिए और बताइए 1. मान लीजिए कि आपने टॉमसन के विवरणानुसार स्वयं एक ‘परमाणु’ बनाया जिसमें
    धनात्मक आवेश के लिए मिट्टी और वितरित इलेक्ट्रॉनों के लिए छोटे मोतियों का उपयोग किया। क्या होगा
    यदि — (i) मिट्टी पर धनावेश उसमें वितरित मोतियों के कुल ऋणावेश से कम हो? (ii) त्रुटिवश यदि मिट्टी
    में थोड़ा-सा भी ऋणावेश हो तो क्या आपका मॉडल अब भी उदासीन परमाणु को प्रदर्शित करेगा? 2. क्या इसकी
    तुलना एक संतरे (अथवा एक नींबू जिनके नरम गूदों के मध्य बीज होते हैं) से करना उचित है? यह कहाँ तक
    टॉमसन के विचार से मेल खाता है और इसमें कहाँ कमी है? 3. टॉमसन ने यह निष्कर्ष क्यों निकाला कि
    इलेक्ट्रॉन सभी परमाणुओं में उपस्थित होते हैं?
