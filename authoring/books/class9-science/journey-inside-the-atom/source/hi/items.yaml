  text: आइए, और आगे बढ़ें इलेक्ट्रॉन सूक्ष्मदर्शी जैसे क्रमवीक्षण सुरंगन सूक्ष्मदर्शी (STM) और संचरण
    इलेक्ट्रॉन सूक्ष्मदर्शी (TEM) पदार्थों के परमाण्विक स्तर की विस्तारित छवि बना सकते हैं।
    क्रमवीक्षण सुरंगन सूक्ष्मदर्शियों द्वारा सामान्यतः सतहों का अध्ययन किया जाता है (चित्र 8.15)
    जबकि संचरण इलेक्ट्रॉन सूक्ष्मदर्शी यह दर्शाते हैं कि अति सूक्ष्म प्रतिदर्श के भीतर परमाणु किस
    प्रकार व्यवस्थित होते हैं।
