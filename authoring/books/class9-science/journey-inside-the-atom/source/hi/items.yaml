  text: अनेक शताब्दियों पश्चात वर्ष 1808 में जॉन डाल्टन ने अपना परमाणु सिद्धांत प्रस्तुत किया। यह उस
    समय के वैज्ञानिक प्रयोगों पर आधारित था। इन्होंने प्रस्तावित किया कि सभी द्रव्य अविभाज्य सूक्ष्म
    कणों से बने हैं जिन्हें परमाणु कहा जाता है अर्थात परमाणु द्रव्य के वे निर्माण मूल खंड हैं
    जिन्हें और सूक्ष्म कणों में विभाजित नहीं किया जा सकता। डाल्टन का परमाणु सिद्धांत यह ज्ञात करने
    का प्रथम वैज्ञानिक विवरण था कि द्रव्य किस प्रकार बना है। यह परमाणु संरचना की आधुनिक समझ का
