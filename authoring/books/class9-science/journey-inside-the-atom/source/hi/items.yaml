- id: "9.2.7"
  kind: box
  page: 18
  title: सारांश
  text: सारांश परमाणु द्रव्य के निर्माण खंड होते हैं। जे. जे. टॉमसन ने प्रस्तावित किया कि परमाणु में
    इलेक्ट्रॉन एक धनावेशित गोले में धँसे होते हैं। रदरफोर्ड मॉडल ने परमाणु के अधिकांश भाग को रिक्त
    स्थान के रूप में वर्णित किया। उनके अनुसार इसके केंद्र में एक सघन, धनावेशित नाभिक होता है और
    इलेक्ट्रॉन उसके चारों ओर परिक्रमा करते हैं। नील्स बोर मॉडल के अनुसार, इलेक्ट्रॉन नाभिक के चारों
    ओर निश्चित ऊर्जा स्तरों (कोशों) में गति करते हैं। परमाणु के कोशों को K, L, M, N, इत्यादि नाम दिए
    गए हैं। जेम्स चैडविक ने परमाणु में न्यूट्रॉन की उपस्थिति की खोज की। परमाणु के तीन अवपरमाणुक कण
    इलेक्ट्रॉन, प्रोटॉन और न्यूट्रॉन हैं। यदि किसी परमाणु के बाह्यतम कोश में इलेक्ट्रॉनों का अष्टक
    है तो परमाणु स्थायी तथा लगभग पूर्णतया अनभिक्रिय (unreactive) होता है। संयोजकता किसी परमाणु की
    संयोजन क्षमता होती है। यह इलेक्ट्रॉनों की उस संख्या के बराबर होती है जिन्हें कोई परमाणु एक
    स्थायी विन्यास प्राप्त करने के लिए ग्रहण, त्याग अथवा साझा कर सकता है। किसी तत्व का परमाणु
    क्रमांक उसके नाभिक में उपस्थित प्रोटॉनों की संख्या के बराबर होता है। किसी परमाणु की द्रव्यमान
    संख्या उसके नाभिक में उपस्थित न्यूक्लिऑनों (प्रोटॉनों और न्यूट्रॉनों) की कुल संख्या के बराबर
    होती है। समस्थानिक एक ही तत्व के ऐसे परमाणु होते हैं जिनका परमाणु क्रमांक समान होता है परंतु
    द्रव्यमान संख्याएँ भिन्न-भिन्न होती हैं। किसी तत्व के औसत परमाणु द्रव्यमान की गणना, प्रकृति में
    उसके समस्थानिकों की सापेक्ष प्रचुरता के आधार पर की जाती है। समभारिक भिन्न-भिन्न तत्वों के ऐसे
    परमाणु होते हैं जिनकी द्रव्यमान संख्याएँ समान होती हैं परंतु परमाणु क्रमांक भिन्न-भिन्न होते
    हैं।
