    परमाणु दो समस्थानिकों, ⁷⁹₃₅Br (49.7%) और ⁸¹₃₅Br (50.3%) के रूप में उपलब्ध होता है तो ब्रोमीन
    परमाणु के भारित औसत द्रव्यमान की गणना कीजिए।
