- id: "9.2.2"
  kind: text
  page: 17
  text: अब जब हम परमाणु की संरचना की अपनी यात्रा का समापन कर रहे हैं तो यह जानना महत्त्वपूर्ण है कि
    कहानी यहीं समाप्त नहीं होती है। परमाणु की संरचना की खोज अभी भी जारी है (चित्र 8.16)। कुछ समय
    पश्चात वैज्ञानिकों ने पाया कि बोर का मॉडल भी पूर्णरूप से सही नहीं था। बोर की निश्चित कक्षाओं की
    भाँति, इलेक्ट्रॉन किसी निश्चित पथ पर गति नहीं करते हैं। वर्तमान में हम यह जानते हैं कि
    इलेक्ट्रॉन नाभिक के चारों ओर ‘इलेक्ट्रॉन अभ्र’ के रूप में रहते हैं। हम उन क्षेत्रों का अनुमान
    लगा सकते हैं जहाँ उनके होने की संभावना सर्वाधिक होती है परंतु उनकी यथार्थ स्थिति नहीं बता सकते
    हैं। आप इनका विवरण उच्च कक्षाओं में पढ़ेंगे। परमाणु के रहस्यों की खोज की यात्रा अभी समाप्त नहीं
    हुई है, आगे अभी और भी रोमांचक खोजें शेष हैं।
