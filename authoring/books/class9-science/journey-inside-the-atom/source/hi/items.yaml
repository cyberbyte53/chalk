- id: "9.2.3"
  kind: box
  page: 17
  title: वैज्ञानिक-परिचय
  text: वैज्ञानिक-परिचय होमी जहाँगीर भाभा (Homi Jehangir Bhabha) एक भारतीय भौतिक वैज्ञानिक थे। इन्हें
    भारतीय परमाणु कार्यक्रम का जनक माना जाता है। इन्होंने भारत में परमाणु ऊर्जा के विकास में अग्रणी
    योगदान दिया। इन्होंने परमाणु ऊर्जा के शांतिपूर्ण उपयोगों, जैसे — विद्युत उत्पादन, कृषि कार्यों
    को प्रोत्साहन दिया। इसके साथ ही इन्होंने उन्नत चिकित्सा उपचार के लिए टाटा इंस्टीट्यूट ऑफ
    फंडामेंटल रिसर्च (TIFR) और भाभा परमाणु अनुसंधान केंद्र (BARC) जैसे प्रमुख संस्थानों की स्थापना
    की।
