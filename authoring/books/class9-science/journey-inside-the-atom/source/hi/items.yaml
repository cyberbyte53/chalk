  text: आइए, हम 2,000 वर्ष पूर्व के प्राचीन भारत एवं प्राचीन ग्रीस के बौद्धिक परिदृश्य की यात्रा
    प्रारंभ करते हैं। इन दोनों दूरस्थ परंतु आश्चर्यजनक रूप से समानांतर सभ्यताओं के महान विचारक,
