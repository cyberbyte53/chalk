  text: इस संदर्भ में बोर और बरी ने निम्नलिखित नियम सुझाए हैं— किसी कोश में उपस्थित इलेक्ट्रॉनों की
    अधिकतम संख्या 2n² सूत्र से दी जाती है, जहाँ ‘n’ कोश की संख्या है (चित्र 8.7)। अतः K-कोश, (n = 1)
    2×1² = 2 में, 2 इलेक्ट्रॉन समायोजित हो सकते हैं। L-कोश में (n = 2) 2×2² = 8 इलेक्ट्रॉन और M-कोश
    में (n = 3) 2×3² = 18 इलेक्ट्रॉन हो सकते हैं। सबसे बाह्यतम कोश में अधिकतम 8 इलेक्ट्रॉन समायोजित
    हो सकते हैं (प्रथम कोश में अधिकतम दो इलेक्ट्रॉन समायोजित हो सकते हैं)। इन कोशों में इलेक्ट्रॉन
