- id: "2.3"
  kind: text
  page: 3
  text: वर्ष 1897 में जे. जे. टॉमसन ने अति निम्न दाब पर गैसों में विद्युत धारा के चालन का अध्ययन किया।
    उन्होंने एक काँच की नलिका का उपयोग किया एवं उसमें उच्च वोल्टता पर विद्युत धारा को प्रवाहित किया।
    उन्होंने देखा कि किरणें, कैथोड (ऋणावेशित इलेक्ट्रोड) से ऐनोड (धनावेशित इलेक्ट्रोड) की ओर गमन कर
    रही हैं (चित्र 8.1)। इन्हें कैथोड किरणें कहा गया। विद्युत एवं चुंबकीय क्षेत्र में इन कैथोड
    किरणों पर किए गए अध्ययन के आधार पर वे इस निष्कर्ष पर पहुँचे कि ये किरणें ऋणावेशित कणों जिनका
    द्रव्यमान परमाणु के द्रव्यमान से बहुत कम है, की धाराएँ हैं। इन कणों को बाद में इलेक्ट्रॉन कहा
    गया। परमाणुओं से उत्सर्जित इन कणों ने यह इंगित किया कि परमाणु और भी सूक्ष्म अवपरमाणुक कणों से
    निर्मित हैं।
