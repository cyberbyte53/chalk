- id: "2.8.1"
  kind: text
  page: 7
  text: परमाणुओं के स्थायित्व को समझाने के लिए नील्स बोर ने वर्ष 1913 में एक नया परमाणु मॉडल
    प्रतिपादित किया। बोर के अनुसार — इलेक्ट्रॉन नाभिक के चारों ओर यादृच्छिक रूप से गति नहीं करते
    अपितु वे निश्चित वृत्ताकार पथ में गति करते हैं जिन्हें स्थायी अवस्थाएँ, कक्षाएँ अथवा कोश (shell)
    कहा जाता है। प्रत्येक कोश में इलेक्ट्रॉन की ऊर्जा निश्चित होती है इसलिए इन्हें ऊर्जा स्तर भी
    कहते हैं। इन कोशों को K, L, M, N, ..... अक्षरों से अथवा n = 1, 2, 3, 4, ..... संख्याओं द्वारा
    प्रदर्शित किया जाता है (चित्र 8.7)। इलेक्ट्रॉन मात्र इन्हीं अनुमत कोशों में गति कर सकते हैं, इन
    कोशों के मध्य में नहीं। इस निश्चित कोश में गति करते हुए इलेक्ट्रॉन ऊर्जा का क्षय नहीं करता है।
    प्रथम ऊर्जा स्तर K (n=1) नाभिक के निकटतम होता है और इसकी ऊर्जा सबसे कम होती है। जैसे-जैसे हम
    नाभिक से दूर जाते हैं, स्तरों की ऊर्जा में वृद्धि होती जाती है, जैसे— L-कोश (n=2) की ऊर्जा,
    K-कोश (n=1) से अधिक होती है, जो कोश नाभिक से जितना दूर होता है उसकी ऊर्जा उतनी ही अधिक होती है।
    दो कोशों की ऊर्जा के अंतर के बराबर निश्चित मात्रा में ऊर्जा अवशोषित अथवा उत्सर्जित कर इलेक्ट्रॉन
    एक कोश से दूसरे कोश में जा सकता है। प्रत्येक कोश में इलेक्ट्रॉनों की एक निश्चित संख्या ही हो
    सकती है।
