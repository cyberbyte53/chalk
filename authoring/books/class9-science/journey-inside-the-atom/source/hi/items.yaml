- id: "2.7.1"
  kind: text
  page: 4
  text: "वर्ष 1911 में गाइगर एवं मार्सडेन जो अर्न्स्ट रदरफोर्ड के निर्देशन में कार्य कर रहे थे, ने
    टॉमसन के परमाणु मॉडल की जाँच की जो स्वर्ण पर्णिका (gold foil) प्रयोग के नाम से प्रसिद्ध हुआ।
    इन्होंने स्वर्ण पर्णिका पर अल्फा कणों के संकीर्ण किरणपुंज की बौछार की। अल्फा (प्रतीक α ) कण
    धनावेशित सूक्ष्म कण होते हैं जो कुछ रेडियोधर्मी तत्वों से उत्सर्जित होते हैं। इस अध्याय में आप
    आगे जानेंगे कि अल्फा कण वास्तव में हीलियम परमाणु का नाभिक है जिसमें दो प्रोटॉन और दो न्यूट्रॉन
    उपस्थित होते हैं। टॉमसन मॉडल के अनुसार परमाणु में धनात्मक आवेश समान रूप से वितरित होता है। अत:
    उन्होंने यह अपेक्षा की थी कि अल्फा कण स्वर्ण पर्णिका के आर-पार हो जाएँगे अथवा बहुत कम विक्षेपित
    होंगे। परंतु उनके लिए ये आश्चर्यजनक था कि जहाँ अधिकांश कण विक्षेपित हुए बिना पर्णिका से सीधे
    निकल गए वहीं कुछ कण बहुत अधिक विक्षेपित हुए (चित्र 8.4) और कुछ कण तो पुन: लौट आए। इस प्रकार सीधे
    मार्ग से विक्षेपण को प्रकीर्णन (scattering) कहा गया। अत: स्वर्ण पर्णिका प्रयोग को α-किरण
    प्रकीर्णन प्रयोग भी कहा जाता है।"
