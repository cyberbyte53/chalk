- id: "8.1"
  kind: text
  page: 14
  text: आपने जाना है कि समान अथवा भिन्न तत्वों के परमाणु मिलकर अणु बनाते हैं। हाइड्रोजन अथवा क्लोरीन
    के परमाणुओं की वह संख्या जो किसी तत्व के एक परमाणु के साथ संयोजित होकर यौगिक बना सकती है, उसकी
    संयोजन क्षमता कहलाती है। इसे हाइड्रोजन और क्लोरीन के संदर्भ में इसलिए व्यक्त किया जाता है
    क्योंकि दोनों की संयोजन क्षमता एक होती है। उदाहरण के लिए— H₂O (जल) में ऑक्सीजन का एक परमाणु
    हाइड्रोजन के दो परमाणुओं के साथ संयोजन करता है इसलिए ऑक्सीजन की संयोजन क्षमता दो है। NH₃
    (अमोनिया) और MgCl₂ (मैग्नीशियम क्लोराइड) में नाइट्रोजन और मैग्नीशियम की संयोजन क्षमताएँ क्रमशः
    क्या होगी? ये उदाहरण दर्शाते हैं कि किस प्रकार तत्वों की संयोजन क्षमता, संयोजित होने वाले
    हाइड्रोजन अथवा क्लोरीन के परमाणुओं की संख्या से निर्धारित होती है।
