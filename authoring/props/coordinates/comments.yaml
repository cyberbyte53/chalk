  text: >-
    The walker's definition, redone for the arrow pad (your comment on street-and-house). Here is
    what changes, before any code.


    **Riya moves by arrows, one block per tap, from where she is.**

    • New action `step { direction: up | down | left | right }`, done by the learner. She glides one
    block (about a third of a second). If there's no road that way, or it leaves the map, she stays
    put and the plane says why (signal `blocked`, e.g. 'no road going up from the main road between
    streets').

    • New field `roads`. **town** means the main road plus a street up from each whole number, so ←
    → only on the main road and ↑ ↓ only on a street. **grid** means every whole-number line is a
    road, as in cross-streets and later lessons. The roads make 'along, then up' happen in the town
    without a rule for it.

    • New field `at`: where she stands. New field `trail`: the blocks she has walked, drawn as her
    route.

    • New field `canStep`: whether the learner gets the pad (it replaces `canSetSteps`).

    • Signals: `stepped` (where she is now), `arrived` (she stepped onto the target place: Aman's
    house), `blocked`.

    • Her address shows under the plane as she moves (Street 4, House 2 …).


    **Removed:** `along`, `up`, `walked`, `setAlong`, `setUp`, `walk` and the steppers.


    **Kept for lessons:** `walkTo (x, y)` (a lesson walks her there: along, then up, step by step,
    for lesson 4's plotting and the timed walk), and `backToStart`, now a ↺ on the pad that also
    clears the trail.


    Nothing outside lesson 1 uses the walker yet; lesson 1's two walking boards change with it.
    Close this to approve, and I'll build it with its tests.
  messages:
