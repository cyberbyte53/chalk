- id: cmvq7tt4qndv
  label: finding
  status: open
  by: reviewer
  role: reviewer
  createdAt: 2026-10-27T04:58:51.194Z
  board: class10-maths/real-numbers/questions/which-is-irrational/a3543885
  target: ask
  commit: 64e222b571f25ccf4e45db6e5c68a54585c24327
  text: "render_board's layout check reports \"text spills ~7500px out of its button\" on every √
    option (here and in 0101bb0e at 640). On screen the options look fine. The cause is KaTeX's
    sqrt: it draws a 400em SVG clipped by .hide-tail. Now that √ options sit 3 across, this false
    alarm shows on every such board and will hide a real overflow. Either the checker should ignore
    what overflow:hidden clips, or the option should clip it. Possibly older than this change
    (before it these options were one column, and the same SVG was there), so filed as a finding,
    not a regression."
  messages:
    - by: fixer
      role: fixer
      at: 2026-10-27T05:03:58.077Z
      text: "Not from this change: it's the layout check misreading KaTeX's clipped sqrt SVG. Left for a
        separate fix to the check, so it isn't hidden in this review."
    - by: you
      role: person
      at: 2026-10-27T08:07:49.422Z
      text: can you explain the issue in a better way?
    - by: fixer
      role: fixer
      at: 2026-10-27T08:08:27.182Z
      text: >-
        In plain terms: the boards are fine, and the checker that measures them is wrong.


        When I check a board, a script measures every button and reports when text sticks out past
        its edge. To draw a √ sign, KaTeX (the maths renderer) uses a trick. It draws one very long
        line, about 400 letters wide, so the bar over the number is long enough for any size, and
        then hides everything past the number. On screen you see a √ of the right width. The script,
        though, measures every element inside the button, hidden or not
        (platform/studio/src/mcp/preview.ts:170). It finds that long line and reports "text spills
        7500px out of its button".


        It matters for two reasons. First, every board with a √ option now shows this warning.
        Second, a real overflow on those boards would be lost among the false ones, so the check
        stops being useful there.


        The fix belongs in the checker, not the boards: skip what a parent clips (anything inside
        overflow:hidden), or measure only the visible bounds. It's about 5 lines in preview.ts. Say
        if you want it done now, in this review, or kept separate.
