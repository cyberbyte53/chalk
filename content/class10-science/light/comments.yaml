- id: cmvf52vnw2eb
  kind: comment
  status: planned
  by: you
  createdAt: 2026-10-19T10:56:27.596Z
  board: class10-science/light/reflection-and-images/overview/real-virtual
  target: w2
  source: content/class10-science/light/reflection-and-images/overview.ts:625
  snapshot: "**Real and virtual.** If the rays **really meet** at the image, the image is **real**.
    Light actually gets there, so it can be caught on a screen, like a projector's picture on a
    wall. If the rays only **seem to come from** the image, it is **virtual**. No light gets there,
    so no screen can catch it: you can only see it by looking into the mirror."
  text: it would be really good if we can demonstrate it ; differtaite the 2 types
  plan:
    by: agent
    at: 2026-10-24T06:07:26Z
    text: "On the real-virtual page, demonstrate both kinds before the plane mirror is called virtual: a
      pinhole camera (real: rays really meet on the screen, the picture is caught on paper) next to
      the plane mirror with paper behind it (virtual: only dashed lines get there, the paper stays
      dark)."
  thread:
    - by: you
      at: 2026-10-19T10:57:26.619Z
      text: how can we introduce this without introducing the mirros is kind of tricky
    - by: claude
      at: 2026-10-24T06:07:26Z
      text: "Your worry is right: a real image from a mirror or a lens needs ideas we haven't taught yet.
        A pinhole camera doesn't. It uses only 'light travels in straight lines', taught three pages
        earlier, and students know it from Class 6. Rays from a candle really cross at the pinhole
        and land on the screen, so you get a real (upside-down) picture you can catch on paper. Put
        next to the plane mirror and its paper that stays dark, that shows both kinds side by side.
        It's also our projector's first step: Kabir's 'throw the movie on the wall'. Proposal
        below."
