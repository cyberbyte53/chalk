  text: '[Medium-high] Principle 5/11 (true reason, NCERT wording). The text says "Its distances are
    written **−6** and **−2**" and the prop labels the dotted perpendiculars −6 and −3 (signed
    lengths). A distance is never negative: NCERT says the distance of Q from the y-axis is OR = 6
    units, measured along the negative direction, so the x-coordinate is −6. A Class 9 student will
    learn "distance can be −6" and carry it into Ch 7 distance work. Suggest: label the
    perpendiculars with their lengths (6, 2) and say "6 units to the left, so its x-coordinate is
    −6"; keep the sign for the coordinate. Also the word **perpendicular** is never used on this
    board or in the definitions (NCERT: "perpendicular distance"; Fig 3.10 names PM and PN), though
    the picture is exactly that; one sentence would tie it to the source.'
