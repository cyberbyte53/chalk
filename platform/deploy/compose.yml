# Everything on the box: Postgres, the app (API + the built PWA), Caddy (HTTPS) and a nightly
# backup. Settings come from the repo's .env on the box (see platform/deploy/README.md):
#   docker compose --env-file .env -f platform/deploy/compose.yml up -d --build
name: chalk

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chalk
      POSTGRES_DB: chalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chalk"]
      interval: 5s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: platform/deploy/Dockerfile
      args:
        - GOOGLE_CLIENT_ID
        - JUGNU_PROVIDER
        - JUGNU_MODEL
        - JUGNU_THINK
        - COMMIT
    image: chalk-app
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://chalk:${POSTGRES_PASSWORD}@postgres:5432/chalk
      PORT: "8080"
      DEV_SIGN_IN: "off"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ORIGIN: ${ORIGIN:?set ORIGIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # A dump of the database every night, kept 30 days, in ~/chalk-backups on the box.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Beside the repo on the box (~/chalk-backups), so a ship's rsync --delete never reaches it.
      - ../../../chalk-backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h postgres -U chalk chalk | gzip > /backups/chalk-$$(date +%F).sql.gz
          find /backups -name 'chalk-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
