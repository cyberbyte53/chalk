# Three layers. platform/ is the fixed code, library/ the props and patterns shared across books,
# content/ the books (not a package: its code resolves from the root; platform/content-source
# loads it). Imports go one way: content → library → platform (checked by `pnpm boundaries`).
packages:
  - platform/packages/*
  - platform/apps/*
  - platform/studio
  - library/props/*
  - library/patterns
  - library/sounds
  - library/registry
  - platform/content-source
